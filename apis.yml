aid: secureauth

name: SecureAuth (incl. Cloudentity)

image: https://secureauth.com/og-image.png

description: SecureAuth is an identity and access management company. It acquired Cloudentity; cloudentity.com
  now redirects to secureauth.com and the former Cloudentity Authorization Control Plane ships as SecureAuth
  CIAM, whose 23 OpenAPI definitions (979 operations) are published in the SecureAuthCorp/ciam-client-go
  repository.

