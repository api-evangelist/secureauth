components:
  schemas:
    DataPoints:
      properties:
        bucket:
          type: string
        data:
          items:
            $ref: '#/components/schemas/SingleDataPoint'
          type: array
      type: object
    AggregatedDataPoints:
      properties:
        bucket:
          type: string
        data:
          items:
            $ref: '#/components/schemas/AggregatedDataPoint'
          type: array
      type: object
    SingleDataPoint:
      properties:
        timestamp:
          format: date-time
          type: string
        value:
          format: double
          type: number
      type: object
    Error:
      description: HTTP error response
      properties:
        details:
          type: object
        error:
          type: string
        error_code:
          type: string
        status_code:
          format: int64
          type: integer
      type: object
    AggregatedDataPoint:
      properties:
        timestamp:
          format: date-time
          type: string
        values:
          additionalProperties:
            format: double
            type: number
          type: object
      type: object
  responses:
    forbiddenHTTPError:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        text/csv:
          schema:
            $ref: '#/components/schemas/Error'
    unauthorizedHTTPError:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        text/csv:
          schema:
            $ref: '#/components/schemas/Error'
    DataPoints:
      description: Data points
      headers:
        etag:
          description: 'The ETag HTTP header is an identifier for a specific version of a resource


            in:header'
          schema:
            type: string
            format: etag
        x-external-error:
          description: 'Indicates that a 5xx error was caused by tenant-provided code


            in:header'
          schema:
            type: string
        x-trace-id:
          description: 'OpenTelemetry trace identifier


            in:header'
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DataPoints'
        text/csv:
          schema:
            $ref: '#/components/schemas/DataPoints'
    AggregatedDataPoints:
      description: Aggregated data points
      headers:
        etag:
          description: 'The ETag HTTP header is an identifier for a specific version of a resource


            in:header'
          schema:
            type: string
