openapi: 3.2.0
info:
  description: 'SecureAuth Analytics API


    The SecureAuth Analytics APIs provide a robust solution for capturing and analyzing metrics related to various operational aspects including access token minting, policy validations, OTP validations, authorizer validations, and HTTP metrics, among others.'
