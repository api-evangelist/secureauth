components:
  schemas:
    Attr:
      properties:
        Space:
          type: string
        Value:
          type: string
      title: An Attr represents a key-value attribute within an XML element.
      type: object
    MetaIDP:
      properties:
        attributes:
          $ref: '#/components/schemas/Attributes'
        authorization_server_id:
          description: ID of the authorization server (workspace) to which the IDP is connected
          format: serverID
          type: string
        client_id:
          description: 'Client application ID


            It serves as a reference to a client application that is created in the System authorization

            server (workspace), when a custom login page is created.'
          format: clientID
          type: string
        config:
          $ref: '#/components/schemas/IDPConfiguration'
        credentials:
          $ref: '#/components/schemas/MetaCredentials'
        disabled:
          description: 'If set to `true`, the IDP is disabled


            When an IDP is disabled, it is not available for the users to be used. It is also not

            displayed on the login page.'
          type: boolean
        discovery_settings:
          $ref: '#/components/schemas/IDPDiscoverySettings'
        display_order:
          description: Can be used to e.g. modify the order in which the Identity Providers are presented on the login page.
          example: 1
          format: int64
          type: integer
        hidden:
          description: 'If set to `true`, the IDP is not displayed on the login page.


            When an IDP is hidden, it will not be displayed on the login page. It can still be used

            and script extensions can enabled it.'
          type: boolean
        id:
          description: 'Unique ID of your identity provider


            If not provided, a random ID is generated.'
          format: idpID
          type: string
        identity_pool_id:
          description: ID of the Identity Pool to which the IDP is connected
          format: poolID
          type: string
        jit:
          $ref: '#/components/schemas/JITSettings'
        logo_uri:
          description: Logo URI
          type: string
        mappings:
          $ref: '#/components/schemas/Mappings'
        method:
          description: 'Defines the type of an IDP


            SecureAuth is designed to make it possible for you to bring any of your own IDPs and integrate it

            with SecureAuth as it delivers enterprise connectors for major Cloud IDPs and a possibility for

            custom integration DKS for home-built solutions. You can also use built-in Sandbox IDP, which

            is a static IDP, to create an IDP for testing purposes.'
          format: idpMethod
          type: string
        name:
          description: Display name of your IDP
          type: string
        post_authn_app_id:
          description: Points to the ID of the custom app, null if not set
          format: customAppID
          type: string
        settings:
          $ref: '#/components/schemas/MetaSettings'
        sso_settings:
          $ref: '#/components/schemas/IDPSSOSettings'
        static_amr:
          description: 'Authentication method reference


            An array of case sensitive strings for authentication methods that are used in the user

            authentication.


            For example, an IDP may require the user to provide a biometric authentication using facial

            recognition. For that, the value of the authentication method reference is `face`.'
          items:
            format: amr
            type: string
          type: array
        tenant_id:
          description: ID of the tenant where an IDP is connected
          format: tenantID
          type: string
        token_exchange_settings:
          $ref: '#/components/schemas/IDPTokenExchangeSettings'
        version:
          description: 'IDP version to track internal changes

            version that is currently supported: 3'
          format: int64
          type: integer
        workspace_id:
          description: ID of the Workspace to which the IDP is connected
          format: serverID
          type: string
      type: object
    GithubEmbeddedIDP:
      properties:
        attributes:
          $ref: '#/components/schemas/Attributes'
        authorization_server_id:
          description: ID of the authorization server (workspace) to which the IDP is connected
          format: serverID
          type: string
        client_id:
          description: 'Client application ID


            It serves as a reference to a client application that is created in the System authorization

            server (workspace), when a custom login page is created.'
