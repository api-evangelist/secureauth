openapi: 3.2.0
info:
  title: Secureauth Idps API
  version: latest
  description: 'Operations tagged idps across 2 of this provider''s published API definitions: secureauth-admin-openapi.yml, secureauth-system-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://localhost:8443/api/admin/default
- url: https://localhost:8443/api/system/default
tags:
- name: idps
paths:
  /pools/{ipID}/idps:
    get:
      operationId: listIDPsForIdentityPool
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - description: ID of your identity pool
        in: path
        name: ipID
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/IDPsResponse'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: Returns a list of IDPs connected with a given Identity Pool
      tags:
      - idps
    servers:
    - url: https://localhost:8443/api/admin/default
  /servers/{wid}/idps:
    get:
      deprecated: true
      description: 'Returns a list of IDPs connected to a given authorization server (workspace).


        This endpoint is deprecated. Use GET /servers/{wid}/v2/idps instead, which supports pagination and filtering.'
      operationId: listIDPs
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - description: ID of your authorization server (workspace)
        in: path
        name: wid
        required: true
        schema:
          type: string
          default: default
      responses:
        '200':
          $ref: '#/components/responses/IDPsResponse'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: 'Deprecated: Use listIDPsV2 instead'
      tags:
      - idps
    servers:
    - url: https://localhost:8443/api/admin/default
  /servers/{wid}/idps/{iid}:
    delete:
      description: 'Deletes an IDP of your choice


        Deleting an IDP is permament. Deleted IDPs cannot be restored.


        It is impossible to delete an IDP with which you are currently logged in.'
      operationId: deleteIDP
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - description: ID of your authorization server (workspace)
        in: path
        name: wid
        required: true
        schema:
          type: string
          default: default
      - description: ID of the IDP you wish to delete
        in: path
        name: iid
        required: true
        schema:
          type: string
      responses:
        '204':
          description: ' IDP has been deleted'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '422':
          $ref: '#/components/responses/unprocessableEntityHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: Delete IDP
      tags:
      - idps
    servers:
    - url: https://localhost:8443/api/admin/default
