        api_key_value:
          description: api key value
          type: string
        password:
          description: http basic auth password
          type: string
        username:
          description: http basic auth username
          type: string
      type: object
    OAuth2Settings:
      description: OAuth2 IDP specific settings
      properties:
        authorization_endpoint:
          description: OAuth2 authorization endpoint
          type: string
        client_id:
          description: OAuth client application identifier
          example: client
          type: string
        scopes:
          description: An array of additional scopes your client requests
          example:
          - email
          - profile
          - openid
          items:
            type: string
          type: array
        token_endpoint:
          description: OAuth2 token endpoint
          type: string
      type: object
    AuthenticationContext:
      additionalProperties:
        type: object
      type: object
    SAMLSettings:
      description: SAML IDP specific settings
      properties:
        entity_issuer:
          description: Unique id of a service provider
          example: https://localhost:8443/default/default/login
          type: string
        identifier_attribute:
          description: 'The attribute name from the `AttributeStatement` SAML response which is used as an identifier in ACP


            Applies only when `identifierSource` parameter is set to `attribute`.'
          type: string
        identifier_source:
          description: 'The source for an identifier


            The `identifierSource` parameter can have either the `subject` or the `attribute` value.


            It is used to provide an unique user attribute that is used as an identifier in ACP.


            Depending on which identifier source you choose, you must define either the

            `identifierAttribute` or the `subjectNameIDFormat` parameter.'
          type: string
        metadata_url:
          description: IDP metadata URL
          type: string
        metadata_xml:
          description: IDP metadata xml
          type: string
        skip_in_response_to_verification:
          description: 'If enabled, the verification, if the `InResponseTo` parameter matches the original ID attribute

            sent from ACP, is skipped.


            Enable the `skipInResponseToVerification` flag when the `InResponseTo` parameter is not

            returned by your IDP.'
          type: boolean
        sso_url:
          description: String represented SSO URL (endpoint) where the SAML request is sent
          example: https://test-dev-ed.my.salesforce.com/idp/endpoint/HttpPost
          type: string
        subject_name_id_format:
          description: 'Name ID format of a SAML subject


            It applies only when the `identifierSource` parameter is set to `subject`.


            Allowed values:


            `urn:oasis:names:tc:SAML:1.1:nameid-format:emailAddress`


            `urn:oasis:names:tc:SAML:1.1:nameid-format:unspecified`


            `urn:oasis:names:tc:SAML:1.1:nameid-format:X509SubjectName`


            `urn:oasis:names:tc:SAML:1.1:nameid-format:WindowsDomainQualifiedName`


            `urn:oasis:names:tc:SAML:2.0:nameid-format:encrypted`


            `urn:oasis:names:tc:SAML:2.0:nameid-format:entity`


            `urn:oasis:names:tc:SAML:2.0:nameid-format:kerberos`


            `urn:oasis:names:tc:SAML:2.0:nameid-format:persistent`


            `urn:oasis:names:tc:SAML:2.0:nameid-format:transient`


            default value:

            `urn:oasis:names:tc:SAML:2.0:nameid-format:persistent`'
          type: string
      type: object
    XCredentials:
      description: X IDP specific credentials
      properties:
        client_secret:
          description: OAuth client application secret
          type: string
      type: object
    IdentifierType:
      type: string
    XIDP:
      properties:
        attributes:
          $ref: '#/components/schemas/Attributes'
        authorization_server_id:
          description: ID of the authorization server (workspace) to which the IDP is connected
          format: serverID
          type: string
        client_id:
          description: 'Client application ID


            It serves as a reference to a client application that is created in the System authorization

            server (workspace), when a custom login page is created.'
          format: clientID
          type: string
        config:
          $ref: '#/components/schemas/IDPConfiguration'
        credentials:
          $ref: '#/components/schemas/XCredentials'
        disabled:
          description: 'If set to `true`, the IDP is disabled


            When an IDP is disabled, it is not available for the users to be used. It is also not

            displayed on the login page.'
          type: boolean
        discovery_settings:
          $ref: '#/components/schemas/IDPDiscoverySettings'
        display_order:
          description: Can be used to e.g. modify the order in which the Identity Providers are presented on the login page.
          example: 1
          format: int64
          type: integer
        hidden:
          description: 'If set to `true`, the IDP is not displayed on the login page.


            When an IDP is hidden, it will not be displayed on the login page. It can still be used

            and script extensions can enabled it.'
          type: boolean
        id:
          description: 'Unique ID of your identity provider


            If not provided, a random ID is generated.'
          format: idpID
          type: string
        identity_pool_id:
          description: ID of the Identity Pool to which the IDP is connected
          format: poolID
          type: string
        jit:
          $ref: '#/components/schemas/JITSettings'
        logo_uri:
          description: Logo URI
          type: string
        mappings:
          $ref: '#/components/schemas/Mappings'
        method:
          description: 'Defines the type of an IDP


            SecureAuth is designed to make it possible for you to bring any of your own IDPs and integrate it

            with SecureAuth as it delivers enterprise connectors for major Cloud IDPs and a possibility for

            custom integration DKS for home-built solutions. You can also use built-in Sandbox IDP, which

            is a static IDP, to create an IDP for testing purposes.'
          format: idpMethod
          type: string
        name:
          description: Display name of your IDP
          type: string
        post_authn_app_id:
          description: Points to the ID of the custom app, null if not set
          format: customAppID
          type: string
        settings:
          $ref: '#/components/schemas/XSettings'
        sso_settings:
          $ref: '#/components/schemas/IDPSSOSettings'
        static_amr:
          description: 'Authentication method reference


            An array of case sensitive strings for authentication methods that are used in the user

            authentication.


            For example, an IDP may require the user to provide a biometric authentication using facial

            recognition. For that, the value of the authentication method reference is `face`.'
          items:
            format: amr
            type: string
          type: array
        tenant_id:
          description: ID of the tenant where an IDP is connected
          format: tenantID
          type: string
        token_exchange_settings:
          $ref: '#/components/schemas/IDPTokenExchangeSettings'
        version:
          description: 'IDP version to track internal changes

            version that is currently supported: 3'
          format: int64
          type: integer
        workspace_id:
          description: ID of the Workspace to which the IDP is connected
          format: serverID
          type: string
      type: object
    Organization:
      description: See http://docs.oasis-open.org/security/saml/v2.0/saml-metadata-2.0-os.pdf §2.3.2.1
      properties:
        OrganizationDisplayNames:
          items:
            $ref: '#/components/schemas/LocalizedName'
          type: array
        OrganizationNames:
          items:
            $ref: '#/components/schemas/LocalizedName'
          type: array
        OrganizationURLs:
          items:
            $ref: '#/components/schemas/LocalizedURI'
          type: array
      title: Organization represents the SAML Organization object.
      type: object
    IndexedEndpoint:
      description: See http://docs.oasis-open.org/security/saml/v2.0/saml-metadata-2.0-os.pdf §2.2.3
      properties:
        Binding:
          type: string
        Index:
          format: int64
          type: integer
        IsDefault:
          type: boolean
        Location:
          type: string
        ResponseLocation:
          type: string
      title: IndexedEndpoint represents the SAML IndexedEndpointType object.
      type: object
    ClientAdminResponse:
      properties:
        agent_capability:
          $ref: '#/components/schemas/AgentCapability'
        app_url:
          description: Application URL
          type: string
        application_purpose:
          description: Application purpose
          enum:
          - single_page
          - server_web
          - mobile_desktop
          - service
          - legacy
          - custom
          - saml
          - ai_agent
          example: signle_page
          type: string
        application_type:
          default: web
          description: 'The client application type.


            Client applications can be either of a `web` or `native` types.


            Web applications include clients like server web applications or service apps.


            Native applications include single-page applications (SPAs) and mobile or desktop

            applications.


            Apply security measures according to the type of your application.'
          example: web
          type: string
        application_types:
          default:
          - server_web
          description: An array of dynamically calculated application types that can be used for filtering
          example:
          - single_page
          - server_web
          - mobile_desktop
          - service
          - legacy
          - dcr
          items:
            enum:
            - single_page
            - server_web
            - mobile_desktop
            - service
            - legacy
            - dcr
            type: string
          readOnly: true
          type: array
        audience:
          default:
          - client_id
          description: 'Identity of the intended recipients (the audience).


            Typically, the audience is a single resource server or a list of resource servers.


            It is considered a good practice to limit the audience of the token for security purposes.'
          items:
            type: string
          type: array
        authorization_details_types:
          description: 'Authorization details types


            Indicates what authorization details types the client can use.'
          items:
            $ref: '#/components/schemas/AuthorizationDetailType'
          type: array
        authorization_encrypted_response_alg:
          description: 'Algorithm used for encrypting authorization responses.


            If both signing and encryption are requested, the response is first signed, and then encrypted.

            As a result, a Nested JWT is obtained, as defined in JWT [RFC7519].


            If omitted, no encryption is applied by default.'
          enum:
          - RSA-OAEP
          - RSA-OAEP-256
          example: RSA-OAEP-256
          type: string
        authorization_encrypted_response_enc:
          description: 'Algorithm used for encrypting authorization responses.


            With `authorization_encrypted_response_alg` specified, the default value is `A128CBC-HS256`.

            When `authorization_encrypted_response_enc` is included, `authorization_encrypted_response_alg`

            MUST also be provided in a request.'
          enum:
          - A256GCM
          - A128CBC-HS256
          example: A128CBC-HS256
          type: string
        authorization_server_id:
          description: An authorization server (workspace) identifier holding the client application.
          example: default
          format: serverID
          type: string
        authorization_signed_response_alg:
          description: 'Algorithm used for signing authorization responses.


            With this parameter specified, the response is signed using JWS and according to the configured algorithm.


            `none` isn''t allowed.'
          example: RS256
          type: string
        backchannel_authentication_request_signing_alg:
          description: 'OPTIONAL. The JWS alg algorithm value used by the client application to sign authentication requests.


            When omitted, the client application doesn''t send signed authentication requests.'
          type: string
        backchannel_client_notification_endpoint:
          description: 'REQUIRED for requests when the client application uses CIBA as an authorization grant type, and the token

            delivery mode is set to `ping` or `push`.


            This parameter is the endpoint where an OP (OpenID Provider) posts a notification after end-user authentication.


            Input: an HTTPS URL.'
          type: string
        backchannel_logout_session_required:
          description: Boolean value specifying whether the RP requires that a sid (session ID) claim be included in the Logout Token to identify the RP session with the OP when the backchannel_logout_uri is used.
          type: boolean
        backchannel_logout_uri:
          description: RP URL that will cause the RP to log itself out when sent a Logout Token by the OP.
          type: string
        backchannel_token_delivery_mode:
          description: 'REQUIRED for requests when the client application uses CIBA as an authorization grant type.


            Input: `poll`, `ping`, or `push`.'
          type: string
        backchannel_user_code_parameter:
          description: 'OPTIONAL. A boolean value indicating the `user_code` parameter support by the client application.


            If omitted, the default value is `false`.


            This applies only when the `backchannel_user_code_parameter_supported` OP parameter is `true`.'
          type: boolean
        certificate:
          description: 'Base64 encoded certicate in PEM format that will be automatically converted and stored in jwks


            It is used only as an input parameter for the Create / Import Client.'
          type: string
        client_id:
          description: 'OAuth client application identifier


            If not provided, a random client ID is generated.'
          format: clientID
          type: string
        client_id_issued_at:
          description: 'The client identifier time of issue.


            The value is the number of seconds between 1970-01-01T00:00:00Z (UTC) and the date/time of issue.'
          format: int64
          type: integer
        client_name:
          description: Human-readable name of a client application.
          example: My app
          type: string
        client_secret:
          description: 'OAuth client secret


            If not provided, a random client secret is generated.'
          minLength: 32
          type: string
        client_secret_expires_at:
          description: 'The client secret expiration time.


            If the client secret does not expire, `client_secret_expires_at` = `0`.'
          format: int64
          type: integer
        client_status:
          description: 'Defines whether the client application is active or not.


            Only clients with the `Active` status can preform authorization, authentication, and PAR requests.'
          enum:
          - active
          - inactive
          type: string
        client_type:
          enum:
          - oauth2
          - saml
          type: string
        client_uri:
          description: URI of a client application.
          type: string
        created_at:
          description: Date when the client application was created.
          example: '2022-04-07T19:17:31.323187Z'
          format: date-time
          type: string
        default_acr_values:
          description: 'default ACR values

            list of ACR values that will be implicitly requested for the client if not explicitly specified'
          items:
            format: acrValue
            type: string
          type: array
        description:
          description: Description of the client application.
          type: string
        developer_id:
          description: Optional developer owner of the client application.
          format: subject
          type: string
        developer_metadata:
          $ref: '#/components/schemas/Metadata'
        dpop_bound_access_tokens:
          description: 'Boolean value specifying whether the client always uses DPoP for token requests

            If true, the authorization server will reject token requests from this client that do not contain the DPoP header.'
          type: boolean
        dynamically_registered:
          type: boolean
        enforce_application_membership:
          description: 'Enforce application membership for this application. When true, a user token is issued only if the

            user has membership/access to this application in the resolved organization. Defaults to false and,

            on creation, to the workspace-level default. Only meaningful while the applications_membership feature is enabled.'
          type: boolean
        fdx:
          $ref: '#/components/schemas/FDXMetadata'
        grant_types:
          default:
          - authorization_code
          description: 'An array of allowed OAuth client grant types.


            The `grantTypes` array stores OAuth flows that are allowed for a given client application.


            [Read more](https://cloudentity.com/developers/basics/oauth-grant-types/grant-types-overview/) about grant types.'
          example:
          - password
          - refresh_token
          - client_credentials
          - implicit
          - authorization_code
          items:
            enum:
            - authorization_code
            - implicit
            - client_credentials
            - refresh_token
            - password
            - urn:ietf:params:oauth:grant-type:jwt-bearer
            - urn:openid:params:grant-type:ciba
            - urn:ietf:params:oauth:grant-type:token-exchange
            - urn:ietf:params:oauth:grant-type:device_code
            type: string
          type: array
        hashed_rotated_secrets:
          description: An array of hashed rotated client secrets
          items:
            type: string
          type: array
        hashed_secret:
          description: 'Hashed client secret


            Hashing client secrets provides additional security for your secrets storage as it hides

            plaintext secrets from being viewed both in the UI and the database.'
          type: string
        id_token_encrypted_response_alg:
          description: JWE alg algorithm for encrypting the ID token issued to this client application.
          enum:
          - RSA-OAEP
          - RSA-OAEP-256
          type: string
        id_token_encrypted_response_enc:
          description: JWE enc algorithm for encrypting the ID token issued to this client application.
          enum:
          - A256GCM
          - A128CBC-HS256
          type: string
        id_token_signed_response_alg:
          description: 'Algorithm for signing ID tokens issued for a client application.


            The default value depends on authorization server configuration.'
          enum:
          - RS256
          - ES256
          - PS256
          example: ES256
          type: string
        introspection_endpoint_auth_method:
          default: client_secret_basic
          description: 'An introspection endpoint authentication method configured for the client application (read-only).


            If empty, the `token_endpoint_auth_method` is used.


            SecureAuth supports the following client authentication methods:

            `client_secret_basic`, `client_secret_post`, `client_secret_jwt`, `private_key_jwt`,

            `self_signed_tls_client_auth`, `tls_client_auth`, `none`.


            [Read more](https://cloudentity.com/developers/basics/oauth-client-authentication/client-authentication-overview/) about client authentication.'
          enum:
          - client_secret_basic
          - client_secret_post
          - client_secret_jwt
          - private_key_jwt
          - self_signed_tls_client_auth
          - tls_client_auth
          - none
          example: client_secret_basic
          type: string
        jwks:
          $ref: '#/components/schemas/ClientJWKs'
        jwks_uri:
          description: A URL of JSON Web Key Set with the public keys used by a client application to authenticate to SecureAuth.
          type: string
        logo_uri:
          description: Logo URI.
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
        organisation_id:
          description: 'External organization identifier. It is a unique string assigned by the CDR Register to identify an Accredited

            Data Recipient Brand.


            The value obtained is used as the `aud` claim for message signing, for example, when a JSON Web Token (JWT) is

            required for authorization, and represents the audience(s) the JWT is intended for.'
          example: 5647fe90-f6bc-11eb-9a03-0242ac130003
          type: string
        policy_uri:
          description: Policy URL to read about how the profile data is used.
          type: string
        post_logout_redirect_uris:
          description: Array of URLs to which a relying party may request that the user be redirected after a logout has been performed.
          items:
            type: string
          type: array
        privacy:
          $ref: '#/components/schemas/ClientPrivacy'
        redirect_uris:
          $ref: '#/components/schemas/RedirectURIs'
        request_object_encryption_alg:
          description: Optional JWE alg algorithm the client is declaring that it may use for encrypting Request Objects
          enum:
          - RSA-OAEP
          - RSA-OAEP-256
          example: RSA-OAEP
          type: string
        request_object_encryption_enc:
          description: 'Optional JWE enc algorithm the client is declaring that it may use for encrypting Request Objects

            When `request_object_encryption_enc` is included, `request_object_encryption_alg` MUST also be provided.'
          enum:
          - A256GCM
          - A128CBC-HS256
          example: A256GCM
          type: string
        request_object_signing_alg:
          default: any
          description: 'Request object signing algorithm for the token endpoint


            SecureAuth supports signing tokens with the RS256, ES256, and PS256 algorithms. If you do not want

            to use a signing algorithm, set the value of this parameter to `none`.'
          enum:
          - any
          - none
          - RS256
          - ES256
          - PS256
          example: none
          type: string
        request_uris:
          description: Array of absolute URIs that points to the Request Object that holds authorization request parameters.
          items:
            type: string
          type: array
        require_pushed_authorization_requests:
          description: Boolean parameter indicating whether the only means of initiating an authorization request the client is allowed to use is PAR.
          type: boolean
        response_types:
          $ref: '#/components/schemas/ResponseTypes'
        revocation_endpoint_auth_method:
          default: client_secret_basic
          description: 'A revocation endpoint authentication method configured for the client application (read-only).

            If empty, the `token_endpoint_auth_method` is used.


            SecureAuth supports the following client authentication methods:

            `client_secret_basic`, `client_secret_post`, `client_secret_jwt`, `private_key_jwt`,

            `self_signed_tls_client_auth`, `tls_client_auth`, `none`.


            [Read more](https://cloudentity.com/developers/basics/oauth-client-authentication/client-authentication-overview/) about client authentication.'
          enum:
          - client_secret_basic
          - client_secret_post
          - client_secret_jwt
          - private_key_jwt
          - self_signed_tls_client_auth
          - tls_client_auth
          - none
          example: client_secret_basic
          type: string
        rotated_secrets:
          description: An array of rotated OAuth client secrets
          items:
            type: string
          minLength: 32
          type: array
        saml_allowed_attributes:
          description: Allowed SAML attributes
          items:
            type: string
          type: array
        saml_idp_accept_acs_from_request:
          description: accept ACS from SamlRequest even if it's not registered in the metadata
          type: boolean
        saml_idp_attributes_override:
          $ref: '#/components/schemas/SAMLIDPAttributesOverride'
        saml_idp_custom_entity_id:
          description: custom entity id
          type: string
        saml_idp_custom_sso_url:
          description: custom sso url
          type: string
        saml_idp_override_enabled:
          description: enable flag
          type: boolean
        saml_idp_signing_key:
          $ref: '#/components/schemas/ServerJWK'
        saml_metadata:
          $ref: '#/components/schemas/EntityDescriptor'
        saml_metadata_updated_at:
          format: date-time
          type: string
        saml_metadata_url:
          type: string
        saml_override_attributes:
          description: If true, then only attributes defined in saml_attributes will be used to build the SAML assertion
          type: boolean
        saml_service_provider_id:
          type: string
        saml_signing_hash:
          default: sha-256
          description: SAML Assertion signing hash algorithm.
          enum:
          - sha-1
          - sha-256
          - sha-512
          example: sha-256
          type: string
        saml_subject_name_id:
          description: Allows to override the subject name id.
          type: string
        saml_subject_name_id_format:
          description: Allows to override the subject name id format
          enum:
          - urn:oasis:names:tc:SAML:1.1:nameid-format:unspecified
          - urn:oasis:names:tc:SAML:2.0:nameid-format:transient
          - urn:oasis:names:tc:SAML:1.1:nameid-format:emailAddress
          - urn:oasis:names:tc:SAML:2.0:nameid-format:persistent
          type: string
        scope:
          description: Space-separated list of scopes for compatibility with the OAuth specification.
          example: email offline_access openid
          type: string
        scopes:
          description: An array of string represented scopes assigned to a client application
          example:
          - email
          - offline_access
          - openid
          items:
            type: string
          type: array
        sector_identifier_uri:
          description: 'OPTIONAL. [A URL using the HTTPS scheme](https://openid.net/specs/openid-connect-registration-1_0.html#SectorIdentifierValidation).

            It must reference a JSON file with the array of `redirect_uri` values.


            Pass this parameter when you use multiple domains in your `redirect_uris` or need a mechanism to allow changes in

            domain without affecting consumer consent.


            [Read more](https://openid.net/specs/openid-connect-core-1_0.html)'
          type: string
        server_issuer_url:
          type: string
        server_mtls_issuer_url:
          type: string
        skip_dbfp:
          description: 'Skip device-based fingerprint (DBFP) collection for this client.

            If true, the interactive DBFP collection step is skipped during login, which lets

            non-interactive clients (e.g. backend HTTP clients that cannot execute the collection

            JavaScript) complete the authorization flow. Risk inference is unaffected.'
          type: boolean
        software_id:
          description: 'A unique identifier string (e.g., a Universally Unique Identifier

            (UUID)) assigned by the client developer or software publisher.


            The `software_id` MUST remain the same across

            multiple updates or versions of the same software package. The

            value of this field is not intended to be human-readable and is

            usually opaque to the client and authorization server.'
          type: string
        software_statement:
          description: 'A digitally signed or MACed JSON Web Token (JWT) [RFC7519] that

            asserts metadata values about the client software.  In some cases,

            a software statement is issued directly by the client

            developer.  In other cases, a software statement is issued by

            a third-party organization for use by the client developer.


            In both cases, the trust relationship the authorization server has

            with the issuer of the software statement is intended to be used

            as an input to the evaluation of whether the registration request

            is accepted.


            A software statement can be presented to an

            authorization server as part of the client registration request.'
          type: string
        software_statement_payload:
          $ref: '#/components/schemas/Metadata'
        software_version:
          description: 'A version identifier string for the client software identified by

            `software_id`. The value of the `software_version` MUST be changed

            with any update of the client software identified by the same

            `software_id`.'
          type: string
        subject_type:
          default: public
          description: 'Subject identifier type


            Stores information if the subject identifier is of the `public` or the `pairwise` type.


            Subject identifiers identify an end-user. They are locally unique and never reassigned within the Issuer,

            and are intended to be consumed by client applications. There are two types

            of subject identifiers: `public` and `pairwise`.


            For the `public` type, the value of the `sub` (subject) token claim is the same for all clients.


            For the `pairwise` type, a different `sub` (subject) token claim is provided for each client.

            Using the `pairwise` subject identifier makes it impossible for client applications to correlate the end-user''s

            activity without their permission.'
          enum:
          - public
          - pairwise
          example: public
          type: string
        system:
          description: Defines whether the client application is a system tenant's application or not.
          type: boolean
        tenant_id:
          description: ID of a tenant where the client application is added
          example: default
          format: tenantID
          type: string
        tls_client_auth_san_dns:
          description: A string containing the value of an expected dNSName SAN entry in the certificate.
          type: string
        tls_client_auth_san_email:
          description: A string containing the value of an expected rfc822Name SAN entry in the certificate.
          type: string
        tls_client_auth_san_ip:
          description: A string representation of an IP address in either dotted decimal notation (for IPv4) or colon-delimited hexadecimal (for IPv6, as defined in [RFC5952]) that is expected to be present as an iPAddress SAN entry in the certificate.
          type: string
        tls_client_auth_san_uri:
          description: A string containing the value of an expected uniformResourceIdentifier SAN entry in the certificate.
          type: string
        tls_client_auth_subject_dn:
          description: An [RFC4514] string representation of the expected subject distinguished name of the certificate.
          type: string
        tls_client_certificate_bound_access_tokens:
          description: Boolean value indicating server support for mutual TLS client certificate-bound access tokens. If omitted, the default value is "false".
          type: boolean
        token_endpoint_auth_method:
          default: client_secret_basic
          description: 'Token endpoint authentication method configured for a client application


            SecureAuth supports the following client authentication methods:

            `client_secret_basic`, `client_secret_post`, `client_secret_jwt`, `private_key_jwt`,

            `self_signed_tls_client_auth`, `tls_client_auth`, `none`.


            To learn more, go to the Authorization Basics > Client Authentication section of this guide.'
          enum:
          - client_secret_basic
          - client_secret_post
          - client_secret_jwt
          - private_key_jwt
          - self_signed_tls_client_auth
          - tls_client_auth
          - none
          - unspecified
          example: client_secret_basic
          type: string
        token_endpoint_auth_signing_alg:
          default: ES256
          description: 'Signing algorithm for the token endpoint


            This field is optional. If empty, a client can use any algorithm supported by the server (see `token_endpoint_auth_signing_alg_values_supported` in the well-known endpoing).


            If provided, depending on the server configuration, client can use of one: HS256, RS256, ES256, PS256 algorithms.


            If your token endpoint authentication is set to the `private_key_jwt` method, the

            `token_endpoint_auth_signing_alg` parameter must be either RS256, ES256, or PS256.


            If your token endpoint authentication is set to the `client_secret_jwt` method,

            the `token_endpoint_auth_signing_alg` parameter must be HS256.'
          enum:
          - RS256
          - ES256
          - PS256
          - HS256
          - ''
          example: ES256
          type: string
        token_exchange:
          $ref: '#/components/schemas/ClientTokenExchangeConfiguration'
        token_ttls:
          $ref: '#/components/schemas/TokenTTLs'
        tos_uri:
          description: Terms of Service URL.
          type: string
        trusted:
          description: 'Defines whether the client application is trusted or not.


            For trusted clients, consent pages are skipped during the authorization process.'
          type: boolean
        updated_at:
          description: Date when the client application was updated.
          example: '2022-05-08T01:11:51.1262916Z'
          format: date-time
          type: string
        use_custom_token_ttls:
          description: If enabled the client application will be able to set its own token TTLs.
          type: boolean
        userinfo_signed_response_alg:
          default: none
          description: 'JWS alg algorithm REQUIRED for signing UserInfo Responses.


            If specified, the response is a JWT serialized and signed with JWS.


            If omitted, then by default, UserInfo Response returns the Claims

            as an UTF-8 encoded JSON object using the application/json content-type.'
          enum:
          - none
          - RS256
          - ES256
          example: none
          type: string
      required:
      - tenant_id
      - authorization_server_id
      type: object
