openapi: 3.2.0
info:
  title: Secureauth CONSENT PAGE API
  version: latest
  description: 'Operations tagged CONSENT_PAGE across 5 of this provider''s published API definitions: secureauth-cdr-openapi.yml, secureauth-fdx-openapi.yml, secureauth-ksa-openapi.yml, secureauth-obbr-openapi.yml, secureauth-obuk-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://localhost:8443/default/default
tags:
- name: CONSENT_PAGE
paths:
  /cdr/cdr-arrangement/{login}:
    get:
      description: 'Call this endpoint to retrieve CDR data from the Data Holder. Based on data obtained, you can build a consent page.


        The response contains details about the arrangement, client application, requested scopes, and authenticated user.'
      operationId: getCDRArrangementSystem
      parameters:
      - description: 'Login session identifier.


          SecureAuth passes the login session identifier with the `login_id` query parameter when redirecting a user to the consent page.'
        in: path
        name: login
        required: true
        schema:
          type: string
      - description: 'A string of characters randomly generated by SecureAuth to mitigate cross-site request forgery (CSRF) attacks.

          SecureAuth passes this value with the `login_state` query parameter when redirecting a user to the consent page.'
        in: query
        name: login_state
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/GetCDRConsentResponse'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - system:
        - manage_openbanking_consents
      summary: Get CDR Request
      tags:
      - CONSENT_PAGE
    servers:
    - url: https://localhost:8443/default/default
  /cdr/cdr-arrangement/{login}/accept:
    post:
      description: 'Notify SecureAuth that the user has authorized the client application to access their resources on their own behalf.

        It''s sent once the user gives consent on the consent page.


        This request includes a list of the permitted accounts along with the access scopes granted, user identifier,

        and the additional parameter to prevent CSRF.'
      operationId: acceptCDRArrangementSystem
      parameters:
      - description: 'Login session identifier.


          SecureAuth passes the login session identifier with the `login_id` query parameter when redirecting a user to the consent page.'
        in: path
        name: login
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/ConsentAccepted'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - system:
        - manage_openbanking_consents
      summary: Accept CDR Arrangement
      tags:
      - CONSENT_PAGE
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptCDRConsentRequest'
        description: Accept Consent Request
    servers:
    - url: https://localhost:8443/default/default
  /cdr/cdr-arrangement/{login}/reject:
    post:
      description: 'Notify SecureAuth that the client application isn''t authorized to access user resources. It''s sent when the user

        rejected a consent on the consent page.


        The request includes the error message along with the rejection reasons, HTTP status code, and the additional

        parameter to prevent CSRF.'
      operationId: rejectCDRArrangementSystem
      parameters:
      - description: 'Login session identifier.


          SecureAuth passes the login session identifier with the `login_id` query parameter when redirecting a user to the consent page.'
        in: path
        name: login
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/ConsentRejected'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - system:
        - manage_openbanking_consents
      summary: Reject CDR Arrangement
      tags:
      - CONSENT_PAGE
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectCDRConsentRequest'
        description: 'Reject Consent Request


          To give more context on why the user rejected the request.'
    servers:
    - url: https://localhost:8443/default/default
  /fdx/fdx/{login}:
    get:
      description: 'Retrieve FDX consent-related data: information about a consent, its status, type, and scopes it requires, as well

        as data of the client application requesting this consent.


        Pass the `Authorization: Bearer` header with a token as the bearer value for authorization. To obtain a

        token and create the consent, apply the

        Client Credentials

        grant type.'
      operationId: getFDXConsentSystem
      parameters:
      - in: path
        name: login
        required: true
        schema:
          type: string
      - in: query
        name: login_state
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/GetFDXConsentResponse'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - system:
        - manage_openbanking_consents
      summary: Get FDX Consent
      tags:
      - CONSENT_PAGE
    servers:
    - url: https://localhost:8443/default/default
  /fdx/fdx/{login}/accept:
    post:
      description: 'Used by a custom consent page to notify SecureAuth that a consumer accepted a consent.


        The `login` path parameter accepts the `login_id` value—the login session identifier.


        SecureAuth passes the login session identifier along with the `login_state` parameter when redirecting

        a user to the consent page.


        Authorization: Bearer token.


        To obtain a token, use the

        Client Credentials grant type.'
      operationId: acceptFDXConsentSystem
      parameters:
      - in: path
        name: login
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/ConsentAccepted'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - system:
        - manage_openbanking_consents
      summary: Accept FDX Consent
      tags:
      - CONSENT_PAGE
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptFDXConsentRequest'
    servers:
    - url: https://localhost:8443/default/default
  /fdx/fdx/{login}/reject:
    post:
      description: 'Used by a consent page to notify SecureAuth that a consumer rejected a consent.


        The `login` path parameter accepts the `login_id` value—the login session identifier.


        SecureAuth passes the login session identifier along with the `login_state` parameter when redirecting

