          description: Rejection error indication.
          example: Rejected
          type: string
        error_cause:
          description: Rejection cause.
          example: Rejected by the user.
          type: string
        error_description:
          description: Rejection error description.
          example: The user rejected authentication.
          type: string
        id:
          description: Login identifier.
          format: loginID
          type: string
        login_state:
          description: 'Random string generated by SecureAuth used to mitigate cross-site request forgery (CSRF) attacks.

            SecureAuth sends state as the `login_state` query parameter when redirecting to the consent page.'
          example: cauq8fonbud6q8806bf0
          format: loginState
          type: string
        rejection_reason:
