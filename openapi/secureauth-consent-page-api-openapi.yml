          example: 403
          format: int64
          type: integer
      type: object
    OpenbankingBrasilPaymentV2Identification:
      description: Objeto contendo os dados do recebedor (creditor).
      properties:
        cpfCnpj:
          description: 'Identificao da pessoa envolvida na transao.

            Preencher com o CPF ou CNPJ, de acordo com o valor escolhido no campo type.

            O CPF ser utilizado com 11 nmeros e dever ser informado sem pontos ou traos.

            O CNPJ ser utilizado com 14 nmeros e dever ser informado sem pontos ou traos.'
          example: '58764789000137'
          maxLength: 14
          minLength: 11
          pattern: ^\d{11}$|^\d{14}$
          type: string
        name:
          description: 'Em caso de pessoa natural deve ser informado o nome completo do titular da conta do recebedor.

            Em caso de pessoa jurdica deve ser informada a razo social ou o nome fantasia da conta do recebedor.'
          example: Marco Antonio de Brito
          maxLength: 120
          pattern: ^([A-Za-z---' -]+)$
          type: string
        personType:
          $ref: '#/components/schemas/OpenbankingBrasilPaymentV2EnumPaymentPersonType'
      required:
      - cpfCnpj
      - name
      - personType
      title: OpenbankingBrasilPaymentV2Identification Identification
      type: object
    OpenbankingBrasilPaymentV3EnumConsentRejectionReasonType:
      description: 'Define o cdigo da razo pela qual o consentimento foi rejeitado

        VALOR_INVALIDO

        NAO_INFORMADO

        FALHA_INFRAESTRUTURA

        TEMPO_EXPIRADO_AUTORIZACAO

        TEMPO_EXPIRADO_CONSUMO

        REJEITADO_USUARIO

        CONTAS_ORIGEM_DESTINO_IGUAIS

        CONTA_NAO_PERMITE_PAGAMENTO

        SALDO_INSUFICIENTE

        VALOR_ACIMA_LIMITE

        QRCODE_INVALIDO

        Example: SALDO_INSUFICIENTE'
      title: OpenbankingBrasilPaymentV3EnumConsentRejectionReasonType EnumConsentRejectionReasonType
      type: string
    OpenbankingBrasilPaymentV2DebtorAccount:
      description: 'Objeto que contm a identificao da conta de origem do pagador.

        As informaes quanto  conta de origem do pagador podero ser trazidas no consentimento para a detentora, caso a iniciadora tenha coletado essas informaes do cliente. Do contrrio, ser coletada na detentora e trazida para a iniciadora como resposta  criao do pagamento.'
      properties:
        accountType:
          $ref: '#/components/schemas/OpenbankingBrasilPaymentV2EnumAccountPaymentsType'
        ispb:
          description: Deve ser preenchido com o ISPB (Identificador do Sistema de Pagamentos Brasileiros) do participante do SPI (Sistema de pagamentos instantneos) somente com nmeros.
          example: '12345678'
          maxLength: 8
          minLength: 8
          pattern: ^[0-9]{8}$
          type: string
        issuer:
          description: 'Cdigo da Agncia emissora da conta sem dgito.

            (Agncia  a dependncia destinada ao atendimento aos clientes, ao pblico em geral e aos associados de cooperativas de crdito,

            no exerccio de atividades da instituio, no podendo ser mvel ou transitria).

            [Restrio] Preenchimento obrigatrio para os seguintes tipos de conta: CACC (CONTA_DEPOSITO_A_VISTA), SVGS (CONTA_POUPANCA) e SLRY (CONTA_SALARIO).'
          example: '1774'
          maxLength: 4
          minLength: 1
          pattern: ^[0-9]{1,4}$
          type: string
        number:
          description: 'Deve ser preenchido com o nmero da conta transacional do usurio pagador, com dgito verificador (se este existir),

            se houver valor alfanumrico, este deve ser convertido para 0.'
          example: '1234567890'
          maxLength: 20
          minLength: 1
          pattern: ^[0-9]{1,20}$
          type: string
      required:
