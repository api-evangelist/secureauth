    OpenbankingBrasilPaymentV3Single:
      description: Define a poltica de agendamento nico.
      properties:
        date:
          description: 'Define a data alvo da liquidao do pagamento.


            O fuso horrio de Braslia deve ser utilizado para criao e racionalizao sobre os dados deste campo.


            Observao: Esse campo dever sempre ser no mnimo D+1 corrido, ou seja, a data imediatamente posterior em relao a data do consentimento considerando o fuso horrio de Braslia e dever ser no mximo D+365 corridos a partir da data do consentimento considerando o fuso horrio de Braslia'
          example: '2021-01-01'
          format: date
          type: string
      required:
      - date
      title: OpenbankingBrasilPaymentV3Single Single
      type: object
    OpenbankingBrasilPaymentEnumAuthorisationStatusType:
      description: 'Retorna o estado do consentimento, o qual no momento de sua criao ser AWAITING_AUTHORISATION.

        Este estado ser alterado depois da autorizao do consentimento na detentora da conta do pagador (Debtor) para AUTHORISED, REJECTED ou REVOKED.

        O consentimento fica no estado CONSUMED aps ocorrer a iniciao do pagamento referente ao consentimento.

        Em caso de consentimento expirado a detentora dever retornar o status REJECTED.

        Em caso de revogao do consentimento a detentora dever retornar o status REVOKED.

        Estados possveis:

        AWAITING_AUTHORISATION - Aguardando autorizao

        AUTHORISED - Autorizado

        REJECTED - Rejeitado

        CONSUMED - Consumido

        REVOKED - Revogado

        Example: REVOKED'
      title: OpenbankingBrasilPaymentEnumAuthorisationStatusType EnumAuthorisationStatusType
      type: string
    OpenbankingBrasilPaymentV3ConsentsDebtorAccount:
      description: 'Objeto que contm a identificao da conta de origem do pagador.

        As informaes quanto  conta de origem do pagador podero ser trazidas no consentimento para a detentora, caso a iniciadora tenha coletado essas informaes do cliente.

        No caso em que o cliente no preenche os dados na iniciadora, a detentora dever persistir as informaes da conta selecionada seguindo as condies abaixo.


        [Restrio]

        AUTHORISED e CONSUMED: Para esses dois status, o preenchimento do campo dever ser obrigatrio.

        REJECTED: Para este status o preenchimento  condicional, dado que h cenrios em que a detentora tambm no ter conhecimento da conta origem, pois a mesma no foi selecionada pelo usurio. Nos casos em que houver seleo, a conta deve ser preenchida obrigatoriamente.'
