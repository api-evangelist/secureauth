    OpenbankingBrasilPaymentV3Details:
      description: Objeto contendo os detalhes do pagamento.
      properties:
        creditorAccount:
          $ref: '#/components/schemas/OpenbankingBrasilPaymentV3CreditorAccount'
        localInstrument:
          $ref: '#/components/schemas/OpenbankingBrasilPaymentV3EnumLocalInstrument'
        proxy:
          description: 'Chave cadastrada no DICT pertencente ao recebedor. Os tipos de chaves podem ser: telefone, e-mail, cpf/cnpj ou chave aleatria.

            No caso de telefone celular deve ser informado no padro E.1641.

            Para e-mail deve ter o formato xxxxxxxx@xxxxxxx.xxx(.xx) e no mximo 77 caracteres.

            No caso de CPF dever ser informado com 11 nmeros, sem pontos ou traos.

            Para o caso de CNPJ dever ser informado com 14 nmeros, sem pontos ou traos.

            No caso de chave aleatria deve ser informado o UUID gerado pelo DICT, conforme formato especificado na RFC41223.

            Se informado, a detentora da conta deve validar o proxy no DICT quando localInstrument for igual a DICT, QRDN ou QRES e validar o campo creditorAccount.

            Esta validao  opcional caso o localInstrument for igual a INIC.

            [Restrio]

            Se localInstrument for igual a MANU, o campo proxy no deve ser preenchido.

            Se localInstrument for igual INIC, DICT, QRDN ou QRES, o campo proxy deve ser sempre preenchido com a chave Pix.'
          example: '12345678901'
          maxLength: 77
          pattern: '[\w\W\s]*'
          type: string
        qrCode:
          description: 'Sequncia de caracteres que corresponde ao QR Code disponibilizado para o pagador.


            a sequncia de caracteres que seria lida pelo leitor de QR Code, e deve propiciar o retorno dos dados do pagador aps consulta na DICT.


            Essa funcionalidade  possvel tanto para QR Code esttico quanto para QR Code dinmico.

            No arranjo do Pix esta  a mesma sequncia gerada e/ou lida pela funcionalidade Pix Copia e Cola.

            Este campo dever ser no formato UTF-8.

            [Restrio] Preenchimento obrigatrio para pagamentos por QR Code, observado o tamanho mximo de 512 bytes.'
          example: 00020104141234567890123426660014BR.GOV.BCB.PIX014466756C616E6F32303139406578616D706C652E636F6D27300012\nBR.COM.OUTRO011001234567895204000053039865406123.455802BR5915NOMEDORECEBEDOR6008BRASILIA61087007490062\n530515RP12345678-201950300017BR.GOV.BCB.BRCODE01051.0.080450014BR.GOV.BCB.PIX0123PADRAO.URL.PIX/0123AB\nCD81390012BR.COM.OUTRO01190123.ABCD.3456.WXYZ6304EB76\n
          maxLength: 512
          pattern: '[\w\W\s]*'
          type: string
      required:
      - creditorAccount
      - localInstrument
      title: OpenbankingBrasilPaymentV3Details Details
      type: object
    OpenbankingBrasilPaymentV2Details:
      description: Objeto contendo os detalhes do pagamento.
      properties:
        creditorAccount:
          $ref: '#/components/schemas/OpenbankingBrasilPaymentV2CreditorAccount'
        localInstrument:
          $ref: '#/components/schemas/OpenbankingBrasilPaymentV2EnumLocalInstrument'
        proxy:
          description: 'Chave cadastrada no DICT pertencente ao recebedor. Os tipos de chaves podem ser: telefone, e-mail, cpf/cnpj ou chave aleatria.

            No caso de telefone celular deve ser informado no padro E.1641.

            Para e-mail deve ter o formato xxxxxxxx@xxxxxxx.xxx(.xx) e no mximo 77 caracteres.

            No caso de CPF dever ser informado com 11 nmeros, sem pontos ou traos.

            Para o caso de CNPJ dever ser informado com 14 nmeros, sem pontos ou traos.

            No caso de chave aleatria deve ser informado o UUID gerado pelo DICT, conforme formato especificado na RFC41223.

            Se informado, a detentora da conta deve validar o proxy no DICT quando localInstrument for igual a DICT, QRDN ou QRES e validar o campo creditorAccount.

            Esta validao  opcional caso o localInstrument for igual a INIC.

            [Restrio]

            Se localInstrument for igual a MANU, o campo proxy no deve ser preenchido.

            Se localInstrument for igual INIC, DICT, QRDN ou QRES, o campo proxy deve ser sempre preenchido com a chave Pix.'
          example: '12345678901'
          maxLength: 77
          pattern: '[\w\W\s]*'
          type: string
        qrCode:
          description: 'Sequncia de caracteres que corresponde ao QR Code disponibilizado para o pagador.


            a sequncia de caracteres que seria lida pelo leitor de QR Code, e deve propiciar o retorno dos dados do pagador aps consulta na DICT.


            Essa funcionalidade  possvel tanto para QR Code esttico quanto para QR Code dinmico.

            No arranjo do Pix esta  a mesma sequncia gerada e/ou lida pela funcionalidade Pix Copia e Cola.

            Este campo dever ser no formato UTF-8.

            [Restrio] Preenchimento obrigatrio para pagamentos por QR Code, observado o tamanho mximo de 512 bytes.'
          example: 00020104141234567890123426660014BR.GOV.BCB.PIX014466756C616E6F32303139406578616D706C652E636F6D27300012\nBR.COM.OUTRO011001234567895204000053039865406123.455802BR5915NOMEDORECEBEDOR6008BRASILIA61087007490062\n530515RP12345678-201950300017BR.GOV.BCB.BRCODE01051.0.080450014BR.GOV.BCB.PIX0123PADRAO.URL.PIX/0123AB\nCD81390012BR.COM.OUTRO01190123.ABCD.3456.WXYZ6304EB76\n
          maxLength: 512
          pattern: '[\w\W\s]*'
          type: string
      required:
      - creditorAccount
      - localInstrument
      title: OpenbankingBrasilPaymentV2Details Details
      type: object
    OpenbankingBrasilPaymentEnumPaymentPersonType:
      description: 'Titular, pessoa natural ou juridica a quem se referem os dados de recebedor (creditor).

        Example: PESSOA_NATURAL'
      title: OpenbankingBrasilPaymentEnumPaymentPersonType EnumPaymentPersonType
      type: string
    OpenbankingBrasilPaymentV3PaymentConsent:
      description: Objeto contendo dados de pagamento para consentimento.
      properties:
        amount:
          description: Valor da transao com 2 casas decimais.
          example: '100000.12'
          maxLength: 19
          minLength: 4
          pattern: ^((\d{1,16}\.\d{2}))$
          type: string
        currency:
          description: 'Cdigo da moeda nacional segundo modelo ISO-4217, ou seja, ''BRL''.

            Todos os valores monetrios informados esto representados com a moeda vigente do Brasil.'
          example: BRL
          maxLength: 3
          pattern: ^([A-Z]{3})$
          type: string
        date:
          description: '[Restrio] Mutuamente excludente com o objeto schedule.


            Este campo  obrigatrio no caso de pagamento nico.


            Neste caso, o objeto schedule no deve ser informado.'
          example: '2021-01-01'
          format: date
          type: string
        details:
          $ref: '#/components/schemas/OpenbankingBrasilPaymentV3Details'
        ibgeTownCode:
          description: 'O campo ibgetowncode no arranjo PIX, tem o mesmo comportamento que o campo codMun descrito no item 1.6.6 do manual do PIX, conforme segue:


            1. Caso a informao referente ao municpio no seja enviada; o PSP do recebedor assumir que no existem feriados estaduais e municipais no perodo em questo;'
          example: '5300108'
          maxLength: 7
          minLength: 7
          pattern: ^\d{7}$
          type: string
        schedule:
          $ref: '#/components/schemas/OpenbankingBrasilPaymentV3Schedule'
        type:
          description: Este campo define o tipo de pagamento que ser iniciado aps a autorizao do consentimento.
          example: PIX
          type: string
      required:
      - amount
      - currency
      - details
      - type
      title: OpenbankingBrasilPaymentV3PaymentConsent PaymentConsent
      type: object
    OpenbankingBrasilPaymentV2Schedule:
      description: '[Restrio] Mutuamente excludente com o campo date.


        Este campo  obrigatrio no caso de agendamento.


        Neste caso, o campo date no deve ser informado.'
      properties:
        single:
          $ref: '#/components/schemas/OpenbankingBrasilPaymentV2Single'
