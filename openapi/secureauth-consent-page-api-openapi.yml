components:
  schemas:
    ScopeGrant:
      properties:
        client_id:
          description: Identifier of a client application that is granted with the scope.
          example: bugkgm23g9kregtu051g
          format: clientID
          type: string
        given_at:
          description: Time when the scope was granted
          format: date-time
          type: string
        granted_scope_name:
          description: The scope name with its actual value
          example: accounts.read.own
          format: scopeName
          type: string
        language:
          description: Language
          format: language
          type: string
        pool_id:
          description: pool id of a user who granted the scope
          format: poolID
          type: string
        scope_name:
          description: 'The scope name as it''s set initially. This parameter supports dynamic scope syntax, thus can include a scope

            root—a fixed core of the dynamic scope name supplemented with a wildcard—a symbol representing

            an adjustable extension to the scope root allowing to retrieve a specific requested scope.


            The basic dynamic scope template is as follows: `[scope-root.*]` where `*` is a wildcard.'
          example: accounts.read.*
          format: scopeName
          type: string
        server_id:
          description: Identifier of a server where the client app is hosted.
          example: my-server
          format: serverID
          type: string
        subject:
          description: Identifier of a user who granted the scope.
          format: subject
          type: string
        tenant_id:
          description: Identifier of the tenant where the client app is hosted.
          example: my-company
          format: tenantID
          type: string
        user_id:
          description: user id of a user who granted the scope
          format: userID
          type: string
      type: object
    RevocationChannel:
      type: string
    Service:
      properties:
        audience_mode:
          description: Controls which audience is injected into access tokens for scopes mapped to this service
          enum:
          - spiffe
          - custom
          - none
          example: spiffe
          type: string
        authorization_server_id:
          description: Authorization server identifier
          example: my-server
          format: serverID
          type: string
        capabilities:
          description: Service capabilities
          items:
            $ref: '#/components/schemas/ServiceCapability'
          type: array
        custom_audience:
          description: Custom service audience
          example: https://api.example.com
          type: string
        description:
          description: Service description
          example: Service description
          type: string
        gateway_id:
          description: Gateway identifier
          example: gateway-1
          format: gatewayID
          type: string
        id:
          description: A unique identifier of a service
          example: service-1
          format: serviceID
          type: string
        name:
          description: Service name
          example: My service
          type: string
        system:
          description: '`true` when the service is a system service'
          example: false
          type: boolean
        tenant_id:
          description: Tenant identifier
          example: my-company
          format: tenantID
          type: string
        type:
          default: user
          description: Service type
          enum:
          - oauth2
          - oidc
          - system
