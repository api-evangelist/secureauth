          $ref: '#/components/schemas/OpenbankingBrasilPaymentV2Document1'
      required:
      - document
      title: OpenbankingBrasilPaymentV2LoggedUser LoggedUser
      type: object
    OpenbankingBrasilConsentDocument1:
      description: OpenbankingBrasilConsentDocument1 Document1
      properties:
        identification:
          description: Nmero do documento de identificao oficial do titular pessoa jurdica.
          example: '11111111111111'
          maxLength: 14
          pattern: ^\d{14}$
          type: string
        rel:
          description: Tipo do documento de identificao oficial do titular pessoa jurdica.
          example: CNPJ
          maxLength: 4
          pattern: ^[A-Z]{4}$
          type: string
      required:
      - identification
      - rel
      type: object
    OpenbankingBrasilPaymentV2CreditorAccount:
      description: Objeto que contm a identificao da conta de destino do beneficirio/recebedor.
      properties:
        accountType:
          $ref: '#/components/schemas/OpenbankingBrasilPaymentV2EnumAccountPaymentsType'
        ispb:
          description: Deve ser preenchido com o ISPB (Identificador do Sistema de Pagamentos Brasileiros) do participante do SPI (Sistema de pagamentos instantneos) somente com nmeros.
          example: '12345678'
          maxLength: 8
          minLength: 8
          pattern: ^[0-9]{8}$
          type: string
        issuer:
          description: 'Cdigo da Agncia emissora da conta sem dgito.

            (Agncia  a dependncia destinada ao atendimento aos clientes, ao pblico em geral e aos associados de cooperativas de crdito,

            no exerccio de atividades da instituio, no podendo ser mvel ou transitria).

            [Restrio] Preenchimento obrigatrio para os seguintes tipos de conta: CACC (CONTA_DEPOSITO_A_VISTA), SVGS (CONTA_POUPANCA) e SLRY (CONTA_SALARIO).'
          example: '1774'
          maxLength: 4
          minLength: 1
          pattern: ^[0-9]{1,4}$
          type: string
        number:
          description: 'Deve ser preenchido com o nmero da conta do usurio recebedor, com dgito verificador (se este existir),

            se houver valor alfanumrico, este deve ser convertido para 0.'
          example: '1234567890'
          maxLength: 20
          minLength: 1
          pattern: ^[0-9]{1,20}$
          type: string
