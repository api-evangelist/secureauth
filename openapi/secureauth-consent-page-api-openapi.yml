      - accountType
      - ispb
      - number
      title: OpenbankingBrasilPaymentV2CreditorAccount CreditorAccount
      type: object
    OpenbankingBrasilPaymentIdentification:
      description: Objeto contendo os dados do recebedor (creditor).
      properties:
        cpfCnpj:
          description: 'Identificao da pessoa envolvida na transao.

            Preencher com o CPF ou CNPJ, de acordo com o valor escolhido no campo type.

            O CPF ser utilizado com 11 nmeros e dever ser informado sem pontos ou traos.

            O CNPJ ser utilizado com 14 nmeros e dever ser informado sem pontos ou traos.'
          example: '58764789000137'
          maxLength: 14
          minLength: 11
          pattern: ^\d{11}$|^\d{14}$
          type: string
        name:
          description: 'Em caso de pessoa natural deve ser informado o nome completo do titular da conta do recebedor.

            Em caso de pessoa jurdica deve ser informada a razo social ou o nome fantasia da conta do recebedor.'
          example: Marco Antonio de Brito
          maxLength: 140
          pattern: '[\w\W\s]*'
          type: string
        personType:
          $ref: '#/components/schemas/OpenbankingBrasilPaymentEnumPaymentPersonType'
      required:
      - cpfCnpj
      - name
      - personType
      title: OpenbankingBrasilPaymentIdentification Identification
      type: object
    OpenbankingBrasilPaymentEnumLocalInstrument:
      description: 'Especifica a forma de iniciao do pagamento:

        MANU - Insero manual de dados da conta transacional

        DICT - Insero manual de chave Pix

        QRDN - QR code dinmico

        QRES - QR code esttico

        INIC - Indica que o recebedor (creditor) contratou o Iniciador de Pagamentos especificamente para realizar iniciaes de pagamento em que o beneficirio  previamente conhecido.

        Example: DICT'
      title: OpenbankingBrasilPaymentEnumLocalInstrument EnumLocalInstrument
      type: string
    OpenbankingBrasilPaymentV2PaymentConsent:
      description: Objeto contendo dados de pagamento para consentimento.
      properties:
        amount:
          description: Valor da transao com 2 casas decimais.
          example: '100000.12'
          maxLength: 19
          minLength: 4
          pattern: ^((\d{1,16}\.\d{2}))$
          type: string
        currency:
          description: 'Cdigo da moeda nacional segundo modelo ISO-4217, ou seja, ''BRL''.

            Todos os valores monetrios informados esto representados com a moeda vigente do Brasil.'
          example: BRL
          maxLength: 3
          pattern: ^([A-Z]{3})$
          type: string
        date:
          description: '[Restrio] Mutuamente excludente com o objeto schedule.


            Este campo  obrigatrio no caso de pagamento nico.


            Neste caso, o objeto schedule no deve ser informado.'
          example: '2021-01-01'
          format: date
          type: string
        details:
          $ref: '#/components/schemas/OpenbankingBrasilPaymentV2Details'
        ibgeTownCode:
          description: 'O campo ibgetowncode no arranjo PIX, tem o mesmo comportamento que o campo codMun descrito no item 1.6.6 do manual do PIX, conforme segue:


            1. Caso a informao referente ao municpio no seja enviada; o PSP do recebedor assumir que no existem feriados estaduais e municipais no perodo em questo;'
          example: '5300108'
          maxLength: 7
          minLength: 7
          pattern: ^\d{7}$
          type: string
        schedule:
          $ref: '#/components/schemas/OpenbankingBrasilPaymentV2Schedule'
        type:
          description: Este campo define o tipo de pagamento que ser iniciado aps a autorizao do consentimento.
          example: PIX
          type: string
      required:
      - amount
      - currency
      - details
      - type
      title: OpenbankingBrasilPaymentV2PaymentConsent PaymentConsent
      type: object
    OpenbankingBrasilPaymentEnumAccountPaymentsType:
      description: 'Tipos de contas usadas para pagamento via Pix.

        Modalidades tradicionais previstas pela Resoluo 4.753, no contemplando contas vinculadas,

        conta de domiciliados no exterior, contas em moedas estrangeiras e conta correspondente moeda eletrnica.

        Segue descrio de cada valor do ENUM para o escopo do Pix.

        CACC - Current - Conta Corrente.

        SLRY - Salary - Conta-Salrio.

        SVGS - Savings - Conta de Poupana.

        TRAN - TransactingAccount - Conta de Pagamento pr-paga.

        Example: CACC'
      title: OpenbankingBrasilPaymentEnumAccountPaymentsType EnumAccountPaymentsType
      type: string
