openapi: 3.2.0
info:
  title: Secureauth Consents API
  version: latest
  description: 'Operations tagged consents across 3 of this provider''s published API definitions: secureauth-admin-openapi.yml, secureauth-public-openapi.yml, secureauth-system-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://localhost:8443/api/admin/default
- url: https://localhost:8443/default/default
- url: https://localhost:8443/api/system/default
tags:
- name: Consents
paths:
  /actions:
    get:
      description: List consent actions.
      operationId: listConsentActions
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/ConsentActionsResponse'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: List consent actions
      tags:
      - Consents
    post:
      description: 'Consent action allows to group list of consents. A Tenant Application asking for the consent it can

        ask for +by the action name+ instead of asking for a list of consents directly. It allows for cleaner

        abstraction and adds the ability to dynamically configure the consents required for particular applications.


        ID and Name are required fields.


        For each consent provide id and specify if it is required.'
      operationId: createConsentAction
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      responses:
        '201':
          $ref: '#/components/responses/ConsentActionWithConsentsResponse'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '409':
          $ref: '#/components/responses/conflictHTTPError'
        '422':
          $ref: '#/components/responses/unprocessableEntityHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: Create consent action
      tags:
      - Consents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentActionWithConsents'
        required: true
    servers:
    - url: https://localhost:8443/api/admin/default
  /actions/{action}:
    delete:
      description: Delete consent action.
      operationId: deleteConsentAction
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - in: path
        name: action
        required: true
        schema:
          type: string
      responses:
        '204':
          description: ' ConsentAction has been deleted'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: Delete consent action
      tags:
      - Consents
    get:
      description: Get consent action with consents.
      operationId: getConsentAction
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - in: path
        name: action
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/ConsentActionWithConsentsResponse'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: Get consent action with consents
      tags:
      - Consents
    put:
      description: Update consent action.
      operationId: updateConsentAction
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - in: path
        name: action
        required: true
        schema:
          type: string
      responses:
        '201':
          $ref: '#/components/responses/ConsentActionWithConsentsResponse'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '409':
          $ref: '#/components/responses/conflictHTTPError'
        '422':
          $ref: '#/components/responses/unprocessableEntityHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: Update consent action
      tags:
      - Consents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentActionWithConsents'
    servers:
    - url: https://localhost:8443/api/admin/default
  /consents:
    get:
      description: List consents.
      operationId: listConsents
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/ConsentsResponse'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: List consents
      tags:
      - Consents
    post:
      description: 'Consents are created per tenant.


        ID, Name and UpdateExistingGrants strategy are required fields when creating a new consent.


        UpdateExistingGrants has the following options:


        explicitAll - all the existing grants should not be updated. It is required that the user grants the consent explicitly.


        implicitAll - all previously existing consent grants should be updated, to the new version of the consent, but


        all of those grants should be implicit from the moment on.


        keepCurrent - if a previously existing consent grant was set implicitly, it is automatically updated and a new


        consent grant is produced, which is also implicit. if a previously existing consent grant was set

        explicitly, it should not be updated. It is required that the user grants the consent explicitly.'
      operationId: createConsent
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      responses:
        '201':
          $ref: '#/components/responses/ConsentResponse'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '409':
          $ref: '#/components/responses/conflictHTTPError'
        '422':
          $ref: '#/components/responses/unprocessableEntityHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: Create consent
      tags:
      - Consents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Consent'
        required: true
    patch:
      description: 'This is a non-standardized PATCH request.


        Allows to update multiple consents approval in one API call.


        User identifier must be provided in the header.


        See ConsentGrantPatchRequest object for more information.'
      operationId: patchConsentGrantsSystem
      parameters:
      - description: user identifier
        in: header
        name: x-subject
        schema:
          type: string
      responses:
        '201':
          $ref: '#/components/responses/ConsentGrantPatchResponse_2'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '409':
          $ref: '#/components/responses/conflictHTTPError'
        '422':
          $ref: '#/components/responses/unprocessableEntityHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - system:
        - manage_consents
      summary: Patch consent grants
      tags:
      - Consents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentGrantPatchRequest'
    servers:
    - url: https://localhost:8443/api/admin/default
  /consents/{consent}:
    delete:
      description: Delete consent.
      operationId: deleteConsent
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - in: path
        name: consent
        required: true
        schema:
          type: string
      responses:
        '204':
          description: ' Consent has been deleted'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: Delete consent
      tags:
      - Consents
    get:
      description: Get consent details.
      operationId: getConsent
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - in: path
        name: consent
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/ConsentResponse'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: Get consent details
      tags:
      - Consents
    put:
      description: 'Every time consent is updated, its version is incremented.


        If ValidFrom attribute is not provided it will be set to current time.'
      operationId: updateConsent
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - in: path
        name: consent
        required: true
        schema:
          type: string
      responses:
        '201':
          $ref: '#/components/responses/ConsentResponse'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '409':
          $ref: '#/components/responses/conflictHTTPError'
        '422':
          $ref: '#/components/responses/unprocessableEntityHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: Update consent
      tags:
      - Consents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Consent'
    servers:
    - url: https://localhost:8443/api/admin/default
  /events:
    get:
      description: List privacy ledger events.
      operationId: listPrivacyLedgerEventsBySubject
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - description: Subject
        in: query
        name: sub
        schema:
          type: string
          format: subject
      - description: Query events from timestamp (default 0)
        in: query
        name: from
        schema:
          type: integer
          format: int64
      - description: Query events to timestamp (default current time)
        in: query
        name: to
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/PrivacyLedgerEventsResponse'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: List privacy ledger events
      tags:
      - Consents
    servers:
    - url: https://localhost:8443/api/admin/default
  /privacy/consents:
    get:
      description: If you want to list only specific consents, provide consent identifiers in query params.
      operationId: listUserConsents
      parameters:
      - description: optional identifiers of consents to be returned
        in: query
        name: consent_id
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/ConsentsWithGrants'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - default:
        - view_consents
      summary: List consents
      tags:
      - Consents
    patch:
      description: 'This is a non-standardized PATCH request.


        Allows to update multiple consents approval in one API call.


        See ConsentGrantPatchRequest object for more information.'
      operationId: patchConsentGrants
      responses:
        '201':
          $ref: '#/components/responses/ConsentGrantPatchResponse'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '409':
          $ref: '#/components/responses/conflictHTTPError'
        '422':
          $ref: '#/components/responses/unprocessableEntityHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - default:
        - manage_consents
      summary: Patch consent grants
      tags:
      - Consents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentGrantPatchRequest'
    servers:
    - url: https://localhost:8443/default/default
  /privacy/consents/{action}:
    get:
      description: 'Returns any possible required consents that the app should ask the User about.


        The response includes a list of consents (including the ones user already agreed to).

        Inclusion of the consents which the user already agreed to can be used to inform the user what he already agreed to.'
      operationId: listUserConsentsByAction
      parameters:
      - description: Consent action id
        in: path
        name: action
        required: true
        schema:
          type: string
          default: default
      responses:
        '200':
          $ref: '#/components/responses/ConsentsWithGrants'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - default:
        - view_consents
      summary: List consents by action
      tags:
      - Consents
    servers:
    - url: https://localhost:8443/default/default
  /privacy/consents/grant:
    post:
      description: 'Consent id must be provided in the request body.


        When a user grants consent which was already granted, it does not result in an error but it silently skipped instead.'
      operationId: grantConsent
      responses:
        '201':
          $ref: '#/components/responses/ConsentGrant'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '409':
          $ref: '#/components/responses/conflictHTTPError'
        '422':
          $ref: '#/components/responses/unprocessableEntityHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - default:
        - manage_consents
      summary: Grant privacy consent
      tags:
      - Consents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentGrantRequest'
    servers:
    - url: https://localhost:8443/default/default
  /privacy/consents/revoke:
    post:
      description: 'This API can be used to withdraw a consent which user previously gave.


        Consent id must be provided in the request body.


        When consent has the can_be_withdrawn flag set to false the API fails with an error saying that the consent cannot be revoked.

        This flag is useful for scenarios in which the application cannot function without the consent from a User.'
      operationId: revokeConsent
      responses:
        '200':
          $ref: '#/components/responses/ConsentGrant'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '422':
          $ref: '#/components/responses/unprocessableEntityHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - default:
        - manage_consents
      summary: Revoke privacy consent
      tags:
      - Consents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentGrantRequest'
    servers:
    - url: https://localhost:8443/default/default
  /privacy/events:
    get:
      description: It is possible to provide time constraints using from and to query params.
      operationId: listPrivacyLedgerEvents
      parameters:
      - description: Query events from timestamp (default 0)
        in: query
        name: from
        schema:
          type: integer
          format: int64
      - description: Query events to timestamp (default current time)
        in: query
        name: to
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/PrivacyLedgerEvents'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - default:
        - view_consents
      summary: List privacy ledger events
      tags:
      - Consents
    servers:
    - url: https://localhost:8443/default/default
  /consents/{action}:
    get:
      description: User identifier must be provided in the header.
      operationId: listUserConsentsByActionSystem
      parameters:
      - description: Consent action id
        in: path
        name: action
        required: true
        schema:
          type: string
          default: default
      - description: user identifier
        in: header
        name: x-subject
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/ConsentsWithGrants'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - system:
        - view_consents
      summary: List user consents by action
      tags:
      - Consents
    servers:
    - url: https://localhost:8443/api/system/default
components:
  schemas:
    PIICategory:
      properties:
        name:
          description: name
          example: HIPAA
          type: string
      type: object
    ConsentActionWithConsents:
      properties:
        consents:
          items:
            $ref: '#/components/schemas/ConsentActionToConsent'
          type: array
        description:
          description: consent description
          example: Consents required by application X
          type: string
        id:
          description: unique consent action id
          example: '1'
          format: consentActionID
          type: string
        name:
          description: consent action name
          example: application_x
          type: string
        tenant_id:
          description: tenant id
          example: default
          format: tenantID
          type: string
      type: object
    PrivacyLedgerEvents:
      properties:
        events:
          items:
            $ref: '#/components/schemas/PrivacyLedgerEvent'
          type: array
      type: object
    PrivacyLedgerPayload:
      properties:
        consent_granted:
          $ref: '#/components/schemas/ConsentGrantedEvent'
        consent_revoked:
          $ref: '#/components/schemas/ConsentRevokedEvent'
        event_type:
          $ref: '#/components/schemas/PrivacyLedgerEventType'
      type: object
    PrivacyLedgerEventType:
