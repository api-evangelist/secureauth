        in: header
        name: x-jws-signature
        schema:
          type: string
      - description: Consent id
        in: path
        name: consentID
        required: true
        schema:
          type: string
          format: consentID
      responses:
        '204':
          description: ' Consent has been deleted'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '405':
          $ref: '#/components/responses/ErrorResponse'
        '406':
          $ref: '#/components/responses/ErrorResponse'
        '415':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
      security:
      - defaultcc:
        - accounts
      summary: Delete account access consent
      tags:
      - OBUK
    get:
      description: 'An AISP may optionally retrieve an account-access-consent resource that they have created to check its status.


        Prior to calling the API, the AISP must have an access token issued by the ASPSP using a client credentials grant.


        The usage of this API endpoint will be subject to an ASPSP''s fair usage policies.'
      operationId: getAccountAccessConsentRequest
      parameters:
      - description: 'The time when the PSU last logged in with the TPP.


          The value is supplied as a HTTP-date as in section 7.1.1.1 of [RFC7231]'
        in: header
        name: x-fapi-auth-date
        schema:
          type: string
      - description: The PSU's IP address if the PSU is currently logged in with the TPP.
        in: header
        name: x-fapi-customer-ip-address
        schema:
          type: string
      - description: 'An RFC4122 UID used as a correlation Id.


          If provided, the ASPSP must "play back" this value

          in the x-fapi-interaction-id response header.'
        in: header
        name: x-fapi-interaction-id
        schema:
          type: string
      - description: 'The header indicates the user-agent that the PSU is using.


          The TPP may populate this field with the user-agent indicated by the PSU.

          If the PSU is using a TPP mobile app, the TPP must ensure that the user-agent string

          is different from browser based user-agent strings.'
        in: header
        name: x-customer-user-agent
        schema:
          type: string
      - description: 'Header containing a detached JWS signature of the body of the payload.


          Refer to resource specific documentation on when this header must be specified.'
        in: header
        name: x-jws-signature
        schema:
          type: string
      - description: Consent id
        in: path
        name: consentID
        required: true
        schema:
          type: string
          format: consentID
      responses:
        '200':
          $ref: '#/components/responses/AccountAccessConsentResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '405':
          $ref: '#/components/responses/ErrorResponse'
        '406':
          $ref: '#/components/responses/ErrorResponse'
        '415':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
      security:
      - defaultcc:
        - accounts
      summary: Get account access consent
      tags:
      - OBUK
  /open-banking/v3.1/aisp/account-access-consents/introspect:
    post:
      description: Introspect openbanking account access consent.
      operationId: openbankingAccountAccessConsentIntrospect
      responses:
        '200':
