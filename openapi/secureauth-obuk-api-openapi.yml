    OBWriteInternationalScheduledConsentResponse6DataExchangeRateInformation:
      properties:
        ContractIdentification:
          description: Unique and unambiguous reference to the foreign exchange contract agreed between the initiating party/creditor and the debtor agent.
          maxLength: 256
          minLength: 1
          type: string
        ExchangeRate:
          description: The factor used for conversion of an amount from one currency to another. This reflects the price at which one currency was bought with another currency.
          format: double
          type: number
        ExpirationDateTime:
          description: 'Specified date and time the exchange rate agreement will expire.All dates in the JSON payloads are represented in ISO 8601 date-time format.

            All date-time fields in responses must include the timezone. An example is below:

            2017-04-05T10:43:07+00:00

            Format: date-time'
          format: date-time
          type: string
        RateType:
          description: Specifies the type used to complete the currency exchange.
          enum:
          - Actual
          - Agreed
          - Indicative
          type: string
        UnitCurrency:
          description: Currency in which the rate of exchange is expressed in a currency exchange. In the example 1GBP = xxxCUR, the unit currency is GBP.
          pattern: ^[A-Z]{3,3}$
          type: string
      required:
      - ExchangeRate
      - RateType
      - UnitCurrency
