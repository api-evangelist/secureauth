      - description: 'Header containing a detached JWS signature of the body of the payload.


          Refer to resource specific documentation on when this header must be specified.'
        in: header
        name: x-jws-signature
        schema:
          type: string
      - description: 'Every request will be processed only once per x-idempotency-key.

          The Idempotency Key will be valid for 24 hours'
        in: header
        name: x-idempotency-key
        schema:
          type: string
      responses:
        '201':
          $ref: '#/components/responses/DomesticPaymentConsentResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '405':
          $ref: '#/components/responses/ErrorResponse'
        '406':
          $ref: '#/components/responses/ErrorResponse'
        '415':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
      security:
      - defaultcc:
        - payments
      summary: Create domestic payment consent
      tags:
      - OBUK
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomesticPaymentConsentRequest'
        description: Request
