openapi: 3.2.0
info:
  title: Secureauth Gateways API
  version: latest
  description: 'Operations tagged gateways across 2 of this provider''s published API definitions: secureauth-admin-openapi.yml, secureauth-system-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://localhost:8443/api/admin/default
- url: https://localhost:8443/api/system/default
tags:
- name: Gateways
paths:
  /gateways:
    post:
      description: Create gateway.
      operationId: createGateway
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      responses:
        '201':
          $ref: '#/components/responses/GatewayWithClient'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '409':
          $ref: '#/components/responses/conflictHTTPError'
        '422':
          $ref: '#/components/responses/unprocessableEntityHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: Create gateway
      tags:
      - Gateways
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGatewayRequest'
    servers:
    - url: https://localhost:8443/api/admin/default
  /gateways/{gw}:
    delete:
      description: This removes configuration for all services connected to this gateway.
      operationId: deleteGateway
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - in: path
        name: gw
        required: true
        schema:
          type: string
      responses:
        '204':
          description: ' Gateway has been deleted'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: Delete gateway
      tags:
      - Gateways
    get:
      description: Get gateway.
      operationId: getGateway
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - description: Gateway id
        in: path
        name: gw
        required: true
        schema:
          type: string
          default: default
      responses:
        '200':
          $ref: '#/components/responses/GatewayWithClient'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: Get gateway
      tags:
      - Gateways
    put:
      description: Update gateway.
      operationId: updateGateway
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - in: path
        name: gw
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/Gateway'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '422':
          $ref: '#/components/responses/unprocessableEntityHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: Update gateway
      tags:
      - Gateways
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGatewayRequest'
    servers:
    - url: https://localhost:8443/api/admin/default
  /gateways/{gw}/groups:
    get:
      description: List gateway api groups.
      operationId: listGatewayAPIGroups
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - description: Gateway id
        in: path
        name: gw
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/GatewayAPIGroups'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: List gateway api groups
      tags:
      - Gateways
    servers:
    - url: https://localhost:8443/api/admin/default
  /gateways/{gw}/groups/{apiGroup}/bind:
    post:
      description: 'It unbinds service first, if it is already connected to an api group.


        It removes specification from a service, if it has specification imported already.


        It removes any APIs added manually to a service, if it contains any.'
      operationId: bindGroupToService
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - in: path
        name: gw
        required: true
        schema:
          type: string
      - in: path
        name: apiGroup
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/BindGroupToServiceResponse'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '422':
          $ref: '#/components/responses/unprocessableEntityHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: Bind a group to a service
      tags:
      - Gateways
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindGroupToServiceRequest'
    servers:
    - url: https://localhost:8443/api/admin/default
  /gateways/{gw}/groups/{apiGroup}/unbind:
    delete:
      description: 'Remove all apis and policies.


        If policy is used by another service it will not be removed.


        If service is connected to a gateway, it will be disconnected.


        If a gateway api group is connected to this service, it will be disconnected.'
      operationId: unbindGroupFromService
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - in: path
        name: gw
        required: true
        schema:
          type: string
      - in: path
        name: apiGroup
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/UnbindGroupFromServiceResponse'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '422':
          $ref: '#/components/responses/unprocessableEntityHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: Unbind a group from a service
      tags:
      - Gateways
    servers:
    - url: https://localhost:8443/api/admin/default
  /gateways/{gw}/package:
    get:
      description: Get package for a gateway.
      operationId: getGatewayPackage
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - description: Gateway id
        in: path
        name: gw
        required: true
        schema:
          type: string
          default: default
      responses:
        '200':
          $ref: '#/components/responses/gatewayPackage'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: Get package for a gateway
      tags:
      - Gateways
    servers:
    - url: https://localhost:8443/api/admin/default
  /servers/{wid}/gateways:
    get:
      description: List gateways.
      operationId: listGateways
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - description: Authorization server id
        in: path
        name: wid
        required: true
        schema:
          type: string
          default: default
      responses:
        '200':
          $ref: '#/components/responses/Gateways'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: List gateways
      tags:
      - Gateways
    servers:
    - url: https://localhost:8443/api/admin/default
  /gateways/configuration:
    get:
      description: This endpoint is used by api authorizers to fetch rules, policies and services to protect.
      operationId: getGatewayConfiguration
      parameters:
      - description: Authorizer version
        in: query
        name: authorizer_version
        schema:
          type: string
          default: latest
      - description: Tenant id
        in: query
        name: tenant_id
        schema:
          type: string
      - description: Server id
        in: query
        name: server_id
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/GatewayConfiguration'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - system:
        - read_gateway_configuration
      summary: Get configuration for a gateway
      tags:
      - Gateways
    post:
      description: This endpoint is used to push apis protected by api gateway to acp.
      operationId: setGatewayConfiguration
      parameters:
      - description: Authorizer version
        in: query
        name: authorizer_version
        schema:
          type: string
          default: latest
      responses:
        '200':
          $ref: '#/components/responses/SetGatewayConfigurationResponse'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '409':
          $ref: '#/components/responses/conflictHTTPError'
        '422':
          $ref: '#/components/responses/unprocessableEntityHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - system:
        - write_gateway_configuration
      summary: Set configuration for a gateway
      tags:
      - Gateways
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetGatewayConfigurationRequest'
    servers:
    - url: https://localhost:8443/api/system/default
  /gateways/requests:
    post:
      description: Push gateway request.
      operationId: pushGatewayRequests
      parameters:
      - description: Authorizer version
        in: query
        name: authorizer_version
        schema:
          type: string
          default: latest
      responses:
        '200':
          $ref: '#/components/responses/GatewayRequestsEventsResponse'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - system:
        - push_gateway_requests
      summary: Push gateway request
      tags:
      - Gateways
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GatewayRequestEvents'
    servers:
    - url: https://localhost:8443/api/system/default
components:
  schemas:
    Attr:
      properties:
        Space:
          type: string
        Value:
          type: string
      title: An Attr represents a key-value attribute within an XML element.
      type: object
    GatewayAPIGroup:
      properties:
        apis:
          description: List of APIs
          items:
            $ref: '#/components/schemas/GatewayAPI'
          type: array
        gateway_id:
          format: gatewayID
          type: string
        id:
          description: API group ID
          format: apiGroupID
          type: string
        metadata:
          $ref: '#/components/schemas/APIGroupMetadata'
        name:
          description: API group name
          type: string
        server_id:
          format: serverID
          type: string
        service_id:
          format: serviceID
          type: string
        tenant_id:
          format: tenantID
          type: string
      type: object
    Gateway:
      properties:
        authorization_server_id:
          description: authorization server id
          example: default
          format: serverID
          type: string
        client_id:
          description: id of a client created for this gateway for authentication
          format: clientID
          type: string
        create_and_bind_services_automatically:
          description: if true services are created automatically for each new discovered api group
          type: boolean
        default_policy_id:
          description: default policy id assigned to new APIs
          format: policyID
          type: string
        description:
          description: description
          type: string
        id:
          description: unique gateway id
          example: '1'
          format: gatewayID
          type: string
        last_active:
          description: last time a client fetched configuration
          format: date-time
          type: string
        name:
          description: gateway name
          example: SecureAuth Pyron
          type: string
        tenant_id:
          description: tenant id
          example: default
          format: tenantID
          type: string
        token_exchange:
          $ref: '#/components/schemas/GatewayTokenExchangeSettings'
        token_exchange_client_id:
          description: Token exchange client id
          format: clientID
          type: string
        type:
          description: 'gateway type, one of: pyron, aws'
          example: pyron
          format: gatewayType
          type: string
      type: object
    GatewayTokenExchangeSettings:
      properties:
        enabled:
          type: boolean
        trusted_idp_ids:
          items:
            format: idpID
            type: string
          type: array
      type: object
    Metadata:
      additionalProperties:
        type: object
      type: object
    AuthnAuthorityDescriptor:
      description: See http://docs.oasis-open.org/security/saml/v2.0/saml-metadata-2.0-os.pdf §2.4.5
      properties:
        AssertionIDRequestServices:
          items:
            $ref: '#/components/schemas/Endpoint'
          type: array
        AuthnQueryServices:
          items:
            $ref: '#/components/schemas/Endpoint'
          type: array
        CacheDuration:
          $ref: '#/components/schemas/Duration'
        ContactPeople:
          items:
            $ref: '#/components/schemas/ContactPerson'
          type: array
        ErrorURL:
          type: string
        ID:
          type: string
        KeyDescriptors:
          items:
            $ref: '#/components/schemas/KeyDescriptor'
          type: array
        NameIDFormats:
          items:
            $ref: '#/components/schemas/NameIDFormat'
          type: array
        Organization:
          $ref: '#/components/schemas/Organization'
        ProtocolSupportEnumeration:
          type: string
        Signature:
          $ref: '#/components/schemas/Element'
        ValidUntil:
          format: date-time
          type: string
      title: AuthnAuthorityDescriptor represents the SAML AuthnAuthorityDescriptor object.
      type: object
    Element:
      properties:
        Attr:
          items:
            $ref: '#/components/schemas/Attr'
          type: array
        Child:
          items:
            $ref: '#/components/schemas/Token'
          type: array
        Space:
          type: string
      title: An Element represents an XML element, its attributes, and its child tokens.
      type: object
    RegistryReference:
      description: Used for registry references. In snake case to match IETF RFC 7591 naming formats
      properties:
        registered_entity_id:
          description: An identifier of the intermediary that can be looked up from a legal identity registry source.
          type: string
        registered_entity_name:
          description: The legal company name for the intermediary.
          type: string
        registry:
          type: string
      type: object
    GatewayAPIGroups:
      properties:
        groups:
          items:
            $ref: '#/components/schemas/GatewayAPIGroup'
          type: array
      type: object
    Intermediary:
      properties:
        contacts:
          description: Array of strings representing ways to contact people responsible for this intermediary
          items:
            type: string
          type: array
        description:
          description: A short description of the intermediary
          type: string
        logo_uri:
          description: A URL string that references a logo for this intermediary
          type: string
        name:
          description: Name of intermediary party
          type: string
        registry_references:
          description: Registry references for this intermediary
          items:
            $ref: '#/components/schemas/RegistryReference'
          type: array
        uri:
          description: A URL string of a web page providing information about the intermediary
          type: string
      type: object
    EntityDescriptor:
      description: See http://docs.oasis-open.org/security/saml/v2.0/saml-metadata-2.0-os.pdf §2.3.2
      properties:
        AdditionalMetadataLocations:
          items:
            type: string
          type: array
        AffiliationDescriptor:
          $ref: '#/components/schemas/AffiliationDescriptor'
        AttributeAuthorityDescriptors:
          items:
            $ref: '#/components/schemas/AttributeAuthorityDescriptor'
          type: array
        AuthnAuthorityDescriptors:
          items:
            $ref: '#/components/schemas/AuthnAuthorityDescriptor'
          type: array
        CacheDuration:
          $ref: '#/components/schemas/Duration'
        ContactPerson:
          $ref: '#/components/schemas/ContactPerson'
        EntityID:
          type: string
        ID:
          type: string
        IDPSSODescriptors:
          items:
            $ref: '#/components/schemas/IDPSSODescriptor'
          type: array
        Organization:
          $ref: '#/components/schemas/Organization'
        PDPDescriptors:
          items:
            $ref: '#/components/schemas/PDPDescriptor'
          type: array
        RoleDescriptors:
          items:
            $ref: '#/components/schemas/RoleDescriptor'
          type: array
        SPSSODescriptors:
          items:
            $ref: '#/components/schemas/SPSSODescriptor'
          type: array
        Signature:
          $ref: '#/components/schemas/Element'
        ValidUntil:
          format: date-time
          type: string
        XMLName:
          $ref: '#/components/schemas/Name'
      title: EntityDescriptor represents the SAML EntityDescriptor object.
      type: object
    ClientIDJAGTarget:
      properties:
        aud_tenant:
          description: Sets the ID-JAG aud_tenant claim for this audience. Multi-tenant resource servers require it.
          type: string
        audience:
          description: Target authorization server issuer URL.
          type: string
        client_id:
          description: Overrides the ID-JAG client_id claim for this audience. Empty uses the requesting client's ID.
          type: string
      required:
      - audience
      type: object
    EncryptionMethod:
      description: EncryptionMethod represents the XMLSEC object of the same name
      properties:
        Algorithm:
          type: string
      type: object
    Attribute:
      description: See http://docs.oasis-open.org/security/saml/v2.0/saml-core-2.0-os.pdf §2.7.3.1
      properties:
        FriendlyName:
          type: string
        Name:
          type: string
        NameFormat:
          type: string
        Values:
          items:
            $ref: '#/components/schemas/AttributeValue'
          type: array
      title: Attribute represents the SAML element Attribute.
      type: object
    AttributeConsumingService:
      description: See http://docs.oasis-open.org/security/saml/v2.0/saml-metadata-2.0-os.pdf §2.4.4.1
      properties:
        Index:
          format: int64
          type: integer
        IsDefault:
          type: boolean
        RequestedAttributes:
          items:
            $ref: '#/components/schemas/RequestedAttribute'
          type: array
        ServiceDescriptions:
          items:
            $ref: '#/components/schemas/LocalizedName'
          type: array
        ServiceNames:
          items:
            $ref: '#/components/schemas/LocalizedName'
          type: array
      title: AttributeConsumingService represents the SAML AttributeConsumingService object.
      type: object
    GatewayAPI:
      properties:
        api_type:
          enum:
          - rest
          - graphql
          type: string
        graphql_schema:
          type: string
        method:
          type: string
        path:
          type: string
      type: object
    ResponseTypes:
      description: 'The array may consist of the following arguments:


        `code` - when supplied as the value for the `response_type` parameter, a successful

        response includes an authorization code


        `code token` - when supplied as the value for the `response_type` parameter, a successful

        response includes an access token, an access token type, and an authorization code


        `id_token token` - when supplied as the value for the `response_type` parameter, a successful

        response includes an access token, an access token type, and an ID token


        `code id_token token` - when supplied as the value for the `response_type` parameter, a successful

        response includes an authorization code, an ID token, an access token, and an access token

        type.


        `token` - when supplied as the value for the `response_type` parameter, a successful

        response includes an access token and its type. This argument is used for the implicit grant

        flow, but is not recommended. Instead, you should use either the authorization code grant

        flow with PKCE or client authentication set to `none` and with the use of PKCE.


        example: ["token", "id_token", "code"]

        default: ["code"]'
      items:
        enum:
        - token
        - id_token
        - code
        - code id_token
        - token id_token
        - token code
        - token id_token code
        - none
        type: string
      title: An array of allowed response types
      type: array
