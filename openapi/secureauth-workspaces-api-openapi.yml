      - description: Tenant ID
        in: path
        name: tenantID
        required: true
        schema:
          type: string
          default: default
      - description: comma separated workspace types that are to be filtered out
        in: query
        name: workspace_types
        schema:
          type: string
          default: admin,developer,system,regular,organization
      - description: optional flag to filter by template
        in: query
        name: template
        schema:
          type: boolean
      - description: optional flag to filter by theme id
        in: query
        name: theme_id
        schema:
          type: string
      - description: 'Optional search phrase: workspace id OR workspace name substring (case insensitive)

          SearchPhrase'
        in: query
        name: search_phrase
        schema:
          type: string
      - description: 'optional list workspaces after given id

          AfterWorkspaceID'
        in: query
        name: after_workspace_id
        schema:
          type: string
      - description: 'optional list workspaces before given id

          BeforeWorkspaceID'
        in: query
        name: before_workspace_id
        schema:
          type: string
      - description: 'optional sort workspaces by given field

          Sort'
        in: query
        name: sort
        schema:
          type: string
      - description: 'optional order workspaces by given direction

          Order'
        in: query
        name: order
        schema:
          type: string
      - description: 'optional limit results

          Limit'
        in: query
        name: limit
        schema:
          type: integer
          format: int64
          default: 20
          maximum: 100
          minimum: 1
      responses:
        '200':
          $ref: '#/components/responses/Workspaces'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - setup: []
      summary: List workspaces
      tags:
      - Workspaces
      x-operation-id-source: normalized
      x-operation-id-original: listWorkspaces
    servers:
    - url: https://localhost:8443/
components:
  schemas:
    WorkforceConfiguration:
      properties:
        client_id:
          description: workforce authentication client id
          type: string
        client_secret:
          description: workforce authentication client secret
          type: string
        status:
          $ref: '#/components/schemas/WorkforceProvisioningStatus'
        tenant_slug:
          description: workforce tenant slug
          type: string
      type: object
    ServerSettings:
      properties:
        deactivated:
          type: boolean
        default_client_id:
          format: clientID
          type: string
        default_post_authn_ctx_script_id:
          format: scriptID
          type: string
      type: object
    UserWorkspacesResponse:
      properties:
        cursor:
          $ref: '#/components/schemas/Cursor'
        workspaces:
          items:
            $ref: '#/components/schemas/WorkspaceResponse'
          type: array
      type: object
    IDPDiscovery:
      properties:
        discovery_mode:
          enum:
          - domain_matching
          - script_execution
          type: string
        enabled:
          description: 'If enabled, IDP discovery automatically redirects the user to their own IDP and does not

            display IDPs of other users while the users accesses the server/application.'
          example: false
          type: boolean
      type: object
    WorkforceProvisioningStatus:
      type: string
    WorkspaceResponse:
      properties:
        authentication_context_settings:
          $ref: '#/components/schemas/AuthenticationContextSettings'
        authentication_mechanisms:
          description: allowed authentication mechanisms for users in the identity pools
          example:
          - password
          - totp
          - otp
          - webauthn
          items:
            enum:
            - totp
            - password
            - otp
            - email_otp
            - sms_otp
            - voice_otp
            - webauthn
            - usernameless_webauthn
            - push
            - symbol
            - qr_code
            type: string
          type: array
        color:
          default: '#007FFF'
          description: Your server's label color in a HEX format.
          example: '#007FFF'
          type: string
        description:
          description: Display description of the workspace
          example: Server description
          type: string
        id:
          description: Unique identifier of an workspace
          example: default
          format: serverID
          type: string
        idp_discovery:
          $ref: '#/components/schemas/IDPDiscovery'
        issuer_url:
          type: string
        logo_uri:
          description: Logo URI
          type: string
        metadata:
          $ref: '#/components/schemas/ServerMetadata'
        name:
          description: 'Display name of the workspace


            If not provided, a random ID is generated.'
          example: default
          type: string
        number_of_child_organizations:
          format: int64
          type: integer
        number_of_clients:
          format: int64
          type: integer
        number_of_idps_excluding_organization:
          format: int64
          type: integer
        number_of_services:
          format: int64
          type: integer
        preferences:
          $ref: '#/components/schemas/ServerPreferences'
        profile:
          default: default
          description: 'The profile of a server


            ACP is delivered with preconfigured workspace templates that enable quick and easy setup for

            specific configuration patterns. For example, you can instantly create an Open Banking

            compliant workspace that has all of the required mechanisms and settings already in place.'
          enum:
          - default
          - demo
          - workforce
          - workforce_v2
          - consumer
          - partners
          - third_party
          - fapi_advanced
          - fapi_rw
          - fapi_ro
          - openbanking_uk_fapi_advanced
          - openbanking_uk
          - openbanking_br
          - openbanking_br_unico
          - cdr_australia
          - cdr_australia_fapi_rw
          - fdx
          - openbanking_ksa
          - fapi_20_security
          - fapi_20_message_signing
          - connect_id
          - agentic_ai
          - saidp_legacy
          example: default
          type: string
        settings:
          $ref: '#/components/schemas/ServerSettings'
        sso:
          $ref: '#/components/schemas/SSOConfiguration'
        subject_format:
          description: Subject format
          enum:
          - hash
          - legacy
          - custom
          type: string
        subject_identifier_algorithm_salt:
          description: Subject identifier algorithm salt
          type: string
        template:
          type: boolean
        theme_id:
          description: optional theme id
          format: themeID
          type: string
        type:
          default: regular
          description: 'Server type


            It is an internal property used to recognize if the server is created for an admin portal,

            a developer portal, or if it is a system or a regular workspace.'
          enum:
          - admin
          - developer
          - system
          - regular
          - organization
          example: regular
          type: string
        workforce:
          $ref: '#/components/schemas/WorkforceConfiguration'
      type: object
    SupportedJSONSchema:
      properties:
        additionalProperties:
          type: boolean
        allOf:
          items:
