openapi: 3.2.0
info:
  title: Secureauth Workspaces API
  version: latest
  description: 'Operations tagged workspaces across 2 of this provider''s published API definitions: secureauth-admin-openapi.yml, secureauth-root-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://localhost:8443/api/admin/default
- url: https://localhost:8443/
tags:
- name: Workspaces
paths:
  /user/workspaces:
    get:
      description: List workspaces that the current user has access to.
      operationId: listUserWorkspaces
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - description: Cursor
        in: query
        name: cursor
        schema:
          type: string
      - description: 'optional limit results

          Limit'
        in: query
        name: limit
        schema:
          type: integer
          format: int64
          default: 20
          maximum: 100
          minimum: 1
      responses:
        '200':
          $ref: '#/components/responses/UserWorkspaces'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: List user workspaces
      tags:
      - Workspaces
    servers:
    - url: https://localhost:8443/api/admin/default
  /workspaces:
    get:
      operationId: listWorkspaces
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - description: comma separated workspace types that are to be filtered out
        in: query
        name: workspace_types
        schema:
          type: string
          default: admin,developer,system,regular,organization
      - description: optional flag to filter by template
        in: query
        name: template
        schema:
          type: boolean
      - description: optional flag to filter by theme id
        in: query
        name: theme_id
        schema:
          type: string
      - description: 'Optional search phrase: workspace id OR workspace name substring (case insensitive)

          SearchPhrase'
        in: query
        name: search_phrase
        schema:
          type: string
      - description: 'optional list workspaces after given id

          AfterWorkspaceID'
        in: query
        name: after_workspace_id
        schema:
          type: string
      - description: 'optional list workspaces before given id

          BeforeWorkspaceID'
        in: query
        name: before_workspace_id
        schema:
          type: string
      - description: 'optional sort workspaces by given field

          Sort'
        in: query
        name: sort
        schema:
          type: string
      - description: 'optional order workspaces by given direction

          Order'
        in: query
        name: order
        schema:
          type: string
      - description: 'optional limit results

          Limit'
        in: query
        name: limit
        schema:
          type: integer
          format: int64
          default: 20
          maximum: 100
          minimum: 1
      responses:
        '200':
          $ref: '#/components/responses/Workspaces'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: List workspaces
      tags:
      - Workspaces
    servers:
    - url: https://localhost:8443/api/admin/default
  /workspaces/{wid}:
    get:
      description: Get workspace.
      operationId: getWorkspace
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - description: Workspace id
        in: path
        name: wid
        required: true
        schema:
          type: string
          default: default
      responses:
        '200':
          $ref: '#/components/responses/Workspace'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: Get workspace
      tags:
      - Workspaces
    servers:
    - url: https://localhost:8443/api/admin/default
  /workspaces/{wid}/metadata:
    put:
      description: Update workspace metadata.
      operationId: updateWorkspaceMetadata
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - description: Workspace id
        in: path
        name: wid
        required: true
        schema:
          type: string
          default: default
      responses:
        '200':
          $ref: '#/components/responses/WorkspaceMetadata'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: Update workspace metadata
      tags:
      - Workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceMetadata'
    servers:
    - url: https://localhost:8443/api/admin/default
  /api/admin/tenants/{tenantID}/workspaces:
    get:
      operationId: getApiAdminTenantsByTenantIDWorkspaces
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
