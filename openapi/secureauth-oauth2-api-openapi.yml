openapi: 3.2.0
info:
  description: 'SecureAuth OAuth2 API


    The POST APIs support idempotency for safely retrying requests without accidentally performing the same operation twice.


    To use idempotent requests:


    1. Generate a unique idempotency key (32-255 characters long).

    2. Include the key in the X-Idempotency-Key header of your POST request.

    3. Retry failed requests with the same key within 1 minute.


    Responses for replayed requests will include the X-Idempotent-Replayed: true header.'
  title: SecureAuth Oauth2 API
  version: latest
servers:
- url: https://localhost:8443/default/default
tags:
- name: OAuth2
paths:
  /.well-known/jwks.json:
    get:
      description: 'This endpoint returns the signing key(s) the client uses to validate

        signatures from the authorization server.'
      operationId: jwks
      responses:
        '200':
          $ref: '#/components/responses/jwksResponse'
        '404':
          $ref: '#/components/responses/genericError'
      summary: JSON Web Keys Discovery endpoint
      tags:
      - OAuth2
  /.well-known/openid-configuration:
    get:
      description: Returns OpenID configuration.
      operationId: wellKnown
      responses:
        '200':
          $ref: '#/components/responses/wellKnownResponse'
        '404':
          $ref: '#/components/responses/genericError'
      summary: OpenID Connect Discovery endpoint
      tags:
      - OAuth2
  /backchannel/authentication:
    post:
      description: Client-Initiated Backchannel Authentication defines an authentication request that is requested directly from the Client to the OpenID Provider without going through the user's browser.
      operationId: backchannelAuthentication
      responses:
        '200':
          $ref: '#/components/responses/BackchannelAuthenticationResponse'
        '400':
          $ref: '#/components/responses/BackchannelAuthenticationError'
        '401':
          $ref: '#/components/responses/BackchannelAuthenticationError'
      summary: OpenID Connect Client-Initiated Backchannel Authentication endpoint
      tags:
      - OAuth2
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                client_secret:
                  type: string
                scope:
                  type: string
                  description: The scope of the access request. Must contain openid scope value.
                client_notification_token:
                  type: string
                  description: It is a bearer token provided by the Client that will be used by the OpenID Provider to authenticate the callback request to the Client.
                acr_values:
                  type: string
                  description: 'Requested Authentication Context Class Reference values.

                    A space-separated string that specifies the acr values that the OpenID Provider is being requested to use for processing this Authentication Request, with the values appearing in order of preference'
                login_hint_token:
                  type: string
                  description: A token containing information identifying the end-user for whom authentication is being requested
                id_token_hint:
                  type: string
                  description: An ID Token previously issued to the Client by the OpenID Provider being passed back as a hint to identify the end-user for whom authentication is being requested.
                login_hint:
                  type: string
                  description: A hint to the OpenID Provider regarding the end-user for whom authentication is being requested.
                binding_message:
                  type: string
                  description: A human-readable identifier or message intended to be displayed on both the consumption device and the authentication device to interlock them together for the transaction by way of a visual cue for the end-user.
                user_code:
                  type: string
                  description: A secret code, such as a password or pin, that is known only to the user but verifiable by the OP. The code is used to authorize sending an authentication request to the user's authentication device.
                requested_expiry:
                  type: integer
                  format: int64
                  description: A positive integer allowing the client to request the expires_in value for the auth_req_id the server will return.
                client_assertion_type:
                  type: string
                  description: client assertion type
                client_assertion:
                  type: string
                  description: client assertion
                request:
                  type: string
                  description: signed authentication request
  /device/authorization:
    post:
      description: 'The Device Authorization endpoint is designed for Internet-

        connected devices that either lack a browser to perform a user-agent-

        based authorization or are input constrained to the extent that

        requiring the user to input text in order to authenticate during the

        authorization flow is impractical.'
      operationId: deviceAuthorization
      responses:
        '200':
          $ref: '#/components/responses/DeviceResponse'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '405':
          $ref: '#/components/responses/methodNotAllowedHTTPError'
        '413':
          $ref: '#/components/responses/payloadTooLargeHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - default: []
      summary: OAuth 2.0 Device Authorization endpoint
      tags:
      - OAuth2
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                  description: Client id
                scope:
                  type: string
                  description: Scope
              required:
              - client_id
  /oauth2/authorize:
    get:
      description: 'The authorization endpoint is used to interact with the resource

        owner and obtain an authorization grant.'
      operationId: authorize
      parameters:
      - in: query
        name: response_type
        required: true
        schema:
          type: string
      - in: query
        name: redirect_uri
        schema:
          type: string
      - description: 'Client application identifier



          You can find the `client_id` value on the Settings page of the required client application.'
        in: query
        name: client_id
        required: true
        schema:
          type: string
      - in: query
        name: scope
        schema:
          type: string
      - in: query
        name: state
        schema:
          type: string
      - in: query
        name: nonce
        schema:
          type: string
      - in: query
        name: code_challenge
        schema:
          type: string
      - in: query
        name: code_challenge_method
        schema:
          type: string
      - in: query
        name: request
        schema:
          type: string
      - in: query
        name: request_uri
        schema:
          type: string
      - in: query
        name: claims
        schema:
          type: string
      - in: query
        name: idp_hint
        schema:
          type: string
      - description: Thumbprint of the DPoP public key
        in: query
        name: dpop_jkt
        schema:
          type: string
      - description: Authorization correlation ID
        in: query
        name: authorization_correlation_id
        schema:
          type: string
      responses:
        '302':
          $ref: '#/components/responses/emptyResponse'
        '401':
          $ref: '#/components/responses/genericError'
        '404':
          $ref: '#/components/responses/genericError'
        '429':
          $ref: '#/components/responses/genericError'
      summary: The OAuth 2.0 authorize endpoint
      tags:
      - OAuth2
  /oauth2/introspect:
    post:
      description: 'Takes the `token` parameter representing an OAuth 2.0 token (the one the application wants to

        introspect) and returns a JSON

        representing the metadata surrounding the token such as, for example,

        whether the token is still active, what are the approved access scopes, what is the

        authentication context in which the token was issued.


        Token introspection allows resource servers or applications to

        query this information regardless of whether or not it is carried in

        the token itself. It allows to use this method along with or

        independently of structured token values. Additionally, you can use the mechanism to

        introspect the token in a particular authentication context

        and ascertain the relevant metadata about the token to make the

        authorization decision appropriately.


        Client applications that call the OAuth 2.0 Introspection Endpoint must authenticate with the

        SecureAuth authorization server either with a valid access token provided as the value of

        the `Authorization: Bearer $AT` request header or using the client authentication method

        configured for the client application.


        When a client application is assigned the `introspect_tokens` scope, it can introspect tokens

        that belong to client applications **registered within the same workspace** as the client app

        requesting the token instrospection. When a client application has no `introspect_tokens` scope

        assigned, it can **only introspect its tokens**.'
      operationId: introspect
      parameters:
      - description: Indicates if sso session should be extended for the request. Optional. Default `true`
        in: header
        name: SSO-Session-Extend
        schema:
          type: boolean
      responses:
        '200':
          $ref: '#/components/responses/IntrospectResponse'
        '401':
          $ref: '#/components/responses/genericError'
        '404':
          $ref: '#/components/responses/genericError'
        '429':
          $ref: '#/components/responses/genericError'
      security:
      - default:
        - introspect_tokens
      summary: The OAuth 2.0 Introspection Endpoint
      tags:
      - OAuth2
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                token:
                  type: string
  /oauth2/register:
    post:
      description: 'Dynamic Client Registration endpoint allows to dynamically register OAuth 2.0 client applications

        with the SecureAuth Platform. When a request with all required registration metadata

        values reaches the SecureAuth authorization server, the server issues a client

        identifier and provides client metadata values registered for the client.

        Client applications can use their registration data to communicate with the SecureAuth

        platform using the OAuth 2.0 protocol.'
      operationId: dynamicClientRegistration
      responses:
        '201':
          $ref: '#/components/responses/DynamicClientRegistrationResponse'
        '400':
          $ref: '#/components/responses/RFC6749Error'
        '401':
          $ref: '#/components/responses/RFC6749Error'
        '403':
          $ref: '#/components/responses/RFC6749Error'
        '404':
          $ref: '#/components/responses/genericError'
      security:
      - default:
        - dcr_register
      summary: OAuth 2.0 Dynamic Client Registration Endpoint
      tags:
      - OAuth2
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DynamicClientRegistrationRequest'
  /oauth2/register/{cid}:
    delete:
      description: This endpoint allows to delete a dynamically registered client.
      operationId: dynamicClientRegistrationDeleteClient
      parameters:
      - description: Client id
        in: path
        name: cid
        required: true
        schema:
          type: string
          default: default
      responses:
        '204':
          description: ' Client has been deleted'
        '400':
          $ref: '#/components/responses/RFC6749Error'
        '401':
          $ref: '#/components/responses/RFC6749Error'
        '403':
          $ref: '#/components/responses/RFC6749Error'
        '404':
          $ref: '#/components/responses/genericError'
      security:
      - default: []
      summary: OAuth 2.0 Dynamic Client Registration Delete Client Endpoint
      tags:
      - OAuth2
    get:
      description: This endpoint allows to get metadata values of a dynamically registered client.
      operationId: dynamicClientRegistrationGetClient
      parameters:
      - description: Client id
        in: path
        name: cid
        required: true
        schema:
          type: string
          default: default
      responses:
        '200':
          $ref: '#/components/responses/DynamicClientRegistrationResponse'
        '400':
          $ref: '#/components/responses/RFC6749Error'
        '401':
          $ref: '#/components/responses/RFC6749Error'
        '403':
          $ref: '#/components/responses/RFC6749Error'
        '404':
          $ref: '#/components/responses/genericError'
      security:
      - default: []
      summary: OAuth 2.0 Dynamic Client Registration Get Client Endpoint
      tags:
      - OAuth2
    put:
      description: This endpoint allows to update metadata values of a dynamically registered client.
      operationId: dynamicClientRegistrationUpdateClient
      parameters:
      - description: Client id
        in: path
        name: cid
        required: true
        schema:
          type: string
          default: default
      responses:
        '200':
          $ref: '#/components/responses/DynamicClientRegistrationResponse'
        '400':
          $ref: '#/components/responses/RFC6749Error'
        '401':
          $ref: '#/components/responses/RFC6749Error'
        '403':
          $ref: '#/components/responses/RFC6749Error'
        '404':
          $ref: '#/components/responses/genericError'
      security:
      - default: []
      summary: OAuth 2.0 Dynamic Client Registration Update Client Endpoint
      tags:
      - OAuth2
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DynamicClientRegistrationRequest'
  /oauth2/revoke:
    post:
      description: 'Supports revocation of access and refresh tokens. The token to be revoked must be provided as the

        value of the `token` parameter. When a token is revoked, it cannot be used to, for example,

        exchange a refresh token to an access token.


        Client applications that call the OAuth 2.0 Revocation Endpoint must authenticate with the

        SecureAuth authorization server either

        with a valid access token provided as the value of the `Authorization: Bearer $AT` request header

        or using the client authentication method configured for the client application.


        When a client application is assigned the `revoke_tokens` scope, it can revoke tokens

        that belong to client applications **registered within the same workspace** as the client app

        requesting the token revocation. When a client application has no `revoke_tokens` scope

        assigned, it can **only revoke its tokens**.'
      operationId: revoke
      responses:
        '200':
          $ref: '#/components/responses/emptyResponse'
        '401':
          $ref: '#/components/responses/genericError'
        '404':
          $ref: '#/components/responses/genericError'
        '429':
          $ref: '#/components/responses/genericError'
      security:
      - default:
        - revoke_tokens
      summary: The OAuth 2.0 Revocation Endpoint
      tags:
      - OAuth2
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                token:
                  type: string
  /oauth2/token:
    post:
      description: 'The token endpoint is used by the client to obtain an access token by

        presenting its authorization grant or refresh token.'
      operationId: token
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - description: DPoP proof
        in: header
        name: dpop
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/tokenResponse'
        '400':
          $ref: '#/components/responses/genericError'
        '401':
          $ref: '#/components/responses/genericError'
        '404':
          $ref: '#/components/responses/genericError'
        '412':
          $ref: '#/components/responses/genericError'
        '429':
          $ref: '#/components/responses/genericError'
      summary: The OAuth 2.0 token endpoint
      tags:
      - OAuth2
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                code:
                  type: string
                scope:
                  type: string
                redirect_uri:
                  type: string
                client_id:
                  type: string
                client_secret:
                  type: string
                refresh_token:
                  type: string
                username:
                  type: string
                password:
                  type: string
                code_verifier:
                  type: string
                requested_token_type:
                  type: string
                subject_token:
                  type: string
                subject_token_type:
                  type: string
                actor_token:
                  type: string
                actor_token_type:
                  type: string
              required:
              - grant_type
  /oidc/logout:
    get:
      description: 'Perform RP-Initiated Logout. See

        OpenID Connect RP-Initiated Logout 1.0 spec.'
      operationId: rpInitiatedLogout
      responses:
        '200':
          $ref: '#/components/responses/emptyResponse'
        '401':
          $ref: '#/components/responses/genericError'
        '404':
          $ref: '#/components/responses/genericError'
        '429':
          $ref: '#/components/responses/genericError'
      security:
      - default: []
      summary: OIDC 1.0 RP-Initiated Logout Endpoint
      tags:
      - OAuth2
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                id_token_hint:
                  type: string
                logout_hint:
                  type: string
                client_id:
                  type: string
                post_logout_redirect_uri:
                  type: string
                state:
                  type: string
                ui_locales:
                  type: array
                  items:
                    type: string
    post:
      description: 'Perform RP-Initiated Logout. See

        OpenID Connect RP-Initiated Logout 1.0 spec.'
      operationId: rpInitiatedLogoutPost
      responses:
        '200':
          $ref: '#/components/responses/emptyResponse'
        '401':
          $ref: '#/components/responses/genericError'
        '404':
          $ref: '#/components/responses/genericError'
        '429':
          $ref: '#/components/responses/genericError'
      security:
      - default: []
      summary: OIDC 1.0 RP-Initiated Logout Endpoint
      tags:
      - OAuth2
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                id_token_hint:
                  type: string
                logout_hint:
                  type: string
                client_id:
                  type: string
                post_logout_redirect_uri:
                  type: string
                state:
                  type: string
                ui_locales:
                  type: array
                  items:
                    type: string
  /par:
    post:
      description: 'This endpoint allows clients to push the payload of an OAuth 2.0 authorization request to the authorization server

        via a direct request and provides them with a request URI that is used as reference to the data in a subsequent call

        to the authorization endpoint.'
      operationId: pushedAuthorizationRequest
      parameters:
      - description: Request Object that holds authorization request parameters
        in: query
        name: request
        schema:
          type: string
      - description: DPoP proof
        in: header
        name: dpop
        schema:
          type: string
      responses:
        '201':
          $ref: '#/components/responses/PARResponse'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '405':
          $ref: '#/components/responses/methodNotAllowedHTTPError'
        '413':
          $ref: '#/components/responses/payloadTooLargeHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - default: []
      summary: Pushed Authorization Request (PAR) endpoint
      tags:
      - OAuth2
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                  description: Client id
                client_secret:
                  type: string
                  description: Client secret
                client_assertion_type:
                  type: string
                  description: client assertion type
                client_assertion:
                  type: string
                  description: client assertion
                response_type:
                  type: string
                  description: Response type
                redirect_uri:
                  type: string
                  description: Redirect uri
                scope:
                  type: string
                  description: Scope
                state:
                  type: string
                  description: State
                acr_values:
                  type: string
                  description: Requested Authentication Context Class Reference values.
                code_challenge:
                  type: string
                  description: Code challenge
                code_challenge_method:
                  type: string
                  description: Code challenge method
                authorization_details:
                  type: string
                  description: Authorization details
                dpop_jkt:
                  type: string
                  description: Thumbprint of the DPoP public key
              required:
              - client_id
              - response_type
              - redirect_uri
  /userinfo:
    get:
      description: 'The UserInfo Endpoint is an OAuth 2.0 Protected Resource that

        returns Claims about the authenticated End-User. To obtain the requested

        Claims about the End-User, the Client makes a request to the UserInfo Endpoint

        using an Access Token obtained through OpenID Connect Authentication. These Claims

        are represented by a JSON object that contains a collection of name and value

        pairs for the Claims.'
      operationId: userinfo
      parameters:
      - description: Indicates if sso session should be extended for the request. Optional. Default `true`
        in: header
        name: SSO-Session-Extend
        schema:
          type: boolean
      responses:
        '200':
          $ref: '#/components/responses/userinfoResponse'
        '401':
          $ref: '#/components/responses/genericError'
        '404':
          $ref: '#/components/responses/genericError'
        '429':
          $ref: '#/components/responses/genericError'
      security:
      - default: []
      summary: OpenID Connect Userinfo endpoint
      tags:
      - OAuth2
components:
  responses:
    jwksResponse:
      description: JWKs
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClientJWKs'
    wellKnownResponse:
      description: OpenID configuration
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/wellKnown'
    BackchannelAuthenticationResponse:
      description: Backchannel authentication response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BackchannelAuthenticationResponse'
    tooManyRequestsHTTPError:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    genericError:
      description: ErrorResponse
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/genericError'
    IntrospectResponse:
      description: Token introspection response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IntrospectResponse'
    BackchannelAuthenticationError:
      description: Backchannel authentication error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BackchannelAuthenticationError'
    emptyResponse:
      description: Empty response
    DynamicClientRegistrationResponse:
      description: Dynamic client registration response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DynamicClientRegistrationResponse'
    unauthorizedHTTPError:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RFC6749Error:
      description: RFC6749 error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RFC6749Error'
    DeviceResponse:
      description: Device Authorization Response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeviceResponse'
    payloadTooLargeHTTPError:
      description: Payload too large
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PARResponse:
      description: Pushed Authorization Response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PARResponse'
    userinfoResponse:
      description: Userinfo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/userinfoResponse'
    tokenResponse:
      description: Token
      headers:
        etag:
          description: 'The ETag HTTP header is an identifier for a specific version of a resource


            in:header'
          schema:
            type: string
            format: etag
        x-external-error:
          description: 'Indicates that a 5xx error was caused by tenant-provided code


            in:header'
          schema:
            type: string
        x-trace-id:
          description: 'OpenTelemetry trace identifier


            in:header'
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TokenResponse'
    methodNotAllowedHTTPError:
      description: Method not allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    badRequestHTTPError:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    PIICategory:
      properties:
        name:
          description: name
          example: HIPAA
          type: string
      type: object
    ClientJWK:
      properties:
        alg:
          description: 'The "alg" (algorithm) parameter identifies the algorithm intended for

            use with the key.  The values used should either be registered in the

            IANA "JSON Web Signature and Encryption Algorithms" registry

            established by [JWA] or be a value that contains a Collision-

            Resistant Name.'
          example: RS256
          type: string
        crv:
          example: P-256
          type: string
        d:
