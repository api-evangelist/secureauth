          description: A string containing the value of an expected rfc822Name SAN entry in the certificate.
          type: string
        tls_client_auth_san_ip:
          description: A string representation of an IP address in either dotted decimal notation (for IPv4) or colon-delimited hexadecimal (for IPv6, as defined in [RFC5952]) that is expected to be present as an iPAddress SAN entry in the certificate.
          type: string
        tls_client_auth_san_uri:
          description: A string containing the value of an expected uniformResourceIdentifier SAN entry in the certificate.
          type: string
        tls_client_auth_subject_dn:
          description: An [RFC4514] string representation of the expected subject distinguished name of the certificate.
          type: string
        tls_client_certificate_bound_access_tokens:
          description: Boolean value indicating server support for mutual TLS client certificate-bound access tokens. If omitted, the default value is "false".
          type: boolean
        token_endpoint_auth_method:
          default: client_secret_basic
          description: 'Token endpoint authentication method configured for a client application


            SecureAuth supports the following client authentication methods:

            `client_secret_basic`, `client_secret_post`, `client_secret_jwt`, `private_key_jwt`,

            `self_signed_tls_client_auth`, `tls_client_auth`, `none`.


            To learn more, go to the Authorization Basics > Client Authentication section of this guide.'
          enum:
          - client_secret_basic
          - client_secret_post
          - client_secret_jwt
          - private_key_jwt
          - self_signed_tls_client_auth
          - tls_client_auth
          - none
          - unspecified
          example: client_secret_basic
          type: string
        token_endpoint_auth_signing_alg:
          default: ES256
          description: 'Signing algorithm for the token endpoint


            This field is optional. If empty, a client can use any algorithm supported by the server (see `token_endpoint_auth_signing_alg_values_supported` in the well-known endpoing).


            If provided, depending on the server configuration, client can use of one: HS256, RS256, ES256, PS256 algorithms.


            If your token endpoint authentication is set to the `private_key_jwt` method, the

            `token_endpoint_auth_signing_alg` parameter must be either RS256, ES256, or PS256.


            If your token endpoint authentication is set to the `client_secret_jwt` method,

            the `token_endpoint_auth_signing_alg` parameter must be HS256.'
          enum:
          - RS256
          - ES256
          - PS256
          - HS256
          - ''
          example: ES256
          type: string
        token_exchange:
          $ref: '#/components/schemas/ClientTokenExchangeConfiguration'
        tos_uri:
          description: Terms of Service URL.
          type: string
        updated_at:
          description: Date when the client application was updated.
          example: '2022-05-08T01:11:51.1262916Z'
          format: date-time
          type: string
        userinfo_signed_response_alg:
          default: none
          description: 'JWS alg algorithm REQUIRED for signing UserInfo Responses.


