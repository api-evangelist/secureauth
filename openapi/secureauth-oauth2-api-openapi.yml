    RFC6749Error:
      properties:
        cause:
          type: string
        details:
          type: object
        error:
          type: string
        error_description:
          type: string
        error_hint:
          type: string
        error_uri:
          type: string
        status_code:
          format: int64
          type: integer
      type: object
    AuthorizationDetailType:
      type: string
    wellKnown:
      description: 'WellKnown represents important OpenID Connect discovery metadata.


        It includes links to several endpoints (e.g. /oauth2/token) and exposes information on supported signature algorithms

        among others.'
      properties:
        acr_values_supported:
          items:
            type: string
          type: array
        attachments_supported:
          description: JSON array containing all attachment types supported by the OP.  REQUIRED when OP supports attachments. Possible values are external and embedded.
          items:
            type: string
          type: array
        authorization_details_types_supported:
          description: List of supported authorization details types
          items:
            type: string
          type: array
        authorization_encryption_alg_values_supported:
          description: optional JSON array containing a list of the encryption algorithms (alg values) supported by the authorization endpoint to encrypt the response.
          items:
            enum:
            - RSA-OAEP
            - RSA-OAEP-256
            type: string
          type: array
        authorization_encryption_enc_values_supported:
          description: optional JSON array containing a list of the encryption algorithms (enc values) supported by the authorization endpoint to encrypt the response.
          items:
            enum:
            - A256GCM
            - A128CBC-HS256
            type: string
          type: array
        authorization_endpoint:
          description: URL of the OP's OAuth 2.0 Authorization Endpoint.
          example: https://example.com/oauth2/auth
          type: string
        authorization_grant_profiles_supported:
          description: JSON array containing a list of the authorization grant profiles that this OP supports.
          items:
            type: string
          type: array
        authorization_response_iss_parameter_supported:
          type: boolean
        authorization_signing_alg_values_supported:
          description: optional JSON array containing a list of the signing algorithms supported by the authorization endpoint to sign the response.
          items:
            type: string
          type: array
        backchannel_authentication_endpoint:
          description: URL of the OP's Backchannel Authentication Endpoint
          type: string
        backchannel_authentication_request_signing_alg_values_supported:
          description: 'JSON array containing a list of the JWS signing algorithms (alg values) supported by the OP for signed authentication requests

            If omitted, signed authentication requests are not supported by the OP.'
          items:
            type: string
          type: array
        backchannel_logout_session_supported:
          description: 'Boolean value specifying whether the OP can pass a sid (session ID) Claim in the Logout Token to identify the RP

            session with the OP. If supported, the sid Claim is also included in ID Tokens issued by the OP'
          type: boolean
        backchannel_logout_supported:
          description: Boolean value specifying whether the OP supports back-channel logout, with true indicating support.
          type: boolean
        backchannel_token_delivery_modes_supported:
          description: 'JSON array containing one or more of the following values: poll, ping, and push.'
          items:
            type: string
          type: array
        backchannel_user_code_parameter_supported:
          description: 'Boolean value specifying whether the OP supports the use of the user_code parameter, with true indicating support.

            If omitted, the default value is false.'
          type: boolean
        cdr_arrangement_revocation_endpoint:
          description: 'The URL of the CDR Arrangement Revocation End Point for consent revocation.

            Available only for "cdr_australia" workspace profile.'
          type: string
        claims_in_verified_claims_supported:
          description: 'JSON array containing all Claims supported within verified_claims.

            Claims that are not present in this array MUST NOT be returned within the verified_claims object.'
          items:
            type: string
          type: array
        claims_parameter_supported:
          description: Boolean value specifying whether the OP supports use of the claims parameter, with true indicating support.
          type: boolean
        claims_supported:
          description: 'JSON array containing a list of the Claim Names of the Claims that the OpenID Provider MAY be able to supply

            values for. Note that for privacy or other reasons, this might not be an exhaustive list.'
          items:
            type: string
          type: array
        client_id_metadata_document_supported:
          description: Boolean value indicating whether the authorization server accepts a client_id that is an https URL pointing at the client's own metadata document
          type: boolean
        code_challenge_methods_supported:
          description: List of supported Proof Key for Code Exchange (PKCE) code challenge methods
          items:
            type: string
          type: array
        device_authorization_endpoint:
          description: URL of the authorization server's device authorization endpoint
          type: string
        digest_algorithms_supported:
          description: 'REQUIRED when OP supports external attachments. JSON array containing all supported digest algorithms which can be used as alg property within

            the digest object of external attachments. If the OP supports external attachments, at least the algorithm sha-256 MUST be supported by the OP as well.'
          items:
            type: string
          type: array
        documents_check_methods_supported:
          description: JSON array containing the check methods the OP supports for evidences of type "document".
          items:
            type: string
          type: array
        documents_methods_supported:
          description: JSON array containing the methods the OP supports for evidences of type "document".
          items:
            type: string
          type: array
        documents_supported:
          description: JSON array containing all identity document types utilized by the OP for identity verification. REQUIRED when evidence_supported contains "document".
          items:
            type: string
          type: array
        dpop_signing_alg_values_supported:
          description: JSON array containing a list of the JWS algorithms supported for DPoP proof JWTs
          items:
            type: string
          type: array
        electronic_records_supported:
          description: JSON array containing all electronic record types the OP supports. REQUIRED when evidence_supported contains "electronic_record".
          items:
            type: string
          type: array
        end_session_endpoint:
          description: URL at the OP to which an RP can perform a redirect to request that the End-User be logged out at the OP.
          type: string
        evidence_supported:
          description: JSON array containing all types of identity evidence the OP uses.
          items:
            type: string
          type: array
        frontchannel_logout_session_supported:
          description: 'Boolean value specifying whether the OP can pass iss (issuer) and sid (session ID) query parameters to identify

            the RP session with the OP when the frontchannel_logout_uri is used. If supported, the sid Claim is also

            included in ID Tokens issued by the OP.'
          type: boolean
        frontchannel_logout_supported:
          description: Boolean value specifying whether the OP supports HTTP-based logout, with true indicating support.
          type: boolean
        grant_types_supported:
          description: JSON array containing a list of the OAuth 2.0 Grant Type values that this OP supports.
          items:
            enum:
            - authorization_code
            - implicit
            - client_credentials
            - refresh_token
            - password
            - urn:ietf:params:oauth:grant-type:jwt-bearer
            - urn:openid:params:grant-type:ciba
            - urn:ietf:params:oauth:grant-type:token-exchange
            - urn:ietf:params:oauth:grant-type:device_code
            type: string
          type: array
        id_token_encryption_alg_values_supported:
          description: JSON array containing a list of the JWE encryption algorithms (alg values) supported by the OP for the ID Token to encode the Claims in a JWT
          items:
            enum:
            - RSA-OAEP
            - RSA-OAEP-256
            type: string
          type: array
        id_token_encryption_enc_values_supported:
          description: JSON array containing a list of the JWE encryption algorithms (enc values) supported by the OP for the ID Token to encode the Claims in a JWT
          items:
            enum:
            - A256GCM
            - A128CBC-HS256
            type: string
          type: array
        id_token_signing_alg_values_supported:
          description: 'JSON array containing a list of the JWS signing algorithms (alg values) supported by the OP for the ID Token

            to encode the Claims in a JWT.'
          items:
            type: string
          type: array
        identity_chaining_requested_token_types_supported:
          description: JSON array containing a list of token type identifiers the authorization server can issue via token exchange for identity chaining
          items:
            type: string
          type: array
        introspection_endpoint:
          description: OAuth 2.0 Introspection Endpoint.
          type: string
        introspection_endpoint_auth_methods_supported:
          description: 'JSON array containing a list of Client Authentication methods supported by Introspection Endpoint. The options are

            client_secret_post, client_secret_basic, client_secret_jwt, and private_key_jwt, as described in Section 9 of OpenID Connect Core 1.0'
          items:
            enum:
            - client_secret_basic
            - client_secret_post
            - client_secret_jwt
            - private_key_jwt
            - self_signed_tls_client_auth
            - tls_client_auth
            - none
            - unspecified
            type: string
          type: array
        introspection_endpoint_auth_signing_alg_values_supported:
          description: 'JSON array containing a list of the JWS signing algorithms ("alg" values) supported by the introspection endpoint for the signature

            on the JWT [JWT] used to authenticate the client at the introspection endpoint for the "private_key_jwt" and "client_secret_jwt" authentication methods.'
          items:
            type: string
          type: array
        issuer:
          description: 'URL using the https scheme with no query or fragment component that the OP asserts as its IssuerURL Identifier.

            If IssuerURL discovery is supported , this value MUST be identical to the issuer value returned

            by WebFinger. This also MUST be identical to the iss Claim value in ID Tokens issued from this IssuerURL.'
          example: https://example.com/
          type: string
        jwks_uri:
          description: 'URL of the OP''s JSON Web Key Set [JWK] document. This contains the signing key(s) the RP uses to validate

            signatures from the OP. The JWK Set MAY also contain the Server''s encryption key(s), which are used by RPs

            to encrypt requests to the Server. When both signing and encryption keys are made available, a use (Key Use)

            parameter value is REQUIRED for all keys in the referenced JWK Set to indicate each key''s intended usage.

            Although some algorithms allow the same key to be used for both signatures and encryption, doing so is

            NOT RECOMMENDED, as it is less secure. The JWK x5c parameter MAY be used to provide X.509 representations of

            keys provided. When used, the bare key values MUST still be present and MUST match those in the certificate.'
          example: https://example.com/.well-known/jwks.json
          type: string
        mtls_endpoint_aliases:
          $ref: '#/components/schemas/MTLSEndpointAliases'
        mtls_issuer:
          type: string
        pushed_authorization_request_endpoint:
          description: 'The URL of the pushed authorization request endpoint at which a client can post an authorization request to exchange

            for a "request_uri" value usable at the authorization server.'
          type: string
        registration_endpoint:
          description: URL of the authorization server's OAuth 2.0 dynamic client registration endpoint.
          type: string
        request_object_encryption_alg_values_supported:
          description: List of JWE encryption algorithms (alg values) supported by the OP for Request Objects. These algorithms are used both when the Request Object is passed by a value and when it is passed by a reference.
          items:
            type: string
          type: array
        request_object_encryption_enc_values_supported:
          description: List of JWE encryption algorithms (enc values) supported by the OP for Request Objects. These algorithms are used both when the Request Object is passed by a value and when it is passed by a reference.
          items:
            type: string
          type: array
        request_object_signing_alg_values_supported:
          description: 'JSON array containing a list of the JWS signing algorithms (alg values) supported by the OP for Request Objects, which are described in Section 6.1 of OpenID Connect Core 1.0 [OpenID.Core].

            These algorithms are used both when the Request Object is passed by value (using the request parameter) and when it is passed by reference (using the request_uri parameter).

            Servers SHOULD support none and RS256.'
          items:
            type: string
          type: array
        request_parameter_supported:
          description: Boolean value specifying whether the OP supports use of the request parameter, with true indicating support.
          type: boolean
        request_uri_parameter_supported:
          description: Boolean value specifying whether the OP supports use of the request_uri parameter, with true indicating support.
          type: boolean
        require_pushed_authorization_requests:
          description: Boolean parameter indicating whether the authorization server accepts authorization request data only via PAR.
          type: boolean
        require_request_uri_registration:
          description: 'Boolean value specifying whether the OP requires any request_uri values used to be pre-registered

            using the request_uris registration parameter.'
          type: boolean
        response_modes_supported:
          description: JSON array containing a list of the OAuth 2.0 response_mode values that this OP supports.
          items:
            enum:
            - query
            - fragment
            - form_post
            - query.jwt
            - fragment.jwt
            - form_post.jwt
            - jwt
            type: string
          type: array
        response_types_supported:
          description: 'JSON array containing a list of the OAuth 2.0 response_type values that this OP supports. Dynamic OpenID

            Providers MUST support the code, id_token, and the token id_token Response Type values.'
          items:
            enum:
            - token
            - id_token
            - code
            - code id_token
            - token id_token
            - token code
            - token id_token code
            - none
            type: string
          type: array
        revocation_endpoint:
          description: URL of the authorization server's OAuth 2.0 revocation endpoint.
          type: string
        revocation_endpoint_auth_methods_supported:
          description: 'JSON array containing a list of Client Authentication methods supported by Revocation Endpoint. The options are

            client_secret_post, client_secret_basic, client_secret_jwt, and private_key_jwt, as described in Section 9 of OpenID Connect Core 1.0'
          items:
            enum:
            - client_secret_basic
            - client_secret_post
            - client_secret_jwt
            - private_key_jwt
            - self_signed_tls_client_auth
            - tls_client_auth
            - none
            - unspecified
            type: string
          type: array
        revocation_endpoint_auth_signing_alg_values_supported:
          description: 'JSON array containing a list of the JWS signing algorithms ("alg" values) supported by the revocation endpoint for

            the signature on the JWT [JWT] used to authenticate the client at the revocation endpoint for the "private_key_jwt" and "client_secret_jwt" authentication methods.'
          items:
            type: string
          type: array
        scopes_supported:
          description: 'SON array containing a list of the OAuth 2.0 [RFC6749] scope values that this server supports. The server MUST

            support the openid scope value. Servers MAY choose not to advertise some supported scope values even when this parameter is used'
          items:
            type: string
          type: array
        subject_types_supported:
          description: 'JSON array containing a list of the Subject Identifier types that this OP supports. Valid types include

            pairwise and public.'
          example: public, pairwise
          items:
            enum:
            - public
            - pairwise
            type: string
          type: array
        tls_client_certificate_bound_access_tokens:
          description: Boolean value indicating server support for mutual TLS client certificate bound access tokens
          type: boolean
        token_endpoint:
          description: URL of the OP's OAuth 2.0 Token Endpoint
          example: https://example.com/oauth2/token
          type: string
        token_endpoint_auth_methods_supported:
          description: 'JSON array containing a list of Client Authentication methods supported by Token Endpoint. The options are

            client_secret_post, client_secret_basic, client_secret_jwt, and private_key_jwt, as described in Section 9 of OpenID Connect Core 1.0'
          items:
            enum:
            - client_secret_basic
            - client_secret_post
            - client_secret_jwt
            - private_key_jwt
            - self_signed_tls_client_auth
            - tls_client_auth
            - none
            - unspecified
            type: string
          type: array
        token_endpoint_auth_signing_alg_values_supported:
          description: 'JSON array containing a list of the JWS signing algorithms ("alg" values) supported by the token endpoint for the

            signature on the JWT [JWT] used to authenticate the client at the token endpoint for the "private_key_jwt" and "client_secret_jwt" authentication methods.

            This metadata entry MUST be present if either of these authentication methods are specified in the "token_endpoint_auth_methods_supported" entry.

            No default algorithms are implied if this entry is omitted.  Servers SHOULD support "RS256".  The value "none" MUST NOT be used.'
          items:
            type: string
          type: array
        trust_frameworks_supported:
          description: JSON array containing all supported trust frameworks
          items:
            type: string
          type: array
        userinfo_endpoint:
          description: URL of the OP's UserInfo Endpoint.
          type: string
        userinfo_signing_alg_values_supported:
          description: JSON array containing a list of the JWS [JWS] signing algorithms (alg values) [JWA] supported by the UserInfo Endpoint to encode the Claims in a JWT [JWT].
          items:
            type: string
          type: array
        verified_claims_supported:
          description: Boolean value indicating support for verified_claims, i.e., the OpenID Connect for Identity Assurance extension.
          type: boolean
      required:
      - issuer
      - authorization_endpoint
      - token_endpoint
      - jwks_uri
      - subject_types_supported
      - response_types_supported
      - id_token_signing_alg_values_supported
      title: WellKnown response
      type: object
    RedirectURIs:
      description: 'SecureAuth uses redirect URIs to redirect users back to the application after they authorized the application. Along

        with the redirection, an authorization code or access token is added to the URL.


        For backward compatibility reasons, it''s also acceptable to pass `redirect_uris` as a string, for example:

        https://example.com/callback.


        example: ["https://example.com/callback"]'
      items:
        type: string
      title: OAuth-allowed redirect URIs
      type: array
    BackchannelAuthenticationError:
      description: 'CIBA error response

        https://openid.net/specs/openidclientinitiatedbackchannelauthenticationcore1_0.html#rfc.section.13'
      properties:
        error:
          description: REQUIRED. A single ASCII error code from one present in the list below.
          type: string
        error_description:
          description: 'OPTIONAL. Humanreadable ASCII [USASCII] text providing additional information, used to assist the client developer in understanding

            the error that occurred. Values for the "error_description" parameter MUST NOT include characters outside the set %x2021 / %x235B / %x5D7E.'
          type: string
        error_uri:
          description: 'OPTIONAL. A URI identifying a humanreadable web page with information about the error to provide the client developer with additional information.

            Values for the "error_uri" parameter MUST conform to the URIreference syntax and thus MUST NOT include characters outside the set %x21 / %x235B / %x5D7E.'
          type: string
      type: object
    genericError:
      description: Error response
      properties:
        cause:
          description: error cause
          type: string
        details:
          description: error details
          type: object
        error:
          example: The requested resource could not be found
          type: string
        error_description:
          description: error description
          type: string
        error_hint:
          example: Object with ID 12345 does not exist
          type: string
        status_code:
          description: Code represents the error status code (404, 403, 401, ...).
          example: 404
          format: int64
          type: integer
      required:
      - error
      type: object
    DynamicClientRegistrationResponse:
      properties:
        agent_capability:
          $ref: '#/components/schemas/AgentCapability'
        app_url:
          description: Application URL
          type: string
        application_purpose:
          description: Application purpose
          enum:
          - single_page
          - server_web
          - mobile_desktop
          - service
          - legacy
          - custom
          - saml
          - ai_agent
          example: signle_page
          type: string
        application_type:
          default: web
          description: 'The client application type.


            Client applications can be either of a `web` or `native` types.


            Web applications include clients like server web applications or service apps.


            Native applications include single-page applications (SPAs) and mobile or desktop

            applications.


            Apply security measures according to the type of your application.'
          example: web
          type: string
        application_types:
          default:
          - server_web
          description: An array of dynamically calculated application types that can be used for filtering
          example:
          - single_page
          - server_web
          - mobile_desktop
          - service
          - legacy
          - dcr
          items:
            enum:
            - single_page
            - server_web
            - mobile_desktop
            - service
            - legacy
            - dcr
            type: string
          readOnly: true
          type: array
        audience:
          default:
          - client_id
          description: 'Identity of the intended recipients (the audience).


            Typically, the audience is a single resource server or a list of resource servers.


            It is considered a good practice to limit the audience of the token for security purposes.'
          items:
            type: string
          type: array
        authorization_details_types:
          description: 'Authorization details types


            Indicates what authorization details types the client can use.'
          items:
            $ref: '#/components/schemas/AuthorizationDetailType'
          type: array
        authorization_encrypted_response_alg:
          description: 'Algorithm used for encrypting authorization responses.


            If both signing and encryption are requested, the response is first signed, and then encrypted.

            As a result, a Nested JWT is obtained, as defined in JWT [RFC7519].


            If omitted, no encryption is applied by default.'
          enum:
          - RSA-OAEP
          - RSA-OAEP-256
          example: RSA-OAEP-256
          type: string
        authorization_encrypted_response_enc:
          description: 'Algorithm used for encrypting authorization responses.


            With `authorization_encrypted_response_alg` specified, the default value is `A128CBC-HS256`.

            When `authorization_encrypted_response_enc` is included, `authorization_encrypted_response_alg`

            MUST also be provided in a request.'
          enum:
          - A256GCM
          - A128CBC-HS256
          example: A128CBC-HS256
          type: string
        authorization_signed_response_alg:
          description: 'Algorithm used for signing authorization responses.


            With this parameter specified, the response is signed using JWS and according to the configured algorithm.


            `none` isn''t allowed.'
          example: RS256
          type: string
        backchannel_authentication_request_signing_alg:
          description: 'OPTIONAL. The JWS alg algorithm value used by the client application to sign authentication requests.


            When omitted, the client application doesn''t send signed authentication requests.'
          type: string
        backchannel_client_notification_endpoint:
          description: 'REQUIRED for requests when the client application uses CIBA as an authorization grant type, and the token

            delivery mode is set to `ping` or `push`.


            This parameter is the endpoint where an OP (OpenID Provider) posts a notification after end-user authentication.


            Input: an HTTPS URL.'
          type: string
        backchannel_logout_session_required:
          description: Boolean value specifying whether the RP requires that a sid (session ID) claim be included in the Logout Token to identify the RP session with the OP when the backchannel_logout_uri is used.
          type: boolean
        backchannel_logout_uri:
          description: RP URL that will cause the RP to log itself out when sent a Logout Token by the OP.
          type: string
        backchannel_token_delivery_mode:
          description: 'REQUIRED for requests when the client application uses CIBA as an authorization grant type.


            Input: `poll`, `ping`, or `push`.'
          type: string
        backchannel_user_code_parameter:
          description: 'OPTIONAL. A boolean value indicating the `user_code` parameter support by the client application.


            If omitted, the default value is `false`.


            This applies only when the `backchannel_user_code_parameter_supported` OP parameter is `true`.'
          type: boolean
        certificate:
          description: 'Base64 encoded certicate in PEM format that will be automatically converted and stored in jwks


            It is used only as an input parameter for the Create / Import Client.'
          type: string
        client_id:
          description: 'OAuth client application identifier


            If not provided, a random client ID is generated.'
          format: clientID
          type: string
        client_id_issued_at:
          description: 'The client identifier time of issue.


            The value is the number of seconds between 1970-01-01T00:00:00Z (UTC) and the date/time of issue.'
          format: int64
          type: integer
        client_name:
          description: Human-readable name of a client application.
          example: My app
          type: string
        client_secret:
          description: 'OAuth client secret


            If not provided, a random client secret is generated.'
          minLength: 32
          type: string
        client_secret_expires_at:
          description: 'The client secret expiration time.


            If the client secret does not expire, `client_secret_expires_at` = `0`.'
          format: int64
          type: integer
        client_uri:
          description: URI of a client application.
          type: string
        created_at:
          description: Date when the client application was created.
          example: '2022-04-07T19:17:31.323187Z'
          format: date-time
          type: string
        default_acr_values:
          description: 'default ACR values

            list of ACR values that will be implicitly requested for the client if not explicitly specified'
          items:
            format: acrValue
            type: string
          type: array
        description:
          description: Description of the client application.
          type: string
        dpop_bound_access_tokens:
          description: 'Boolean value specifying whether the client always uses DPoP for token requests

            If true, the authorization server will reject token requests from this client that do not contain the DPoP header.'
          type: boolean
        dynamically_registered:
          type: boolean
        enforce_application_membership:
          description: 'Enforce application membership for this application. When true, a user token is issued only if the

            user has membership/access to this application in the resolved organization. Defaults to false and,

            on creation, to the workspace-level default. Only meaningful while the applications_membership feature is enabled.'
          type: boolean
        grant_types:
          default:
          - authorization_code
          description: 'An array of allowed OAuth client grant types.


            The `grantTypes` array stores OAuth flows that are allowed for a given client application.


            [Read more](https://cloudentity.com/developers/basics/oauth-grant-types/grant-types-overview/) about grant types.'
          example:
          - password
          - refresh_token
          - client_credentials
          - implicit
          - authorization_code
          items:
            enum:
            - authorization_code
            - implicit
            - client_credentials
            - refresh_token
            - password
            - urn:ietf:params:oauth:grant-type:jwt-bearer
            - urn:openid:params:grant-type:ciba
            - urn:ietf:params:oauth:grant-type:token-exchange
            - urn:ietf:params:oauth:grant-type:device_code
            type: string
          type: array
        hashed_rotated_secrets:
          description: An array of hashed rotated client secrets
          items:
            type: string
          type: array
        hashed_secret:
          description: 'Hashed client secret


            Hashing client secrets provides additional security for your secrets storage as it hides

            plaintext secrets from being viewed both in the UI and the database.'
          type: string
        id_token_encrypted_response_alg:
          description: JWE alg algorithm for encrypting the ID token issued to this client application.
          enum:
          - RSA-OAEP
          - RSA-OAEP-256
          type: string
        id_token_encrypted_response_enc:
          description: JWE enc algorithm for encrypting the ID token issued to this client application.
          enum:
          - A256GCM
          - A128CBC-HS256
          type: string
        id_token_signed_response_alg:
          description: 'Algorithm for signing ID tokens issued for a client application.


            The default value depends on authorization server configuration.'
          enum:
          - RS256
          - ES256
          - PS256
          example: ES256
          type: string
        introspection_endpoint_auth_method:
          default: client_secret_basic
          description: 'An introspection endpoint authentication method configured for the client application (read-only).


            If empty, the `token_endpoint_auth_method` is used.


            SecureAuth supports the following client authentication methods:

            `client_secret_basic`, `client_secret_post`, `client_secret_jwt`, `private_key_jwt`,

            `self_signed_tls_client_auth`, `tls_client_auth`, `none`.


            [Read more](https://cloudentity.com/developers/basics/oauth-client-authentication/client-authentication-overview/) about client authentication.'
          enum:
          - client_secret_basic
          - client_secret_post
          - client_secret_jwt
          - private_key_jwt
          - self_signed_tls_client_auth
          - tls_client_auth
          - none
          example: client_secret_basic
          type: string
        jwks:
          $ref: '#/components/schemas/ClientJWKs'
        jwks_uri:
          description: A URL of JSON Web Key Set with the public keys used by a client application to authenticate to SecureAuth.
          type: string
        logo_uri:
          description: Logo URI.
          type: string
        organisation_id:
