            on creation, to the workspace-level default. Only meaningful while the applications_membership feature is enabled.'
          type: boolean
        grant_types:
          default:
          - authorization_code
          description: 'An array of allowed OAuth client grant types.


            The `grantTypes` array stores OAuth flows that are allowed for a given client application.


            [Read more](https://cloudentity.com/developers/basics/oauth-grant-types/grant-types-overview/) about grant types.'
          example:
          - password
          - refresh_token
          - client_credentials
          - implicit
          - authorization_code
          items:
            enum:
            - authorization_code
            - implicit
            - client_credentials
            - refresh_token
            - password
            - urn:ietf:params:oauth:grant-type:jwt-bearer
            - urn:openid:params:grant-type:ciba
            - urn:ietf:params:oauth:grant-type:token-exchange
            - urn:ietf:params:oauth:grant-type:device_code
            type: string
          type: array
        id_token_encrypted_response_alg:
          description: JWE alg algorithm for encrypting the ID token issued to this client application.
          enum:
          - RSA-OAEP
          - RSA-OAEP-256
          type: string
        id_token_encrypted_response_enc:
          description: JWE enc algorithm for encrypting the ID token issued to this client application.
          enum:
          - A256GCM
          - A128CBC-HS256
          type: string
        id_token_signed_response_alg:
          description: 'Algorithm for signing ID tokens issued for a client application.


            The default value depends on authorization server configuration.'
          enum:
          - RS256
          - ES256
          - PS256
          example: ES256
          type: string
        introspection_endpoint_auth_method:
          default: client_secret_basic
          description: 'An introspection endpoint authentication method configured for the client application (read-only).


            If empty, the `token_endpoint_auth_method` is used.


            SecureAuth supports the following client authentication methods:

            `client_secret_basic`, `client_secret_post`, `client_secret_jwt`, `private_key_jwt`,

            `self_signed_tls_client_auth`, `tls_client_auth`, `none`.


            [Read more](https://cloudentity.com/developers/basics/oauth-client-authentication/client-authentication-overview/) about client authentication.'
          enum:
          - client_secret_basic
          - client_secret_post
          - client_secret_jwt
          - private_key_jwt
          - self_signed_tls_client_auth
          - tls_client_auth
          - none
          example: client_secret_basic
          type: string
        jwks:
          $ref: '#/components/schemas/ClientJWKs'
        jwks_uri:
          description: A URL of JSON Web Key Set with the public keys used by a client application to authenticate to SecureAuth.
          type: string
        logo_uri:
          description: Logo URI.
          type: string
        organisation_id:
          description: 'External organization identifier. It is a unique string assigned by the CDR Register to identify an Accredited

            Data Recipient Brand.


            The value obtained is used as the `aud` claim for message signing, for example, when a JSON Web Token (JWT) is

            required for authorization, and represents the audience(s) the JWT is intended for.'
          example: 5647fe90-f6bc-11eb-9a03-0242ac130003
          type: string
        policy_uri:
          description: Policy URL to read about how the profile data is used.
          type: string
        post_logout_redirect_uris:
          description: Array of URLs to which a relying party may request that the user be redirected after a logout has been performed.
          items:
            type: string
          type: array
        privacy:
          $ref: '#/components/schemas/ClientPrivacy'
        redirect_uris:
          $ref: '#/components/schemas/RedirectURIs'
        request_object_encryption_alg:
          description: Optional JWE alg algorithm the client is declaring that it may use for encrypting Request Objects
          enum:
          - RSA-OAEP
          - RSA-OAEP-256
          example: RSA-OAEP
          type: string
        request_object_encryption_enc:
          description: 'Optional JWE enc algorithm the client is declaring that it may use for encrypting Request Objects

            When `request_object_encryption_enc` is included, `request_object_encryption_alg` MUST also be provided.'
          enum:
          - A256GCM
          - A128CBC-HS256
          example: A256GCM
          type: string
        request_object_signing_alg:
          default: any
          description: 'Request object signing algorithm for the token endpoint


            SecureAuth supports signing tokens with the RS256, ES256, and PS256 algorithms. If you do not want

            to use a signing algorithm, set the value of this parameter to `none`.'
          enum:
          - any
          - none
          - RS256
          - ES256
          - PS256
          example: none
          type: string
        request_uris:
          description: Array of absolute URIs that points to the Request Object that holds authorization request parameters.
          items:
            type: string
          type: array
        require_pushed_authorization_requests:
          description: Boolean parameter indicating whether the only means of initiating an authorization request the client is allowed to use is PAR.
          type: boolean
        response_types:
          $ref: '#/components/schemas/ResponseTypes'
        revocation_endpoint_auth_method:
          default: client_secret_basic
          description: 'A revocation endpoint authentication method configured for the client application (read-only).

            If empty, the `token_endpoint_auth_method` is used.


            SecureAuth supports the following client authentication methods:

            `client_secret_basic`, `client_secret_post`, `client_secret_jwt`, `private_key_jwt`,

            `self_signed_tls_client_auth`, `tls_client_auth`, `none`.


            [Read more](https://cloudentity.com/developers/basics/oauth-client-authentication/client-authentication-overview/) about client authentication.'
          enum:
          - client_secret_basic
          - client_secret_post
          - client_secret_jwt
          - private_key_jwt
          - self_signed_tls_client_auth
          - tls_client_auth
          - none
          example: client_secret_basic
          type: string
        scope:
          description: Space-separated list of scopes for compatibility with the OAuth specification.
          example: email offline_access openid
          type: string
        scopes:
          description: An array of string represented scopes assigned to a client application
          example:
          - email
          - offline_access
          - openid
          items:
            type: string
          type: array
        sector_identifier_uri:
          description: 'OPTIONAL. [A URL using the HTTPS scheme](https://openid.net/specs/openid-connect-registration-1_0.html#SectorIdentifierValidation).

            It must reference a JSON file with the array of `redirect_uri` values.


            Pass this parameter when you use multiple domains in your `redirect_uris` or need a mechanism to allow changes in

            domain without affecting consumer consent.


            [Read more](https://openid.net/specs/openid-connect-core-1_0.html)'
          type: string
        skip_dbfp:
          description: 'Skip device-based fingerprint (DBFP) collection for this client.

            If true, the interactive DBFP collection step is skipped during login, which lets

            non-interactive clients (e.g. backend HTTP clients that cannot execute the collection

            JavaScript) complete the authorization flow. Risk inference is unaffected.'
          type: boolean
        software_id:
          description: 'A unique identifier string (e.g., a Universally Unique Identifier

            (UUID)) assigned by the client developer or software publisher.


            The `software_id` MUST remain the same across

            multiple updates or versions of the same software package. The

            value of this field is not intended to be human-readable and is

            usually opaque to the client and authorization server.'
          type: string
        software_statement:
          description: 'A digitally signed or MACed JSON Web Token (JWT) [RFC7519] that

            asserts metadata values about the client software.  In some cases,

            a software statement is issued directly by the client

            developer.  In other cases, a software statement is issued by

            a third-party organization for use by the client developer.


            In both cases, the trust relationship the authorization server has

            with the issuer of the software statement is intended to be used

            as an input to the evaluation of whether the registration request

            is accepted.


            A software statement can be presented to an

            authorization server as part of the client registration request.'
          type: string
        software_version:
          description: 'A version identifier string for the client software identified by

            `software_id`. The value of the `software_version` MUST be changed

            with any update of the client software identified by the same

            `software_id`.'
          type: string
        subject_type:
          default: public
          description: 'Subject identifier type


            Stores information if the subject identifier is of the `public` or the `pairwise` type.


            Subject identifiers identify an end-user. They are locally unique and never reassigned within the Issuer,

            and are intended to be consumed by client applications. There are two types

            of subject identifiers: `public` and `pairwise`.


            For the `public` type, the value of the `sub` (subject) token claim is the same for all clients.


            For the `pairwise` type, a different `sub` (subject) token claim is provided for each client.

            Using the `pairwise` subject identifier makes it impossible for client applications to correlate the end-user''s

            activity without their permission.'
          enum:
          - public
          - pairwise
          example: public
          type: string
        tls_client_auth_san_dns:
          description: A string containing the value of an expected dNSName SAN entry in the certificate.
          type: string
        tls_client_auth_san_email:
          description: A string containing the value of an expected rfc822Name SAN entry in the certificate.
          type: string
        tls_client_auth_san_ip:
          description: A string representation of an IP address in either dotted decimal notation (for IPv4) or colon-delimited hexadecimal (for IPv6, as defined in [RFC5952]) that is expected to be present as an iPAddress SAN entry in the certificate.
          type: string
        tls_client_auth_san_uri:
          description: A string containing the value of an expected uniformResourceIdentifier SAN entry in the certificate.
          type: string
        tls_client_auth_subject_dn:
          description: An [RFC4514] string representation of the expected subject distinguished name of the certificate.
          type: string
        tls_client_certificate_bound_access_tokens:
          description: Boolean value indicating server support for mutual TLS client certificate-bound access tokens. If omitted, the default value is "false".
          type: boolean
        token_endpoint_auth_method:
          default: client_secret_basic
          description: 'Token endpoint authentication method configured for a client application


            SecureAuth supports the following client authentication methods:

            `client_secret_basic`, `client_secret_post`, `client_secret_jwt`, `private_key_jwt`,

            `self_signed_tls_client_auth`, `tls_client_auth`, `none`.


            To learn more, go to the Authorization Basics > Client Authentication section of this guide.'
          enum:
          - client_secret_basic
          - client_secret_post
          - client_secret_jwt
          - private_key_jwt
          - self_signed_tls_client_auth
          - tls_client_auth
          - none
          - unspecified
          example: client_secret_basic
          type: string
        token_endpoint_auth_signing_alg:
          default: ES256
          description: 'Signing algorithm for the token endpoint


            This field is optional. If empty, a client can use any algorithm supported by the server (see `token_endpoint_auth_signing_alg_values_supported` in the well-known endpoing).


            If provided, depending on the server configuration, client can use of one: HS256, RS256, ES256, PS256 algorithms.


            If your token endpoint authentication is set to the `private_key_jwt` method, the

            `token_endpoint_auth_signing_alg` parameter must be either RS256, ES256, or PS256.


            If your token endpoint authentication is set to the `client_secret_jwt` method,

            the `token_endpoint_auth_signing_alg` parameter must be HS256.'
          enum:
          - RS256
          - ES256
          - PS256
          - HS256
          - ''
          example: ES256
          type: string
        token_exchange:
          $ref: '#/components/schemas/ClientTokenExchangeConfiguration'
        tos_uri:
          description: Terms of Service URL.
          type: string
        updated_at:
          description: Date when the client application was updated.
          example: '2022-05-08T01:11:51.1262916Z'
          format: date-time
          type: string
        userinfo_signed_response_alg:
          default: none
          description: 'JWS alg algorithm REQUIRED for signing UserInfo Responses.


            If specified, the response is a JWT serialized and signed with JWS.


            If omitted, then by default, UserInfo Response returns the Claims

            as an UTF-8 encoded JSON object using the application/json content-type.'
          enum:
          - none
          - RS256
          - ES256
          example: none
          type: string
      type: object
    Error:
      description: HTTP error response
      properties:
        details:
          type: object
        error:
          type: string
        error_code:
          type: string
        status_code:
          format: int64
          type: integer
      type: object
    ClientTokenExchangeConfiguration:
      properties:
        actor_claims:
          description: 'Additional actor token claims


            Claims from the actor token that will be injected into the exchanged token under the `act` claim.


            Applies for the token exchange delegation flow only.'
          items:
            type: string
          type: array
        id_jag_targets:
          description: ID-JAG targets with optional client ID and audience tenant overrides. Audiences must be unique.
          items:
            $ref: '#/components/schemas/ClientIDJAGTarget'
          type: array
      type: object
    DeviceResponse:
      description: Device Response
      properties:
        device_code:
          description: The device verification code.
          type: string
        expires_in:
          description: The lifetime in seconds of the "device_code" and "user_code".
          format: int64
          type: integer
        interval:
          description: 'The minimum amount of time in seconds that the client

            SHOULD wait between polling requests to the token endpoint.  If no

            value is provided, clients MUST use 5 as the default.'
          format: int64
          type: integer
        user_code:
          description: The end-user verification code.
          type: string
        verification_uri:
          description: 'The end-user verification URI on the authorization server.

            The URI should be short and easy to remember as end users will be asked to manually type it into their user agent.'
          type: string
        verification_uri_complete:
          description: 'A verification URI that includes the "user_code" (or other information with the same function as the "user_code"),

            which is designed for non-textual transmission.'
          type: string
      type: object
    AgentCapability:
      type: string
    ClientIDJAGTarget:
      properties:
        aud_tenant:
          description: Sets the ID-JAG aud_tenant claim for this audience. Multi-tenant resource servers require it.
          type: string
        audience:
          description: Target authorization server issuer URL.
          type: string
        client_id:
          description: Overrides the ID-JAG client_id claim for this audience. Empty uses the requesting client's ID.
          type: string
      required:
      - audience
      type: object
    Confirmation:
      properties:
        jkt:
          type: string
        x5t#S256:
          type: string
      type: object
    MTLSEndpointAliases:
      properties:
        backchannel_authentication_endpoint:
          type: string
        device_authorization_endpoint:
          type: string
        introspection_endpoint:
          type: string
        pushed_authorization_request_endpoint:
          type: string
        registration_endpoint:
          type: string
        revocation_endpoint:
          type: string
        token_endpoint:
          type: string
        userinfo_endpoint:
          type: string
      type: object
    BackchannelAuthenticationResponse:
      properties:
        auth_req_id:
          description: Unique identifier to identify the authentication request made by the Client
          type: string
        expires_in:
          description: A JSON number with a positive integer value indicating the expiration time of the "auth_req_id" in seconds since the authentication request was received
          format: int64
          type: integer
        interval:
          description: 'OPTIONAL. A JSON number with a positive integer value indicating the minimum amount of time in seconds

            that the Client MUST wait between polling requests to the token endpoint.

            This parameter will only be present if the Client is registered to use the Poll or Ping modes.

            If no value is provided, clients MUST use 5 as the default value.'
          format: int64
          type: integer
      type: object
    ScopePrivacyInformation:
      properties:
        pii_categories:
          items:
            $ref: '#/components/schemas/PIICategory'
          type: array
        purpose:
          format: purposeName
          type: string
      type: object
    PARResponse:
      description: Pushed Authorization Response
      properties:
        expires_in:
          description: 'A JSON number that represents the lifetime of the request URI in seconds as a positive integer.

            The request URI lifetime is at the discretion of the authorization server but will typically be

            relatively short (e.g., between 5 and 600 seconds).'
          format: int64
          type: integer
        request_uri:
          description: 'The request URI corresponding to the authorization request posted.

            This URI is a single-use reference to the respective request data in the subsequent authorization request.

            The way the authorization process obtains the authorization request data is at the discretion of the

            authorization server and is out of scope of this specification.

            There is no need to make the authorization request data available to other parties via this URI.'
          type: string
      type: object
    IntrospectResponse:
      properties:
        acr:
          description: Authentication context class reference
          type: string
        act:
          additionalProperties:
            type: object
          description: Actor claims used in the Token Exchange flow.
          type: object
        active:
          description: 'Active is a boolean indicator of whether or not the presented token

            is currently active. The specifics of a token''s `active` state

            varies depending on the implementation of an authorization

            server and the information it keeps about its token. Still, the `true`

            value returned for the `active` property generally indicates

            that a given token has been issued by this authorization server,

            has not been revoked by the resource owner, and is within its

            given time window of validity (e.g., between its issuance and

            expiration time).'
          type: boolean
        amr:
          description: Authentication method references
          items:
            type: string
          type: array
        aud:
          description: Audience contains the list of the audiences the token is intended for.
          items:
            type: string
          type: array
        authorization_details:
          description: Granted authorization details
          items:
            additionalProperties:
              type: object
            type: object
          type: array
        client_id:
          description: 'A client application identifier for the OAuth 2.0 client that

            requested this token.'
          type: string
        cnf:
          $ref: '#/components/schemas/Confirmation'
        exp:
          description: 'ExpiredAt is the integer timestamp measured in the number of seconds

            since January 1 1970 UTC (1970-01-01T00:00:00Z). It indicates when this token will expire.'
          format: int64
          type: integer
        ext:
          additionalProperties:
            type: object
          description: Extra is arbitrary data set by the session.
          type: object
        iat:
          description: 'IssuedAt is the integer timestamp measured in the number of seconds

            since January 1 1970 UTC. It indicates when this token was

            originally issued.'
          format: int64
          type: integer
        idp:
          description: The identifier of an identity provider that user authenticated with.
          type: string
        idp_sub:
          description: IDP subject
          type: string
        iss:
          description: Issuer URL is a string representing the issuer of this token.
          type: string
        may_act:
          additionalProperties:
            type: object
          description: May act claims used in the Token Exchange flow.s
          type: object
        nbf:
          description: 'NotBefore is an integer timestamp measured in the number of seconds

            since January 1 1970 UTC. It indicates this token was not

            used before the specified time.'
          format: int64
          type: integer
        scope:
          description: 'Scope is a JSON string containing a space-separated list of

            scopes associated with this token.'
          type: string
        server_id:
          description: 'The OAuth 2.0 authorization server identifier that

            issued this token.'
          type: string
        sub:
          description: 'Subject of the token, as defined in JWT [RFC7519].

            Usually a machine-readable identifier of the resource owner who

            authorized this token.'
          type: string
        tenant_id:
          description: 'TenantID identifies a tenant holding the authorization server that

            issued this token.'
          type: string
        token_type:
          description: TokenType is the type of the introspected token. For example, `access_token` or `refresh_token`.
          type: string
        username:
          description: 'Username is a human-readable identifier for the resource owner who

            authorized this token.'
          type: string
      type: object
    userinfoResponse:
      properties:
        aid:
          description: Server ID - Authorization Server ID that this ID Token is intended for.
          type: string
        aud:
          description: Audience - Audiences that this ID Token is intended for.
          items:
            type: string
          type: array
        birthdate:
          description: End-User's birthday, represented as an ISO 8601:2004 [ISO8601‑2004] YYYY-MM-DD format. The year MAY be 0000, indicating that it is omitted. To represent only the year, YYYY format is allowed. Note that depending on the underlying platform's date related function, providing just year can result in varying month and day, so the implementers need to take this factor into account to correctly process the dates.
          type: string
        email:
          description: End-User's preferred e-mail address. Its value MUST conform to the RFC 5322 [RFC5322] addr-spec syntax. The RP MUST NOT rely upon this value being unique, as discussed in Section 5.7.
          type: string
        email_verified:
          description: True if the End-User's e-mail address has been verified; otherwise false. When this Claim Value is true, this means that the OP took affirmative steps to ensure that this e-mail address was controlled by the End-User at the time the verification was performed. The means by which an e-mail address is verified is context-specific, and dependent upon the trust framework or contractual agreements within which the parties are operating.
          type: boolean
        family_name:
          description: Surname(s) or last name(s) of the End-User. Note that in some cultures, people can have multiple family names or no family name; all can be present, with the names being separated by space characters.
          type: string
        gender:
          description: End-User's gender. Values defined by this specification are female and male. Other values MAY be used when neither of the defined values are applicable.
          type: string
        given_name:
          description: Given name(s) or first name(s) of the End-User. Note that in some cultures, people can have multiple given names; all can be present, with the names being separated by space characters.
          type: string
        idp:
          description: IdpID - IDP ID that this ID Token is intended for.
          type: string
        idp_method:
          description: IdpMethod - IDP Method that this ID Token is intended for.
          type: string
        locale:
          description: End-User's locale, represented as a BCP47 [RFC5646] language tag. This is typically an ISO 639-1 Alpha-2 [ISO639‑1] language code in lowercase and an ISO 3166-1 Alpha-2 [ISO3166‑1] country code in uppercase, separated by a dash. For example, en-US or fr-CA. As a compatibility note, some implementations have used an underscore as the separator rather than a dash, for example, en_US; Relying Parties MAY choose to accept this locale syntax as well.
          type: string
        middle_name:
          description: Middle name(s) of the End-User. Note that in some cultures, people can have multiple middle names; all can be present, with the names being separated by space characters. Also note that in some cultures, middle names are not used.
          type: string
        name:
          description: End-User's full name in displayable form including all name parts, possibly including titles and suffixes, ordered according to the End-User's locale and preferences.
          type: string
        nickname:
          description: Casual name of the End-User that may or may not be the same as the given_name. For instance, a nickname value of Mike might be returned alongside a given_name value of Michael.
          type: string
        phone_number:
          description: End-User's preferred telephone number. E.164 [E.164] is RECOMMENDED as the format of this Claim, for example, +1 (425) 555-1212 or +56 (2) 687 2400. If the phone number contains an extension, it is RECOMMENDED that the extension be represented using the RFC 3966 [RFC3966] extension syntax, for example, +1 (604) 555-1234;ext=5678.
          type: string
        phone_number_verified:
          description: True if the End-User's phone number has been verified; otherwise false. When this Claim Value is true, this means that the OP took affirmative steps to ensure that this phone number was controlled by the End-User at the time the verification was performed. The means by which a phone number is verified is context-specific, and dependent upon the trust framework or contractual agreements within which the parties are operating. When true, the phone_number Claim MUST be in E.164 format and any extensions MUST be represented in RFC 3966 format.
          type: boolean
        picture:
          description: URL of the End-User's profile picture. This URL MUST refer to an image file (for example, a PNG, JPEG, or GIF image file), rather than to a Web page containing an image. Note that this URL SHOULD specifically reference a profile photo of the End-User suitable for displaying when describing the End-User, rather than an arbitrary photo taken by the End-User.
          type: string
        preferred_username:
          description: Non-unique shorthand name by which the End-User wishes to be referred to at the RP, such as janedoe or j.doe. This value MAY be any valid JSON string including special characters such as @, /, or whitespace.
          type: string
        profile:
          description: URL of the End-User's profile page. The contents of this Web page SHOULD be about the End-User.
          type: string
        sub:
          description: Subject - Identifier for the End-User at the IssuerURL.
          type: string
        tid:
          description: TenantID - Tenant ID that this ID Token is intended for.
          type: string
        updated_at:
          description: Time the End-User's information was last updated. Its value is a JSON number representing the number of seconds from 1970-01-01T0:0:0Z as measured in UTC until the date/time.
          format: int64
          type: integer
        website:
          description: URL of the End-User's Web page or blog. This Web page SHOULD contain information published by the End-User or an organization that the End-User is affiliated with.
          type: string
        zoneinfo:
          description: String from zoneinfo [zoneinfo] time zone database representing the End-User's time zone. For example, Europe/Paris or America/Los_Angeles.
          type: string
      type: object
    ResponseTypes:
      description: 'The array may consist of the following arguments:


        `code` - when supplied as the value for the `response_type` parameter, a successful

        response includes an authorization code


        `code token` - when supplied as the value for the `response_type` parameter, a successful

        response includes an access token, an access token type, and an authorization code


        `id_token token` - when supplied as the value for the `response_type` parameter, a successful

        response includes an access token, an access token type, and an ID token


        `code id_token token` - when supplied as the value for the `response_type` parameter, a successful

        response includes an authorization code, an ID token, an access token, and an access token

        type.


        `token` - when supplied as the value for the `response_type` parameter, a successful

        response includes an access token and its type. This argument is used for the implicit grant

        flow, but is not recommended. Instead, you should use either the authorization code grant

        flow with PKCE or client authentication set to `none` and with the use of PKCE.


        example: ["token", "id_token", "code"]

        default: ["code"]'
      items:
        enum:
        - token
        - id_token
        - code
        - code id_token
        - token id_token
        - token code
        - token id_token code
        - none
        type: string
      title: An array of allowed response types
      type: array
    ClientPrivacy:
      properties:
