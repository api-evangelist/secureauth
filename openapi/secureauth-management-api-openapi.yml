          type: string
        screenBrightness:
          description: 'Indica o nvel de brilho da tela do dispositivo.

            Em dispositivos Android o valor  um inteiro, entre 0 e 255, inclusive;

            Em dispositivos iOS o valor  um ponto flutuante entre 0.0 e 1.0.'
          format: double
          type: number
        screenDimensions:
          $ref: '#/components/schemas/OpenbankingBrasilAutomaticPaymentV1ScreenDimensions'
        userTimeZoneOffset:
          description: 'Indica a configurao de fuso horrio do dispositivo do usurio, com o formato UTC offset: hh[:mm]'
          type: string
