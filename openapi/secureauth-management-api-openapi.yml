openapi: 3.2.0
info:
  title: Secureauth MANAGEMENT API
  version: latest
  description: 'Operations tagged MANAGEMENT across 4 of this provider''s published API definitions: secureauth-cdr-openapi.yml, secureauth-fdx-openapi.yml, secureauth-obbr-openapi.yml, secureauth-obuk-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://localhost:8443/default/default
tags:
- name: MANAGEMENT
paths:
  /servers/{wid}/cdr/arrangements:
    delete:
      description: 'Revoke CDR arrangements by parameters passed.


        Currently, this endpoint supports revocation by the `client id` parameter.


        To revoke all arrangements for a given client application, specify its identifier in the query.'
      operationId: revokeCDRArrangements
      parameters:
      - description: Workspace id
        in: path
        name: wid
        required: true
        schema:
          type: string
          default: default
      - description: Client ID
        in: query
        name: client_id
        required: true
        schema:
          type: string
      - description: Stores the channel that was used to revoke the arrangement
        in: query
        name: revocation_channel
        schema:
          type: string
          enum:
          - online
          - writing
          - over_the_phone
          - data_holder
          - data_recipient
          default: online
      - description: Stores the reason why the arrangement was revoked
        in: query
        name: revocation_reason
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/ConsentsRemovedResponse'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - system:
        - manage_openbanking_consents
      summary: Revoke CDR Arrangements
      tags:
      - MANAGEMENT
    get:
      deprecated: true
      description: 'Returns the detailed list of all CDR arrangements available for a workspace.

        To narrow the list down, use the request body parameters.'
      operationId: getCDRArrangements
      parameters:
      - description: 'Customer identifier. It represents an organization. The customer identifier can cover several

          user identifiers as organization members.


          When you pass a `customer_id` with your request, the response contains results related to the specified

          organization, including the allowed information about its users and their arrangements.'
        in: query
        name: customer_id
        schema:
          type: string
      - description: 'User identifier. It represents an end-user.


          When you pass a `user_id` with your request, the endpoint returns the details relating to the specified user.'
        in: query
        name: user_id
        schema:
          type: string
      - description: 'List of accounts.


          It can refer to user bank accounts the client application is allowed to access.'
        in: query
        name: accounts
        schema:
          type: array
          items:
            type: string
      - description: A client identifier.
        in: query
        name: client_id
        schema:
          type: string
      - description: List of the consent statuses.
        in: query
        name: status
        schema:
          type: array
          items:
            type: string
      - description: Consent types.
        in: query
        name: types
        schema:
          type: array
          items:
            type: string
      - description: 'A consent identifier.


          Use it to navigate through the request pagination when the number of consents is greater than

          the `limit` set for results in the response.


          With `after_consent_id`, the list you obtain starts from the subsequent consent after the specified one. Also,

          the response depends on the `sort` and `order` parameters, if any are passed.'
        in: query
        name: after_consent_id
        schema:
          type: string
      - description: 'A consent identifier.


          Use it to navigate through the request pagination when the number of consents is greater than

          the limit set for results in the response.


          With `before_consent_id`, the list you obtain comprises consents up to the specified one. The specified consent

          isn''t included. Also, the response depends on the `sort` and `order` parameters, if any are passed.'
        in: query
        name: before_consent_id
        schema:
          type: string
      - description: Sort results returned in the response.
        in: query
        name: sort
        schema:
          type: string
      - description: 'Input: `acs` or `desc`.


          Set the order of results returned in the response.'
        in: query
        name: order
        schema:
          type: string
          default: desc
      - description: Limit the number of results returned in the response.
        in: query
        name: limit
        schema:
          type: integer
          format: int64
          default: 20
          maximum: 100
          minimum: 1
      - description: Workspace ID
        in: path
        name: wid
        required: true
        schema:
          type: string
          default: default
      responses:
        '200':
          $ref: '#/components/responses/CDRArrangements'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '422':
          $ref: '#/components/responses/unprocessableEntityHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - system:
        - manage_openbanking_consents
      summary: List CDR Arrangements
      tags:
      - MANAGEMENT
    post:
      description: 'Returns the detailed list of all CDR arrangements available for a workspace.

        To narrow the list down, use the request body parameters.'
      operationId: listCDRArrangements
      parameters:
      - description: Workspace id
        in: path
        name: wid
        required: true
        schema:
          type: string
          default: default
      responses:
        '200':
          $ref: '#/components/responses/CDRArrangements'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '422':
          $ref: '#/components/responses/unprocessableEntityHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - system:
        - manage_openbanking_consents
      summary: List CDR Arrangements
      tags:
      - MANAGEMENT
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CDRConsentsRequest'
    servers:
    - url: https://localhost:8443/default/default
  /servers/{wid}/cdr/arrangements/{arrangementID}:
    delete:
      description: Revoke a CDR arrangement. Specify the required arrangement with its identifier passed as the path parameter.
      operationId: revokeCDRArrangementByID
      parameters:
      - description: Workspace id
        in: path
        name: wid
        required: true
        schema:
          type: string
          default: default
      - description: Arrangement id
        in: path
        name: arrangementID
        required: true
        schema:
          type: string
      - in: query
        name: revocation_channel
        schema:
          type: string
          enum:
          - online
          - writing
          - over_the_phone
          - data_holder
          - data_recipient
          default: online
      - description: Stores the reason why the arrangement was revoked
        in: query
        name: revocation_reason
        schema:
          type: string
      responses:
        '204':
          description: ' Arrangement revoked'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '422':
          $ref: '#/components/responses/unprocessableEntityHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - system:
        - manage_openbanking_consents
      summary: Revoke CDR Arrangement
      tags:
      - MANAGEMENT
    get:
      description: 'Retrieve CDR arrangement by its ID.


        Call this endpoint to get the details of an arrangement within the specified workspace.'
      operationId: getCDRArrangement
      parameters:
      - description: Workspace ID
        in: path
        name: wid
        required: true
        schema:
          type: string
          default: default
      - description: Arrangement ID
        in: path
        name: arrangementID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: CDRArrangement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CDRArrangement'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - system:
        - manage_openbanking_consents
      summary: Get CDR Arrangement
      tags:
      - MANAGEMENT
    servers:
    - url: https://localhost:8443/default/default
  /servers/{wid}/cdr/customer-arrangements:
    delete:
      description: 'Revoke CDR arrangements, access tokens, and refresh tokens for a given customer.


        This endpoint requires the `customer_id` value passed as a claim in an access token using the

        JWT Bearer flow.'
      operationId: revokeCDRCustomerArrangements
      parameters:
      - description: Workspace id
        in: path
        name: wid
        required: true
        schema:
          type: string
          default: default
      - description: Stores the channel that was used to revoke the arrangement
        in: query
        name: revocation_channel
        schema:
          type: string
          enum:
          - online
          - writing
          - over_the_phone
          - data_holder
          - data_recipient
          default: online
      - description: Stores the reason why the arrangement was revoked
        in: query
        name: revocation_reason
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/ConsentsRemovedResponse'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '422':
          $ref: '#/components/responses/unprocessableEntityHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - system:
        - manage_openbanking_consents
      summary: Revoke CDR Customer Arrangements
      tags:
      - MANAGEMENT
    post:
      description: 'Returns the detailed list of CDR arrangements for a given customer.


        This endpoint requires the `customer_id` value passed as a claim in an access token using the

        JWT Bearer flow.


        To narrow the list down, use the request body parameters.'
      operationId: listCDRCustomerArrangements
      parameters:
      - description: Workspace id
        in: path
        name: wid
        required: true
        schema:
          type: string
          default: default
      responses:
        '200':
          $ref: '#/components/responses/CDRArrangements'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '422':
          $ref: '#/components/responses/unprocessableEntityHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - system:
        - manage_openbanking_consents
      summary: List CDR Customer Arrangements
      tags:
      - MANAGEMENT
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListCDRCustomerArrangementsFilter'
    servers:
    - url: https://localhost:8443/default/default
  /servers/{wid}/cdr/customer-clients:
    get:
      description: 'Returns clients that currently have arrangements assigned to them.


        The response must be filtered either by `customer_id` or `account_ids` value passed as claims in an access token

        using the JWT Bearer flow.


        You can pass `account_ids` as an array of maximum 10 identifiers at once.'
      operationId: listCustomerClients
      parameters:
      - description: Workspace id
        in: path
        name: wid
        required: true
        schema:
          type: string
          default: default
      responses:
        '200':
          $ref: '#/components/responses/Clients'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - system:
        - manage_openbanking_consents
      summary: List CDR Customer Clients
      tags:
      - MANAGEMENT
    servers:
    - url: https://localhost:8443/default/default
  /servers/{wid}/fdx/consents:
    delete:
      description: 'Revoke FDX consents by parameters passed with the request.


        Currently supported revocation by a client identifier. It revokes all consents provided for a given client

        application.


        Pass the revocation initiator and reason details with the `RevocationDetails` body parameter.


        Authorization: Bearer token.


        To obtain a token, use the

        Client Credentials grant type.'
      operationId: revokeFDXConsents
      parameters:
      - description: Workspace id
        in: path
        name: wid
        required: true
        schema:
          type: string
          default: default
      responses:
        '200':
          $ref: '#/components/responses/ConsentsRemovedResponse'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - system:
        - manage_openbanking_consents
      summary: Revoke FDX Consents
      tags:
      - MANAGEMENT
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentRevocationByCLientID'
        description: Revocation details
    post:
      description: 'Obtain the list of FDX consents.


        To narrow down the list, define the required parameters in the request body.


        Authorization: Bearer token.


        To obtain a token, use the

        Client Credentials grant type.'
      operationId: listFDXConsents
      parameters:
      - description: Workspace id
        in: path
        name: wid
        required: true
        schema:
          type: string
          default: default
      responses:
        '200':
          $ref: '#/components/responses/FDXConsents'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '422':
          $ref: '#/components/responses/unprocessableEntityHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - system:
        - manage_openbanking_consents
      summary: List FDX Consents
      tags:
      - MANAGEMENT
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FDXConsentsRequest'
    servers:
    - url: https://localhost:8443/default/default
  /servers/{wid}/fdx/consents/{consentID}:
    delete:
      description: 'Revoke an FDX consent. Provide the required consent identifier in the path.


        Authorization: Bearer token.


        To obtain a token, use the

        Client Credentials grant type.'
      operationId: revokeFDXConsentByID
      parameters:
      - description: Workspace id
        in: path
        name: wid
        required: true
        schema:
          type: string
          default: default
      - description: Consent id
        in: path
        name: consentID
        required: true
        schema:
          type: string
      responses:
        '204':
          description: ' Consent revoked'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '422':
          $ref: '#/components/responses/unprocessableEntityHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - system:
        - manage_openbanking_consents
      summary: Revoke FDX Consent
      tags:
      - MANAGEMENT
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FDXConsentRevocation'
        description: Revocation details
    servers:
    - url: https://localhost:8443/default/default
  /servers/{wid}/open-banking-brasil/consents:
    delete:
      description: 'Revoke Open Banking Brazil consents by a client ID or combination of client ID and consent types.

        For this, pass the `client_id` query parameter with the value set to the required client identifier. It revokes

        all consents for the given client application.


        Currently, v1 and v2 consents are supported.


        For authorization, pass the `Authorization: Bearer` with a token as the bearer value. To obtain the token with the

        necessary scopes, apply the

        Client Credentials grant type.


        Find the scope list in the AUTHORIZATIONS block.'
      operationId: revokeOBBRConsents
      parameters:
      - description: Workspace id
        in: path
        name: wid
        required: true
        schema:
          type: string
          default: default
      - description: Client ID
        in: query
        name: client_id
        schema:
          type: string
      - description: A string of consent types you can pass along with the client identifier to detail your request.
        in: query
        name: consent_types
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/ConsentsRemovedResponse'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - system:
        - manage_openbanking_consents
      summary: Revoke Open Banking Brazil Consents
      tags:
      - MANAGEMENT
    get:
      deprecated: true
      description: 'Retrieve the list of Open Banking Brazil consents per workspace. Pass the required workspace identifier in the path.

        To narrow the list, use the query parameters. Currently, this endpoint supports v1 and v2 consents.


        For authorization, pass the `Authorization: Bearer` header with a token as the bearer value. To obtain the token

        with the required scopes, apply the

        Client Credentials grant type.


        Find the scope list in the AUTHORIZATIONS block.'
      operationId: getOBBRConsents
      parameters:
      - description: 'Optional. A

          [14-digit identification number](https://openbanking-brasil.github.io/specs-seguranca/open-banking-brasil-financial-api-1_ID3.html#section-5.2.2.4)

          of a company in Cadastro Nacional da Pessoa Jurídica (Brazilian National Registry of Legal Entities).'
        in: query
        name: cnpj
        schema:
          type: string
      - description: 'Optional. An

          [11-digit taxpayer identification number](https://openbanking-brasil.github.io/specs-seguranca/open-banking-brasil-financial-api-1_ID3.html#name-requesting-the-cpf-claim)

          in Cadastro de Pessoas Físicas (Natural Persons Register).'
        in: query
        name: cpf
        schema:
          type: string
      - description: 'Optional. Consent creation date.


          Sets the start date of the consent retrieval date range.'
        in: query
        name: date_from
        schema:
          type: string
      - description: 'Optional. Consent creation date.


          Sets the end date of the consent retrieval date range.'
        in: query
        name: date_to
        schema:
          type: string
      - description: 'List of accounts.


          It can refer to user bank accounts the client application is allowed to access.'
        in: query
        name: accounts
        schema:
          type: array
          items:
            type: string
      - description: A client application identifier.
        in: query
        name: client_id
        schema:
          type: string
      - description: List of the consent statuses.
        in: query
        name: status
        schema:
          type: array
          items:
            type: string
      - description: Consent types.
        in: query
        name: types
        schema:
          type: array
          items:
            type: string
      - description: 'A consent identifier.


          Use it to navigate through the request pagination when the number of consents is greater than

          the `limit` set for results in the response.


          With `after_consent_id`, the list you obtain starts from the subsequent consent after the specified one. Also,

          the response depends on the `sort` and `order` parameters, if any are passed.'
        in: query
        name: after_consent_id
        schema:
          type: string
      - description: 'A consent identifier.


          Use it to navigate through the request pagination when the number of consents is greater than

          the limit set for results in the response.


          With `before_consent_id`, the list you obtain comprises consents up to the specified one. The specified consent

          isn''t included. Also, the response depends on the `sort` and `order` parameters, if any are passed.'
        in: query
        name: before_consent_id
        schema:
          type: string
      - description: Sort results returned in the response.
        in: query
        name: sort
        schema:
          type: string
      - description: 'Input: `acs` or `desc`.


          Set the order of results returned in the response.'
        in: query
        name: order
        schema:
          type: string
          default: desc
      - description: Limit the number of results returned in the response.
        in: query
        name: limit
        schema:
          type: integer
          format: int64
          default: 20
          maximum: 100
          minimum: 1
      - description: Workspace id
        in: path
        name: wid
        required: true
        schema:
          type: string
          default: default
      responses:
        '200':
          $ref: '#/components/responses/OBBRConsents'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - system:
        - manage_openbanking_consents
      summary: Get Open Banking Brazil Consents
      tags:
      - MANAGEMENT
    post:
      description: 'Retrieve the list of Open Banking Brazil consents per workplace. Pass the required workplace identifier in the path.

        This endpoint currently supports v1 and v2 consents. To narrow the list, filter the response with the request body

        parameters.


        For authorization, pass the `Authorization: Bearer` header with a token as the bearer value. To obtain the token with

        the necessary scopes, apply the

        Client Credentials grant type.


        Find the scope list in the AUTHORIZATIONS block.'
      operationId: listOBBRConsents
      parameters:
      - description: Workspace id
        in: path
        name: wid
        required: true
        schema:
          type: string
          default: default
      responses:
        '200':
          $ref: '#/components/responses/OBBRConsents'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '422':
          $ref: '#/components/responses/unprocessableEntityHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - system:
        - manage_openbanking_consents
      summary: List Open Banking Brazil Consents
      tags:
      - MANAGEMENT
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OBBRConsentsRequest'
    servers:
    - url: https://localhost:8443/default/default
  /servers/{wid}/open-banking-brasil/consents/{consentID}:
    delete:
      description: 'Revoke an Open Banking Brazil consent by ID. Pass the identifiers of the required consent and the related workspace

        in the path.


        Currently, v1 and v2 consents are supported.


        For authorization, pass the `Authorization: Bearer` header with a token as the bearer value. To obtain the token

        and the necessary scopes, apply the

        Client Credentials grant type.


