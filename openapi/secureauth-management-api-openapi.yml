          example: '2021-01-01'
          format: date
          type: string
        details:
          $ref: '#/components/schemas/OpenbankingBrasilPaymentDetails'
        ibgeTownCode:
          description: 'Traz o cdigo da cidade segundo o IBGE (Instituto Brasileiro de Geografia e Estatstica).

            Para o preenchimento deste campo, o Iniciador de Pagamentos deve seguir a orientao do arranjo da forma de pagamento.

            O preenchimento do campo tanto em pix/payments quanto /consents deve ser igual. Caso haja divergncia dos valores, a instituio deve retornar HTTP 422 com o cdigo de erro PAGAMENTO_DIVERGENTE_DO_CONSENTIMENTO.

            Este campo faz referncia ao campo CodMun do arranjo Pix.'
          example: '5300108'
          maxLength: 7
          minLength: 7
          pattern: ^\d{7}$
          type: string
        schedule:
          $ref: '#/components/schemas/OpenbankingBrasilPaymentSchedule'
        type:
          description: Este campo define o tipo de pagamento que ser iniciado aps a autorizao do consentimento.
          example: PIX
          type: string
