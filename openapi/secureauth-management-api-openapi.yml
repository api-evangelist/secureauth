        antennaInformation:
          description: Indica em qual antena o dispositivo est conectado.
          type: string
        deviceId:
          description: ID nico do dispositivo gerado pela plataforma.
          example: 00000000-54b3-e7c7-0000-000046bffd97
          type: string
        elapsedTimeSinceBoot:
