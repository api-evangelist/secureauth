            NAO_INFORMADO: No informada pela detentora de conta;

            FALHA_INFRAESTRUTURA: [Descrio de qual falha na infraestrutura inviabilizou o processamento].

            TEMPO_EXPIRADO_AUTORIZACAO: Consentimento expirou antes que o usurio pudesse confirm-lo.

            TEMPO_EXPIRADO_CONSUMO: O usurio no finalizou o fluxo de pagamento e o consentimento expirou;

            REJEITADO_USUARIO: O usurio rejeitou a autorizao do consentimento

            CONTAS_ORIGEM_DESTINO_IGUAIS: A conta selecionada  igual  conta destino e no permite realizar esse pagamento.

            CONTA_NAO_PERMITE_PAGAMENTO: A conta selecionada  do tipo [salario/investimento/liquidao/outros] e no permite realizar esse pagamento.

            SALDO_INSUFICIENTE: A conta selecionada no possui saldo suficiente para realizar o pagamento.

            VALOR_ACIMA_LIMITE: O valor ultrapassa o limite estabelecido [na instituio/no arranjo/outro] para permitir a realizao de transaes pelo cliente.

            QRCODE_INVALIDO: O QRCode utilizado para a iniciao de pagamento no  vlido.


            [Restrio] Caso consentimento rejeitado de verses nas quais no havia o campo rejectionReason retornar o seguinte detail: Motivo de rejeio inexistente em verses anteriores.'
          example: O usurio rejeitou a autorizao do consentimento
          maxLength: 2048
          pattern: '[\w\W\s]*'
          type: string
      required:
      - code
      - detail
      title: OpenbankingBrasilPaymentV4ConsentRejectionReason ConsentRejectionReason
      type: object
    BrazilCustomerDataAccessConsentV1:
      properties:
        consentId:
          description: 'O consentId  o identificador nico do consentimento e dever ser um URN - Uniform Resource Name.

            Um URN, conforme definido na [RFC8141](https://tools.ietf.org/html/rfc8141)  um Uniform Resource

            Identifier - URI - que  atribudo sob o URI scheme "urn" e um namespace URN especfico, com a inteno de que o URN

            seja um identificador de recurso persistente e independente da localizao.

            Considerando a string urn:bancoex:C1DD33123 como exemplo para consentId temos:

            o namespace(urn)

            o identificador associado ao namespace da instituio transnmissora (bancoex)

            o identificador especfico dentro do namespace (C1DD33123).

            Informaes mais detalhadas sobre a construo de namespaces devem ser consultadas na [RFC8141](https://tools.ietf.org/html/rfc8141).'
          example: urn:bancoex:C1DD33123
          maxLength: 256
          pattern: ^urn:[a-zA-Z0-9][a-zA-Z0-9-]{0,31}:[a-zA-Z0-9()+,\-.:=@;$_!*'%\/?#]+$
          type: string
        creationDateTime:
          description: Data e hora em que o recurso foi criado. Uma string com data e hora conforme especificao RFC-3339, sempre com a utilizao de timezone UTC(UTC time format).
          example: '2021-05-21T08:30:00Z'
          format: date-time
          type: string
        document:
          $ref: '#/components/schemas/OpenbankingBrasilConsentDocument1'
        expirationDateTime:
          description: Data e hora de expirao da permisso. De preenchimento obrigatrio, reflete a data limite de validade do consentimento. Uma string com data e hora conforme especificao RFC-3339, sempre com a utilizao de timezone UTC(UTC time format).
          example: '2021-05-21T08:30:00Z'
          format: date-time
          type: string
        permissions:
          description: Especifica os tipos de permisses de acesso s APIs no escopo do Open Banking Brasil - Fase 2, de acordo com os blocos de consentimento fornecidos pelo usurio e necessrios ao acesso a cada endpoint das APIs.
          example:
          - ACCOUNTS_READ
          - ACCOUNTS_OVERDRAFT_LIMITS_READ
          - RESOURCES_READ
          items:
            $ref: '#/components/schemas/OpenbankingBrasilConsentPermission1'
          maxItems: 30
          minItems: 1
          type: array
        status:
          $ref: '#/components/schemas/OpenbankingBrasilConsentStatus'
        statusUpdateDateTime:
          description: Data e hora em que o recurso foi atualizado. Uma string com data e hora conforme especificao RFC-3339, sempre com a utilizao de timezone UTC(UTC time format).
          example: '2021-05-21T08:30:00Z'
          format: date-time
          type: string
        transactionFromDateTime:
          description: Data e hora da transao inicial. Se no for preenchido, a transao ter a data aberta e a data ser retornada com a primeira transao disponvel. Uma string com data e hora conforme especificao RFC-3339, sempre com a utilizao de timezone UTC(UTC time format).
          example: '2021-01-01T00:00:00Z'
          format: date-time
          type: string
        transactionToDateTime:
          description: Data e hora final da transao. Se no for preenchido, a transao ter a data aberta e a data ser retornada com a ultima transao disponvel. Uma string com data e hora conforme especificao RFC-3339, sempre com a utilizao de timezone UTC(UTC time format).
          example: '2021-02-01T23:59:59Z'
          format: date-time
          type: string
      required:
      - consentId
      - creationDateTime
      - expirationDateTime
      - permissions
      - status
      - statusUpdateDateTime
      - document
      type: object
    OpenbankingBrasilPaymentV3Document1:
      description: OpenbankingBrasilPaymentV3Document1 Document1
      properties:
        identification:
          description: Nmero do documento de identificao oficial do usurio.
