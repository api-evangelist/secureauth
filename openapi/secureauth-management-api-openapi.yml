    BrazilCustomerDataAccessConsentV2:
      properties:
        consentId:
          description: 'O consentId  o identificador nico do consentimento e dever ser um URN - Uniform Resource Name.

            Um URN, conforme definido na [RFC8141](https://tools.ietf.org/html/rfc8141)  um Uniform Resource

            Identifier - URI - que  atribudo sob o URI scheme "urn" e um namespace URN especfico, com a inteno de que o URN

            seja um identificador de recurso persistente e independente da localizao.

            Considerando a string urn:bancoex:C1DD33123 como exemplo para consentId temos:

            o namespace(urn)

            o identificador associado ao namespace da instituio transnmissora (bancoex)

            o identificador especfico dentro do namespace (C1DD33123).

            Informaes mais detalhadas sobre a construo de namespaces devem ser consultadas na [RFC8141](https://tools.ietf.org/html/rfc8141).'
          example: urn:bancoex:C1DD33123
          maxLength: 256
          pattern: ^urn:[a-zA-Z0-9][a-zA-Z0-9-]{0,31}:[a-zA-Z0-9()+,\-.:=@;$_!*'%\/?#]+$
          type: string
        creationDateTime:
          description: Data e hora em que o recurso foi criado. Uma string com data e hora conforme especificao RFC-3339, sempre com a utilizao de timezone UTC(UTC time format).
          example: '2021-05-21T08:30:00Z'
          format: date-time
          type: string
        document:
          $ref: '#/components/schemas/OpenbankingBrasilConsentV2BusinessEntityDocument'
        expirationDateTime:
          description: Data e hora de expirao da permisso. De preenchimento obrigatrio, reflete a data limite de validade do consentimento. Uma string com data e hora conforme especificao RFC-3339, sempre com a utilizao de timezone UTC (UTC time format). Para consentimentos com prazo indeterminado,  esperado preenchimento com `2300-01-01T00:00:00Z`.
          example: '2021-05-21T08:30:00Z'
          format: date-time
          type: string
        extensions:
          $ref: '#/components/schemas/BrazilConsentExtensions'
        permissions:
          description: Especifica os tipos de permisses de acesso s APIs no escopo do Open Finance Brasil - Dados cadastrais e transacionais, de acordo com os blocos de consentimento fornecidos pelo usurio e necessrios ao acesso a cada endpoint das APIs. Esse array no deve ter duplicidade de itens.
          example:
          - ACCOUNTS_READ
          - ACCOUNTS_OVERDRAFT_LIMITS_READ
          - RESOURCES_READ
          items:
            $ref: '#/components/schemas/OpenbankingBrasilConsentV2Permission1'
          minItems: 1
          type: array
        rejection:
          $ref: '#/components/schemas/OpenbankingBrasilConsentV2Rejection'
        status:
          $ref: '#/components/schemas/OpenbankingBrasilConsentV2Status'
        statusUpdateDateTime:
          description: Data e hora em que o recurso foi atualizado. Uma string com data e hora conforme especificao RFC-3339, sempre com a utilizao de timezone UTC(UTC time format).
          example: '2021-05-21T08:30:00Z'
          format: date-time
          type: string
      required:
      - consentId
      - creationDateTime
      - expirationDateTime
      - permissions
      - status
      - statusUpdateDateTime
      - document
      type: object
    BrazilCustomerPaymentConsentV3:
      properties:
        businessEntity:
          $ref: '#/components/schemas/OpenbankingBrasilPaymentV3BusinessEntity'
        consentId:
          description: 'Identificador nico do consentimento criado para a iniciao de pagamento solicitada. Dever ser um URN - Uniform Resource Name.

            Um URN, conforme definido na [RFC8141](https://tools.ietf.org/html/rfc8141)  um Uniform Resource

            Identifier - URI - que  atribudo sob o URI scheme "urn" e um namespace URN especfico, com a inteno de que o URN

            seja um identificador de recurso persistente e independente da localizao.

            Considerando a string urn:bancoex:C1DD33123 como exemplo para consentId temos:

            o namespace(urn)

            o identificador associado ao namespace da instituio transnmissora (bancoex)

            o identificador especfico dentro do namespace (C1DD33123).

            Informaes mais detalhadas sobre a construo de namespaces devem ser consultadas na [RFC8141](https://tools.ietf.org/html/rfc8141).'
          example: urn:bancoex:C1DD33123
          maxLength: 256
          pattern: ^urn:[a-zA-Z0-9][a-zA-Z0-9\-]{0,31}:[a-zA-Z0-9()+,\-.:=@;$_!*'%\/?#]+$
          type: string
        creationDateTime:
          description: Data e hora em que o consentimento foi criado. Uma string com data e hora conforme especificao RFC-3339, sempre com a utilizao de timezone UTC(UTC time format).
          example: '2021-05-21T08:30:00Z'
          format: date-time
          type: string
        creditor:
          $ref: '#/components/schemas/OpenbankingBrasilPaymentV3Identification'
        debtorAccount:
          $ref: '#/components/schemas/OpenbankingBrasilPaymentV3ConsentsDebtorAccount'
        expirationDateTime:
          description: 'Data e hora em que o consentimento da iniciao de pagamento expira, devendo ser sempre o creationDateTime mais 5 minutos. Uma string com data e hora conforme especificao RFC-3339, sempre com a utilizao de timezone UTC (UTC time format).

            O consentimento  criado com o status AWAITING_AUTHORISATION, e deve assumir o status AUTHORIZED ou REJECTED antes do tempo de expirao - 5 minutos. Caso o tempo seja expirado, o status deve assumir REJECTED.

            Para o cenrio em que o status assumiu AUTHORISED, o tempo mximo do expirationDateTime do consentimento deve assumir "now + 60 minutos". Este  o tempo para consumir o consentimento autorizado, mudando seu status para CONSUMED. No  possvel prorrogar este tempo e a criao de um novo consentimento ser necessria para os cenrios de insucesso.

            O tempo do expirationDateTime  garantido com os 15 minutos do access token, sendo possvel utilizar mais trs refresh tokens at totalizar 60 minutos.'
          example: '2021-05-21T08:30:00Z'
          format: date-time
          type: string
        loggedUser:
          $ref: '#/components/schemas/OpenbankingBrasilPaymentV3LoggedUser'
        payment:
          $ref: '#/components/schemas/OpenbankingBrasilPaymentV3PaymentConsent'
        rejectionReason:
          $ref: '#/components/schemas/OpenbankingBrasilPaymentV3ConsentRejectionReason'
        status:
          $ref: '#/components/schemas/OpenbankingBrasilPaymentV3EnumAuthorisationStatusType'
        statusUpdateDateTime:
          description: Data e hora em que o recurso foi atualizado. Uma string com data e hora conforme especificao RFC-3339, sempre com a utilizao de timezone UTC(UTC time format).
          example: '2021-05-21T08:30:00Z'
          format: date-time
          type: string
      required:
      - consentId
      - creationDateTime
      - creditor
      - expirationDateTime
      - loggedUser
      - payment
      - status
      - statusUpdateDateTime
      type: object
