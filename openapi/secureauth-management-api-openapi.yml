          description: creditors
          items:
            $ref: '#/components/schemas/OpenbankingBrasilAutomaticPaymentV1Creditor'
          minItems: 1
          type: array
        debtorAccount:
          $ref: '#/components/schemas/OpenbankingBrasilAutomaticPaymentV1ConsentsDebtorAccount'
        expirationDateTime:
          description: Data e hora em que o consentimento deve deixar de ser vlido. Uma string com data e hora conforme especificao [RFC-3339](https://datatracker.ietf.org/doc/html/rfc3339), sempre com a utilizao de timezone UTC(UTC time format).
          example: '2021-05-21T08:30:00Z'
          format: date-time
          type: string
        loggedUser:
          $ref: '#/components/schemas/OpenbankingBrasilAutomaticPaymentV1LoggedUser'
        recurringConfiguration:
          description: Campo destinado a configurao dos diferentes produtos de pagamentos recorrentes.
          type: object
        recurringConsentId:
          description: 'Identificador nico do consentimento de longa durao criado para a iniciao de pagamento solicitada. Dever ser um URN - Uniform Resource Name. Um URN, conforme definido na [RFC8141](https://datatracker.ietf.org/doc/html/rfc8141)  um Uniform Resource Identifier - URI - que  atribudo sob o URI scheme "urn" e um namespace URN especfico, com a inteno de que o URN seja um identificador de recurso persistente e independente da localizao.

            Considerando a string urn:bancoex:C1DD33123 como exemplo para `recurringConsentId` temos:

            o namespace(urn)

            o identificador associado ao namespace da instituio transmissora (bancoex)

            o identificador especfico dentro do namespace (C1DD33123). Informaes mais detalhadas sobre a construo de namespaces devem ser consultadas na [RFC8141](https://datatracker.ietf.org/doc/html/rfc8141).'
          maxLength: 256
          pattern: ^urn:[a-zA-Z0-9][a-zA-Z0-9\-]{0,31}:[a-zA-Z0-9()+,\-.:=@;$_!*'%\/?#]+$
          type: string
        rejection:
          $ref: '#/components/schemas/OpenbankingBrasilAutomaticPaymentV1Rejection'
        revocation:
          $ref: '#/components/schemas/OpenbankingBrasilAutomaticPaymentV1Revocation1'
        riskSignals:
          $ref: '#/components/schemas/OpenbankingBrasilAutomaticPaymentV1RiskSignalsConsents'
        startDateTime:
          description: Data e hora em que o consentimento deve passar a ser vlido. Uma string com data e hora conforme especificao [RFC-3339](https://datatracker.ietf.org/doc/html/rfc3339), sempre com a utilizao de timezone UTC(UTC time format).
          example: '2021-05-21T08:30:00Z'
          format: date-time
          type: string
        status:
          $ref: '#/components/schemas/OpenbankingBrasilAutomaticPaymentV1EnumAuthorisationStatusType'
        statusUpdateDateTime:
          description: Data e hora em que o consentimento teve o status atualizado. Uma string com data e hora conforme especificao [RFC-3339](https://datatracker.ietf.org/doc/html/rfc3339), sempre com a utilizao de timezone UTC(UTC time format).
          example: '2021-05-21T08:30:00Z'
          format: date-time
          type: string
      required:
      - creationDateTime
      - creditors
      - loggedUser
      - recurringConfiguration
      - recurringConsentId
      - startDateTime
      - status
      - statusUpdateDateTime
