        isCallInProgress:
          description: 'Indica chamada ativa no momento do vnculo.


            [Restrio] Caso o sinal de risco esteja disponvel (cliente permitiu que fosse coletado), o mesmo dever ser enviado'
          type: boolean
        isCharging:
          description: Indica se a bateria do dispositivo est sendo carregada.
          type: boolean
        isDevModeEnabled:
          description: Indica se o dispositivo est em modo de desenvolvedor.
          type: boolean
        isEmulated:
