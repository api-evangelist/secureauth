        SPProvidedID:
          type: string
        Value:
          type: string
      title: NameID represents the SAML element NameID.
      type: object
    SPSSODescriptor:
      description: See http://docs.oasis-open.org/security/saml/v2.0/saml-metadata-2.0-os.pdf §2.4.2
      properties:
        ArtifactResolutionServices:
          items:
            $ref: '#/components/schemas/IndexedEndpoint'
          type: array
        AssertionConsumerServices:
          items:
            $ref: '#/components/schemas/IndexedEndpoint'
          type: array
        AttributeConsumingServices:
          items:
            $ref: '#/components/schemas/AttributeConsumingService'
          type: array
        AuthnRequestsSigned:
          type: boolean
        CacheDuration:
          $ref: '#/components/schemas/Duration'
        ContactPeople:
          items:
            $ref: '#/components/schemas/ContactPerson'
          type: array
        ErrorURL:
          type: string
        ID:
          type: string
        KeyDescriptors:
          items:
            $ref: '#/components/schemas/KeyDescriptor'
          type: array
        ManageNameIDServices:
          items:
            $ref: '#/components/schemas/Endpoint'
          type: array
        NameIDFormats:
          items:
            $ref: '#/components/schemas/NameIDFormat'
          type: array
        Organization:
          $ref: '#/components/schemas/Organization'
        ProtocolSupportEnumeration:
          type: string
        Signature:
          $ref: '#/components/schemas/Element'
        SingleLogoutServices:
          items:
            $ref: '#/components/schemas/Endpoint'
          type: array
        ValidUntil:
          format: date-time
          type: string
        WantAssertionsSigned:
          type: boolean
        XMLName:
          $ref: '#/components/schemas/Name'
      title: SPSSODescriptor represents the SAML SPSSODescriptorType object.
      type: object
