        businessEntity:
          $ref: '#/components/schemas/OpenbankingBrasilAutomaticPaymentV1BusinessEntity'
        creationDateTime:
          description: Data e hora em que o consentimento foi criado. Uma string com data e hora conforme especificao [RFC-3339](https://datatracker.ietf.org/doc/html/rfc3339), sempre com a utilizao de timezone UTC(UTC time format).
          example: '2021-05-21T08:30:00Z'
          format: date-time
          type: string
