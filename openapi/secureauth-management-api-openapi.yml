    OpenbankingBrasilPaymentV3ConsentRejectionReason:
      description: Motivo da rejeio do consentimento. Informaes complementares sobre o motivo do status
      properties:
        code:
          $ref: '#/components/schemas/OpenbankingBrasilPaymentV3EnumConsentRejectionReasonType'
        detail:
          description: 'Contm informaes adicionais ao consentimento rejeitado.

            VALOR_INVALIDO: O valor enviado no  vlido para o QR Code informado;

            NAO_INFORMADO: No informada pela detentora de conta;

            FALHA_INFRAESTRUTURA: [Descrio de qual falha na infraestrutura inviabilizou o processamento].

            TEMPO_EXPIRADO_AUTORIZACAO: Consentimento expirou antes que o usurio pudesse confirm-lo.

            TEMPO_EXPIRADO_CONSUMO: O usurio no finalizou o fluxo de pagamento e o consentimento expirou;

            REJEITADO_USUARIO: O usurio rejeitou a autorizao do consentimento

            CONTAS_ORIGEM_DESTINO_IGUAIS: A conta selecionada  igual  conta destino e no permite realizar esse pagamento.

            CONTA_NAO_PERMITE_PAGAMENTO: A conta selecionada  do tipo [salario/investimento/liquidao/outros] e no permite realizar esse pagamento.

            SALDO_INSUFICIENTE: A conta selecionada no possui saldo suficiente para realizar o pagamento.

            VALOR_ACIMA_LIMITE: O valor ultrapassa o limite estabelecido [na instituio/no arranjo/outro] para permitir a realizao de transaes pelo cliente.

            QRCODE_INVALIDO: O QRCode utilizado para a iniciao de pagamento no  vlido.'
          example: O usurio rejeitou a autorizao do consentimento
          maxLength: 2048
          pattern: '[\w\W\s]*'
          type: string
      required:
      - code
      - detail
      title: OpenbankingBrasilPaymentV3ConsentRejectionReason ConsentRejectionReason
      type: object
    OpenbankingBrasilPaymentV4EnumAuthorisationStatusType:
      description: 'Retorna o estado do consentimento, o qual no momento de sua criao ser AWAITING_AUTHORISATION. Na situao de mltiplas aladas PARTIALLY_ACCEPTED, indica que consentimento precisa da confirmao de mais autorizadores. Este estado ser alterado depois da(s) autorizao(es) do(s) consentimento(s) na detentora da conta do pagador (Debtor) para AUTHORISED ou REJECTED. O consentimento fica no estado CONSUMED aps ocorrer a iniciao do pagamento referente ao consentimento.


        Em caso de consentimento expirado a detentora dever retornar o status REJECTED.


        Estados possveis:


        AWAITING_AUTHORISATION - Aguardando autorizao


        PARTIALLY_ACCEPTED  Aguardando mltiplas aladas


        AUTHORISED - Autorizado


        REJECTED - Rejeitado


        CONSUMED - Consumido

        Example: AWAITING_AUTHORISATION'
      title: OpenbankingBrasilPaymentV4EnumAuthorisationStatusType EnumAuthorisationStatusType
      type: string
    OpenbankingBrasilAutomaticPaymentV1Integrity:
      description: 'Informa a integridade do dispositivo e app.

        No Android, conforme documentao Play API Integrity - [Android](https://developer.android.com/google/play/integrity/overview?hl=pt-br).

        No iOS, conforme documentao App Attest [iOS](https://developer.apple.com/documentation/devicecheck/establishing_your_app_s_integrity)'
      properties:
        appRecognitionVerdict:
          description: Informa a integridade do app
          type: string
        deviceRecognitionVerdict:
          description: Informa a integridade do dispositivo
          type: string
      title: OpenbankingBrasilAutomaticPaymentV1Integrity Integrity
      type: object
    BrazilCustomerPaymentConsentV2:
      properties:
        businessEntity:
          $ref: '#/components/schemas/OpenbankingBrasilPaymentV2BusinessEntity'
        consentId:
          description: 'Identificador nico do consentimento criado para a iniciao de pagamento solicitada. Dever ser um URN - Uniform Resource Name.

            Um URN, conforme definido na [RFC8141](https://tools.ietf.org/html/rfc8141)  um Uniform Resource

            Identifier - URI - que  atribudo sob o URI scheme "urn" e um namespace URN especfico, com a inteno de que o URN

            seja um identificador de recurso persistente e independente da localizao.

            Considerando a string urn:bancoex:C1DD33123 como exemplo para consentId temos:

            o namespace(urn)

            o identificador associado ao namespace da instituio transnmissora (bancoex)

            o identificador especfico dentro do namespace (C1DD33123).

            Informaes mais detalhadas sobre a construo de namespaces devem ser consultadas na [RFC8141](https://tools.ietf.org/html/rfc8141).'
          example: urn:bancoex:C1DD33123
          maxLength: 256
          pattern: ^urn:[a-zA-Z0-9][a-zA-Z0-9\-]{0,31}:[a-zA-Z0-9()+,\-.:=@;$_!*'%\/?#]+$
          type: string
        creationDateTime:
          description: Data e hora em que o consentimento foi criado. Uma string com data e hora conforme especificao RFC-3339, sempre com a utilizao de timezone UTC(UTC time format).
          example: '2021-05-21T08:30:00Z'
          format: date-time
          type: string
        creditor:
          $ref: '#/components/schemas/OpenbankingBrasilPaymentV2Identification'
        debtorAccount:
          $ref: '#/components/schemas/OpenbankingBrasilPaymentV2DebtorAccount'
        expirationDateTime:
          description: 'Data e hora em que o consentimento da iniciao de pagamento expira, devendo ser sempre o creationDateTime mais 5 minutos. Uma string com data e hora conforme especificao RFC-3339, sempre com a utilizao de timezone UTC (UTC time format).

            O consentimento  criado com o status AWAITING_AUTHORISATION, e deve assumir o status AUTHORIZED ou REJECTED antes do tempo de expirao - 5 minutos. Caso o tempo seja expirado, o status deve assumir REJECTED.

            Para o cenrio em que o status assumiu AUTHORISED, o tempo mximo do expirationDateTime do consentimento deve assumir "now + 60 minutos". Este  o tempo para consumir o consentimento autorizado, mudando seu status para CONSUMED. No  possvel prorrogar este tempo e a criao de um novo consentimento ser necessria para os cenrios de insucesso.

            O tempo do expirationDateTime  garantido com os 15 minutos do access token, sendo possvel utilizar mais trs refresh tokens at totalizar 60 minutos.'
          example: '2021-05-21T08:30:00Z'
          format: date-time
          type: string
        loggedUser:
          $ref: '#/components/schemas/OpenbankingBrasilPaymentV2LoggedUser'
        payment:
          $ref: '#/components/schemas/OpenbankingBrasilPaymentV2PaymentConsent'
        status:
          $ref: '#/components/schemas/OpenbankingBrasilPaymentV2EnumAuthorisationStatusType'
        statusUpdateDateTime:
          description: Data e hora em que o recurso foi atualizado. Uma string com data e hora conforme especificao RFC-3339, sempre com a utilizao de timezone UTC(UTC time format).
          example: '2021-05-21T08:30:00Z'
          format: date-time
          type: string
      required:
      - consentId
      - creationDateTime
      - creditor
      - expirationDateTime
      - loggedUser
      - payment
      - status
      - statusUpdateDateTime
      type: object
    OpenbankingBrasilPaymentV4ConsentRejectionReason:
      description: 'Motivo da rejeio do consentimento. Informaes complementares sobre o motivo do status.


        [Restrio] Esse motivo dever ser enviado quando o campo /data/status for igual a REJECTED.'
