openapi: 3.2.0
info:
  title: Secureauth Groups API
  version: latest
  description: 'Operations tagged Groups across 2 of this provider''s published API definitions: secureauth-identity-openapi.yml, secureauth-identitysystem-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://localhost:8443/api/identity/default
tags:
- name: Groups
paths:
  /admin/pools/{ipID}/groups:
    get:
      description: 'Retrieve the top level list of groups from the specified identity pool.


        If query param parent_id is set, the response will contain top level list of groups that are children of the specified group.


        If query param with_nested_groups is set to true, the response will contain a list of groups with all nested groups (also nested groups of nested groups etc.)


        Results are sorted by group `name`. No other sorting is supported.'
      operationId: listGroups
      parameters:
      - in: path
        name: ipID
        required: true
        schema:
          type: string
      - in: query
        name: parent_id
        schema:
          type: string
      - description: 'optional list groups after given id

          AfterGroupID'
        in: query
        name: after_group_id
        schema:
          type: string
      - description: 'optional list groups before given id

          BeforeGroupID'
        in: query
        name: before_group_id
        schema:
          type: string
      - description: 'optional limit results

          Limit'
        in: query
        name: limit
        schema:
          type: integer
          format: int64
          default: 20
          maximum: 100
          minimum: 1
      - description: 'optional query filter

          query is in json format - parameter must be url-encoded

          supported parameters:

          `name` - limits group set to groups that have name starting or ending with provided value (case insensitive)'
        in: query
        name: query
        schema:
          type: string
      - in: query
        name: with_nested_groups
        schema:
          type: boolean
      responses:
        '200':
          $ref: '#/components/responses/GroupsResponse'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '422':
          $ref: '#/components/responses/unprocessableEntityHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: List groups
      tags:
      - Groups
    post:
      operationId: createGroup
      parameters:
      - in: path
        name: ipID
        required: true
        schema:
          type: string
      responses:
        '201':
          $ref: '#/components/responses/GroupResponse'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '409':
          $ref: '#/components/responses/conflictHTTPError'
        '422':
          $ref: '#/components/responses/unprocessableEntityHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: Create group
      tags:
      - Groups
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaseGroup'
    servers:
    - url: https://localhost:8443/api/identity/default
  /admin/pools/{ipID}/groups/{groupID}:
    delete:
      description: Delete a group.
      operationId: deleteGroup
      parameters:
      - in: path
        name: ipID
        required: true
        schema:
          type: string
      - in: path
        name: groupID
        required: true
        schema:
          type: string
      responses:
        '204':
          description: ' Group has been deleted'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
