        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: Delete Identity Pool
      tags:
      - Pools
    get:
      description: 'Retrieve detailed information about an identity pool. Pass the identifier of the required identity pool with the

        `ipID` path parameter.


        To retrieve the pool identifier, log in to the Admin workspace. Then go to Identity Providers >

        [*click the connected identity provider name*] > Identity Pool > Manage Pool.'
      operationId: getPool
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - in: path
        name: ipID
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/PoolResponseParams'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: Get Identity Pool
      tags:
      - Pools
    put:
      description: 'Update the identity pool details. Pass the identifier of the required identity pool with the `ipID` path parameter.


        To retrieve the identity pool ID, log in to the Admin workspace. Then go to Identity Providers >

        [*click the connected identity provider name*] > Identity Pool > Manage Pool.'
      operationId: updatePool
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - in: path
        name: ipID
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/PoolResponseParams'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '409':
          $ref: '#/components/responses/conflictHTTPError'
        '422':
          $ref: '#/components/responses/unprocessableEntityHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: Update Identity Pool
      tags:
      - Pools
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pool'
    servers:
    - url: https://localhost:8443/api/identity/default
