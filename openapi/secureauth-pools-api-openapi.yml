openapi: 3.2.0
info:
  title: Secureauth Pools API
  version: latest
  description: 'Operations tagged Pools across 2 of this provider''s published API definitions: secureauth-identity-openapi.yml, secureauth-identitysystem-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://localhost:8443/api/identity/default
tags:
- name: Pools
paths:
  /admin/pools:
    get:
      description: 'Retrieve the list of identity pools available under the current administrator.


        You can filter the response with the query parameters to narrow the pool list down.'
      operationId: listPools
      parameters:
      - description: 'A search substring. Use the identity pool identifier or name as its value.


          SearchPhrase'
        in: query
        name: search_phrase
        schema:
          type: string
      - description: 'An identity pool identifier.


          Use it to navigate through the request pagination when the number of identity pools is greater than the

          `limit` set for results in the response.


          With `after_pool_id`, the list you obtain starts from the subsequent identity pool after the specified one. Also,

          the response depends on the `sort` and `order` parameters, if any are passed.


          AfterPoolID'
        in: query
        name: after_pool_id
        schema:
          type: string
      - description: 'An identity pool identifier.


          Use it to navigate through the request pagination when the number of identity pools is greater than the

          `limit` set for the results in the response.


          With `before_pool_id`, the list you obtain comprises identity pools up to the specified one. The specified

          identity pool isn''t included. Also, the response depends on the `sort` and `order` parameters, if any are

          passed.


          BeforePoolID'
        in: query
        name: before_pool_id
        schema:
          type: string
      - description: 'Sort results returned in the response by `name` or `id`.


          Sort'
        in: query
        name: sort
        schema:
          type: string
      - description: 'Set the order of results returned in the response. Input: `acs`, `desc`.


          Order'
        in: query
        name: order
        schema:
          type: string
      - description: 'Limit the number of results returned in the response.


          Limit'
        in: query
        name: limit
        schema:
          type: integer
          format: int64
          default: 20
          maximum: 100
          minimum: 1
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      responses:
        '200':
          description: Pools
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pools'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: List Identity Pools
      tags:
      - Pools
    post:
      description: 'Create an identity pool.


        When no `metadata_schema_id` and/or `payload_schema_id` are provided in the request body, the identity pool

        is created with the following defaults accordingly:


        `default_metadata=metadata_v0`


        `default_payload=user_v0`'
      operationId: createPool
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      responses:
        '201':
          $ref: '#/components/responses/PoolResponseParams'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '409':
          $ref: '#/components/responses/conflictHTTPError'
        '422':
          $ref: '#/components/responses/unprocessableEntityHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: Create Identity Pool
      tags:
      - Pools
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pool'
    servers:
    - url: https://localhost:8443/api/identity/default
  /admin/pools/{ipID}:
    delete:
      description: 'Delete an identity pool. For this, provide the required identity pool identifier in the path.


        To retrieve the identity pool ID, log in to the Admin workspace. Then go to Identity Providers >

        [*click the connected identity provider name*] > Identity Pool > Manage Pool.'
