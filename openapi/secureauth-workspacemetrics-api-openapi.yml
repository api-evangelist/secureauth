          - all
          - 1m
          - 5m
          - 15m
          - 30m
          - 1h
          - 3h
          - 6h
          - 12h
          - 1d
          - 1w
          - 1M
          - 3M
          - 6M
          - 1Y
          default: auto
      - description: Origin
        in: query
        name: origin
        schema:
          type: string
          format: date-time
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - description: Function
        in: query
        name: function
        schema:
          type: string
          enum:
          - count
          - count_recovery
          - recovery_friction
          - unique
          - unique_clients
          - unique_users
          default: count
      responses:
        '200':
          $ref: '#/components/responses/DataPoints'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: Query access tokens
      tags:
      - WorkspaceMetrics
