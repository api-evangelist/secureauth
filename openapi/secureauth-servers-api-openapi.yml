          $ref: '#/components/responses/GetServerWithScopesDeveloperAPIResponse'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - developer: []
      summary: Get authorization server
      tags:
      - Servers
    servers:
    - url: https://localhost:8443/api/developer/default/developer
