          type: string
        api_key_name:
          description: api key name
          type: string
        api_key_value:
          description: api key value
          type: string
        password:
          description: http basic auth password
          type: string
        username:
          description: http basic auth username
          type: string
      type: object
    Name:
      description: 'A Name represents an XML name (Local) annotated

        with a name space identifier (Space).

        In tokens returned by [Decoder.Token], the Space identifier

        is given as a canonical URL, not the short prefix used

        in the document being parsed.'
      properties:
        Space:
          type: string
      type: object
    Server:
      description: Multi Tenant authorization server
      properties:
        access_token_strategy:
          default: jwt
          description: 'Access token strategy


            You can choose to go either with `JWT` or `opaque` tokens.


            The content of JSON Web Tokens is readable and it is possible to be decoded by anyone that

            has a secret or a public key in their possession.


            Opaque tokens are in a proprietary form that contains an identifier to information stored on

            the athorization server. To validate an opaque token, the recipient must call the server that

            issued the token.'
          enum:
          - jwt
          - opaque
          example: jwt
          type: string
        access_token_ttl:
          default: 1h0m0s
          description: 'Access token time to live


            After an access token reaches its time to live, it expires and it cannot be used to

            authenticate the client application.'
          example: 1h10m30s
          format: duration
          type: string
        advanced:
          $ref: '#/components/schemas/AdvancedConfiguration'
        authentication_context_settings:
          $ref: '#/components/schemas/AuthenticationContextSettings'
        authentication_mechanisms:
          description: allowed authentication mechanisms for users in the identity pools
          example:
          - password
          - totp
          - otp
          - webauthn
          - sms_otp
          - email_otp
          items:
            enum:
            - totp
            - password
            - otp
            - email_otp
            - sms_otp
            - voice_otp
            - webauthn
            - usernameless_webauthn
            - push
            - symbol
            - qr_code
            type: string
          type: array
        authorization_code_ttl:
          description: 'Authorization code time to live


            After an authorization code reaches its time to live, it expires and it cannot be used to

            authorize the request to the `/token` endpoint.'
          example: 10m0s
          format: duration
          type: string
        backchannel_token_delivery_modes_supported:
          default:
          - poll
          - ping
          items:
            type: string
          type: array
        backchannel_user_code_parameter_supported:
          default: false
          type: boolean
        cdr:
          $ref: '#/components/schemas/CDRConfiguration'
        color:
          default: '#007FFF'
          description: Your server's label color in a HEX format.
          example: '#007FFF'
          type: string
        consent_id_namespace:
          description: 'Namespace used when creating Open Banking Brasil consent IDs


            Consent IDs will have the form of urn:<consent_id_namespace>:<uid> when this is set.

            If this is empty, the tenant id is used by default'
          type: string
        cookie_max_age:
          description: 'Cookie max age


            Defines how long a cookie can live until it expires.'
          example: 1h10m30s
          format: duration
          type: string
        created_at:
          description: 'Date the workspace or organization was created.


            Not set for workspaces and organizations that existed before this field was introduced,

            as there is no stored creation time to recover for them.'
          example: '2026-04-07T19:17:31.323187Z'
          format: date-time
          readOnly: true
          type: string
        custom_issuer_url:
          description: 'Defines a custom issuer URL that can be used as the value of the `iss` claim in an access

            token.


            If not provided, it is built dynamically based on the server''s URL.'
          example: http://example.com/default/default
          type: string
        description:
          description: Display description of the workspace
          example: Server description
          type: string
        device_authorization:
          $ref: '#/components/schemas/DeviceAuthorizationConfiguration'
        dynamic_client_registration:
          $ref: '#/components/schemas/DynamicClientRegistrationSettings'
        dynamic_scope_separator:
          default: .
          description: 'You can use this property to define a separator that is used for dynamic scopes.


            For example, the default separator is `.`, so the scope could look like the following:

            `users.*`.


            For Open Banking Brazil compliant servers, the `:` separator should be used.'
          format: dynamicScopeSeparator
          type: string
        enable_idp_discovery:
          description: 'Deprecated: Use IDPDiscovery instead


            If enabled, IDP discovery automatically redirects the user to their own IDP and does not

            display IDPs of other users while the users accesses the server/application.'
          example: false
          type: boolean
        enable_legacy_clients_with_no_software_statement:
          description: 'Deprecated


            If enabled, it is possible to manually register clients withouth the use of software

            statements.


            This flag is enabled, when the `enable_trust_anchor` flag is set to `false`. You can disable

            it using API, but it cannot be manually enabled.'
          type: boolean
        enable_quick_access:
          description: If enabled, the server is visible on the Quick Access tab on the login page.
          type: boolean
        enable_trust_anchor:
          default: false
          description: 'If enabled, it makes it obligatory to provide a software statement signed by a trusted certificate authority


            when registering a client application with the use of the Dynamic Client Registration (DCR).


            In public key infrastructure (PKI), trust anchors are certification authorities. They are

            represented by a certificate that is used to verify the signature of a certificate issued by

            a particular trust anchor.'
          type: boolean
        enforce_id_token_encryption:
          description: When enabled, the authorization server will enforce encrypted id tokens it issues
          type: boolean
        enforce_pkce:
          default: false
          description: 'Define whether you want to enforce using the Proof Key of Code Exchange (PKCE) for both

            private and public clients.


            PKCE is an OAuth security extension that prevents malicious applications or codes that

            intercepted authorization code from exchanging it for an access token.'
          example: false
          type: boolean
        enforce_pkce_for_public_clients:
          default: false
          description: 'Define whether you want to enforce using the Proof Key of Code Exchange (PKCE) for

            public clients.


            Public clients, like mobile applications or JavaScript-based applications, by their design,

            cannot store client secrets securely. For such clients, even encrypting the client secret

            inside the application’s code is not a reliable way of protecting secrets as the application

            can be decompiled and the client secret can be extracted while it is decrypted in the memory

            of the application.


            For those reasons, ACP supports the use of PKCE as an addition to the authorization code

            grant flow to provide a secure alternative to the implicit grant flow.'
          example: false
          type: boolean
        fdx:
          $ref: '#/components/schemas/FDXConfiguration'
        grant_types:
          default:
          - authorization_code
          - implicit
          - client_credentials
          - refresh_token
          description: An array that defines which of the OAuth 2.0 grant types are enabled for the authorization server.
          example:
          - authorization_code
          - implicit
          - refresh_token
          - client_credentials
          items:
            enum:
            - authorization_code
            - implicit
            - client_credentials
            - refresh_token
            - password
            - urn:ietf:params:oauth:grant-type:jwt-bearer
            - urn:openid:params:grant-type:ciba
            - urn:ietf:params:oauth:grant-type:token-exchange
            - urn:ietf:params:oauth:grant-type:device_code
            type: string
          type: array
        id:
          description: 'Unique identifier of an authorization server (workspace)


            If not provided, a random ID is generated.'
          example: default
          format: serverID
          type: string
        id_jag_ttl:
          default: 5m0s
          description: 'ID-JAG time to live


            After an Identity Assertion JWT Authorization Grant reaches its time to live, it expires

            and it cannot be redeemed at the resource authorization server. Kept short by default

            because the grant is redeemed immediately, and its expiry bounds how long the resource

            server must remember the grant identifier to reject replays.'
          example: 5m0s
          format: duration
          type: string
        id_token_ttl:
          description: 'ID token time to live


            After an ID token reaches its time to live, it expires and it cannot be used to provide

            user profile information to a client application.'
          example: 1h10m30s
          format: duration
          type: string
        identity_assurance:
          $ref: '#/components/schemas/IdentityAssuranceConfiguration'
        idp_discovery:
          $ref: '#/components/schemas/IDPDiscovery'
        issuer_id:
          description: 'Issuer ID that will be used to set `iss` claim on signed messages


            If issuer_id is not set then default issuer_url will be used'
          example: 5647fe90-f6bc-11eb-9a03-0242ac130003
          type: string
        jwks:
          $ref: '#/components/schemas/ServerJWKs'
        key_type:
          default: ecdsa
          description: 'Determines which type of asymmetric algorithms (RSA or ECDSA) is used to generate keys for signing access and

            ID tokens.


            It is used only as an input parameter for the Create Authorization Server API.'
          enum:
          - rsa
          - ecdsa
          - ps
          example: rsa
          type: string
        legal_entity:
          $ref: '#/components/schemas/LegalEntity'
        logo_uri:
          description: Logo URI
          type: string
        metadata:
          $ref: '#/components/schemas/ServerMetadata'
        name:
          description: 'Display name of the workspace


            If not provided, a random ID is generated.'
          example: default
          type: string
        obbr:
          $ref: '#/components/schemas/DeprecatedOBBRConfiguration'
        organization:
          $ref: '#/components/schemas/OrganizationConfiguration'
        parent_id:
          description: Optional ID of a parent server
          format: serverID
          type: string
        preferences:
          $ref: '#/components/schemas/ServerPreferences'
        profile:
          default: default
          description: 'The profile of a server


            ACP is delivered with preconfigured workspace templates that enable quick and easy setup for

            specific configuration patterns. For example, you can instantly create an Open Banking

            compliant workspace that has all of the required mechanisms and settings already in place.'
          enum:
          - default
          - demo
          - workforce
          - workforce_v2
          - consumer
          - partners
          - third_party
          - fapi_advanced
          - fapi_rw
          - fapi_ro
          - openbanking_uk_fapi_advanced
          - openbanking_uk
          - openbanking_br
          - openbanking_br_unico
          - cdr_australia
          - cdr_australia_fapi_rw
          - fdx
          - openbanking_ksa
          - fapi_20_security
          - fapi_20_message_signing
          - connect_id
          - agentic_ai
          - saidp_legacy
          example: default
          type: string
        pushed_authorization_request_ttl:
          description: 'Custom pushed authentication request TTL

            If not provided, TTL is set to 60 seconds.'
          format: duration
          type: string
        refresh_token_ttl:
          default: 720h0m0s
          description: 'Refresh token time to live


            After a refresh token reaches its time to live, it expires and it cannot be used to obtain

            new access tokens for a client application.'
          example: 720h0m0s
          format: duration
          type: string
        require_pushed_authorization_requests:
          description: Boolean parameter indicating whether the authorization server accepts authorization request data only via PAR.
          type: boolean
        response_types:
          $ref: '#/components/schemas/ResponseTypes'
        root_cas:
          description: 'You can provide root Certificate Authority (CA) certificates encoded to the Privacy-Enhanced

            Mail (PEM) file format which are used for the `tls_client_auth` and the

            `self_signed_tls_client_auth` client authentication methods that use the Mutual

            Transport Layer Security (mTLS).


            If not set, the system root CA certifiates are used instead.'
          type: string
        rotated_secrets:
          description: An array of rotated secrets that are still used to validate tokens
          example:
          - jFpwIvuKJP46J71WqszPv1SrzoUr-cSILP9EPdlClB4
          items:
            type: string
          type: array
        saml:
          $ref: '#/components/schemas/SAMLConfiguration'
        scope_claim_formats:
          default:
          - scp_array
          description: formats of the scope claim that will be included in the access token
          example:
          - scp_array
          - scope_space_separated
          items:
            $ref: '#/components/schemas/ScopeClaimFormat'
          type: array
        secret:
          description: 'Secret used for hashing


            It must have at least 32 characters. If not provided, it is generated.'
          example: hW5WhKX_7w7BLwUQ6mn7Cp70_OoKI_F1y1hLS5U8lIU
          type: string
        settings:
          $ref: '#/components/schemas/ServerSettings'
        sso:
          $ref: '#/components/schemas/SSOConfiguration'
        styling:
          $ref: '#/components/schemas/Styling'
        subject_custom_attribute:
          description: The authentication context attribute name that will be used as subject when the custom subject format is used.
          type: string
        subject_format:
          description: 'Define the format of a subject

            When set to hash sub value is a one way hash of idp id and idp sub'
          enum:
          - hash
          - legacy
          - custom
          type: string
        subject_identifier_algorithm_salt:
          description: 'Salt used to hash `subject` when the `pairwise` subject type is used.


            Salt is a random data which is used as an additional input to one-way functions that hashes

            data, passwords, and, in this case, subjects.


            It is recommended that your salt value is long for security reasons. Preferably, the salt

            value should be at least the same length as the output of the hash.


            If not provided, it is generated.'
          type: string
        subject_identifier_types:
          default:
          - public
          - pairwise
          description: 'An array that defines supported subject identifier types.


            Subject identifiers identify an end-user. They are locally unique and never reassigned within the Issuer,

            and are intended to be consumed by client applications. There are two types

            of subject identifiers: `public` and `pairwise`.


            `public` identifiers provide the same `sub` claim value to all client applications.

            `pairwise` identifiers provide different `sub` claim values to each client application. With

            this approach, it makes it impossible for client applications to correlate the end-user''s

            activity without their permission.'
          example:
          - public
          - pairwise
          items:
            enum:
            - public
            - pairwise
            type: string
          type: array
        template:
          description: If true this workspace can be used as a template when creating a new ones.
          type: boolean
        tenant_id:
          description: ID of a tenant
          example: default
          format: tenantID
          type: string
        token_endpoint_auth_methods:
          default:
          - client_secret_basic
          - client_secret_post
          - client_secret_jwt
          - private_key_jwt
          - self_signed_tls_client_auth
          - tls_client_auth
          - none
          description: 'An array that lists all of the supported token endpoint authentication methods for the

            authorization server.'
          items:
            enum:
            - client_secret_basic
            - client_secret_post
            - client_secret_jwt
            - private_key_jwt
            - self_signed_tls_client_auth
            - tls_client_auth
            - none
            - unspecified
            type: string
          type: array
        token_endpoint_auth_signing_alg_values:
          description: 'Token endpoint auth signing supported alg values


            Supported algorithms: HS256, RS256, ES256, PS256


            At least one algorithm must be set.


            The default values depends on the server security profile.'
          items:
            type: string
          type: array
        token_endpoint_authn_methods:
          description: 'Deprecated: Use TokenEndpointAuthMethods instead'
          items:
            enum:
            - client_secret_basic
            - client_secret_post
            - client_secret_jwt
            - private_key_jwt
            - self_signed_tls_client_auth
            - tls_client_auth
            - none
            - unspecified
            type: string
          type: array
        trust_anchor_configuration:
          $ref: '#/components/schemas/TrustAnchorConfiguration'
        type:
          default: regular
          description: 'Server type


            It is an internal property used to recognize if the server is created for an admin portal,

            a developer portal, or if it is a system or a regular workspace.'
          enum:
          - admin
          - developer
          - system
          - regular
          - organization
          example: regular
          type: string
        updated_at:
          description: 'Date the workspace or organization was last updated.


            Not set until the first write after this field was introduced.'
          example: '2026-05-08T01:11:51.126291Z'
          format: date-time
          readOnly: true
          type: string
        version:
          default: 3
          description: 'server version to track internal changes

            version that is currently the latest: 3'
          format: int64
          type: integer
        workforce:
          $ref: '#/components/schemas/WorkforceConfiguration'
