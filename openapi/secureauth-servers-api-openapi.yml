          items:
            type: string
          type: array
        require_pushed_authorization_requests:
          description: Boolean parameter indicating whether the only means of initiating an authorization request the client is allowed to use is PAR.
          type: boolean
        response_types:
          $ref: '#/components/schemas/ResponseTypes'
        revocation_endpoint_auth_method:
          default: client_secret_basic
          description: 'A revocation endpoint authentication method configured for the client application (read-only).

            If empty, the `token_endpoint_auth_method` is used.


            SecureAuth supports the following client authentication methods:

            `client_secret_basic`, `client_secret_post`, `client_secret_jwt`, `private_key_jwt`,

            `self_signed_tls_client_auth`, `tls_client_auth`, `none`.


            [Read more](https://cloudentity.com/developers/basics/oauth-client-authentication/client-authentication-overview/) about client authentication.'
          enum:
          - client_secret_basic
          - client_secret_post
          - client_secret_jwt
          - private_key_jwt
          - self_signed_tls_client_auth
          - tls_client_auth
          - none
          example: client_secret_basic
          type: string
        rotated_secrets:
          description: An array of rotated OAuth client secrets
          items:
            type: string
          minLength: 32
          type: array
        saml_allowed_attributes:
          description: Allowed SAML attributes
          items:
            type: string
          type: array
        saml_idp_accept_acs_from_request:
          description: accept ACS from SamlRequest even if it's not registered in the metadata
          type: boolean
        saml_idp_attributes_override:
          $ref: '#/components/schemas/SAMLIDPAttributesOverride'
        saml_idp_custom_entity_id:
          description: custom entity id
          type: string
        saml_idp_custom_sso_url:
          description: custom sso url
          type: string
        saml_idp_override_enabled:
          description: enable flag
          type: boolean
        saml_idp_signing_key:
          $ref: '#/components/schemas/ServerJWK'
        saml_metadata:
          $ref: '#/components/schemas/EntityDescriptor'
        saml_metadata_updated_at:
          format: date-time
          type: string
        saml_metadata_url:
          type: string
        saml_override_attributes:
          description: If true, then only attributes defined in saml_attributes will be used to build the SAML assertion
          type: boolean
        saml_service_provider_id:
          type: string
        saml_signing_hash:
          default: sha-256
          description: SAML Assertion signing hash algorithm.
          enum:
          - sha-1
          - sha-256
          - sha-512
          example: sha-256
          type: string
        saml_subject_name_id:
          description: Allows to override the subject name id.
          type: string
        saml_subject_name_id_format:
          description: Allows to override the subject name id format
          enum:
          - urn:oasis:names:tc:SAML:1.1:nameid-format:unspecified
          - urn:oasis:names:tc:SAML:2.0:nameid-format:transient
          - urn:oasis:names:tc:SAML:1.1:nameid-format:emailAddress
          - urn:oasis:names:tc:SAML:2.0:nameid-format:persistent
          type: string
        scope:
          description: Space-separated list of scopes for compatibility with the OAuth specification.
          example: email offline_access openid
          type: string
        scopes:
          description: An array of string represented scopes assigned to a client application
          example:
          - email
          - offline_access
          - openid
          items:
            type: string
          type: array
        sector_identifier_uri:
          description: 'OPTIONAL. [A URL using the HTTPS scheme](https://openid.net/specs/openid-connect-registration-1_0.html#SectorIdentifierValidation).

            It must reference a JSON file with the array of `redirect_uri` values.


            Pass this parameter when you use multiple domains in your `redirect_uris` or need a mechanism to allow changes in

            domain without affecting consumer consent.


            [Read more](https://openid.net/specs/openid-connect-core-1_0.html)'
          type: string
        server_issuer_url:
          type: string
        server_mtls_issuer_url:
          type: string
        skip_dbfp:
          description: 'Skip device-based fingerprint (DBFP) collection for this client.

            If true, the interactive DBFP collection step is skipped during login, which lets

            non-interactive clients (e.g. backend HTTP clients that cannot execute the collection

            JavaScript) complete the authorization flow. Risk inference is unaffected.'
          type: boolean
        software_id:
          description: 'A unique identifier string (e.g., a Universally Unique Identifier

            (UUID)) assigned by the client developer or software publisher.


            The `software_id` MUST remain the same across

            multiple updates or versions of the same software package. The

            value of this field is not intended to be human-readable and is

            usually opaque to the client and authorization server.'
          type: string
        software_statement:
          description: 'A digitally signed or MACed JSON Web Token (JWT) [RFC7519] that

            asserts metadata values about the client software.  In some cases,

            a software statement is issued directly by the client

            developer.  In other cases, a software statement is issued by

            a third-party organization for use by the client developer.


            In both cases, the trust relationship the authorization server has

            with the issuer of the software statement is intended to be used

            as an input to the evaluation of whether the registration request

            is accepted.


            A software statement can be presented to an

            authorization server as part of the client registration request.'
          type: string
        software_statement_payload:
          $ref: '#/components/schemas/Metadata'
        software_version:
          description: 'A version identifier string for the client software identified by

            `software_id`. The value of the `software_version` MUST be changed

            with any update of the client software identified by the same

            `software_id`.'
          type: string
        subject_type:
          default: public
          description: 'Subject identifier type


            Stores information if the subject identifier is of the `public` or the `pairwise` type.


            Subject identifiers identify an end-user. They are locally unique and never reassigned within the Issuer,

            and are intended to be consumed by client applications. There are two types

            of subject identifiers: `public` and `pairwise`.


            For the `public` type, the value of the `sub` (subject) token claim is the same for all clients.


            For the `pairwise` type, a different `sub` (subject) token claim is provided for each client.

            Using the `pairwise` subject identifier makes it impossible for client applications to correlate the end-user''s

            activity without their permission.'
          enum:
          - public
          - pairwise
          example: public
          type: string
        system:
          description: Defines whether the client application is a system tenant's application or not.
          type: boolean
        tenant_id:
          description: ID of a tenant where the client application is added
          example: default
          format: tenantID
          type: string
        tls_client_auth_san_dns:
          description: A string containing the value of an expected dNSName SAN entry in the certificate.
          type: string
        tls_client_auth_san_email:
          description: A string containing the value of an expected rfc822Name SAN entry in the certificate.
          type: string
        tls_client_auth_san_ip:
          description: A string representation of an IP address in either dotted decimal notation (for IPv4) or colon-delimited hexadecimal (for IPv6, as defined in [RFC5952]) that is expected to be present as an iPAddress SAN entry in the certificate.
          type: string
        tls_client_auth_san_uri:
          description: A string containing the value of an expected uniformResourceIdentifier SAN entry in the certificate.
          type: string
        tls_client_auth_subject_dn:
          description: An [RFC4514] string representation of the expected subject distinguished name of the certificate.
          type: string
        tls_client_certificate_bound_access_tokens:
          description: Boolean value indicating server support for mutual TLS client certificate-bound access tokens. If omitted, the default value is "false".
          type: boolean
        token_endpoint_auth_method:
          default: client_secret_basic
          description: 'Token endpoint authentication method configured for a client application


            SecureAuth supports the following client authentication methods:

            `client_secret_basic`, `client_secret_post`, `client_secret_jwt`, `private_key_jwt`,

            `self_signed_tls_client_auth`, `tls_client_auth`, `none`.


            To learn more, go to the Authorization Basics > Client Authentication section of this guide.'
          enum:
          - client_secret_basic
          - client_secret_post
          - client_secret_jwt
          - private_key_jwt
          - self_signed_tls_client_auth
          - tls_client_auth
          - none
          - unspecified
          example: client_secret_basic
          type: string
        token_endpoint_auth_signing_alg:
          default: ES256
          description: 'Signing algorithm for the token endpoint


            This field is optional. If empty, a client can use any algorithm supported by the server (see `token_endpoint_auth_signing_alg_values_supported` in the well-known endpoing).


            If provided, depending on the server configuration, client can use of one: HS256, RS256, ES256, PS256 algorithms.


            If your token endpoint authentication is set to the `private_key_jwt` method, the

            `token_endpoint_auth_signing_alg` parameter must be either RS256, ES256, or PS256.


            If your token endpoint authentication is set to the `client_secret_jwt` method,

            the `token_endpoint_auth_signing_alg` parameter must be HS256.'
          enum:
          - RS256
          - ES256
          - PS256
          - HS256
          - ''
          example: ES256
          type: string
        token_exchange:
          $ref: '#/components/schemas/ClientTokenExchangeConfiguration'
        token_ttls:
          $ref: '#/components/schemas/TokenTTLs'
        tos_uri:
          description: Terms of Service URL.
          type: string
        trusted:
          description: 'Defines whether the client application is trusted or not.


            For trusted clients, consent pages are skipped during the authorization process.'
          type: boolean
        updated_at:
          description: Date when the client application was updated.
          example: '2022-05-08T01:11:51.1262916Z'
          format: date-time
          type: string
        use_custom_token_ttls:
          description: If enabled the client application will be able to set its own token TTLs.
          type: boolean
        userinfo_signed_response_alg:
          default: none
          description: 'JWS alg algorithm REQUIRED for signing UserInfo Responses.


            If specified, the response is a JWT serialized and signed with JWS.


            If omitted, then by default, UserInfo Response returns the Claims

            as an UTF-8 encoded JSON object using the application/json content-type.'
          enum:
          - none
          - RS256
          - ES256
          example: none
          type: string
      required:
      - tenant_id
      - authorization_server_id
      type: object
    ScopeClaimFormat:
      type: string
    ServerResponse:
      properties:
        access_token_strategy:
          default: jwt
          description: 'Access token strategy


            You can choose to go either with `JWT` or `opaque` tokens.


            The content of JSON Web Tokens is readable and it is possible to be decoded by anyone that

            has a secret or a public key in their possession.


            Opaque tokens are in a proprietary form that contains an identifier to information stored on

            the athorization server. To validate an opaque token, the recipient must call the server that

            issued the token.'
          enum:
          - jwt
          - opaque
          example: jwt
          type: string
        access_token_ttl:
          default: 1h0m0s
          description: 'Access token time to live


            After an access token reaches its time to live, it expires and it cannot be used to

            authenticate the client application.'
          example: 1h10m30s
          format: duration
          type: string
        advanced:
          $ref: '#/components/schemas/AdvancedConfiguration'
        authentication_context_settings:
          $ref: '#/components/schemas/AuthenticationContextSettings'
        authentication_mechanisms:
          description: allowed authentication mechanisms for users in the identity pools
          example:
          - password
          - totp
          - otp
          - webauthn
          - sms_otp
          - email_otp
          items:
            enum:
            - totp
            - password
            - otp
            - email_otp
            - sms_otp
            - voice_otp
            - webauthn
            - usernameless_webauthn
            - push
            - symbol
            - qr_code
            type: string
          type: array
        authorization_code_ttl:
          description: 'Authorization code time to live


            After an authorization code reaches its time to live, it expires and it cannot be used to

            authorize the request to the `/token` endpoint.'
          example: 10m0s
          format: duration
          type: string
        backchannel_token_delivery_modes_supported:
          default:
          - poll
          - ping
          items:
            type: string
          type: array
        backchannel_user_code_parameter_supported:
          default: false
          type: boolean
        cdr:
          $ref: '#/components/schemas/CDRConfiguration'
        color:
          default: '#007FFF'
          description: Your server's label color in a HEX format.
          example: '#007FFF'
          type: string
        consent_id_namespace:
          description: 'Namespace used when creating Open Banking Brasil consent IDs


            Consent IDs will have the form of urn:<consent_id_namespace>:<uid> when this is set.

            If this is empty, the tenant id is used by default'
          type: string
        cookie_max_age:
          description: 'Cookie max age


            Defines how long a cookie can live until it expires.'
          example: 1h10m30s
          format: duration
          type: string
        created_at:
          description: 'Date the workspace or organization was created.


            Not set for workspaces and organizations that existed before this field was introduced,

            as there is no stored creation time to recover for them.'
          example: '2026-04-07T19:17:31.323187Z'
          format: date-time
          readOnly: true
          type: string
        custom_issuer_url:
          description: 'Defines a custom issuer URL that can be used as the value of the `iss` claim in an access

            token.


            If not provided, it is built dynamically based on the server''s URL.'
          example: http://example.com/default/default
          type: string
        description:
          description: Display description of the workspace
          example: Server description
          type: string
        device_authorization:
          $ref: '#/components/schemas/DeviceAuthorizationConfiguration'
        dynamic_client_registration:
          $ref: '#/components/schemas/DynamicClientRegistrationSettings'
        dynamic_scope_separator:
          default: .
          description: 'You can use this property to define a separator that is used for dynamic scopes.


            For example, the default separator is `.`, so the scope could look like the following:

            `users.*`.


            For Open Banking Brazil compliant servers, the `:` separator should be used.'
          format: dynamicScopeSeparator
          type: string
        enable_idp_discovery:
          description: 'Deprecated: Use IDPDiscovery instead


            If enabled, IDP discovery automatically redirects the user to their own IDP and does not

            display IDPs of other users while the users accesses the server/application.'
          example: false
          type: boolean
        enable_legacy_clients_with_no_software_statement:
          description: 'Deprecated


            If enabled, it is possible to manually register clients withouth the use of software

            statements.


            This flag is enabled, when the `enable_trust_anchor` flag is set to `false`. You can disable

            it using API, but it cannot be manually enabled.'
          type: boolean
        enable_quick_access:
          description: If enabled, the server is visible on the Quick Access tab on the login page.
          type: boolean
        enable_trust_anchor:
          default: false
          description: 'If enabled, it makes it obligatory to provide a software statement signed by a trusted certificate authority


            when registering a client application with the use of the Dynamic Client Registration (DCR).


            In public key infrastructure (PKI), trust anchors are certification authorities. They are

            represented by a certificate that is used to verify the signature of a certificate issued by

            a particular trust anchor.'
          type: boolean
        enforce_id_token_encryption:
          description: When enabled, the authorization server will enforce encrypted id tokens it issues
          type: boolean
        enforce_pkce:
          default: false
          description: 'Define whether you want to enforce using the Proof Key of Code Exchange (PKCE) for both

            private and public clients.


            PKCE is an OAuth security extension that prevents malicious applications or codes that

            intercepted authorization code from exchanging it for an access token.'
          example: false
          type: boolean
        enforce_pkce_for_public_clients:
          default: false
          description: 'Define whether you want to enforce using the Proof Key of Code Exchange (PKCE) for

            public clients.


            Public clients, like mobile applications or JavaScript-based applications, by their design,

            cannot store client secrets securely. For such clients, even encrypting the client secret

            inside the application’s code is not a reliable way of protecting secrets as the application

            can be decompiled and the client secret can be extracted while it is decrypted in the memory

            of the application.


            For those reasons, ACP supports the use of PKCE as an addition to the authorization code

            grant flow to provide a secure alternative to the implicit grant flow.'
          example: false
          type: boolean
        fdx:
          $ref: '#/components/schemas/FDXConfiguration'
        grant_types:
          default:
          - authorization_code
          - implicit
          - client_credentials
          - refresh_token
          description: An array that defines which of the OAuth 2.0 grant types are enabled for the authorization server.
          example:
          - authorization_code
          - implicit
          - refresh_token
          - client_credentials
          items:
            enum:
            - authorization_code
            - implicit
            - client_credentials
            - refresh_token
            - password
            - urn:ietf:params:oauth:grant-type:jwt-bearer
            - urn:openid:params:grant-type:ciba
            - urn:ietf:params:oauth:grant-type:token-exchange
            - urn:ietf:params:oauth:grant-type:device_code
            type: string
          type: array
        id:
          description: 'Unique identifier of an authorization server (workspace)


            If not provided, a random ID is generated.'
          example: default
          format: serverID
          type: string
        id_jag_ttl:
          default: 5m0s
          description: 'ID-JAG time to live


            After an Identity Assertion JWT Authorization Grant reaches its time to live, it expires

            and it cannot be redeemed at the resource authorization server. Kept short by default

            because the grant is redeemed immediately, and its expiry bounds how long the resource

            server must remember the grant identifier to reject replays.'
          example: 5m0s
          format: duration
          type: string
        id_token_ttl:
          description: 'ID token time to live


            After an ID token reaches its time to live, it expires and it cannot be used to provide

            user profile information to a client application.'
          example: 1h10m30s
          format: duration
          type: string
        identity_assurance:
          $ref: '#/components/schemas/IdentityAssuranceConfiguration'
        idp_discovery:
          $ref: '#/components/schemas/IDPDiscovery'
        issuer_id:
          description: 'Issuer ID that will be used to set `iss` claim on signed messages


            If issuer_id is not set then default issuer_url will be used'
          example: 5647fe90-f6bc-11eb-9a03-0242ac130003
          type: string
        issuer_url:
          type: string
        jwks:
          $ref: '#/components/schemas/ServerJWKs'
        key_type:
          default: ecdsa
          description: 'Determines which type of asymmetric algorithms (RSA or ECDSA) is used to generate keys for signing access and

            ID tokens.


            It is used only as an input parameter for the Create Authorization Server API.'
          enum:
          - rsa
          - ecdsa
          - ps
          example: rsa
          type: string
        legal_entity:
          $ref: '#/components/schemas/LegalEntity'
        logo_uri:
          description: Logo URI
          type: string
        metadata:
          $ref: '#/components/schemas/ServerMetadata'
        mtls_issuer_url:
          type: string
        name:
          description: 'Display name of the workspace


            If not provided, a random ID is generated.'
          example: default
          type: string
        obbr:
          $ref: '#/components/schemas/DeprecatedOBBRConfiguration'
        organization:
          $ref: '#/components/schemas/OrganizationConfiguration'
        parent_id:
          description: Optional ID of a parent server
          format: serverID
          type: string
        preferences:
          $ref: '#/components/schemas/ServerPreferences'
        profile:
          default: default
          description: 'The profile of a server


            ACP is delivered with preconfigured workspace templates that enable quick and easy setup for

            specific configuration patterns. For example, you can instantly create an Open Banking

            compliant workspace that has all of the required mechanisms and settings already in place.'
          enum:
          - default
          - demo
          - workforce
          - workforce_v2
          - consumer
          - partners
          - third_party
          - fapi_advanced
          - fapi_rw
          - fapi_ro
          - openbanking_uk_fapi_advanced
          - openbanking_uk
          - openbanking_br
          - openbanking_br_unico
          - cdr_australia
          - cdr_australia_fapi_rw
          - fdx
          - openbanking_ksa
          - fapi_20_security
          - fapi_20_message_signing
          - connect_id
          - agentic_ai
          - saidp_legacy
          example: default
          type: string
        pushed_authorization_request_ttl:
          description: 'Custom pushed authentication request TTL

            If not provided, TTL is set to 60 seconds.'
          format: duration
          type: string
        refresh_token_ttl:
          default: 720h0m0s
          description: 'Refresh token time to live


            After a refresh token reaches its time to live, it expires and it cannot be used to obtain

            new access tokens for a client application.'
          example: 720h0m0s
          format: duration
          type: string
        require_pushed_authorization_requests:
          description: Boolean parameter indicating whether the authorization server accepts authorization request data only via PAR.
          type: boolean
        response_types:
          $ref: '#/components/schemas/ResponseTypes'
        root_cas:
          description: 'You can provide root Certificate Authority (CA) certificates encoded to the Privacy-Enhanced

            Mail (PEM) file format which are used for the `tls_client_auth` and the

            `self_signed_tls_client_auth` client authentication methods that use the Mutual

            Transport Layer Security (mTLS).


            If not set, the system root CA certifiates are used instead.'
          type: string
        rotated_secrets:
          description: An array of rotated secrets that are still used to validate tokens
          example:
          - jFpwIvuKJP46J71WqszPv1SrzoUr-cSILP9EPdlClB4
          items:
            type: string
          type: array
        saml:
          $ref: '#/components/schemas/SAMLConfiguration'
        scope_claim_formats:
          default:
          - scp_array
          description: formats of the scope claim that will be included in the access token
          example:
          - scp_array
          - scope_space_separated
          items:
            $ref: '#/components/schemas/ScopeClaimFormat'
          type: array
        secret:
          description: 'Secret used for hashing


            It must have at least 32 characters. If not provided, it is generated.'
          example: hW5WhKX_7w7BLwUQ6mn7Cp70_OoKI_F1y1hLS5U8lIU
          type: string
        settings:
          $ref: '#/components/schemas/ServerSettings'
        sso:
          $ref: '#/components/schemas/SSOConfiguration'
        styling:
          $ref: '#/components/schemas/Styling'
        subject_custom_attribute:
          description: The authentication context attribute name that will be used as subject when the custom subject format is used.
          type: string
        subject_format:
          description: 'Define the format of a subject

            When set to hash sub value is a one way hash of idp id and idp sub'
          enum:
          - hash
          - legacy
          - custom
          type: string
        subject_identifier_algorithm_salt:
          description: 'Salt used to hash `subject` when the `pairwise` subject type is used.


            Salt is a random data which is used as an additional input to one-way functions that hashes

            data, passwords, and, in this case, subjects.


            It is recommended that your salt value is long for security reasons. Preferably, the salt

            value should be at least the same length as the output of the hash.


            If not provided, it is generated.'
          type: string
        subject_identifier_types:
          default:
          - public
          - pairwise
          description: 'An array that defines supported subject identifier types.


            Subject identifiers identify an end-user. They are locally unique and never reassigned within the Issuer,

            and are intended to be consumed by client applications. There are two types

            of subject identifiers: `public` and `pairwise`.


            `public` identifiers provide the same `sub` claim value to all client applications.

            `pairwise` identifiers provide different `sub` claim values to each client application. With

            this approach, it makes it impossible for client applications to correlate the end-user''s

            activity without their permission.'
          example:
          - public
          - pairwise
          items:
            enum:
            - public
            - pairwise
            type: string
          type: array
        supported_application_purposes:
          description: supported application purposes
          example:
          - single_page
          - server_web
          - mobile_desktop
          - service
          - legacy
          items:
            enum:
            - single_page
            - server_web
            - mobile_desktop
            - service
            - legacy
            - custom
            - saml
            - ai_agent
            type: string
          type: array
        template:
          description: If true this workspace can be used as a template when creating a new ones.
          type: boolean
        tenant_id:
          description: ID of a tenant
          example: default
          format: tenantID
          type: string
        theme_id:
          description: optional theme id
          format: themeID
          type: string
        token_endpoint_auth_methods:
          default:
          - client_secret_basic
          - client_secret_post
          - client_secret_jwt
          - private_key_jwt
          - self_signed_tls_client_auth
          - tls_client_auth
          - none
          description: 'An array that lists all of the supported token endpoint authentication methods for the

            authorization server.'
          items:
            enum:
            - client_secret_basic
            - client_secret_post
            - client_secret_jwt
            - private_key_jwt
            - self_signed_tls_client_auth
            - tls_client_auth
            - none
            - unspecified
            type: string
          type: array
        token_endpoint_auth_signing_alg_values:
          description: 'Token endpoint auth signing supported alg values


            Supported algorithms: HS256, RS256, ES256, PS256


            At least one algorithm must be set.


            The default values depends on the server security profile.'
          items:
            type: string
          type: array
        token_endpoint_authn_methods:
          description: 'Deprecated: Use TokenEndpointAuthMethods instead'
          items:
            enum:
            - client_secret_basic
            - client_secret_post
            - client_secret_jwt
            - private_key_jwt
            - self_signed_tls_client_auth
            - tls_client_auth
            - none
            - unspecified
            type: string
          type: array
        trust_anchor_configuration:
          $ref: '#/components/schemas/TrustAnchorConfiguration'
        type:
          default: regular
          description: 'Server type


            It is an internal property used to recognize if the server is created for an admin portal,

            a developer portal, or if it is a system or a regular workspace.'
          enum:
          - admin
          - developer
          - system
          - regular
          - organization
          example: regular
          type: string
        updated_at:
          description: 'Date the workspace or organization was last updated.


            Not set until the first write after this field was introduced.'
          example: '2026-05-08T01:11:51.126291Z'
          format: date-time
          readOnly: true
          type: string
        version:
          default: 3
          description: 'server version to track internal changes

            version that is currently the latest: 3'
          format: int64
          type: integer
        workforce:
          $ref: '#/components/schemas/WorkforceConfiguration'
      required:
      - tenant_id
      type: object
    Token:
      description: 'A Token is an interface type used to represent XML elements, character

        data, CDATA sections, XML comments, XML directives, and XML processing

        instructions.'
      properties:
        Index:
          format: int64
          type: integer
        Parent:
          $ref: '#/components/schemas/Element'
        Remove:
          type: boolean
      type: object
    AdvancedConfiguration:
      properties:
        acr_values:
          description: Deprecated ACR values to enforce during auth flow (use new ACR feature instead)
          items:
            type: string
          type: array
        advertise_only_mtls_aliases_in_well_known:
          description: This option overrides all urls advertised by the well known endpoint with their mtls alias
          type: boolean
        allow_organization_selection:
          description: 'Allow the user to select one of their organizations after authentication (application-membership

            org-selector login step). Disabled by default.'
          type: boolean
        auto_request_recovery:
          description: auto request recovery
          type: boolean
        block_response_modes:
          description: Block response modes
          type: boolean
        cookies_configuration:
          $ref: '#/components/schemas/CookiesConfiguration'
        cross_organization_application_membership:
          description: 'Allow cross-organization application membership across this workspace''s org tree — granting a

            user whose identity pool lives in one org access to an application in another org of the same

            tree, and honoring such grants at token time. Disabled by default. Set on the tree-root

            workspace; governs the whole tree. Role assignment is unaffected (that stays flag-gated).'
          type: boolean
        disable_dcr_client_certificate_bound_access_tokens:
          description: 'Disable certificate-bound access tokens for new DCR clients


            If true, new DCR clients are created with CertificateBoundAccessToken disabled.'
          type: boolean
        disable_par:
          description: Disable PAR
          type: boolean
        disable_rar:
          description: Disable RAR
          type: boolean
        disable_refresh_token_cycling:
          description: 'Disable refresh token cycling


            Once disabled, original refresh token can be constantly used to issue new access token.'
          type: boolean
        disallow_access_token_in_query_for_protected_resources:
          description: 'When enabled, the authorization server will not accept access tokens supplied in the request query parameter

            for protected resources endpoints.'
          type: boolean
        disallow_code_response_type_without_jarm:
          description: Disallow code response type without JARM
          type: boolean
        disallowed_response_modes:
          $ref: '#/components/schemas/ResponseModes'
        do_not_issue_acr_claim_in_id_token:
          description: Do not issue acr claim in ID Token
          type: boolean
        enforce_acr_values:
          description: Enforce acr values
          type: boolean
        enforce_application_membership_default:
          description: 'Default value stamped onto the enforce_application_membership toggle of applications created in

            this workspace. Applied at creation only — changing it later does not affect existing applications.

            Disabled by default. Only meaningful while the applications_membership feature is enabled.'
          type: boolean
        ignore_unknown_scopes_for_dcr:
          description: 'Ignore unknown scopes for DCR


            If enabled, an attempt to register or update a client with a scope that does not exist in the server will succeed.'
          type: boolean
        require_request_or_request_uri_parameter:
          description: Require request or request uri parameter for authorization flow
          type: boolean
        return_iss_parameter_in_authorization_response:
          description: Return iss parameter in the authorization response
          type: boolean
        single_audience_equals_issuer_in_authentication_jwts:
          description: Enforces a single-value audience in authentication JWTs sent to the authorization server, matching the server's issuer URL.
          type: boolean
        strict_post_logout_redirect_enforcement:
          description: Disables SSO as a fallback mechanism for post-logout redirect URI validation
          type: boolean
      type: object
