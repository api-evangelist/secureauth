openapi: 3.2.0
info:
  title: Secureauth Servers API
  version: latest
  description: 'Operations tagged servers across 3 of this provider''s published API definitions: secureauth-admin-openapi.yml, secureauth-developer-openapi.yml, secureauth-system-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://localhost:8443/api/admin/default
- url: https://localhost:8443/api/developer/default/developer
- url: https://localhost:8443/api/system/default
tags:
- name: Servers
paths:
  /servers:
    get:
      description: List authorization servers.
      operationId: listAuthorizationServers
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - description: comma separated server types that are to be filtered out
        in: query
        name: server_types
        schema:
          type: string
          default: admin,developer,system,regular,organization
      - description: 'Optional search phrase: server id OR server name substring (case insensitive)

          SearchPhrase'
        in: query
        name: search_phrase
        schema:
          type: string
      - description: 'optional list servers after given id

          AfterServerID'
        in: query
        name: after_server_id
        schema:
          type: string
      - description: 'optional list servers before given id

          BeforeServerID'
        in: query
        name: before_server_id
        schema:
          type: string
      - description: 'optional sort servers by given field

          Sort'
        in: query
        name: sort
        schema:
          type: string
      - description: 'optional order servers by given direction

          Order'
        in: query
        name: order
        schema:
          type: string
      - description: 'optional limit results

          Limit'
        in: query
        name: limit
        schema:
          type: integer
          format: int64
          default: 20
          maximum: 100
          minimum: 1
      responses:
        '200':
          $ref: '#/components/responses/Servers'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: List authorization servers
      tags:
      - Servers
    post:
      description: 'Multiple authorization servers with unique id can be created within a tenant.

        If id and secret are not provided, will be generated.

        Secret if provided must have at least 32 characters.


        You can set what grant types will be supported by authorization server. The defaults are:

        `{"grant_types": ["authorization_code", "implicit", "client_credentials", "refresh_token"]}`


        If jwks keys are not provided explicitly, will be generated based on provided `key_type` algorithm (rsa by default).


        TTLs for tokens and authorization code can be customized. The defaults are:


        `authorization_code_ttl` - 10 minutes

        `access_token_ttl` - 1 hour

        `id_token_ttl` - 1 hour

        `refresh_token_ttl` - 30 days


        If you want to enable dynamic client registration set `{"enable_dynamic_client_registration": true}`.


        If you want to create FAPI read write compliant server set: `{"profiles"": ["fapi_rw"]}`.


        If you want to enforce PKCE set `{"enforce_pkce": true}`.'
      operationId: createAuthorizationServer
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - description: With demo client
        in: query
        name: with_demo_client
        schema:
          type: boolean
      - description: With identity pool
        in: query
        name: with_identity_pool
        schema:
          type: boolean
      - description: With identity pool idp
        in: query
        name: with_identity_pool_idp
        schema:
          type: boolean
      responses:
        '201':
          $ref: '#/components/responses/Server'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '409':
          $ref: '#/components/responses/conflictHTTPError'
        '422':
          $ref: '#/components/responses/unprocessableEntityHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: Create authorization server
      tags:
      - Servers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Server'
    servers:
    - url: https://localhost:8443/api/admin/default
