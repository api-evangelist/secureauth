          items:
            type: string
          minLength: 32
          type: array
        saml_allowed_attributes:
          description: Allowed SAML attributes
          items:
            type: string
          type: array
        saml_idp_accept_acs_from_request:
          description: accept ACS from SamlRequest even if it's not registered in the metadata
          type: boolean
