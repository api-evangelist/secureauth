openapi: 3.2.0
info:
  title: Secureauth Clients API
  version: latest
  description: 'Operations tagged clients across 4 of this provider''s published API definitions: secureauth-admin-openapi.yml, secureauth-developer-openapi.yml, secureauth-public-openapi.yml, secureauth-system-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://localhost:8443/api/admin/default
- url: https://localhost:8443/api/developer/default/developer
- url: https://localhost:8443/default/default
- url: https://localhost:8443/api/system/default
tags:
- name: Clients
paths:
  /clients:
    post:
      description: 'Create an OAuth 2.0 or SAML client application. Specify the required protocol type with the

        `client_type` request body parameter.


        Client must be created under existing tenant and authorization server. Provide the tenant identifier

        as the `{tenantID}` path value, and the authorization server with the `authorization_server_id`

        request body parameter.


        The default values: `client_type`=`oauth2`, `grant_type`=`authorization_code`, `response_type`=`code`,

        `token_endpoint_auth_method`=`client_secret_basic`.'
      operationId: createClient
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - in: query
        name: application_purpose
        schema:
          type: string
      responses:
        '201':
          $ref: '#/components/responses/ClientAdminResponse'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '409':
          $ref: '#/components/responses/conflictHTTPError'
        '422':
          $ref: '#/components/responses/unprocessableEntityHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: Create OAuth/SAML client
      tags:
      - Clients
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClientAdminRequest'
    get:
      description: List clients owner by developer.
      operationId: listClientsForDeveloper
      responses:
        '200':
          $ref: '#/components/responses/ListClientDeveloperAPIResponse'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - developer: []
      summary: List clients
      tags:
      - Clients
    servers:
    - url: https://localhost:8443/api/admin/default
  /clients/{cid}:
    delete:
      description: Delete client.
      operationId: deleteClient
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - description: Client id
        in: path
        name: cid
        required: true
        schema:
          type: string
          default: default
      responses:
        '204':
          description: ' Client has been deleted'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: Delete client
      tags:
      - Clients
    get:
      description: If client has been created by a developer, client's secret will be empty.
      operationId: getClient
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - description: Client id
        in: path
        name: cid
        required: true
        schema:
          type: string
          default: default
      responses:
        '200':
          $ref: '#/components/responses/ClientAdminResponse'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: Get client
      tags:
      - Clients
    put:
      description: 'Update client.


        For clients created by developers only metadata, system and trusted attributes

        can be updated.'
      operationId: updateClient
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - description: Client id
        in: path
        name: cid
        required: true
        schema:
          type: string
          default: default
      responses:
        '200':
          $ref: '#/components/responses/ClientAdminResponse'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '422':
          $ref: '#/components/responses/unprocessableEntityHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: Update client
      tags:
      - Clients
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClientAdminRequest'
    servers:
    - url: https://localhost:8443/api/admin/default
  /clients/{cid}/revokeDcrAccess:
    post:
      description: 'Revokes all access tokens and refresh tokens for the specified

        dynamically-registered client across all subjects. By default also deletes

        scope grants and claim grants for that client; set preserve_scope_grants

        or preserve_claim_grants to true to keep them. The OAuth client record

        itself is preserved.


        Returns 400 if the client is not dynamically registered.'
      operationId: revokeDcrAccess
      parameters:
      - description: Client id
        in: path
        name: cid
        required: true
        schema:
          type: string
      responses:
        '204':
          description: ' Client access has been revoked'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: Revoke access for a DCR-registered client
      tags:
      - Clients
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeDcrAccessBody'
    servers:
    - url: https://localhost:8443/api/admin/default
  /clients/{cid}/revokeRotatedSecrets:
    post:
      description: Revoke all rotated client's secrets.
      operationId: revokeRotatedClientSecrets
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - description: Client id
        in: path
        name: cid
        required: true
        schema:
          type: string
          default: default
      responses:
        '204':
          description: ' all client''s rotated secrets has been revoked'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: Revoke rotated secrets
      tags:
      - Clients
    servers:
    - url: https://localhost:8443/api/admin/default
  /clients/{cid}/rotateSecret:
    post:
      description: 'Generate a new client secret, move old secret to rotated secrets list and return

        new client secret as a response. The max number of client rotated secrets is 2.

        The rotated secrets over the limit are dropped.


        It is possible to set expiration time for rotated secrets. When the `AutoRevokeAfter` parameter

        is set to a value greater than zero, rotated secrets that reach their expiry time are revoked.

        The `AutoRevokeAfter` parameter accepts values in the go-openapi duration format, for example,

        `1s`, `5m`, `2h`.'
      operationId: rotateClientSecret
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - description: Client id
        in: path
        name: cid
        required: true
        schema:
          type: string
          default: default
      - description: Auto revoke after
        in: query
        name: auto_revoke_after
        schema:
          type: string
          default: '0'
      responses:
        '200':
          $ref: '#/components/responses/RotateClientSecretResponse'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: Rotate client's secret
      tags:
      - Clients
    servers:
    - url: https://localhost:8443/api/admin/default
  /clients/{cid}/saml/metadata:
    get:
      operationId: getClientSAMLMetadata
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - description: Client id
        in: path
        name: cid
        required: true
        schema:
          type: string
          default: default
      responses:
        '200':
          $ref: '#/components/responses/SAMLClientMetadataResponse'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: Get saml metadata
      tags:
      - Clients
    servers:
    - url: https://localhost:8443/api/admin/default
  /clients/{cid}/saml/metadata/import/file:
    post:
      operationId: importSAMLMetadataFromFile
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - description: Client id
        in: path
        name: cid
        required: true
        schema:
          type: string
          default: default
      responses:
        '204':
          description: ' metadata has been successfully imported'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '409':
          $ref: '#/components/responses/conflictHTTPError'
        '422':
          $ref: '#/components/responses/unprocessableEntityHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: Import saml metadata from file
      tags:
      - Clients
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
    servers:
    - url: https://localhost:8443/api/admin/default
  /clients/{cid}/saml/metadata/import/manual:
    post:
      operationId: importSAMLMetadataManually
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - description: Client id
        in: path
        name: cid
        required: true
        schema:
          type: string
          default: default
      responses:
        '204':
          description: ' metadata has been successfully imported'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '409':
          $ref: '#/components/responses/conflictHTTPError'
        '422':
          $ref: '#/components/responses/unprocessableEntityHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: Set saml metadata manually
      tags:
      - Clients
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportSAMLMetadataManuallyRequest'
    servers:
    - url: https://localhost:8443/api/admin/default
  /clients/{cid}/saml/metadata/import/text:
    post:
      operationId: importSAMLMetadataFromText
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - description: Client id
        in: path
        name: cid
        required: true
        schema:
          type: string
          default: default
      responses:
        '204':
          description: ' metadata has been successfully imported'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '409':
          $ref: '#/components/responses/conflictHTTPError'
        '422':
          $ref: '#/components/responses/unprocessableEntityHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: Import saml metadata from text
      tags:
      - Clients
      requestBody:
        content:
          application/xml:
            schema:
              type: string
    servers:
    - url: https://localhost:8443/api/admin/default
  /clients/{cid}/saml/metadata/import/url:
    post:
      operationId: importSAMLMetadataFromURL
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - description: Client id
        in: path
        name: cid
        required: true
        schema:
          type: string
          default: default
      responses:
        '204':
          description: ' metadata has been successfully imported'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '409':
          $ref: '#/components/responses/conflictHTTPError'
        '422':
          $ref: '#/components/responses/unprocessableEntityHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: Import saml metadata from url
      tags:
      - Clients
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                url:
                  type: string
    servers:
    - url: https://localhost:8443/api/admin/default
  /clients/parse-certificate:
    post:
      description: 'Parse certificate in PEM format.

        Returns certificate in JWKS format and additional details about subject DN and SAN entries.'
      operationId: parseCertificate
      responses:
        '200':
          description: CertificateInfo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateInfo'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: Parse certificate in PEM format
      tags:
      - Clients
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
    servers:
    - url: https://localhost:8443/api/admin/default
  /servers/{wid}/clients:
    get:
      description: Returns clients created by admins and developers. If client has been created by a developer, client secret will be empty.
      operationId: listClients
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - description: Authorization server id
        in: path
        name: wid
        required: true
        schema:
          type: string
          default: default
      - description: 'Optional search phrase: client id OR client name substring

          SearchPhrase'
        in: query
        name: search_phrase
        schema:
          type: string
      - description: 'Optional type, one of: internal, third_party

          Type'
        in: query
        name: type
        schema:
          type: string
      - description: 'Optional application types

          ApplicationTypes'
        in: query
        name: application_types
        schema:
          type: string
      - description: Optional client types (oauth2, saml)
        in: query
        name: client_types
        schema:
          type: string
      - description: 'optional list clients after given id

          AfterClientID'
        in: query
        name: after_client_id
        schema:
          type: string
      - description: 'optional list clients before given id

          BeforeClientID'
        in: query
        name: before_client_id
        schema:
          type: string
      - description: 'optional sort clients by given field, one of: name, client_id, issued_at, updated_at

          Sort'
        in: query
        name: sort
        schema:
          type: string
      - description: 'optional order clients by given direction

          Order'
        in: query
        name: order
        schema:
          type: string
      - description: 'optional limit results

          Limit'
        in: query
        name: limit
        schema:
          type: integer
          format: int64
          default: 20
          maximum: 100
          minimum: 1
      responses:
        '200':
          $ref: '#/components/responses/ClientsForAdminResponse'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: List clients
      tags:
      - Clients
    servers:
    - url: https://localhost:8443/api/admin/default
  /client/{cid}:
    delete:
      description: Delete client.
      operationId: deleteClientByCid
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - description: Client id
        in: path
        name: cid
        required: true
        schema:
          type: string
          default: default
      responses:
        '204':
          description: ' Client has been deleted'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - system:
        - manage_clients
      summary: Delete client
      tags:
      - Clients
      x-operation-id-source: normalized
      x-operation-id-original: deleteClient
    get:
      description: If client has been created by a developer, client's secret will be empty.
      operationId: getClientByCid
      parameters:
      - description: Client id
        in: path
        name: cid
        required: true
        schema:
          type: string
          default: default
      responses:
        '200':
