      - result
      - session_id
      title: 'WebAuthnLoginBeginData wraps the standard PublicKeyCredentialRequestOptions with a

        session_id that the client must echo back at complete time. The session_id keys the

        stored challenge so concurrent begins from different users (or the same user across

        tabs/integrations) do not overwrite each other — this is what the cookie store does

