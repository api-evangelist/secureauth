        type:
          enum:
          - regular
          - discoverable
          type: string
      required:
      - new_webauthn
      type: object
    PRFInputs:
      description: 'Every member is optional. A zero value is the bare availability probe, i.e. the "prf":{} input a Relying Party

        sends at registration to learn whether the pseudo-random function is available for the credential; the client

        answers with the ''enabled'' output. This is why [AuthenticationExtensions.PRF] is a pointer while its

        [LargeBlobInputs] and [HMACGetSecretInputs] siblings are not.


        EvalByCredential is only valid during authentication; the client throws a NotSupportedError when it is present

        during registration. Its keys are base64url encoded credential IDs which MUST each match an entry of the

        allowed credentials.


        Specification: §10.1.4. Pseudo-random function extension (https://www.w3.org/TR/webauthn-3/#prf-extension)'
      properties:
        eval:
          $ref: '#/components/schemas/PRFValues'
        evalByCredential:
          additionalProperties:
            $ref: '#/components/schemas/PRFValues'
          type: object
      title: PRFInputs represents the AuthenticationExtensionsPRFInputsJSON IDL.
      type: object
    PublicKeyCredentialHints:
      description: 'The IDL types the hints member as a sequence of strings rather than as this enumeration, and requires clients to

        ignore values they do not recognise, so values are deliberately not validated against the constants below: a

        Relying Party may send a hint ratified after this release, or one a particular user agent understands. Clients

        also ignore the second and later appearances of a repeated hint.


        Hints may contradict the authenticator attachment and the transports of the allowed credentials. Where they do,

        a client which implements hints gives the hints precedence; see

        [PublicKeyCredentialHints.AuthenticatorAttachment] for how a registration ceremony pairs the two for the benefit

        of clients which do not.


        WebAuthn Level 3.


        Specification: §5.8.7. User-agent Hints Enumeration (https://www.w3.org/TR/webauthn-3/#enum-hints)'
      title: 'PublicKeyCredentialHints represents an entry of the hints member, which conveys the Relying Party''s belief about

        how the user will satisfy the request, in descending order of preference.'
      type: string
    RelyingPartyEntity:
      description: 'Specification: §5.4.2. Relying Party Parameters for Credential Generation (https://www.w3.org/TR/webauthn/#dictionary-rp-credential-params)'
      properties:
        id:
          description: A unique identifier for the Relying Party entity, which sets the RP ID.
          type: string
        name:
          description: 'A human-palatable name for the entity. Its function depends on what the PublicKeyCredentialEntity represents:


            When inherited by PublicKeyCredentialRpEntity it is a human-palatable identifier for the Relying Party,

            intended only for display. For example, "ACME Corporation", "Wonderful Widgets, Inc." or "ОАО Примертех".


            When inherited by PublicKeyCredentialUserEntity, it is a human-palatable identifier for a user account. It is

            intended only for display, i.e., aiding the user in determining the difference between user accounts with similar

            displayNames. For example, "alexm", "alex.p.mueller@example.com" or "+14255551234".'
          type: string
      title: 'The RelyingPartyEntity represents the PublicKeyCredentialRpEntity IDL and is used to supply additional Relying Party

        attributes when creating a new credential.'
      type: object
    CredentialCreationResponse:
      description: 'Specification: §5.4. Options for Credential Creation (https://www.w3.org/TR/webauthn/#sctn-credentialcreationoptions-extension)'
      properties:
        authenticatorAttachment:
          type: string
        clientExtensionResults:
          $ref: '#/components/schemas/AuthenticationExtensionsClientOutputs'
        id:
          description: 'ID is The credential’s identifier. The requirements for the

            identifier are distinct for each type of credential. It might

            represent a username for username/password tuples, for example.'
          type: string
        rawId:
          $ref: '#/components/schemas/URLEncodedBase64'
        response:
          $ref: '#/components/schemas/AuthenticatorAttestationResponse'
        type:
          description: 'Type is the value of the object’s interface object''s [[type]] slot,

            which specifies the credential type represented by this object.

            This should be type "public-key" for Webauthn credentials.'
          type: string
      required:
      - id
      - rawId
      - response
      - type
      title: 'CredentialCreationResponse is the raw response returned to the Relying Party from the client for a credential

        registration ceremony. It contains the [AuthenticatorAttestationResponse] which holds the attestation object

        and client data.'
      type: object
