    AuthenticationExtensionsClientOutputs:
      description: 'Every modelled member is a pointer so an absent value is distinguishable from a false or empty one; the

        unsolicited output check performed by [AuthenticationExtensionsClientOutputs.Verify] depends on that distinction.


        A JSON member whose key matches a modelled name only by case (e.g. "AppID" for "appid") is bound to that

        modelled field, not collected into [AuthenticationExtensionsClientOutputs.Extra]: encoding/json resolves the

        case-insensitive match during the first decoding pass, before UnmarshalJSON ever sees the untyped member map. If

        such a member''s value has the wrong type for the modelled field, unmarshalling fails outright rather than

        falling back to Extra. encoding/json (v1, the only version this module may use) offers no way to defer that

        binding.


        Specification: §5.9. Authentication Extensions Client Outputs (https://www.w3.org/TR/webauthn-3/#iface-authentication-extensions-client-outputs)'
      properties:
        appid:
          description: AppID indicates the FIDO AppID Extension was acted upon.
          type: boolean
        appidExclude:
          description: AppIDExclude indicates the FIDO AppID Exclusion Extension was acted upon.
          type: boolean
        credProps:
          $ref: '#/components/schemas/CredentialPropertiesOutput'
        hmacCreateSecret:
          description: HMACCreateSecret indicates the CTAP hmac-secret was provisioned at registration.
          type: boolean
        hmacGetSecret:
          $ref: '#/components/schemas/HMACGetSecretOutputs'
        largeBlob:
          $ref: '#/components/schemas/LargeBlobOutputs'
        prf:
          $ref: '#/components/schemas/PRFOutputs'
        remoteClientDataJSON:
          description: 'RemoteClientDataJSON indicates the Remote Client Data JSON Extension was acted upon, which means the local

            client delegated every Relying Party ID and origin check to a remote host. See

            [ExtensionRemoteClientDataJSON], which records that this extension is not yet ratified.'
          type: boolean
      title: 'AuthenticationExtensionsClientOutputs represents the AuthenticationExtensionsClientOutputs IDL, returned by the

        client after a create() or get() call.'
      type: object
    LargeBlobInputs:
      description: 'Specification: §10.1.5. Large blob storage extension (https://www.w3.org/TR/webauthn-3/#sctn-large-blob-extension)'
      properties:
        read:
          type: boolean
        support:
          $ref: '#/components/schemas/LargeBlobSupport'
        write:
          $ref: '#/components/schemas/URLEncodedBase64'
      title: 'LargeBlobInputs represents the AuthenticationExtensionsLargeBlobInputsJSON IDL. Support is only valid during

        registration; Read and Write are only valid during authentication and are mutually exclusive.'
      type: object
    SelfUserWithData:
      properties:
        business_metadata:
          additionalProperties:
            type: object
          type: object
        id:
          format: userID
          type: string
        identifiers:
          items:
