    ResidentKeyRequirement:
      description: 'This enumeration’s values describe the Relying Party''s requirements for client-side discoverable credentials

        (formerly known as resident credentials or resident keys).


        Specifies the extent to which the Relying Party desires to create a client-side discoverable credential. For

        historical reasons the naming retains the deprecated “resident” terminology. The value SHOULD be a member of

        ResidentKeyRequirement but client platforms MUST ignore unknown values, treating an unknown value as if the member

        does not exist. If no value is given then the effective value is required if requireResidentKey is true or

        discouraged if it is false or absent.


        Specification: §5.4.4. Authenticator Selection Criteria (https://www.w3.org/TR/webauthn/#dom-authenticatorselectioncriteria-residentkey)


        Specification: §5.4.6. Resident Key Requirement Enumeration (https://www.w3.org/TR/webauthn/#enumdef-residentkeyrequirement)'
      title: ResidentKeyRequirement represents the IDL of the same name.
      type: string
    AuthenticationExtensions:
      description: 'Members are marshalled in the AuthenticationExtensionsClientInputsJSON form, i.e. buffer sources are base64url

        encoded strings, which is the form consumed by PublicKeyCredential.parseCreationOptionsFromJSON().


        A JSON member whose key matches a modelled name only by case (e.g. "CredProps" for "credProps") is bound to that

        modelled field, not collected into [AuthenticationExtensions.Extra]: encoding/json resolves the case-insensitive

        match during the first decoding pass, before UnmarshalJSON ever sees the untyped member map. If such a member''s

        value has the wrong type for the modelled field, unmarshalling fails outright rather than falling back to Extra.

        encoding/json (v1, the only version this module may use) offers no way to defer that binding.


        Specification: §5.7.1. Authentication Extensions Client Inputs (https://www.w3.org/TR/webauthn-3/#iface-authentication-extensions-client-inputs)


        Specification: §10.1. Client Extensions (https://www.w3.org/TR/webauthn-3/#sctn-defined-client-extensions)'
      properties:
        appid:
          description: AppID is the FIDO AppID Extension input. Authentication only.
          type: string
        appidExclude:
          description: AppIDExclude is the FIDO AppID Exclusion Extension input. Registration only.
          type: string
        credBlob:
          $ref: '#/components/schemas/URLEncodedBase64'
        credProps:
          description: CredProps requests the Credential Properties Extension. Registration only.
          type: boolean
        credentialProtectionPolicy:
          $ref: '#/components/schemas/CredentialProtectionPolicy'
        enforceCredentialProtectionPolicy:
          description: EnforceCredentialProtectionPolicy requires the credProtect policy is honoured. Registration only.
          type: boolean
        getCredBlob:
          description: GetCredBlob requests the blob stored with the credential. Authentication only.
          type: boolean
        hmacCreateSecret:
          description: HMACCreateSecret requests provisioning of the CTAP hmac-secret. Registration only.
          type: boolean
        hmacGetSecret:
          $ref: '#/components/schemas/HMACGetSecretInputs'
        largeBlob:
          $ref: '#/components/schemas/LargeBlobInputs'
        minPinLength:
          description: MinPinLength requests the authenticator minimum PIN length. Registration only.
          type: boolean
        prf:
          $ref: '#/components/schemas/PRFInputs'
        remoteClientDataJSON:
          description: 'RemoteClientDataJSON is the Remote Client Data JSON Extension input. This member is set by a remote desktop

            web client and a Relying Party should not normally set it. See [ExtensionRemoteClientDataJSON], which records

            that this extension is not yet ratified.'
          type: string
        uvm:
          description: UVM requests the user verification methods used for the operation.
          type: boolean
      title: 'AuthenticationExtensions represents the AuthenticationExtensionsClientInputs IDL. It contains additional

        parameters requesting additional processing by the client and authenticator.'
      type: object
    UserVerificationRequirement:
      description: 'A WebAuthn Relying Party may require user verification for some of its operations but not for others,

        and may use this type to express its needs.


        Specification: §5.8.6. User Verification Requirement Enumeration (https://www.w3.org/TR/webauthn/#enum-userVerificationRequirement)'
      title: UserVerificationRequirement is a representation of the UserVerificationRequirement IDL enum.
      type: string
    UserEntity:
      description: 'Specification: §5.4.3 User Account Parameters for Credential Generation (https://www.w3.org/TR/webauthn/#dictdef-publickeycredentialuserentity)'
      properties:
        displayName:
          description: 'A human-palatable name for the user account, intended only for display.

            For example, "Alex P. Müller" or "田中 倫". The Relying Party SHOULD let

            the user choose this, and SHOULD NOT restrict the choice more than necessary.'
          type: string
        id:
          description: 'ID is the user handle of the user account entity. To ensure secure operation,

            authentication and authorization decisions MUST be made on the basis of this id

            member, not the displayName nor name members. See Section 6.1 of

            [RFC8266](https://www.w3.org/TR/webauthn/#biblio-rfc8266).'
          type: object
        name:
          description: 'A human-palatable name for the entity. Its function depends on what the PublicKeyCredentialEntity represents:


            When inherited by PublicKeyCredentialRpEntity it is a human-palatable identifier for the Relying Party,

            intended only for display. For example, "ACME Corporation", "Wonderful Widgets, Inc." or "ОАО Примертех".


            When inherited by PublicKeyCredentialUserEntity, it is a human-palatable identifier for a user account. It is

            intended only for display, i.e., aiding the user in determining the difference between user accounts with similar

            displayNames. For example, "alexm", "alex.p.mueller@example.com" or "+14255551234".'
          type: string
      title: 'The UserEntity represents the PublicKeyCredentialUserEntity IDL and is used to supply additional user account

        attributes when creating a new credential.'
      type: object
    AuthenticationMechanisms:
      items:
        enum:
        - totp
        - password
