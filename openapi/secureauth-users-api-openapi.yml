          type: array
      type: object
    PRFOutputs:
      description: 'Specification: §10.1.4. Pseudo-random function extension (https://www.w3.org/TR/webauthn-3/#prf-extension)'
      properties:
        enabled:
          description: 'Enabled reports whether the pseudo-random function is available for the credential. It is the answer to the

            bare "prf":{} input a Relying Party sends at registration. A false value is meaningful and distinct from

            the client not reporting availability at all.'
          type: boolean
        results:
          $ref: '#/components/schemas/PRFValues'
      title: PRFOutputs represents the AuthenticationExtensionsPRFOutputsJSON IDL.
      type: object
    ConveyancePreference:
      description: 'WebAuthn Relying Parties may use AttestationConveyancePreference to specify their preference regarding attestation

        conveyance during credential generation.


        Specification: §5.4.7. Attestation Conveyance Preference Enumeration (https://www.w3.org/TR/webauthn/#enum-attestation-convey)'
      title: ConveyancePreference is the type representing the AttestationConveyancePreference IDL.
      type: string
    SetTotpSecret:
      properties:
        new_totp_secret:
          type: string
      required:
      - new_totp_secret
      type: object
    PublicKeyCredentialCreationOptions:
      description: 'In order to create a Credential via create(), the caller specifies a few parameters in a

        PublicKeyCredentialCreationOptions object.


        WebAuthn Level 3: hints,attestationFormats.


        Specification: §5.4. Options for Credential Creation (https://www.w3.org/TR/webauthn/#dictionary-makecredentialoptions)'
      properties:
        attestation:
          $ref: '#/components/schemas/ConveyancePreference'
        attestationFormats:
          items:
            $ref: '#/components/schemas/AttestationFormat'
          type: array
        authenticatorSelection:
          $ref: '#/components/schemas/AuthenticatorSelection'
        challenge:
          $ref: '#/components/schemas/URLEncodedBase64'
        excludeCredentials:
          items:
            $ref: '#/components/schemas/CredentialDescriptor'
          type: array
        extensions:
          $ref: '#/components/schemas/AuthenticationExtensions'
        hints:
          items:
            $ref: '#/components/schemas/PublicKeyCredentialHints'
          type: array
        pubKeyCredParams:
          items:
            $ref: '#/components/schemas/CredentialParameter'
          type: array
        rp:
          $ref: '#/components/schemas/RelyingPartyEntity'
        timeout:
          format: int64
          type: integer
        user:
          $ref: '#/components/schemas/UserEntity'
      title: PublicKeyCredentialCreationOptions represents the IDL of the same name.
      type: object
    LargeBlobSupport:
      description: 'Specification: §10.1.5. Large blob storage extension (https://www.w3.org/TR/webauthn-3/#sctn-large-blob-extension)'
      title: 'LargeBlobSupport represents the LargeBlobSupport IDL enumeration used by the large blob storage extension during

        registration.'
      type: string
    ChangePassword:
      properties:
        new_password:
          type: string
        old_password:
