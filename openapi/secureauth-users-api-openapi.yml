      title: 'PRFValues represents the AuthenticationExtensionsPRFValuesJSON IDL. The byte values are conveyed to the client

        base64url encoded.'
      type: object
    CredentialDescriptor:
      description: 'This dictionary contains the attributes that are specified by a caller when referring to a public key credential as

        an input parameter to the create() or get() methods. It mirrors the fields of the PublicKeyCredential object returned

        by the latter methods.


        Specification: §5.10.3. Credential Descriptor (https://www.w3.org/TR/webauthn/#credential-dictionary)'
      properties:
        id:
          $ref: '#/components/schemas/URLEncodedBase64'
        transports:
          description: The authenticator transports that can be used.
          items:
            $ref: '#/components/schemas/AuthenticatorTransport'
          type: array
        type:
          $ref: '#/components/schemas/CredentialType'
      title: CredentialDescriptor represents the PublicKeyCredentialDescriptor IDL.
      type: object
    HMACGetSecretOutputs:
      description: 'Registry: https://www.iana.org/assignments/webauthn/webauthn.xhtml'
      properties:
        output1:
          $ref: '#/components/schemas/URLEncodedBase64'
        output2:
          $ref: '#/components/schemas/URLEncodedBase64'
      title: HMACGetSecretOutputs represents the outputs of the CTAP hmac-secret extension during authentication.
      type: object
    FederatedAccount:
      properties:
        federated_idp_id:
          format: idpID
          type: string
        federated_idp_method:
          type: string
        federated_idp_name:
          type: string
        federated_sub:
          type: string
        identifier_id:
          type: string
