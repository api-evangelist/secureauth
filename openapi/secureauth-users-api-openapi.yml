openapi: 3.2.0
info:
  title: Secureauth Users API
  version: latest
  description: 'Operations tagged Users across 3 of this provider''s published API definitions: secureauth-identity-openapi.yml, secureauth-identityself-openapi.yml, secureauth-identitysystem-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://localhost:8443/api/identity/default
- url: https://localhost:8443/default/default/identity
tags:
- name: Users
paths:
  /admin/pools/{ipID}/users:
    get:
      description: 'Retrieve the list of users from the specified identity pool.


        Results are sorted by user ID. No other sorting is supported.'
      operationId: listUsers
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - in: path
        name: ipID
        required: true
        schema:
          type: string
      - description: 'optional list users after given id

          AfterUserID'
        in: query
        name: after_user_id
        schema:
          type: string
      - description: 'optional list users before given id

          BeforeUserID'
        in: query
        name: before_user_id
        schema:
          type: string
      - description: 'optional sort clients by given field

          Sort'
        in: query
        name: sort
        schema:
          type: string
      - description: 'optional order clients by given direction

          Order'
        in: query
        name: order
        schema:
          type: string
      - description: 'optional limit results

          Limit'
        in: query
        name: limit
        schema:
          type: integer
          format: int64
          default: 20
          maximum: 100
          minimum: 1
      - description: 'optional query filter

          query is in json format like {"user_key":"john"} - parameter must be url-encoded

          supported parameters

          `user_key` - limits user set to users that has identifier starting or ending with provided user_key or has verified address starting or ending with provided user_key or their ID is equal to provided user_key

          `payload` - limits user set to users with payload matches provided metadata - for simple values it does exact match, for arrays it does `contain`

          `metadata` - limits user set to users with metadata matches provided metadata - for simple values it does exact match, for arrays it does `contain`

          if multiple parameters provided it does logical AND between the results so users must match ALL parameters'
        in: query
        name: query
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/UsersResponse'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '422':
          $ref: '#/components/responses/unprocessableEntityHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: List Users
      tags:
      - Users
    post:
      description: 'Create a user with extended data.


        Any status and set of identifiers, addresses, and credentials are allowed.

        If credential of type password is provided it can be marked as must_be_changed which forces user to change its password upon first login.


        When no `payload_schema_id` or `metadata_schema_id` are provided, the default values are taken from the

        specified Identity Pool.


        Payload and metadata must match the specified schema.


        The response contains an extended view on user entry.


        To retrieve a user entry without user creation, call the **Get User Details** endpoint.'
      operationId: createUser
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - in: path
        name: ipID
        required: true
        schema:
          type: string
      responses:
        '201':
          $ref: '#/components/responses/AdminUserResponse'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '409':
          $ref: '#/components/responses/conflictHTTPError'
        '422':
          $ref: '#/components/responses/unprocessableEntityHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: Create User Account
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUserPayload'
    servers:
    - url: https://localhost:8443/api/identity/default
  /admin/pools/{ipID}/users/{userID}:
    delete:
      description: Remove a record about a user account in the specified identity pool.
      operationId: deleteUser
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - in: path
        name: ipID
        required: true
        schema:
          type: string
      - in: path
        name: userID
        required: true
        schema:
          type: string
      responses:
        '204':
          description: ' User has been deleted'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: Delete User Account
      tags:
      - Users
    get:
      description: 'Retrieve an extended information about a user record.


        The response contains user''s basic details, payload, and metadata, as well as all their identifiers,

        addresses, and blurred credentials.'
      operationId: getUser
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - in: path
        name: ipID
        required: true
        schema:
          type: string
      - in: path
        name: userID
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/AdminUserResponse'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: Get User Details
      tags:
      - Users
    patch:
      description: 'Patch operates on the same fields as the **Update User Record** endpoint.


        example for RFC6902:

        [{"op": "replace", "path": "/payload/first_name", "value": "John"}]


        example for RFC7396:

        {"payload": {"first_name": "John"}}'
      operationId: patchUser
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - in: path
        name: ipID
        required: true
        schema:
          type: string
      - in: path
        name: userID
        required: true
        schema:
          type: string
      - description: RFC version
        in: query
        name: rfc_version
        schema:
          type: string
          enum:
          - '6902'
          - '7396'
          default: '7396'
      responses:
        '200':
          $ref: '#/components/responses/AdminUserResponse'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '422':
          $ref: '#/components/responses/unprocessableEntityHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: Patches existing User (supports both RFC6902 and RFC7396 JSON Patch)
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              type: object
        description: Patch spec in format matching RFC Version
    put:
      description: 'Update the basic set of user data: payload, metadata, schemas, and status. Provide the required values for the fields

        you need to update. Fields (top level elements like `status`, `payload` etc.) with no values are skipped for the update (not removed nor cleared).


        The fields to be updated are overridden.


        Any `payload` / `metadata` and `payload_schema_id` / `metadata_schema_id` values passed must be mutually relevant.


        To retrieve a user entry without updating their record, call the **Get User Details** endpoint.


        Please notice that `deleted` status may be used as soft-delete but does not have any special meaning in the

        system besides it does not allow such user to authenticate.'
      operationId: updateUser
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - in: path
        name: ipID
        required: true
        schema:
          type: string
      - in: path
        name: userID
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/AdminUserResponse'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '409':
          $ref: '#/components/responses/conflictHTTPError'
        '422':
          $ref: '#/components/responses/unprocessableEntityHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: Update User Record
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUser'
    servers:
    - url: https://localhost:8443/api/identity/default
  /admin/pools/{ipID}/users/{userID}/activation/send:
    post:
      description: 'Send an activation message to the user''s provided address.


        When no `address` is provided in the request body, the message is sent to the address saved for this user (if there

        is only one address).


        The request fails upon the following:


        • `address` is not provided and user has no addresses or more than one.


        • `address` is someone else''s verified address or identifier.


        • The user''s `status` is not `new`.


        This request invalidates any previously generated OTPs for user account activation.


        When `code_type_in_message=link` or no value is provided for it, an activation link is generated.


        Activation message validity period is configured in the identity pool settings.


        ❕ REFACTORED: `identifier` is renamed to `address` in the request body. For backward compatibility, the both

        fields are available. If `identifier` is not empty, it overrides the `address` value.'
      operationId: sendActivationMessage
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - in: path
        name: ipID
        required: true
        schema:
          type: string
      - in: path
        name: userID
        required: true
        schema:
          type: string
      - description: Code type in message
        in: query
        name: code_type_in_message
        schema:
          type: string
          enum:
          - link
          - code
          default: link
      - description: 'optional server''s identifier (used for themes etc.)

          ServerID'
        in: query
        name: server_id
        schema:
          type: string
      - description: 'optional URL where user will be asked to sign in after successful activation

          PostActivationURL'
        in: query
        name: post_activation_url
        schema:
          type: string
      - description: 'optional mode

          Mode'
        in: query
        name: mode
        schema:
          type: string
          enum:
          - registration
          - invitation
          default: registration
      responses:
        '204':
          description: ' Activation message sent'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '422':
          $ref: '#/components/responses/unprocessableEntityHTTPError'
      security:
      - admin: []
      summary: Send Activation Message
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestActivation'
    servers:
    - url: https://localhost:8443/api/identity/default
