openapi: 3.2.0
info:
  description: 'SecureAuth Identity API


    It is important for clients to note that most APIs return the `ETag` response header.'
  title: SecureAuth Mfa API
  version: latest
servers:
- url: https://localhost:8443/default/default/identity
tags:
- name: MFA
paths:
  /v2/self/mfa/sessions:
    get:
      description: user MFA sessions.
      operationId: listUserMFASessions
      responses:
        '200':
          $ref: '#/components/responses/ListUserMFASessions'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - self:
        - view_ss_profile
      summary: Lists user MFA sessions
      tags:
      - MFA
  /v2/self/mfa/sessions/{mfaSessionID}:
    delete:
      operationId: deleteMFASession
      parameters:
      - description: MFA session id
        in: path
        name: mfaSessionID
        required: true
        schema:
          type: string
          default: default
      responses:
        '204':
          description: ' MFA session has been deleted'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - self:
        - manage_ss_profile
      summary: Delete user MFA session
      tags:
      - MFA
components:
  responses:
    forbiddenHTTPError:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    notFoundHTTPError:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    unauthorizedHTTPError:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ListUserMFASessions:
      description: User MFA sessions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ListUserMFASessions'
    tooManyRequestsHTTPError:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    UserMFASession:
      properties:
        id:
          description: Session id
          type: string
        ip_address:
          description: IP address of the user who created the session
          type: string
        issue_time:
          description: Time when the session was issued
          format: date-time
          type: string
        user_agent:
          description: User agent of the user who created the session
          type: string
      type: object
    Error:
      description: HTTP error response
      properties:
        details:
          type: object
        error:
          type: string
        error_code:
          type: string
        status_code:
          format: int64
          type: integer
      type: object
    ListUserMFASessions:
      properties:
        sessions:
          items:
            $ref: '#/components/schemas/UserMFASession'
          type: array
      type: object
  securitySchemes:
    self:
      type: oauth2
      flows:
        authorizationCode:
          scopes:
            manage_ss_profile: manage_ss_profile
            view_ss_profile: view_ss_profile
          authorizationUrl: /default/default/oauth2/authorize
          tokenUrl: /default/default/oauth2/token
