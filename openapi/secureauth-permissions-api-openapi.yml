openapi: 3.2.0
info:
  title: Secureauth Permissions API
  version: latest
  description: 'Operations tagged permissions across 3 of this provider''s published API definitions: secureauth-admin-openapi.yml, secureauth-identity-openapi.yml, secureauth-permissions-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://localhost:8443/api/admin/default
- url: https://localhost:8443/api/identity/default
- url: https://localhost:8443/api/permissions/default
tags:
- name: Permissions
paths:
  /servers/{wid}/permissions:
    get:
      description: Check my permissions for this workspace.
      operationId: checkWorkspacePermissions
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - description: Workspace id
        in: path
        name: wid
        required: true
        schema:
          type: string
          default: default
      responses:
        '200':
          $ref: '#/components/responses/WorkspacePermissionsResponse'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: Check workspace permissions
      tags:
      - Permissions
    servers:
    - url: https://localhost:8443/api/admin/default
  /tenant/permissions:
    get:
      description: Check my permissions for this tenant.
      operationId: checkTenantPermissions
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/TenantPermissionsResponse'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: Check tenant permissions
      tags:
      - Permissions
    servers:
    - url: https://localhost:8443/api/admin/default
  /admin/pools/{ipID}/permissions:
    get:
      description: 'Check permissions granted to the current administrator relating to the identity pool specified.


        Pass the required identity pool identifier as the value of the `ipID` path parameter.


        For authorization, include the `if-match` header with the ETag value.'
      operationId: checkPoolPermissions
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - in: path
        name: ipID
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/PoolPermissionsResponse'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: Check Identity Pool Permissions
      tags:
      - Permissions
    servers:
    - url: https://localhost:8443/api/identity/default
  /system/systems/{psID}/check:
    post:
      description: Check permission.
      operationId: checkPermission
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
