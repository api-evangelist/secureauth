        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '409':
          $ref: '#/components/responses/conflictHTTPError'
        '412':
          $ref: '#/components/responses/preconditionFailedHTTPError'
        '422':
          $ref: '#/components/responses/unprocessableEntityHTTPError'
      security:
      - system:
        - identity
      summary: Complete Address Verification
      tags:
      - OTP
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteAddressVerification'
      x-operation-id-source: normalized
      x-operation-id-original: completeAddressVerification
    servers:
    - url: https://localhost:8443/api/identity/default
  /system/pools/{ipID}/users/{userID}/address/verification/request:
    post:
      description: 'Generate and send a verification code to the provided address.

        The `address` value must be a valid email or mobile number marked as the user''s `unverified address`.


        Also, this value must not be a verified address of any other user. Otherwise, the request returns the

        verification link and runs protection for email or mobile enumeration for the address specified.


        The requested code validity period is configured in the identity pool settings.'
      operationId: postSystemPoolsByIpIDUsersByUserIDAddressVerificationRequest
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - in: path
        name: ipID
        required: true
        schema:
          type: string
      - in: path
        name: userID
        required: true
        schema:
          type: string
      - description: Code type in message
        in: query
        name: code_type_in_message
        schema:
          type: string
          enum:
          - link
          - code
          default: code
      responses:
        '204':
          $ref: '#/components/responses/RequestAddressVerificationResponse'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '409':
          $ref: '#/components/responses/conflictHTTPError'
        '412':
          $ref: '#/components/responses/preconditionFailedHTTPError'
        '422':
          $ref: '#/components/responses/unprocessableEntityHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - system:
        - identity
      summary: Request Address Verification
      tags:
      - OTP
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestOTPForAddress'
      x-operation-id-source: normalized
      x-operation-id-original: requestAddressVerification
    servers:
    - url: https://localhost:8443/api/identity/default
