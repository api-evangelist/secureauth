          type: integer
        maxItems:
          description: arrays
          format: int64
          type: integer
        maxLength:
          description: strings
          format: int64
          type: integer
        maxProperties:
          description: objects
          format: int64
          type: integer
        maximum:
          format: int64
          type: integer
        minContains:
          format: int64
          type: integer
        minItems:
          format: int64
          type: integer
        minLength:
          format: int64
          type: integer
        minProperties:
          format: int64
          type: integer
        minimum:
          format: int64
          type: integer
        multipleOf:
          description: numeric
          format: int64
          type: integer
        not:
          $ref: '#/components/schemas/SupportedJSONSchema'
        oneOf:
          items:
            $ref: '#/components/schemas/SupportedJSONSchema'
          type: array
        pattern:
          type: string
        patternProperties:
          additionalProperties:
            $ref: '#/components/schemas/SupportedJSONSchema'
          type: object
        properties:
          additionalProperties:
            $ref: '#/components/schemas/SupportedJSONSchema'
          type: object
        propertyNames:
          $ref: '#/components/schemas/SupportedJSONSchema'
        required:
          items:
            type: string
          type: array
        then:
          $ref: '#/components/schemas/SupportedJSONSchema'
        title:
          type: string
        type:
          description: any
          type: string
        uniqueItems:
          type: boolean
      type: object
    Cursor:
      type: string
    ServerMetadata:
      properties:
        payload:
          additionalProperties:
            type: object
          description: metadata payload
          type: object
        schema:
          $ref: '#/components/schemas/SupportedJSONSchema'
      type: object
    Error:
      description: HTTP error response
      properties:
        details:
          type: object
        error:
          type: string
        error_code:
          type: string
        status_code:
          format: int64
          type: integer
      type: object
  securitySchemes:
    admin:
      type: oauth2
      flows:
        authorizationCode:
          scopes: {}
          authorizationUrl: /default/admin/oauth2/authorize
          tokenUrl: /default/admin/oauth2/token
    system:
      type: oauth2
      flows:
        authorizationCode:
          scopes:
            introspect_tokens: introspect_tokens
            manage_clients: manage_clients
            manage_configuration: manage_configuration
            manage_consents: manage_consents
            manage_idps: manage_idps
            manage_logins: manage_logins
