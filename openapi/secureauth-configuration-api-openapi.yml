openapi: 3.2.0
info:
  title: Secureauth Configuration API
  version: latest
  description: 'Operations tagged configuration across 3 of this provider''s published API definitions: secureauth-identityroot-openapi.yml, secureauth-licensingroot-openapi.yml, secureauth-root-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://localhost:8443/api/identity/system
- url: https://localhost:8443/api/licensing
- url: https://localhost:8443/
tags:
- name: Configuration
paths:
  /configuration:
    get:
      operationId: exportConfiguration
      parameters:
      - description: Tenant id
        in: query
        name: tid
        schema:
          type: string
          default: default
      responses:
        '200':
          description: Dump
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dump'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '422':
          $ref: '#/components/responses/unprocessableEntityHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - setup: []
      tags:
      - Configuration
      summary: Export configuration
      x-summary-source: derived
    patch:
      description: Patch tenant configuration using RFC 6902 JSON Patch.
      operationId: patchConfiguration
      parameters:
      - description: Tenant id
        in: query
        name: tid
        schema:
          type: string
          default: default
      - in: query
        name: mode
        schema:
          type: string
          format: insertMode
      responses:
        '204':
          description: ' patch applied'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '422':
          $ref: '#/components/responses/unprocessableEntityHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - setup: []
      summary: Patch configuration
      tags:
      - Configuration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Rfc6902PatchOperations'
    put:
      description: 'ACP updates existing values with the values provided in the request.

        API supports only full entries update, not partial, meaning if user is re-imported it should be re-imported with all subentries.'
      operationId: importConfiguration
      responses:
        '204':
          description: ' configuration has been imported'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '409':
          $ref: '#/components/responses/conflictHTTPError'
        '422':
          $ref: '#/components/responses/unprocessableEntityHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - setup: []
      summary: Imports configuration
      tags:
      - Configuration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Dump'
    servers:
    - url: https://localhost:8443/api/identity/system
  /system/configuration:
    get:
      description: 'Returns a JSON with licensing configuration.


        By default, a system tenant is created for you automatically and a client application with the

        client credentials grant flow enabled is also provided. The ID of this client is `system` and the

        client secret can be found in your ACP configuration file.


        When requesting an access token, you should provide the `manage_configuration` scope as the one you

        would like to request.'
      operationId: getSystemConfiguration
      parameters:
      - description: Tenant id
        in: query
        name: tid
        schema:
          type: string
          default: default
      responses:
        '200':
          description: Dump
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dump_2'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '422':
          $ref: '#/components/responses/unprocessableEntityHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - setup:
        - manage_configuration
      summary: Export global licensing configuration
      tags:
      - Configuration
      x-operation-id-source: normalized
      x-operation-id-original: exportConfiguration
    patch:
      description: Patch tenant configuration using RFC 6902 JSON Patch.
      operationId: patchSystemConfiguration
      parameters:
      - description: Tenant id
        in: query
        name: tid
        schema:
          type: string
          default: default
      - in: query
        name: mode
        schema:
          type: string
          format: insertMode
      responses:
        '204':
          description: ' patch applied'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '422':
          $ref: '#/components/responses/unprocessableEntityHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - setup:
        - manage_configuration
      summary: Patch configuration
      tags:
      - Configuration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Rfc6902PatchOperations'
      x-operation-id-source: normalized
      x-operation-id-original: patchConfiguration
    put:
      description: 'Allows to import a JSON file that contains all the licensing configuration.


        By default, a system tenant is created for you automatically and a client application with the

        client credentials grant flow enabled is also provided. The ID of this client is `system` and the

        client secret can be found in your ACP configuration file.


        When requesting an access token, you should provide the `manage_configuration` scope as the one you

        would like to request.'
      operationId: putSystemConfiguration
      parameters:
      - description: 'Insert mode


          Defines what happens in case of configuration import conflicts.


          The `mode` parameter defines

          what happens if there are any conflicts when importing your configuration. For example, if a

          license already exists within ACP and you are trying to import a

          configuration that also has a license for this tenant, there are the following ways

          ACP can handle the request:


          `mode` set to `ignore`, ACP ignores the changes that come from your configuration import.


          `mode` set to `fail`, ACP stops processing the import and returns an error.


          `mode` set to `update`, ACP updates the value from the previous configuration with the value

          provided in the request.'
        in: query
        name: mode
        schema:
          type: string
          format: insertMode
      responses:
        '204':
          description: ' configuration has been imported'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '409':
          $ref: '#/components/responses/conflictHTTPError'
        '422':
          $ref: '#/components/responses/unprocessableEntityHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - setup:
        - manage_configuration
      summary: Import global licensing configuration
      tags:
      - Configuration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Dump_2'
      x-operation-id-source: normalized
      x-operation-id-original: importConfiguration
    servers:
    - url: https://localhost:8443/api/licensing
  /api/system/configuration:
    get:
      description: 'Returns a JSON with all tenants and their configuration.


        Customers that use the on-premise version of the ACP deployment can use the

        global tenants'' configuration export ACP REST API. The requirement to

        have the on-premise deployment comes from the fact, that you need to be able to access the system

        tenant of your deployment to be able to authenticate your client and get access token that allows

        you to import the tenants configuration.


        By default, a system tenant is created for you automatically and a client application with the

        client credentials grant flow enabled is also provided. The ID of this client is `system` and the

        client secret can be found in your ACP configuration file.


        When requesting an access token, you should provide the `manage_configuration` scope as the one you

        would like to request.'
      operationId: getApiSystemConfiguration
      parameters:
      - description: Tenant id
        in: query
        name: tid
        schema:
          type: string
          default: default
      - description: Workspace id
        in: query
        name: workspace_id
        schema:
          type: string
      - description: Include data in export
        in: query
        name: with_data
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Dump
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dump_3'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '422':
          $ref: '#/components/responses/unprocessableEntityHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - setup:
        - manage_configuration
      summary: Export global tenants configuration
      tags:
      - Configuration
      x-operation-id-source: normalized
      x-operation-id-original: exportConfiguration
    patch:
      description: Patch tenant configuration using RFC 6902 JSON Patch.
      operationId: patchApiSystemConfiguration
      parameters:
      - description: Tenant id
        in: query
        name: tid
        schema:
          type: string
          default: default
      - in: query
        name: mode
        schema:
          type: string
          format: insertMode
      responses:
        '204':
          description: ' patch applied'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '422':
          $ref: '#/components/responses/unprocessableEntityHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - setup:
        - manage_configuration
      summary: Patch configuration
      tags:
      - Configuration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Rfc6902PatchOperations'
      x-operation-id-source: normalized
      x-operation-id-original: patchConfiguration
    put:
      description: 'Allows to import a JSON file that contains all the tenants and their configuration.


        Customers that use the on-premise version of the ACP deployment can use the

        global tenants'' configuration import ACP REST API. The requirement to

        have the on-premise deployment comes from the fact, that you need to be able to access the system

        tenant of your deployment to be able to authenticate your client and get access token that allows

        you to import the tenants configuration.


        By default, a system tenant is created for you automatically and a client application with the

        client credentials grant flow enabled is also provided. The ID of this client is `system` and the

        client secret can be found in your ACP configuration file.


        When requesting an access token, you should provide the `manage_configuration` scope as the one you

        would like to request.'
      operationId: putApiSystemConfiguration
      parameters:
      - description: 'Insert mode


          Defines what happens in case of configuration import conflicts.


          The `mode` parameter defines

          what happens if there are any conflicts when importing your configuration. For example, if a

          client already exists within ACP and you are trying to import a

          configuration that also has a client with this ID, there are the following ways

          ACP can handle the request:


          `mode` set to `ignore`, ACP ignores the changes that come from your configuration import.


          `mode` set to `fail`, ACP stops processing the import and returns an error.


          `mode` set to `update`, ACP updates the value from the previous configuration with the value

          provided in the request.'
        in: query
        name: mode
        schema:
          type: string
          format: insertMode
      responses:
        '204':
          description: ' configuration has been imported'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '409':
          $ref: '#/components/responses/conflictHTTPError'
        '422':
          $ref: '#/components/responses/unprocessableEntityHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - setup:
        - manage_configuration
      summary: Import global tenants configuration
      tags:
      - Configuration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Dump_3'
      x-operation-id-source: normalized
      x-operation-id-original: importConfiguration
    servers:
    - url: https://localhost:8443/
components:
  schemas:
    Dump:
      properties:
        codes:
          items:
            $ref: '#/components/schemas/Code'
          type: array
        group_members:
          items:
            $ref: '#/components/schemas/GroupMember'
          type: array
        groups:
          items:
            $ref: '#/components/schemas/InternalGroup'
          type: array
        pools:
          items:
            $ref: '#/components/schemas/Pool'
          type: array
        schemas:
          items:
            $ref: '#/components/schemas/Schema'
          type: array
        user_credentials:
          items:
            $ref: '#/components/schemas/UserCredential'
          type: array
        user_identifiers:
          items:
            $ref: '#/components/schemas/UserIdentifier'
          type: array
        user_verifiable_addresses:
          items:
            $ref: '#/components/schemas/UserVerifiableAddress'
          type: array
        users:
          items:
            $ref: '#/components/schemas/User'
          type: array
      type: object
    OtpSettings:
      properties:
        activation:
          $ref: '#/components/schemas/OtpConfig'
        authentication:
          $ref: '#/components/schemas/OtpConfig'
        challenge:
          $ref: '#/components/schemas/OtpConfig'
        enroll_webauthn:
          $ref: '#/components/schemas/OtpConfig'
        pair_device:
          $ref: '#/components/schemas/OtpConfig'
        require_user_confirmation_before_send:
          description: 'RequireUserConfirmationBeforeSend is a flow-level toggle (it does not

            correspond to any of the per-purpose OtpConfig fields above) that affects

            only the hosted web login UI. When true, the OTP is not auto-sent: the user

            lands on the OTP send view and must click Continue to trigger delivery.

            Applies to primary login (LoginFlow) and forced re-authentication / MFA

            challenge (ForcedAuthnFlow). API-driven OTP triggers (the OTP send

            endpoints) are unaffected.'
          type: boolean
        reset_password:
          $ref: '#/components/schemas/OtpConfig'
        reset_totp:
          $ref: '#/components/schemas/OtpConfig'
        verify_address:
          $ref: '#/components/schemas/OtpConfig'
      type: object
    User:
      properties:
        business_metadata:
          additionalProperties:
            type: object
          type: object
        business_metadata_schema_id:
          format: schemaID
          type: string
        created_at:
          format: date-time
          type: string
        id:
          format: userID
          type: string
        metadata:
          additionalProperties:
            type: object
          type: object
        metadata_schema_id:
          format: schemaID
          type: string
        payload:
          additionalProperties:
            type: object
          type: object
        payload_schema_id:
          format: schemaID
          type: string
        preferences:
          $ref: '#/components/schemas/UserPreferences'
        status:
          enum:
          - active
          - inactive
          - deleted
          - new
          example: active
          type: string
        status_updated_at:
          format: date-time
          type: string
        tenant_id:
          example: default
          format: tenantID
          type: string
        updated_at:
          format: date-time
          type: string
        user_pool_id:
          example: default
          format: poolID
          type: string
        user_type:
          enum:
          - jit
          - standard
          - scim
          type: string
      required:
      - tenant_id
      - user_pool_id
      - status
      type: object
    PBKDF2Config:
      properties:
        function:
          type: string
        key_length:
          format: int64
          type: integer
        number_of_iterations:
          format: int64
          type: integer
        salt:
          type: string
        salt_length:
          format: int64
          type: integer
      type: object
    MFAPreferences:
      properties:
        preferred_2fa:
          enum:
          - totp
          - password
          - otp
          - email_otp
          - sms_otp
          - voice_otp
          - webauthn
          - usernameless_webauthn
          - push
          - symbol
          - qr_code
          type: string
      type: object
    Schema:
      properties:
        created_at:
          format: date-time
          type: string
        description:
          type: string
        id:
          format: schemaID
          type: string
        name:
          type: string
        schema:
          $ref: '#/components/schemas/SupportedJSONSchema'
        system:
          type: boolean
        tenant_id:
          example: default
          format: tenantID
          type: string
        updated_at:
          format: date-time
          type: string
      required:
      - tenant_id
      - name
      - schema
      type: object
    WebAuthnSettings:
      properties:
        require_user_interaction_before_prompt:
          description: 'RequireUserInteractionBeforePrompt, when true, stops the hosted web login,

            activation, and self-registration UIs from auto-initiating the browser passkey

            prompt on page load; the user must click Continue. Default false preserves

            auto-prompt behavior. API-driven WebAuthn flows are unaffected.'
          type: boolean
        rp_id:
          type: string
        rp_origins:
          items:
            type: string
          type: array
      type: object
    PoolLimits:
      description: All values are clamped to the range [1, 100] with sensible defaults.
      properties:
        max_addresses:
          format: int64
          type: integer
        max_codes:
          format: int64
          type: integer
        max_credentials:
          format: int64
          type: integer
        max_identifiers:
          format: int64
          type: integer
        webauthn_credentials_capacity:
          format: int64
          type: integer
      title: PoolLimits defines limits for user sub-entries within a pool.
      type: object
    Code:
      properties:
        code:
          $ref: '#/components/schemas/CodeValue'
        created_at:
          format: date-time
          type: string
        expires_at:
          format: date-time
          type: string
        id:
          format: codeID
          type: string
        issued_at:
          format: date-time
          type: string
        metadata:
          additionalProperties:
            type: object
          description: general purpose metadata
          type: object
        tenant_id:
          example: default
          format: tenantID
          type: string
        type:
          enum:
          - activation
          - reset_password
          - reset_totp
          - enroll_webauthn
          - challenge
          - verify_address
          - authentication
          - pair_device
          example: active
          type: string
        user_id:
          format: userID
          type: string
        user_pool_id:
          example: default
          format: poolID
          type: string
        verifiable_address_id:
          format: verifiableAddressID
          type: string
      required:
      - tenant_id
      - user_pool_id
      - user_id
      - type
      - code
      type: object
    SCIMSettings:
      properties:
        inboundInputMapping:
          items:
            $ref: '#/components/schemas/FieldMapping'
          type: array
      type: object
    AuthenticationMechanisms:
      items:
        enum:
        - totp
        - password
        - otp
        - email_otp
        - sms_otp
        - voice_otp
        - webauthn
        - usernameless_webauthn
        - push
        - symbol
        - qr_code
        type: string
      type: array
    UserPreferences:
      properties:
        locales:
          description: Locale is the list of user's preferred languages/locales for UI and communications
          example: en-US, es-ES
          items:
            format: locale
            type: string
          type: array
        mfa:
          $ref: '#/components/schemas/MFAPreferences'
      type: object
    Rfc6902PatchOperations:
      items:
        $ref: '#/components/schemas/Rfc6902PatchOperation'
      type: array
    BcryptConfig:
      properties:
        cost:
          format: int64
          type: integer
      type: object
    Hash:
      properties:
        config:
          $ref: '#/components/schemas/HashConfig'
        value:
          type: string
      type: object
    TotpSettings:
      properties:
        issuer:
          type: string
      type: object
    OtpConfig:
      properties:
        length:
          format: int64
          type: integer
        ttl:
          format: duration
          type: string
      type: object
    UserVerifiableAddress:
      properties:
        address:
          format: verifiableAddress
          type: string
        address_lc:
          format: verifiableAddress
          type: string
        allowed_for_2fa:
          description: is allowed for 2FA
          type: boolean
        created_at:
          format: date-time
          type: string
        id:
          format: verifiableAddressID
          type: string
        message_redaction:
          $ref: '#/components/schemas/RedactionPolicy'
        metadata:
          additionalProperties:
            type: object
          description: general purpose metadata
          type: object
        preferred_contact_method:
          enum:
          - sms
          - voice
          example: sms
          type: string
        status:
          enum:
          - active
          - inactive
          example: active
          type: string
        tenant_id:
          example: default
          format: tenantID
          type: string
        type:
          enum:
          - email
          - mobile
          example: mobile
          type: string
        updated_at:
          format: date-time
          type: string
        user_id:
          format: userID
          type: string
        user_pool_id:
          example: default
          format: poolID
          type: string
        verified:
          type: boolean
        verified_at:
          format: date-time
          type: string
      required:
      - tenant_id
      - user_pool_id
      - user_id
      - address
      - address_lc
      - type
      - status
      - verified
      - created_at
      - updated_at
      type: object
    PasswordPolicy:
      properties:
        capital_letters:
          format: uint64
          type: integer
        digits:
          format: uint64
          type: integer
        lowercase_letters:
          format: uint64
          type: integer
        min_length:
          format: uint64
          type: integer
        not_used_since:
          format: uint64
          type: integer
        special_characters:
          format: uint64
          type: integer
        strength:
          enum:
          - any
          - weak
          - fair
          - strong
          - very_strong
          type: string
      type: object
    PasswordSettings:
      properties:
        expires_after:
          format: duration
          type: string
        hashing_method:
          enum:
          - bcrypt
          - pbkdf2
          - argon2
          - sha
          type: string
      type: object
    HashConfig:
      properties:
        argon2:
          $ref: '#/components/schemas/Argon2Config'
        bcrypt:
          $ref: '#/components/schemas/BcryptConfig'
        md5:
          $ref: '#/components/schemas/MD5Config'
        method:
          enum:
          - bcrypt
          - pbkdf2
          - argon2
          - sha
          - md5
          type: string
        pbkdf2:
          $ref: '#/components/schemas/PBKDF2Config'
        sha:
          $ref: '#/components/schemas/SHAConfig'
      type: object
    SupportedJSONSchema:
      properties:
        additionalProperties:
          type: boolean
        allOf:
          items:
            $ref: '#/components/schemas/SupportedJSONSchema'
          type: array
        anyOf:
          items:
            $ref: '#/components/schemas/SupportedJSONSchema'
          type: array
        const:
          type: string
        contains:
          $ref: '#/components/schemas/SupportedJSONSchema'
        dependentRequired:
          additionalProperties:
            items:
              type: string
            type: array
          type: object
        dependentSchemas:
          additionalProperties:
