    Mapping:
      description: Source and target must be provided.
      properties:
        allow_weak_decoding:
          description: 'If enabled, the decoder makes the following "weak" conversions:


            Bools to string (true = "1", false = "0")


            numbers to string (base 10)


            bools to int/uint (true = 1, false = 0)


            strings to int/uint (base implied by prefix)


            int to bool (true if value != 0)


            string to bool (accepts only the following: 1, t, T, TRUE, true, True, 0, f, F, FALSE, false, False)


            empty array = empty map and vice versa


            negative numbers to overflowed uint values (base 10)


            slice of maps to a merged map


            single values are converted to slices if required. Each element is weakly decoded.'
          example: false
          type: boolean
        default:
          description: Default value used when source value is missing in dynamic mode.
          type: object
        mode:
          $ref: '#/components/schemas/MappingMode'
        source:
          description: 'Source attribute.


            Source path to the attribute(s) which should be copied to the authentication context.

            Use ''.'' to copy everything.

            Required for dynamic mode.'
          example: access_token
          type: string
        static:
          description: When static mode is used, this field contains a value that will be populated into a target attribute.
          type: object
        target:
          description: 'Target attribute.


            Target path in the authentication context where source attribute(s) should be pasted.

            Use ''.'' to paste to the context top level object.'
          example: .
          type: string
        type:
          description: 'Type of the target attribute


            The `type` parameter accepts the following values:

            `number`, `string`, `bool`, `number_array`, `string_array`, `bool_array`, `any`.'
          example: string
          format: type
          type: string
      required:
      - target
      - type
      title: Attribute mapping.
      type: object
