    ServerDump:
      properties:
        access_token_strategy:
          default: jwt
          description: 'Access token strategy


            You can choose to go either with `JWT` or `opaque` tokens.


            The content of JSON Web Tokens is readable and it is possible to be decoded by anyone that

            has a secret or a public key in their possession.


            Opaque tokens are in a proprietary form that contains an identifier to information stored on

            the athorization server. To validate an opaque token, the recipient must call the server that

            issued the token.'
          enum:
          - jwt
          - opaque
          example: jwt
          type: string
        access_token_ttl:
          default: 1h0m0s
          description: 'Access token time to live


            After an access token reaches its time to live, it expires and it cannot be used to

            authenticate the client application.'
          example: 1h10m30s
          format: duration
          type: string
        advanced:
          $ref: '#/components/schemas/AdvancedConfiguration'
        authentication_context_settings:
          $ref: '#/components/schemas/AuthenticationContextSettings'
        authentication_mechanisms:
          description: allowed authentication mechanisms for users in the identity pools
          example:
          - password
          - totp
          - otp
          - webauthn
          - sms_otp
          - email_otp
          items:
            enum:
            - totp
            - password
            - otp
            - email_otp
            - sms_otp
            - voice_otp
            - webauthn
            - usernameless_webauthn
            - push
            - symbol
            - qr_code
            type: string
          type: array
        authorization_code_ttl:
          description: 'Authorization code time to live


            After an authorization code reaches its time to live, it expires and it cannot be used to

            authorize the request to the `/token` endpoint.'
          example: 10m0s
          format: duration
          type: string
        backchannel_token_delivery_modes_supported:
          default:
          - poll
          - ping
          items:
            type: string
          type: array
        backchannel_user_code_parameter_supported:
          default: false
          type: boolean
        cdr:
          $ref: '#/components/schemas/CDRConfiguration'
        color:
          default: '#007FFF'
          description: Your server's label color in a HEX format.
          example: '#007FFF'
          type: string
        consent_id_namespace:
          description: 'Namespace used when creating Open Banking Brasil consent IDs


            Consent IDs will have the form of urn:<consent_id_namespace>:<uid> when this is set.

            If this is empty, the tenant id is used by default'
          type: string
        cookie_max_age:
          description: 'Cookie max age


            Defines how long a cookie can live until it expires.'
          example: 1h10m30s
          format: duration
          type: string
        created_at:
          description: 'Date the workspace or organization was created.


            Not set for workspaces and organizations that existed before this field was introduced,

            as there is no stored creation time to recover for them.'
          example: '2026-04-07T19:17:31.323187Z'
          format: date-time
          readOnly: true
          type: string
        custom_issuer_url:
          description: 'Defines a custom issuer URL that can be used as the value of the `iss` claim in an access

            token.


            If not provided, it is built dynamically based on the server''s URL.'
          example: http://example.com/default/default
          type: string
        description:
          description: Display description of the workspace
          example: Server description
          type: string
        device_authorization:
          $ref: '#/components/schemas/DeviceAuthorizationConfiguration'
        do_not_create_default_claims:
          description: flag to skip default claims creation (applicable only if server does not exist)
          type: boolean
        dynamic_client_registration:
          $ref: '#/components/schemas/DynamicClientRegistrationSettings'
        dynamic_scope_separator:
          default: .
          description: 'You can use this property to define a separator that is used for dynamic scopes.


            For example, the default separator is `.`, so the scope could look like the following:

            `users.*`.


            For Open Banking Brazil compliant servers, the `:` separator should be used.'
          format: dynamicScopeSeparator
          type: string
        enable_idp_discovery:
          description: 'Deprecated: Use IDPDiscovery instead


            If enabled, IDP discovery automatically redirects the user to their own IDP and does not

            display IDPs of other users while the users accesses the server/application.'
          example: false
          type: boolean
        enable_legacy_clients_with_no_software_statement:
          description: 'Deprecated


            If enabled, it is possible to manually register clients withouth the use of software

            statements.


            This flag is enabled, when the `enable_trust_anchor` flag is set to `false`. You can disable

            it using API, but it cannot be manually enabled.'
          type: boolean
        enable_quick_access:
          description: If enabled, the server is visible on the Quick Access tab on the login page.
          type: boolean
        enable_trust_anchor:
          default: false
          description: 'If enabled, it makes it obligatory to provide a software statement signed by a trusted certificate authority


            when registering a client application with the use of the Dynamic Client Registration (DCR).


            In public key infrastructure (PKI), trust anchors are certification authorities. They are

            represented by a certificate that is used to verify the signature of a certificate issued by

            a particular trust anchor.'
          type: boolean
        enforce_id_token_encryption:
          description: When enabled, the authorization server will enforce encrypted id tokens it issues
          type: boolean
        enforce_pkce:
          default: false
          description: 'Define whether you want to enforce using the Proof Key of Code Exchange (PKCE) for both

            private and public clients.


            PKCE is an OAuth security extension that prevents malicious applications or codes that

            intercepted authorization code from exchanging it for an access token.'
          example: false
          type: boolean
        enforce_pkce_for_public_clients:
          default: false
          description: 'Define whether you want to enforce using the Proof Key of Code Exchange (PKCE) for

            public clients.


            Public clients, like mobile applications or JavaScript-based applications, by their design,

            cannot store client secrets securely. For such clients, even encrypting the client secret

            inside the application’s code is not a reliable way of protecting secrets as the application

            can be decompiled and the client secret can be extracted while it is decrypted in the memory

            of the application.


            For those reasons, ACP supports the use of PKCE as an addition to the authorization code

            grant flow to provide a secure alternative to the implicit grant flow.'
          example: false
          type: boolean
        fdx:
          $ref: '#/components/schemas/FDXConfiguration'
        grant_types:
          default:
          - authorization_code
          - implicit
          - client_credentials
          - refresh_token
          description: An array that defines which of the OAuth 2.0 grant types are enabled for the authorization server.
          example:
          - authorization_code
          - implicit
          - refresh_token
          - client_credentials
          items:
            enum:
            - authorization_code
            - implicit
            - client_credentials
            - refresh_token
            - password
            - urn:ietf:params:oauth:grant-type:jwt-bearer
            - urn:openid:params:grant-type:ciba
            - urn:ietf:params:oauth:grant-type:token-exchange
            - urn:ietf:params:oauth:grant-type:device_code
            type: string
          type: array
        id:
          description: 'Unique identifier of an authorization server (workspace)


            If not provided, a random ID is generated.'
          example: default
          format: serverID
          type: string
        id_jag_ttl:
          default: 5m0s
          description: 'ID-JAG time to live


            After an Identity Assertion JWT Authorization Grant reaches its time to live, it expires

            and it cannot be redeemed at the resource authorization server. Kept short by default

            because the grant is redeemed immediately, and its expiry bounds how long the resource

            server must remember the grant identifier to reject replays.'
          example: 5m0s
          format: duration
          type: string
        id_token_ttl:
          description: 'ID token time to live


            After an ID token reaches its time to live, it expires and it cannot be used to provide

            user profile information to a client application.'
          example: 1h10m30s
          format: duration
          type: string
        identity_assurance:
          $ref: '#/components/schemas/IdentityAssuranceConfiguration'
        idp_discovery:
          $ref: '#/components/schemas/IDPDiscovery'
        initialize:
          description: flag to initialize server default configuration (applicable only if server does not exist)
          type: boolean
        issuer_id:
          description: 'Issuer ID that will be used to set `iss` claim on signed messages


            If issuer_id is not set then default issuer_url will be used'
          example: 5647fe90-f6bc-11eb-9a03-0242ac130003
          type: string
        jwks:
          $ref: '#/components/schemas/ServerJWKs'
        key_type:
          default: ecdsa
          description: 'Determines which type of asymmetric algorithms (RSA or ECDSA) is used to generate keys for signing access and

            ID tokens.


            It is used only as an input parameter for the Create Authorization Server API.'
          enum:
          - rsa
          - ecdsa
          - ps
          example: rsa
          type: string
        legal_entity:
          $ref: '#/components/schemas/LegalEntity'
        logo_uri:
          description: Logo URI
          type: string
        metadata:
          $ref: '#/components/schemas/ServerMetadata'
