            If not provided, a random ID is generated.'
          example: default
          type: string
        obbr:
          $ref: '#/components/schemas/DeprecatedOBBRConfiguration'
        organization:
          $ref: '#/components/schemas/OrganizationConfiguration'
        parent_id:
          description: Optional ID of a parent server
          format: serverID
          type: string
        preferences:
          $ref: '#/components/schemas/ServerPreferences'
        profile:
          default: default
          description: 'The profile of a server


            ACP is delivered with preconfigured workspace templates that enable quick and easy setup for

            specific configuration patterns. For example, you can instantly create an Open Banking

            compliant workspace that has all of the required mechanisms and settings already in place.'
          enum:
          - default
          - demo
          - workforce
          - workforce_v2
          - consumer
          - partners
          - third_party
          - fapi_advanced
          - fapi_rw
          - fapi_ro
          - openbanking_uk_fapi_advanced
          - openbanking_uk
          - openbanking_br
          - openbanking_br_unico
          - cdr_australia
          - cdr_australia_fapi_rw
          - fdx
          - openbanking_ksa
          - fapi_20_security
          - fapi_20_message_signing
          - connect_id
          - agentic_ai
          - saidp_legacy
          example: default
          type: string
        pushed_authorization_request_ttl:
          description: 'Custom pushed authentication request TTL

            If not provided, TTL is set to 60 seconds.'
          format: duration
          type: string
        refresh_token_ttl:
          default: 720h0m0s
          description: 'Refresh token time to live


            After a refresh token reaches its time to live, it expires and it cannot be used to obtain

            new access tokens for a client application.'
          example: 720h0m0s
          format: duration
          type: string
        require_pushed_authorization_requests:
          description: Boolean parameter indicating whether the authorization server accepts authorization request data only via PAR.
          type: boolean
        response_types:
          $ref: '#/components/schemas/ResponseTypes'
        root_cas:
          description: 'You can provide root Certificate Authority (CA) certificates encoded to the Privacy-Enhanced

            Mail (PEM) file format which are used for the `tls_client_auth` and the

            `self_signed_tls_client_auth` client authentication methods that use the Mutual

            Transport Layer Security (mTLS).


            If not set, the system root CA certifiates are used instead.'
          type: string
        rotated_secrets:
          description: An array of rotated secrets that are still used to validate tokens
          example:
          - jFpwIvuKJP46J71WqszPv1SrzoUr-cSILP9EPdlClB4
          items:
            type: string
          type: array
        saml:
          $ref: '#/components/schemas/SAMLConfiguration'
        scope_claim_formats:
          default:
          - scp_array
          description: formats of the scope claim that will be included in the access token
          example:
          - scp_array
          - scope_space_separated
          items:
            $ref: '#/components/schemas/ScopeClaimFormat'
          type: array
        secret:
          description: 'Secret used for hashing


            It must have at least 32 characters. If not provided, it is generated.'
          example: hW5WhKX_7w7BLwUQ6mn7Cp70_OoKI_F1y1hLS5U8lIU
          type: string
        settings:
          $ref: '#/components/schemas/ServerSettings'
        sso:
          $ref: '#/components/schemas/SSOConfiguration'
        styling:
          $ref: '#/components/schemas/Styling'
        subject_custom_attribute:
          description: The authentication context attribute name that will be used as subject when the custom subject format is used.
          type: string
        subject_format:
          description: 'Define the format of a subject

            When set to hash sub value is a one way hash of idp id and idp sub'
          enum:
          - hash
          - legacy
          - custom
          type: string
        subject_identifier_algorithm_salt:
          description: 'Salt used to hash `subject` when the `pairwise` subject type is used.


            Salt is a random data which is used as an additional input to one-way functions that hashes

            data, passwords, and, in this case, subjects.


            It is recommended that your salt value is long for security reasons. Preferably, the salt

            value should be at least the same length as the output of the hash.


            If not provided, it is generated.'
          type: string
        subject_identifier_types:
          default:
          - public
          - pairwise
          description: 'An array that defines supported subject identifier types.


            Subject identifiers identify an end-user. They are locally unique and never reassigned within the Issuer,

            and are intended to be consumed by client applications. There are two types

            of subject identifiers: `public` and `pairwise`.


            `public` identifiers provide the same `sub` claim value to all client applications.

            `pairwise` identifiers provide different `sub` claim values to each client application. With

            this approach, it makes it impossible for client applications to correlate the end-user''s

            activity without their permission.'
          example:
          - public
          - pairwise
          items:
            enum:
            - public
            - pairwise
            type: string
          type: array
        template:
          description: If true this workspace can be used as a template when creating a new ones.
          type: boolean
        tenant_id:
          description: ID of a tenant
          example: default
          format: tenantID
          type: string
        token_endpoint_auth_methods:
          default:
          - client_secret_basic
          - client_secret_post
          - client_secret_jwt
          - private_key_jwt
          - self_signed_tls_client_auth
          - tls_client_auth
          - none
          description: 'An array that lists all of the supported token endpoint authentication methods for the

            authorization server.'
          items:
            enum:
            - client_secret_basic
            - client_secret_post
            - client_secret_jwt
            - private_key_jwt
            - self_signed_tls_client_auth
            - tls_client_auth
            - none
            - unspecified
            type: string
          type: array
        token_endpoint_auth_signing_alg_values:
          description: 'Token endpoint auth signing supported alg values


            Supported algorithms: HS256, RS256, ES256, PS256


            At least one algorithm must be set.


            The default values depends on the server security profile.'
          items:
            type: string
          type: array
        token_endpoint_authn_methods:
          description: 'Deprecated: Use TokenEndpointAuthMethods instead'
          items:
            enum:
            - client_secret_basic
            - client_secret_post
            - client_secret_jwt
            - private_key_jwt
            - self_signed_tls_client_auth
            - tls_client_auth
            - none
            - unspecified
            type: string
          type: array
        trust_anchor_configuration:
          $ref: '#/components/schemas/TrustAnchorConfiguration'
        type:
          default: regular
          description: 'Server type


            It is an internal property used to recognize if the server is created for an admin portal,

            a developer portal, or if it is a system or a regular workspace.'
          enum:
          - admin
          - developer
          - system
          - regular
          - organization
          example: regular
          type: string
        updated_at:
          description: 'Date the workspace or organization was last updated.


            Not set until the first write after this field was introduced.'
          example: '2026-05-08T01:11:51.126291Z'
          format: date-time
          readOnly: true
          type: string
        version:
          default: 3
          description: 'server version to track internal changes

            version that is currently the latest: 3'
          format: int64
          type: integer
