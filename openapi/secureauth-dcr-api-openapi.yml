openapi: 3.2.0
info:
  title: Secureauth DCR API
  version: latest
  description: 'Operations tagged DCR across 4 of this provider''s published API definitions: secureauth-cdr-openapi.yml, secureauth-fdx-openapi.yml, secureauth-obbr-openapi.yml, secureauth-obuk-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://localhost:8443/default/default
tags:
- name: DCR
paths:
  /oauth2/register:
    post:
      description: 'Dynamic Client Registration endpoint allows to dynamically register OAuth 2.0 client applications

        with the SecureAuth Platform. When a request with all required registration metadata

        values reaches the SecureAuth authorization server, the server issues a client

        identifier and provides client metadata values registered for the client.

        Client applications can use their registration data to communicate with the SecureAuth

        platform using the OAuth 2.0 protocol.'
      operationId: dynamicClientRegistration
      responses:
        '201':
          $ref: '#/components/responses/DynamicClientRegistrationResponse'
        '400':
          $ref: '#/components/responses/RFC6749Error'
        '401':
          $ref: '#/components/responses/RFC6749Error'
        '403':
          $ref: '#/components/responses/RFC6749Error'
        '404':
          $ref: '#/components/responses/genericError'
      security:
      - default:
        - dcr_register
      summary: CDR Dynamic Client Registration
      tags:
      - DCR
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CDRDynamicClientRegistrationRequest'
    servers:
    - url: https://localhost:8443/default/default
  /oauth2/register/{cid}:
    delete:
      description: This endpoint allows to delete a dynamically registered client.
      operationId: dynamicClientRegistrationDeleteClient
      parameters:
      - description: Client id
        in: path
        name: cid
        required: true
        schema:
          type: string
          default: default
      responses:
        '204':
          description: ' Client has been deleted'
        '400':
          $ref: '#/components/responses/RFC6749Error'
        '401':
          $ref: '#/components/responses/RFC6749Error'
        '403':
          $ref: '#/components/responses/RFC6749Error'
        '404':
          $ref: '#/components/responses/genericError'
      security:
      - default: []
      summary: Delete CDR Client
      tags:
      - DCR
    get:
      description: This endpoint allows to get metadata values of a dynamically registered client.
      operationId: dynamicClientRegistrationGetClient
      parameters:
      - description: Client id
        in: path
        name: cid
        required: true
        schema:
          type: string
          default: default
      responses:
        '200':
          $ref: '#/components/responses/DynamicClientRegistrationResponse'
        '400':
          $ref: '#/components/responses/RFC6749Error'
        '401':
          $ref: '#/components/responses/RFC6749Error'
        '403':
          $ref: '#/components/responses/RFC6749Error'
        '404':
          $ref: '#/components/responses/genericError'
      security:
      - default: []
      summary: Get CDR Client Metadata
      tags:
      - DCR
    put:
      description: This endpoint allows to update metadata values of a dynamically registered client.
      operationId: dynamicClientRegistrationUpdateClient
      parameters:
      - description: Client id
        in: path
        name: cid
        required: true
        schema:
          type: string
          default: default
      responses:
        '200':
          $ref: '#/components/responses/DynamicClientRegistrationResponse'
        '400':
          $ref: '#/components/responses/RFC6749Error'
        '401':
          $ref: '#/components/responses/RFC6749Error'
        '403':
          $ref: '#/components/responses/RFC6749Error'
        '404':
          $ref: '#/components/responses/genericError'
      security:
      - default: []
      summary: Update CDR Client Metadata
      tags:
      - DCR
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CDRDynamicClientRegistrationRequest'
    servers:
    - url: https://localhost:8443/default/default
  /fdx/clients/{cid}:
    put:
      description: 'Update an FDX client application status.


        Pass the `Authorization: Bearer` header with a token as the bearer value. To obtain the token, apply

        the Client Credentials

        grant type.'
      operationId: FDXUpdateClientStatus
      parameters:
      - description: Client id
        in: path
        name: cid
        required: true
        schema:
          type: string
          default: default
      responses:
        '200':
          description: ' Client Status Updated'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '422':
          $ref: '#/components/responses/unprocessableEntityHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - system:
        - update_client_status
      summary: Update FDX Client Status
      tags:
      - DCR
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FDXUpdateClientStatusRequest'
        description: FDXUpdateClientStatusRequest
    servers:
    - url: https://localhost:8443/default/default
  /fdx/dcr/register:
    post:
      description: 'Register a new client application dynamically.


        Authorization: Bearer token.'
      operationId: FDXDynamicClientRegistration
      responses:
        '201':
          $ref: '#/components/responses/FDXDynamicClientRegistrationResponse'
        '400':
          $ref: '#/components/responses/RFC6749Error'
        '401':
          $ref: '#/components/responses/RFC6749Error'
        '403':
          $ref: '#/components/responses/RFC6749Error'
        '404':
          $ref: '#/components/responses/genericError'
      security:
      - default:
        - client_register
      summary: Dynamic Client Registration
      tags:
      - DCR
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FDXDynamicClientRegistrationRequest'
    servers:
    - url: https://localhost:8443/default/default
  /fdx/dcr/register/{cid}:
    delete:
      description: 'Delete the registered client application details.


        Pass the `Authorization: Bearer` header with a token as the bearer value. To obtain the token,

        apply the Client Credentials

        grant type.'
      operationId: FDXDynamicClientRegistrationDelete
      parameters:
      - description: Client id
        in: path
        name: cid
        required: true
        schema:
          type: string
          default: default
      responses:
        '204':
          description: ' Client details deleted'
        '400':
          $ref: '#/components/responses/RFC6749Error'
        '401':
          $ref: '#/components/responses/RFC6749Error'
        '403':
          $ref: '#/components/responses/RFC6749Error'
        '404':
          $ref: '#/components/responses/genericError'
      security:
      - default: []
      summary: Delete Client
      tags:
      - DCR
    get:
      description: 'Retrieve the details about a registered client application by the client identifier.


        Pass the `Authorization: Bearer` header with a token as the bearer value for authorization.

        To obtain the token, apply the

        Client Credentials

        grant type.'
      operationId: FDXDynamicClientRegistrationGet
      parameters:
      - description: Client id
        in: path
        name: cid
        required: true
        schema:
          type: string
          default: default
      responses:
        '200':
          $ref: '#/components/responses/FDXDynamicClientRegistrationGetResponse'
        '400':
          $ref: '#/components/responses/RFC6749Error'
        '401':
          $ref: '#/components/responses/RFC6749Error'
        '403':
          $ref: '#/components/responses/RFC6749Error'
        '404':
          $ref: '#/components/responses/genericError'
      security:
      - default: []
      summary: Get Client Endpoint
      tags:
      - DCR
    put:
      description: 'Modify the registered client application details.


        Pass the `Authorization: Bearer` header with a token as the bearer value. To obtain the token, apply

        the Client Credentials

        grant type.'
      operationId: FDXDynamicClientRegistrationPut
      parameters:
      - description: Client id
        in: path
        name: cid
        required: true
        schema:
          type: string
          default: default
      responses:
        '200':
          $ref: '#/components/responses/FDXDynamicClientRegistrationPutResponse'
        '400':
          $ref: '#/components/responses/RFC6749Error'
        '401':
          $ref: '#/components/responses/RFC6749Error'
        '403':
          $ref: '#/components/responses/RFC6749Error'
        '404':
          $ref: '#/components/responses/genericError'
      security:
      - default: []
      summary: Update FDX Client Details
      tags:
      - DCR
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FDXDynamicClientRegistrationRequest'
    servers:
    - url: https://localhost:8443/default/default
  /openbankinguk/dcr/v3.2/register:
    post:
      description: 'This endpoint can be used to dynamically register new clients.

        Request body must be signed.

        Please take a look at reference to see what fields are required:

        https://openbankinguk.github.io/dcr-docs-pub/v3.2/dynamic-client-registration.html

        Consider adding client credentials grant type to a client to be able to modify it later on.'
      operationId: dynamicClientRegistrationOpenbankingUK
      responses:
        '201':
          $ref: '#/components/responses/OpenbankingUKDynamicClientRegistrationResponse'
        '400':
          $ref: '#/components/responses/RFC6749Error'
        '401':
          $ref: '#/components/responses/RFC6749Error'
        '403':
          $ref: '#/components/responses/RFC6749Error'
        '404':
          $ref: '#/components/responses/genericError'
      security:
      - default: []
      summary: Openbanking UK compliant dynamic client registration endpoint
      tags:
      - DCR
      requestBody:
        content:
          application/jose:
            schema:
              $ref: '#/components/schemas/OpenbankingUKDynamicClientRegistrationRequest'
    servers:
    - url: https://localhost:8443/default/default
  /openbankinguk/dcr/v3.2/register/{cid}:
    delete:
      description: 'This endpoint can be used to delete registered client details.

        Use client credentials flow to authorize to this api.'
      operationId: dynamicClientRegistrationOpenbankingUKDeleteClient
      parameters:
      - description: Client id
        in: path
        name: cid
        required: true
        schema:
          type: string
          default: default
      responses:
        '204':
          description: ' Client has been deleted'
        '400':
          $ref: '#/components/responses/RFC6749Error'
        '401':
          $ref: '#/components/responses/RFC6749Error'
        '403':
          $ref: '#/components/responses/RFC6749Error'
        '404':
          $ref: '#/components/responses/genericError'
      security:
      - default: []
      summary: Openbanking UK compliant dynamic delete client endpoint
      tags:
      - DCR
    get:
      description: 'This endpoint can be used to get registered client details.

        Use client credentials flow to authorize to this api.'
      operationId: dynamicClientRegistrationOpenbankingUKGetClient
      parameters:
      - description: Client id
        in: path
        name: cid
        required: true
        schema:
          type: string
          default: default
      responses:
        '200':
          $ref: '#/components/responses/OpenbankingUKDynamicClientRegistrationResponse'
        '400':
          $ref: '#/components/responses/RFC6749Error'
        '401':
          $ref: '#/components/responses/RFC6749Error'
        '403':
          $ref: '#/components/responses/RFC6749Error'
        '404':
          $ref: '#/components/responses/genericError'
      security:
      - default: []
      summary: Openbanking UK compliant dynamic get client endpoint
      tags:
      - DCR
    put:
      description: 'This endpoint can be used to update registered client details.

        Use client credentials flow to authorize to this api.'
      operationId: dynamicClientRegistrationOpenbankingUKUpdateClient
      parameters:
      - description: Client id
        in: path
        name: cid
        required: true
        schema:
          type: string
          default: default
      responses:
        '200':
          $ref: '#/components/responses/OpenbankingUKDynamicClientRegistrationResponse'
        '400':
          $ref: '#/components/responses/RFC6749Error'
        '401':
          $ref: '#/components/responses/RFC6749Error'
        '403':
          $ref: '#/components/responses/RFC6749Error'
        '404':
          $ref: '#/components/responses/genericError'
      security:
      - default: []
      summary: Openbanking UK compliant dynamic update client endpoint
      tags:
      - DCR
      requestBody:
        content:
          application/jose:
            schema:
              $ref: '#/components/schemas/OpenbankingUKDynamicClientRegistrationRequest'
    servers:
    - url: https://localhost:8443/default/default
components:
  schemas:
    TokenTTLs:
      properties:
        access_token_ttl:
          default: 1h0m0s
          description: 'Access token time to live


            After an access token reaches its time to live, it expires and it cannot be used to

            authenticate the client application.'
          example: 1h10m30s
          format: duration
          type: string
        authorization_code_ttl:
          description: 'Authorization code time to live


            After an authorization code reaches its time to live, it expires and it cannot be used to

            authorize the request to the `/token` endpoint.'
          example: 10m0s
          format: duration
          type: string
        id_jag_ttl:
          default: 5m0s
          description: 'ID-JAG time to live


            After an Identity Assertion JWT Authorization Grant reaches its time to live, it expires

            and it cannot be redeemed at the resource authorization server. Kept short by default

            because the grant is redeemed immediately, and its expiry bounds how long the resource

            server must remember the grant identifier to reject replays.'
          example: 5m0s
          format: duration
          type: string
        id_token_ttl:
          description: 'ID token time to live


            After an ID token reaches its time to live, it expires and it cannot be used to provide

            user profile information to a client application.'
          example: 1h10m30s
          format: duration
          type: string
        refresh_token_ttl:
          default: 720h0m0s
          description: 'Refresh token time to live


            After a refresh token reaches its time to live, it expires and it cannot be used to obtain

            new access tokens for a client application.'
          example: 720h0m0s
          format: duration
          type: string
      type: object
    PIICategory:
      properties:
        name:
          description: name
          example: HIPAA
          type: string
      type: object
    RFC6749Error:
      properties:
        cause:
          type: string
        details:
          type: object
        error:
          type: string
        error_description:
          type: string
        error_hint:
          type: string
        error_uri:
          type: string
        status_code:
          format: int64
          type: integer
      type: object
    AuthorizationDetailType:
      type: string
    RedirectURIs:
      description: 'SecureAuth uses redirect URIs to redirect users back to the application after they authorized the application. Along

        with the redirection, an authorization code or access token is added to the URL.


        For backward compatibility reasons, it''s also acceptable to pass `redirect_uris` as a string, for example:

        https://example.com/callback.


        example: ["https://example.com/callback"]'
      items:
        type: string
      title: OAuth-allowed redirect URIs
      type: array
    CDRDynamicClientRegistrationRequest:
      properties:
        agent_capability:
          $ref: '#/components/schemas/AgentCapability'
        app_url:
          description: Application URL
          type: string
        application_purpose:
          description: Application purpose
          enum:
          - single_page
          - server_web
          - mobile_desktop
          - service
          - legacy
          - custom
          - saml
          - ai_agent
          example: signle_page
          type: string
        application_type:
          default: web
          description: 'The client application type.


            Client applications can be either of a `web` or `native` types.


            Web applications include clients like server web applications or service apps.


            Native applications include single-page applications (SPAs) and mobile or desktop

            applications.


            Apply security measures according to the type of your application.'
          example: web
          type: string
        application_types:
          default:
          - server_web
          description: An array of dynamically calculated application types that can be used for filtering
          example:
          - single_page
          - server_web
          - mobile_desktop
          - service
          - legacy
          - dcr
          items:
            enum:
            - single_page
            - server_web
            - mobile_desktop
            - service
            - legacy
            - dcr
            type: string
          readOnly: true
          type: array
        aud:
          description: 'The audience for the request. This should be the unique identifier

            for the ASPSP issued by the issuer of the software statement.

            An ASPSP processing the software statement may validate the value

            of the claim and reject software statements for which the ASPSP

            is not the audience.The value must be a Base62 encoded GUID.'
          pattern: ^[0-9a-zA-Z]{1,18}$
          type: string
        audience:
          default:
          - client_id
          description: 'Identity of the intended recipients (the audience).


            Typically, the audience is a single resource server or a list of resource servers.


            It is considered a good practice to limit the audience of the token for security purposes.'
          items:
            type: string
          type: array
        authorization_details_types:
          description: 'Authorization details types


            Indicates what authorization details types the client can use.'
          items:
            $ref: '#/components/schemas/AuthorizationDetailType'
          type: array
        authorization_encrypted_response_alg:
          description: 'Algorithm used for encrypting authorization responses.


            If both signing and encryption are requested, the response is first signed, and then encrypted.

            As a result, a Nested JWT is obtained, as defined in JWT [RFC7519].


            If omitted, no encryption is applied by default.'
          enum:
          - RSA-OAEP
          - RSA-OAEP-256
          example: RSA-OAEP-256
          type: string
        authorization_encrypted_response_enc:
          description: 'Algorithm used for encrypting authorization responses.


            With `authorization_encrypted_response_alg` specified, the default value is `A128CBC-HS256`.

            When `authorization_encrypted_response_enc` is included, `authorization_encrypted_response_alg`

            MUST also be provided in a request.'
          enum:
          - A256GCM
          - A128CBC-HS256
          example: A128CBC-HS256
          type: string
        authorization_signed_response_alg:
          description: 'Algorithm used for signing authorization responses.


            With this parameter specified, the response is signed using JWS and according to the configured algorithm.


            `none` isn''t allowed.'
          example: RS256
          type: string
        backchannel_authentication_request_signing_alg:
          description: 'OPTIONAL. The JWS alg algorithm value used by the client application to sign authentication requests.


            When omitted, the client application doesn''t send signed authentication requests.'
          type: string
        backchannel_client_notification_endpoint:
          description: 'REQUIRED for requests when the client application uses CIBA as an authorization grant type, and the token

            delivery mode is set to `ping` or `push`.


            This parameter is the endpoint where an OP (OpenID Provider) posts a notification after end-user authentication.


            Input: an HTTPS URL.'
          type: string
        backchannel_logout_session_required:
          description: Boolean value specifying whether the RP requires that a sid (session ID) claim be included in the Logout Token to identify the RP session with the OP when the backchannel_logout_uri is used.
          type: boolean
        backchannel_logout_uri:
          description: RP URL that will cause the RP to log itself out when sent a Logout Token by the OP.
          type: string
        backchannel_token_delivery_mode:
          description: 'REQUIRED for requests when the client application uses CIBA as an authorization grant type.


            Input: `poll`, `ping`, or `push`.'
          type: string
        backchannel_user_code_parameter:
          description: 'OPTIONAL. A boolean value indicating the `user_code` parameter support by the client application.


            If omitted, the default value is `false`.


            This applies only when the `backchannel_user_code_parameter_supported` OP parameter is `true`.'
          type: boolean
        certificate:
          description: 'Base64 encoded certicate in PEM format that will be automatically converted and stored in jwks


            It is used only as an input parameter for the Create / Import Client.'
          type: string
        client_id_issued_at:
          description: 'The client identifier time of issue.


            The value is the number of seconds between 1970-01-01T00:00:00Z (UTC) and the date/time of issue.'
          format: int64
          type: integer
        client_name:
          description: Human-readable name of a client application.
          example: My app
          type: string
        client_secret_expires_at:
          description: 'The client secret expiration time.


            If the client secret does not expire, `client_secret_expires_at` = `0`.'
          format: int64
          type: integer
        client_uri:
          description: URI of a client application.
          type: string
        created_at:
          description: Date when the client application was created.
          example: '2022-04-07T19:17:31.323187Z'
          format: date-time
          type: string
        default_acr_values:
          description: 'default ACR values

            list of ACR values that will be implicitly requested for the client if not explicitly specified'
          items:
            format: acrValue
            type: string
          type: array
        description:
          description: Description of the client application.
          type: string
        dpop_bound_access_tokens:
          description: 'Boolean value specifying whether the client always uses DPoP for token requests

            If true, the authorization server will reject token requests from this client that do not contain the DPoP header.'
          type: boolean
        enforce_application_membership:
          description: 'Enforce application membership for this application. When true, a user token is issued only if the

            user has membership/access to this application in the resolved organization. Defaults to false and,

            on creation, to the workspace-level default. Only meaningful while the applications_membership feature is enabled.'
          type: boolean
        exp:
          description: 'The time at which the request expires expressed as seconds since

            the epoch. An ASPSP processing the request must reject requests

            where the current time is greater than the time specified in the claim.'
          format: int64
          type: integer
        grant_types:
          default:
          - authorization_code
          description: 'An array of allowed OAuth client grant types.


            The `grantTypes` array stores OAuth flows that are allowed for a given client application.


            [Read more](https://cloudentity.com/developers/basics/oauth-grant-types/grant-types-overview/) about grant types.'
          example:
          - password
          - refresh_token
          - client_credentials
          - implicit
          - authorization_code
          items:
            enum:
            - authorization_code
            - implicit
            - client_credentials
            - refresh_token
            - password
            - urn:ietf:params:oauth:grant-type:jwt-bearer
            - urn:openid:params:grant-type:ciba
            - urn:ietf:params:oauth:grant-type:token-exchange
            - urn:ietf:params:oauth:grant-type:device_code
            type: string
          type: array
        iat:
          description: 'The time at which the request was issued by the TPP expressed

            as "seconds since the epoch"'
          format: int64
          type: integer
        id_token_encrypted_response_alg:
          description: JWE alg algorithm for encrypting the ID token issued to this client application.
          enum:
          - RSA-OAEP
          - RSA-OAEP-256
          type: string
        id_token_encrypted_response_enc:
          description: JWE enc algorithm for encrypting the ID token issued to this client application.
          enum:
          - A256GCM
          - A128CBC-HS256
          type: string
        id_token_signed_response_alg:
          description: 'Algorithm for signing ID tokens issued for a client application.


            The default value depends on authorization server configuration.'
          enum:
          - RS256
          - ES256
          - PS256
          example: ES256
          type: string
        introspection_endpoint_auth_method:
          default: client_secret_basic
          description: 'An introspection endpoint authentication method configured for the client application (read-only).


            If empty, the `token_endpoint_auth_method` is used.


            SecureAuth supports the following client authentication methods:

            `client_secret_basic`, `client_secret_post`, `client_secret_jwt`, `private_key_jwt`,

            `self_signed_tls_client_auth`, `tls_client_auth`, `none`.


            [Read more](https://cloudentity.com/developers/basics/oauth-client-authentication/client-authentication-overview/) about client authentication.'
          enum:
          - client_secret_basic
          - client_secret_post
          - client_secret_jwt
          - private_key_jwt
          - self_signed_tls_client_auth
          - tls_client_auth
          - none
          example: client_secret_basic
          type: string
        iss:
          description: 'Identifier for the TPP. This value must be unique for each TPP

            registered by the issuer of the SSA.The value must be a Base62

            encoded GUID. For SSAs issued by the OB Directory,

            this must be the software_id.'
          pattern: ^[0-9a-zA-Z]{1,22}$
          type: string
        jti:
          description: A unique identifier for the JWT. The value must be a UUIDv4 GUID.
          pattern: ^[0-9A-F]{8}-[0-9A-F]{4}-4[0-9A-F]{3}-[89AB][0-9A-F]{3}-[0-9A-F]{12}$
          type: string
        jwks:
          $ref: '#/components/schemas/ClientJWKs'
        jwks_uri:
          description: A URL of JSON Web Key Set with the public keys used by a client application to authenticate to SecureAuth.
          type: string
        logo_uri:
          description: Logo URI.
          type: string
        organisation_id:
          description: 'External organization identifier. It is a unique string assigned by the CDR Register to identify an Accredited

            Data Recipient Brand.


            The value obtained is used as the `aud` claim for message signing, for example, when a JSON Web Token (JWT) is

            required for authorization, and represents the audience(s) the JWT is intended for.'
