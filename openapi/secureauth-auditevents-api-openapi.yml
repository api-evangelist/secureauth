          description: 'Enforce application membership for this application. When true, a user token is issued only if the

            user has membership/access to this application in the resolved organization. Defaults to false and,

            on creation, to the workspace-level default. Only meaningful while the applications_membership feature is enabled.'
          type: boolean
        grant_types:
          default:
          - authorization_code
          description: 'An array of allowed OAuth client grant types.


            The `grantTypes` array stores OAuth flows that are allowed for a given client application.


            [Read more](https://cloudentity.com/developers/basics/oauth-grant-types/grant-types-overview/) about grant types.'
          example:
          - password
          - refresh_token
          - client_credentials
          - implicit
          - authorization_code
          items:
            enum:
            - authorization_code
            - implicit
            - client_credentials
            - refresh_token
            - password
            - urn:ietf:params:oauth:grant-type:jwt-bearer
            - urn:openid:params:grant-type:ciba
            - urn:ietf:params:oauth:grant-type:token-exchange
            - urn:ietf:params:oauth:grant-type:device_code
            type: string
          type: array
        id_token_encrypted_response_alg:
          description: JWE alg algorithm for encrypting the ID token issued to this client application.
          enum:
          - RSA-OAEP
          - RSA-OAEP-256
          type: string
        id_token_encrypted_response_enc:
          description: JWE enc algorithm for encrypting the ID token issued to this client application.
          enum:
          - A256GCM
          - A128CBC-HS256
          type: string
        id_token_signed_response_alg:
          description: 'Algorithm for signing ID tokens issued for a client application.


            The default value depends on authorization server configuration.'
          enum:
          - RS256
          - ES256
          - PS256
          example: ES256
          type: string
        introspection_endpoint_auth_method:
          default: client_secret_basic
          description: 'An introspection endpoint authentication method configured for the client application (read-only).


            If empty, the `token_endpoint_auth_method` is used.


            SecureAuth supports the following client authentication methods:

            `client_secret_basic`, `client_secret_post`, `client_secret_jwt`, `private_key_jwt`,

            `self_signed_tls_client_auth`, `tls_client_auth`, `none`.


            [Read more](https://cloudentity.com/developers/basics/oauth-client-authentication/client-authentication-overview/) about client authentication.'
          enum:
          - client_secret_basic
          - client_secret_post
          - client_secret_jwt
          - private_key_jwt
          - self_signed_tls_client_auth
          - tls_client_auth
          - none
          example: client_secret_basic
          type: string
        jwks:
          $ref: '#/components/schemas/ClientJWKs'
        jwks_uri:
          description: A URL of JSON Web Key Set with the public keys used by a client application to authenticate to SecureAuth.
          type: string
        logo_uri:
          description: Logo URI.
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
        organisation_id:
          description: 'External organization identifier. It is a unique string assigned by the CDR Register to identify an Accredited

            Data Recipient Brand.


            The value obtained is used as the `aud` claim for message signing, for example, when a JSON Web Token (JWT) is

            required for authorization, and represents the audience(s) the JWT is intended for.'
          example: 5647fe90-f6bc-11eb-9a03-0242ac130003
          type: string
        policy_uri:
          description: Policy URL to read about how the profile data is used.
          type: string
        post_logout_redirect_uris:
          description: Array of URLs to which a relying party may request that the user be redirected after a logout has been performed.
          items:
            type: string
          type: array
        privacy:
          $ref: '#/components/schemas/ClientPrivacy'
        redirect_uris:
          $ref: '#/components/schemas/RedirectURIs'
        request_object_encryption_alg:
          description: Optional JWE alg algorithm the client is declaring that it may use for encrypting Request Objects
          enum:
          - RSA-OAEP
          - RSA-OAEP-256
          example: RSA-OAEP
          type: string
        request_object_encryption_enc:
          description: 'Optional JWE enc algorithm the client is declaring that it may use for encrypting Request Objects

            When `request_object_encryption_enc` is included, `request_object_encryption_alg` MUST also be provided.'
          enum:
          - A256GCM
          - A128CBC-HS256
          example: A256GCM
          type: string
        request_object_signing_alg:
          default: any
          description: 'Request object signing algorithm for the token endpoint


            SecureAuth supports signing tokens with the RS256, ES256, and PS256 algorithms. If you do not want

            to use a signing algorithm, set the value of this parameter to `none`.'
          enum:
          - any
          - none
          - RS256
          - ES256
          - PS256
          example: none
          type: string
        request_uris:
          description: Array of absolute URIs that points to the Request Object that holds authorization request parameters.
          items:
            type: string
          type: array
        require_pushed_authorization_requests:
          description: Boolean parameter indicating whether the only means of initiating an authorization request the client is allowed to use is PAR.
          type: boolean
        response_types:
          $ref: '#/components/schemas/ResponseTypes'
        revocation_endpoint_auth_method:
          default: client_secret_basic
          description: 'A revocation endpoint authentication method configured for the client application (read-only).

            If empty, the `token_endpoint_auth_method` is used.


            SecureAuth supports the following client authentication methods:

            `client_secret_basic`, `client_secret_post`, `client_secret_jwt`, `private_key_jwt`,

            `self_signed_tls_client_auth`, `tls_client_auth`, `none`.


            [Read more](https://cloudentity.com/developers/basics/oauth-client-authentication/client-authentication-overview/) about client authentication.'
          enum:
          - client_secret_basic
          - client_secret_post
          - client_secret_jwt
          - private_key_jwt
          - self_signed_tls_client_auth
          - tls_client_auth
          - none
          example: client_secret_basic
          type: string
        scope:
          description: Space-separated list of scopes for compatibility with the OAuth specification.
          example: email offline_access openid
          type: string
        scopes:
          description: An array of string represented scopes assigned to a client application
          example:
          - email
          - offline_access
          - openid
          items:
            type: string
          type: array
        sector_identifier_uri:
          description: 'OPTIONAL. [A URL using the HTTPS scheme](https://openid.net/specs/openid-connect-registration-1_0.html#SectorIdentifierValidation).

            It must reference a JSON file with the array of `redirect_uri` values.


            Pass this parameter when you use multiple domains in your `redirect_uris` or need a mechanism to allow changes in

            domain without affecting consumer consent.


            [Read more](https://openid.net/specs/openid-connect-core-1_0.html)'
          type: string
        skip_dbfp:
          description: 'Skip device-based fingerprint (DBFP) collection for this client.

            If true, the interactive DBFP collection step is skipped during login, which lets

            non-interactive clients (e.g. backend HTTP clients that cannot execute the collection

            JavaScript) complete the authorization flow. Risk inference is unaffected.'
          type: boolean
        software_statement:
          description: 'A digitally signed or MACed JSON Web Token (JWT) [RFC7519] that

            asserts metadata values about the client software.  In some cases,

            a software statement is issued directly by the client

            developer.  In other cases, a software statement is issued by

            a third-party organization for use by the client developer.


            In both cases, the trust relationship the authorization server has

            with the issuer of the software statement is intended to be used

            as an input to the evaluation of whether the registration request

            is accepted.


            A software statement can be presented to an

            authorization server as part of the client registration request.'
          type: string
        software_statement_payload:
          $ref: '#/components/schemas/Metadata'
        subject_type:
          default: public
          description: 'Subject identifier type


            Stores information if the subject identifier is of the `public` or the `pairwise` type.


            Subject identifiers identify an end-user. They are locally unique and never reassigned within the Issuer,

            and are intended to be consumed by client applications. There are two types

            of subject identifiers: `public` and `pairwise`.


            For the `public` type, the value of the `sub` (subject) token claim is the same for all clients.


            For the `pairwise` type, a different `sub` (subject) token claim is provided for each client.

            Using the `pairwise` subject identifier makes it impossible for client applications to correlate the end-user''s

            activity without their permission.'
          enum:
          - public
          - pairwise
          example: public
          type: string
        system:
          description: Defines whether the client application is a system tenant's application or not.
          type: boolean
        tenant_id:
          description: ID of a tenant where the client application is added
          example: default
          format: tenantID
          type: string
        tls_client_auth_san_dns:
          description: A string containing the value of an expected dNSName SAN entry in the certificate.
          type: string
        tls_client_auth_san_email:
          description: A string containing the value of an expected rfc822Name SAN entry in the certificate.
          type: string
        tls_client_auth_san_ip:
          description: A string representation of an IP address in either dotted decimal notation (for IPv4) or colon-delimited hexadecimal (for IPv6, as defined in [RFC5952]) that is expected to be present as an iPAddress SAN entry in the certificate.
          type: string
        tls_client_auth_san_uri:
          description: A string containing the value of an expected uniformResourceIdentifier SAN entry in the certificate.
          type: string
        tls_client_auth_subject_dn:
          description: An [RFC4514] string representation of the expected subject distinguished name of the certificate.
          type: string
        tls_client_certificate_bound_access_tokens:
          description: Boolean value indicating server support for mutual TLS client certificate-bound access tokens. If omitted, the default value is "false".
          type: boolean
        token_endpoint_auth_method:
          default: client_secret_basic
          description: 'Token endpoint authentication method configured for a client application


            SecureAuth supports the following client authentication methods:

            `client_secret_basic`, `client_secret_post`, `client_secret_jwt`, `private_key_jwt`,

            `self_signed_tls_client_auth`, `tls_client_auth`, `none`.


            To learn more, go to the Authorization Basics > Client Authentication section of this guide.'
          enum:
          - client_secret_basic
          - client_secret_post
          - client_secret_jwt
          - private_key_jwt
          - self_signed_tls_client_auth
          - tls_client_auth
          - none
          - unspecified
          example: client_secret_basic
          type: string
        token_endpoint_auth_signing_alg:
          default: ES256
          description: 'Signing algorithm for the token endpoint


            This field is optional. If empty, a client can use any algorithm supported by the server (see `token_endpoint_auth_signing_alg_values_supported` in the well-known endpoing).


            If provided, depending on the server configuration, client can use of one: HS256, RS256, ES256, PS256 algorithms.


            If your token endpoint authentication is set to the `private_key_jwt` method, the

            `token_endpoint_auth_signing_alg` parameter must be either RS256, ES256, or PS256.


            If your token endpoint authentication is set to the `client_secret_jwt` method,

            the `token_endpoint_auth_signing_alg` parameter must be HS256.'
          enum:
          - RS256
          - ES256
          - PS256
          - HS256
          - ''
          example: ES256
          type: string
        token_exchange:
          $ref: '#/components/schemas/ClientTokenExchangeConfiguration'
        token_ttls:
          $ref: '#/components/schemas/TokenTTLs'
        tos_uri:
          description: Terms of Service URL.
          type: string
        trusted:
          description: 'Defines whether the client application is trusted or not.


            For trusted clients, consent pages are skipped during the authorization process.'
          type: boolean
        updated_at:
          description: Date when the client application was updated.
          example: '2022-05-08T01:11:51.1262916Z'
          format: date-time
          type: string
        use_custom_token_ttls:
          description: If enabled the client application will be able to set its own token TTLs.
