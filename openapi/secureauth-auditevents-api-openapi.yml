          example: 1h10m30s
          format: duration
          type: string
        custom_issuer_url:
          description: 'Defines a custom issuer URL that can be used as the value of the `iss` claim in an access

            token.


            If not provided, it is built dynamically based on the server''s URL.'
          example: http://example.com/default/default
          type: string
