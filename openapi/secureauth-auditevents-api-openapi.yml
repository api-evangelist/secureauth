          $ref: '#/components/schemas/CDRConfiguration'
        color:
          default: '#007FFF'
          description: Your server's label color in a HEX format.
          example: '#007FFF'
          type: string
        consent_id_namespace:
          description: 'Namespace used when creating Open Banking Brasil consent IDs


            Consent IDs will have the form of urn:<consent_id_namespace>:<uid> when this is set.

            If this is empty, the tenant id is used by default'
          type: string
        cookie_max_age:
          description: 'Cookie max age


