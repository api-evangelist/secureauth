openapi: 3.2.0
info:
  title: Secureauth Audit Events API
  version: latest
  description: 'Operations tagged auditEvents across 2 of this provider''s published API definitions: secureauth-admin-openapi.yml, secureauth-system-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://localhost:8443/api/admin/default
- url: https://localhost:8443/api/system/default
tags:
- name: auditEvents
paths:
  /servers/{wid}/audit-events:
    get:
      description: Returns list of audit events.
      operationId: listAuditEvents
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
        name: if-match
        schema:
          type: string
          format: etag
      - description: Unique identifier included in audit events for request tracking
        in: header
        name: x-correlation-id
        schema:
          type: string
      - description: Key used to safely retry failed requests without duplicate processing
        in: header
        name: x-idempotency-key
        schema:
          type: string
      - description: Authorization server id
        in: path
        name: wid
        required: true
        schema:
          type: string
          default: admin
      - description: 'optional list audit events with a given client id

          ClientID'
        in: query
        name: client_id
        schema:
          type: string
      - description: 'optional list audit events with a given subject

          Subject'
        in: query
        name: subject
        schema:
          type: string
      - description: 'optional list audit events with a given ip address

          IP'
        in: query
        name: ip
        schema:
          type: string
      - description: 'optional list audit events with high risk

          IP'
        in: query
        name: high_risk
        schema:
          type: string
      - description: 'optional list audit events with a given result (success/failure)

          IP'
        in: query
        name: result
        schema:
          type: string
      - description: 'optional list audit events with a given session id


          it can be used as a correlation id for listing all login related audit events

          SessionID'
        in: query
        name: session_id
        schema:
          type: string
      - description: optional list audit events with a given authorization correlation id
        in: query
        name: authorization_correlation_id
        schema:
          type: string
      - description: 'optional list audit events with a given IDP subject

          IDPSubject'
        in: query
        name: idp_subject
        schema:
          type: string
      - description: 'optional list audit events with a given IDP id

          IDPID'
        in: query
        name: idp_id
        schema:
          type: string
      - description: 'optional list audit events performed by a principal from a given identity pool

          UserPoolID'
        in: query
        name: user_pool_id
        schema:
          type: string
      - description: 'optional list audit events with a given user id

          UserID'
        in: query
        name: user_id
        schema:
          type: string
      - description: 'optional list audit events with a given IDP method

          IDPMethod'
        in: query
        name: idp_method
        schema:
          type: string
      - description: optional organization id
        in: query
        name: organization_id
        schema:
          type: string
      - description: optional list audit events for a given application (target OAuth client id)
        in: query
        name: application_id
        schema:
          type: string
      - description: 'optional list audit events targeting a given identity pool: the pool administered, or the

          pool owning the affected user or group'
        in: query
        name: identity_pool_id
        schema:
          type: string
      - description: 'optional list audit events with a given affected user identity pool id

          AffectedUserPoolID'
        in: query
        name: affected_user_pool_id
        schema:
          type: string
      - description: 'optional list audit events with a given affected user id

          AffectedUserID'
        in: query
        name: affected_user_id
        schema:
          type: string
      - description: 'optional list audit events with a given group id

          GroupID'
        in: query
        name: group_id
        schema:
          type: string
      - description: 'Optional list of event subjects, one of: request client gateway_request policy consent authorization_code recovery login access_token scopes otp gateway_policy user credential dcr role jit tokens service server

          EventSubject'
        in: query
        name: event_subject
        schema:
          type: array
          items:
            type: string
      - description: 'Optional list of event types, one of: authorized unauthorized created updated deleted requested accepted rejected issued denied granted attempted failed sent not_sent revoked generated reset_requested reset_completed add_requested add_completed

          EventType'
        in: query
        name: event_action
        schema:
          type: array
          items:
            type: string
      - description: 'list all events after a given time

          TimestampFrom'
        in: query
        name: timestamp_from
        schema:
          type: string
          format: date-time
      - description: 'list all events before a given time

          TimestampTo'
        in: query
        name: timestamp_to
        schema:
          type: string
          format: date-time
      - description: 'optional list events before a given event id

          BeforeEventID'
        in: query
        name: before_event_id
        schema:
          type: string
      - description: 'optional list audit events after a given event id

          AfterEventID'
        in: query
        name: after_event_id
        schema:
          type: string
      - description: 'optional sort audit events by a given field

          Sort'
        in: query
        name: sort
        schema:
          type: string
      - description: 'optional order audit events by given direction

          Order'
        in: query
        name: order
        schema:
          type: string
      - description: 'optional limit results, min 1, max 100

          Limit'
        in: query
        name: limit
        schema:
          type: integer
          format: int64
          default: 20
          maximum: 100
          minimum: 1
      responses:
        '200':
          $ref: '#/components/responses/AuditEventsResponse'
        '400':
          $ref: '#/components/responses/badRequestHTTPError'
        '401':
          $ref: '#/components/responses/unauthorizedHTTPError'
        '403':
          $ref: '#/components/responses/forbiddenHTTPError'
        '404':
          $ref: '#/components/responses/notFoundHTTPError'
        '429':
          $ref: '#/components/responses/tooManyRequestsHTTPError'
      security:
      - admin: []
      summary: List audit events
      tags:
      - auditEvents
    servers:
    - url: https://localhost:8443/api/admin/default
components:
  schemas:
    AccessRequestDataWithError:
      properties:
        actor_claims:
          additionalProperties:
            type: object
          description: Actor claims
          type: object
        affected_user_id:
          description: ID of the User in Identity Pool that is affected by an action
          format: userID
          type: string
        affected_user_pool_id:
          description: ID of the Identity Pool of the User that is affected by an action
          format: poolID
          type: string
        authentication_mechanisms:
          description: The authentication mechanisms a user used to login.
          items:
            enum:
            - totp
            - password
            - otp
            - email_otp
            - sms_otp
            - voice_otp
            - webauthn
            - usernameless_webauthn
            - push
            - symbol
            - qr_code
            type: string
          type: array
        city:
          description: The visitor's city
          type: string
        client_id:
          description: OAuth client application identifier.
          format: clientID
          type: string
        client_name:
          description: Human readable name of a client application
          type: string
        country_code:
          description: The visitor's country
          type: string
        created_by_developer:
          description: Stores information if the owner of the client application is a developer.
          type: boolean
        dbfp:
          description: DBFP `jwt` cookie.
          type: string
        error:
          description: High level error name (request_forbidden, access_denied, invalid_request).
          type: string
        error_cause:
          description: Error root cause (invalid_pkce, invalid_state, user_policy_failed).
          type: string
        error_description:
          description: Human readable error description
          type: string
        error_hint:
          description: Error hint
          type: string
        external_error:
          description: External error
          type: boolean
        grant_type:
          description: 'Stores the information which grant type was selected to perfom a given action.

            Matches one of allowed OAuth client grant types for a given client.'
          type: string
        granted_scopes:
          description: Granted scopes
          items:
            type: string
          type: array
        group_id:
          description: ID of the Group in Identity Pool
          format: groupID
          type: string
        identity_pool_id:
          description: 'ID of the Identity Pool the action targets: the pool being administered, or the pool

            owning the affected user or group. Not the acting principal''s pool -- that is user_pool_id.'
          format: poolID
          type: string
        idp_id:
          description: IDP identifier
          format: idpID
          type: string
        idp_method:
          description: IDP method
          type: string
        idp_subject:
          description: Subject within the Identity Provider
          format: subject
          type: string
        latitude:
          description: The visitor's latitude
          type: string
        longitude:
          description: The visitor's longitude
          type: string
        may_act_claims:
          additionalProperties:
            type: object
          description: May act claims
          type: object
        organization_id:
          description: ID of the Organization
          format: serverID
          type: string
        public:
          description: Stores information if the client application is a public one.
          type: boolean
        recovery:
          description: True if user had to do login recovery during authentication
          type: boolean
        remote_addr:
          description: Requester IP address obtained from system network socket information.
          type: string
        risk_engine_context:
          $ref: '#/components/schemas/RiskContext'
        server_id:
          description: ID of the authorization server (workspace) to which an access request is tied.
          format: serverID
          type: string
        session_id:
          description: 'Session id of a given subject. It''s uniform across the authentication processes.

            It can be used as a correlation ID between a different audit events.'
          format: loginID
          type: string
        subject:
          description: 'Identification of the principal that is the subject of authorization.

            For the authorization grant, the subject typically identifies an authorized accessor for which the access token is being requested.

            For client authentication, the subject is the client_id of the OAuth client.'
          format: subject
          type: string
        system:
          description: Stores information if the client application is a system tenant's application.
          type: boolean
        token_endpoint_authn_method:
          description: Token endpoint authentication method configured for a client application.
          enum:
          - client_secret_basic
          - client_secret_post
          - client_secret_jwt
          - private_key_jwt
          - self_signed_tls_client_auth
          - tls_client_auth
          - none
          - unspecified
          type: string
        token_signature:
          description: Token signature
          type: string
        true_client_ip:
          description: Requester IP address obtained from True-Client-IP header.
          type: string
        user_agent:
          description: A characteristic string that lets servers and network peers identify the application, operating system, vendor, and/or version of the requesting user agent.
          type: string
        user_id:
          description: ID of the User in Identity Pool
          format: userID
          type: string
        user_pool_id:
          description: ID of the Identity Pool of the principal that performed the action.
          format: poolID
          type: string
        workspace_id:
          description: ID of the authorization server (workspace) to which a resource is tied.
          format: serverID
          type: string
        x_forwarded_for:
          description: Requester IP address obtained from X-Forwarded-For header.
          type: string
        x_real_ip:
          description: Requester IP address obtained from X-Real-IP header.
          type: string
      type: object
    DeprecatedOBBRConfiguration:
      properties:
        industry:
          $ref: '#/components/schemas/DeprecatedOBBRIndustry'
      type: object
    ApplicationOpenAccessAuditPayload:
      properties:
        app_workspace_id:
          format: serverID
          type: string
        cascade_to_suborgs:
          type: boolean
        client_id:
          format: clientID
          type: string
        open_to_all:
          type: boolean
        organization_id:
          format: serverID
          type: string
      type: object
    Service:
      properties:
        audience_mode:
          description: Controls which audience is injected into access tokens for scopes mapped to this service
          enum:
          - spiffe
          - custom
          - none
          example: spiffe
          type: string
        authorization_server_id:
          description: Authorization server identifier
          example: my-server
          format: serverID
          type: string
        capabilities:
          description: Service capabilities
          items:
            $ref: '#/components/schemas/ServiceCapability'
          type: array
        custom_audience:
          description: Custom service audience
          example: https://api.example.com
          type: string
        description:
          description: Service description
          example: Service description
          type: string
        gateway_id:
          description: Gateway identifier
          example: gateway-1
          format: gatewayID
          type: string
        id:
          description: A unique identifier of a service
          example: service-1
          format: serviceID
          type: string
        name:
          description: Service name
          example: My service
          type: string
        system:
          description: '`true` when the service is a system service'
          example: false
          type: boolean
        tenant_id:
          description: Tenant identifier
          example: my-company
          format: tenantID
          type: string
        type:
          default: user
          description: Service type
          enum:
          - oauth2
          - oidc
          - system
          - user
          - openbanking
          type: string
        updated_at:
          description: The date of service update
          format: date-time
          type: string
        with_specification:
          description: '`true` when the service has the OpenAPI 3.0 specification'
          type: boolean
      type: object
    ConsentDetails:
      properties:
        cdr:
          $ref: '#/components/schemas/CDRArrangement'
        cdr_previous:
          $ref: '#/components/schemas/CDRArrangement'
        fdx:
          $ref: '#/components/schemas/FDXConsent'
      type: object
    BruteForceLimit:
      properties:
        block_duration:
          example: 1m0s
          format: duration
          type: string
        max_attempts:
          description: Max number of attempts
          example: 5
          format: int64
          type: integer
        protected_type:
          $ref: '#/components/schemas/ProtectedType'
        tenant_id:
          example: default
          format: tenantID
          type: string
      required:
      - tenant_id
      - protected_type
      - max_attempts
      - block_duration
      type: object
    CookiesConfiguration:
      properties:
        same_site:
          $ref: '#/components/schemas/SameSite'
      type: object
    EventAddress:
      description: EventAddress event address
      properties:
        value:
          description: value
          type: string
      type: object
    Gateway:
      properties:
        authorization_server_id:
          description: authorization server id
          example: default
          format: serverID
          type: string
        client_id:
          description: id of a client created for this gateway for authentication
          format: clientID
          type: string
        create_and_bind_services_automatically:
          description: if true services are created automatically for each new discovered api group
          type: boolean
        default_policy_id:
          description: default policy id assigned to new APIs
          format: policyID
          type: string
        description:
          description: description
          type: string
        id:
          description: unique gateway id
          example: '1'
          format: gatewayID
          type: string
        last_active:
          description: last time a client fetched configuration
          format: date-time
          type: string
        name:
          description: gateway name
          example: SecureAuth Pyron
          type: string
        tenant_id:
          description: tenant id
          example: default
          format: tenantID
          type: string
        token_exchange:
          $ref: '#/components/schemas/GatewayTokenExchangeSettings'
        token_exchange_client_id:
          description: Token exchange client id
          format: clientID
          type: string
        type:
          description: 'gateway type, one of: pyron, aws'
          example: pyron
          format: gatewayType
          type: string
      type: object
    GatewayTokenExchangeSettings:
      properties:
        enabled:
          type: boolean
        trusted_idp_ids:
          items:
            format: idpID
            type: string
          type: array
      type: object
    OTPPayload:
      properties:
        address:
          type: string
        failure_reason:
          type: string
        otp_id:
          type: string
        purpose:
          type: string
        redaction:
          $ref: '#/components/schemas/RedactionPolicy'
        type:
          enum:
          - sms
          - email
          - voice
          type: string
        user_id:
          format: userID
          type: string
      type: object
    Metadata:
      additionalProperties:
        type: object
      type: object
    Org:
      properties:
        authentication_mechanisms:
          description: allowed authentication mechanisms
          items:
            enum:
            - totp
            - password
            - otp
            - email_otp
            - sms_otp
            - voice_otp
            - webauthn
            - usernameless_webauthn
            - push
            - symbol
            - qr_code
            type: string
          type: array
        color:
          default: '#007FFF'
          description: Your organization's label color in a HEX format.
          example: '#007FFF'
          type: string
        created_at:
          description: 'Date the workspace or organization was created.


            Not set for workspaces and organizations that existed before this field was introduced,

            as there is no stored creation time to recover for them.'
          example: '2026-04-07T19:17:31.323187Z'
          format: date-time
          readOnly: true
          type: string
        deactivated:
          type: boolean
        description:
          description: Display description of the organization
          example: Organization description
          type: string
        domains:
          description: An array of email domains configured for an organization for the purposes of IDP discovery
          items:
            type: string
          type: array
        id:
          description: 'Unique identifier of an organization


            If not provided, a random ID is generated.'
          example: default
          format: serverID
          type: string
        metadata:
          $ref: '#/components/schemas/ServerMetadata'
        name:
          description: Display name of the organization
          example: default
          type: string
        parent_id:
          description: The id of the parent workspace / organization
          format: serverID
          type: string
        template:
          description: If true this organization can be used as a template when creating a new ones.
          type: boolean
        updated_at:
          description: 'Date the workspace or organization was last updated.


            Not set until the first write after this field was introduced.'
          example: '2026-05-08T01:11:51.126291Z'
          format: date-time
          readOnly: true
          type: string
      type: object
    ServiceProviderDiscoveryMode:
      type: string
    FDXConsent:
      properties:
        authorization_server_id:
          format: serverID
          type: string
        client_id:
          format: clientID
          type: string
        createdTime:
          description: Time of consent creation
          format: date-time
          type: string
        durationPeriod:
          description: Consent duration, in days, from day of original grant.
          format: int64
          type: integer
        durationType:
          $ref: '#/components/schemas/DurationType'
        expirationTime:
          description: Time of consent expiration
          format: date-time
          type: string
        granted_resources:
          description: 'Enumeration of the Clusters of granted data elements permissioned by this Consent Grant.

            Data Clusters are described in FDX RFC 0167.'
          items:
            $ref: '#/components/schemas/FDXGrantedResource'
          type: array
        id:
          $ref: '#/components/schemas/FDXConsentID'
        lookbackPeriod:
          description: Period, in days, for which historical data may be requested; period is measured from request time, not grant time
          format: int64
          type: integer
        parties:
          description: 'A collection of parameters identifying the Parties (including the legal entity operating branded products or services)

            in the data sharing chain. Descriptive information is collected during Data Recipient registration at Data Provider,

            and populated during issuance by DataProvider from its registry;'
          items:
            $ref: '#/components/schemas/FDXConsentGrantParty'
          type: array
        resources:
          description: 'Enumeration of the Clusters of requested data elements permissioned by this Consent Grant.

            Data Clusters are described in FDX RFC 0167.'
          items:
            $ref: '#/components/schemas/FDXRequestedResource'
          type: array
        revocationReason:
          $ref: '#/components/schemas/FDXConsentRevocation'
        status:
          $ref: '#/components/schemas/ConsentStatus'
        tenant_id:
          format: tenantID
          type: string
        updatedTime:
          description: Time of last consent's status change
          format: date-time
          type: string
      type: object
    CustomerConsentsAuditEventPayload:
      properties:
        customer_id:
          description: customer id
          type: string
        number_revoked:
          description: number of consents revoked
          format: int64
          type: integer
      type: object
    ClientAuditPayload:
      properties:
        agent_capability:
          $ref: '#/components/schemas/AgentCapability'
        app_url:
          description: Application URL
          type: string
        application_purpose:
          description: Application purpose
          enum:
          - single_page
          - server_web
          - mobile_desktop
          - service
          - legacy
          - custom
          - saml
          - ai_agent
          example: signle_page
          type: string
        application_type:
          default: web
          description: 'The client application type.


            Client applications can be either of a `web` or `native` types.


            Web applications include clients like server web applications or service apps.


            Native applications include single-page applications (SPAs) and mobile or desktop

            applications.


            Apply security measures according to the type of your application.'
          example: web
          type: string
        application_types:
          default:
          - server_web
          description: An array of dynamically calculated application types that can be used for filtering
          example:
          - single_page
          - server_web
          - mobile_desktop
          - service
          - legacy
          - dcr
          items:
            enum:
            - single_page
            - server_web
            - mobile_desktop
            - service
            - legacy
            - dcr
            type: string
          readOnly: true
          type: array
        audience:
          default:
          - client_id
          description: 'Identity of the intended recipients (the audience).


            Typically, the audience is a single resource server or a list of resource servers.


            It is considered a good practice to limit the audience of the token for security purposes.'
          items:
            type: string
          type: array
        authorization_details_types:
          description: 'Authorization details types


            Indicates what authorization details types the client can use.'
          items:
            $ref: '#/components/schemas/AuthorizationDetailType'
          type: array
        authorization_encrypted_response_alg:
          description: 'Algorithm used for encrypting authorization responses.


            If both signing and encryption are requested, the response is first signed, and then encrypted.

            As a result, a Nested JWT is obtained, as defined in JWT [RFC7519].


            If omitted, no encryption is applied by default.'
          enum:
          - RSA-OAEP
          - RSA-OAEP-256
          example: RSA-OAEP-256
          type: string
        authorization_encrypted_response_enc:
          description: 'Algorithm used for encrypting authorization responses.


            With `authorization_encrypted_response_alg` specified, the default value is `A128CBC-HS256`.

            When `authorization_encrypted_response_enc` is included, `authorization_encrypted_response_alg`

            MUST also be provided in a request.'
          enum:
          - A256GCM
          - A128CBC-HS256
          example: A128CBC-HS256
          type: string
        authorization_server_id:
          description: An authorization server (workspace) identifier holding the client application.
          example: default
          format: serverID
          type: string
        authorization_signed_response_alg:
          description: 'Algorithm used for signing authorization responses.


            With this parameter specified, the response is signed using JWS and according to the configured algorithm.


            `none` isn''t allowed.'
          example: RS256
          type: string
        backchannel_authentication_request_signing_alg:
          description: 'OPTIONAL. The JWS alg algorithm value used by the client application to sign authentication requests.


            When omitted, the client application doesn''t send signed authentication requests.'
          type: string
        backchannel_client_notification_endpoint:
          description: 'REQUIRED for requests when the client application uses CIBA as an authorization grant type, and the token

            delivery mode is set to `ping` or `push`.


            This parameter is the endpoint where an OP (OpenID Provider) posts a notification after end-user authentication.


            Input: an HTTPS URL.'
          type: string
        backchannel_logout_session_required:
          description: Boolean value specifying whether the RP requires that a sid (session ID) claim be included in the Logout Token to identify the RP session with the OP when the backchannel_logout_uri is used.
          type: boolean
        backchannel_logout_uri:
          description: RP URL that will cause the RP to log itself out when sent a Logout Token by the OP.
          type: string
        backchannel_token_delivery_mode:
          description: 'REQUIRED for requests when the client application uses CIBA as an authorization grant type.


            Input: `poll`, `ping`, or `push`.'
          type: string
        backchannel_user_code_parameter:
          description: 'OPTIONAL. A boolean value indicating the `user_code` parameter support by the client application.


            If omitted, the default value is `false`.


            This applies only when the `backchannel_user_code_parameter_supported` OP parameter is `true`.'
          type: boolean
        certificate:
          description: 'Base64 encoded certicate in PEM format that will be automatically converted and stored in jwks


            It is used only as an input parameter for the Create / Import Client.'
          type: string
        client_id:
          description: 'OAuth client application identifier


            If not provided, a random client ID is generated.'
          format: clientID
          type: string
        client_id_issued_at:
          description: 'The client identifier time of issue.


            The value is the number of seconds between 1970-01-01T00:00:00Z (UTC) and the date/time of issue.'
          format: int64
          type: integer
        client_name:
          description: Human-readable name of a client application.
          example: My app
          type: string
        client_secret_expires_at:
          description: 'The client secret expiration time.


