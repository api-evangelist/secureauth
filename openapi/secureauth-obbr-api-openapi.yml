openapi: 3.2.0
info:
  description: 'SecureAuth''s Brazil Open Banking

    and Open Insurance API collections meet

    the guidelines for products and services operating within the Open Finance ecosystem in Brazil.'
  title: SecureAuth Brazil Open Banking and Open Insurance OBBR API
  version: latest
servers:
- url: https://localhost:8443/default/default
tags:
- name: OBBR
paths:
  /open-banking-brasil/open-banking/automatic-payments/v1/recurring-consents/introspect:
    post:
      description: 'This endpoint accepts an OAuth 2.0 token and returns meta information surrounding the token along with the

        data access consent and the associated account identifiers.


        Pass the token as the bearer value with the `Authorization: Bearer` header. To obtain the token with all the required

        scopes, apply the

        Authorization Code grant type.


        Find the scopes list in the AUTHORIZATIONS block.'
      operationId: obbrAutomaticPaymentsRecurringConsentIntrospect
      responses:
        '200':
          $ref: '#/components/responses/IntrospectOBBRAutomaticPaymentsRecurringConsentResponse'
        '401':
          $ref: '#/components/responses/genericError'
        '404':
          $ref: '#/components/responses/genericError'
        '429':
          $ref: '#/components/responses/genericError'
      security:
      - default:
        - introspect_openbanking_tokens
      summary: Introspect Open Banking Brazil Automatic Payments Recurring Consent
      tags:
      - OBBR
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                token:
                  type: string
  /open-banking-brasil/open-banking/consents/v1/consents:
    post:
      deprecated: true
      description: 'This API allows an Account Information Service Provider (AISP) to create a consent to access the registration data

        of a Payment Service User (PSU), along with information about transactions in PSU''s accounts, credit cards, and

        contracted credit products.


        For authorization, pass the `Authorization: Bearer` header with an access token as the bearer value. To obtain the

        access token with all the required scopes, apply the

        Client Credentials grant type.


        Find the scopes list in the AUTHORIZATIONS block.'
      operationId: CreateDataAccessConsentDeprecated
      parameters:
      - description: 'The time when the PSU last logged in with the TPP.


          The value is supplied as a HTTP-date as in section 7.1.1.1 of [RFC7231]'
        in: header
        name: x-fapi-auth-date
        schema:
          type: string
      - description: The PSU's IP address if the PSU is currently logged in with the TPP.
        in: header
        name: x-fapi-customer-ip-address
        schema:
          type: string
      - description: 'An RFC4122 UID used as a correlation Id.


          If provided, the ASPSP must "play back" this value

          in the x-fapi-interaction-id response header.'
        in: header
        name: x-fapi-interaction-id
        schema:
          type: string
      - description: 'The header indicates the user-agent that the PSU is using.


          The TPP may populate this field with the user-agent indicated by the PSU.

          If the PSU is using a TPP mobile app, the TPP must ensure that the user-agent string

          is different from browser based user-agent strings.'
        in: header
        name: x-customer-user-agent
        schema:
          type: string
      - description: 'Header containing a detached JWS signature of the body of the payload.


          Refer to resource specific documentation on when this header must be specified.'
        in: header
        name: x-jws-signature
        schema:
          type: string
      - description: 'Every request will be processed only once per x-idempotency-key.

          The Idempotency Key will be valid for 24 hours'
        in: header
        name: x-idempotency-key
        schema:
          type: string
      responses:
        '201':
          $ref: '#/components/responses/BrazilCustomerDataAccessConsentResponse'
        '400':
          $ref: '#/components/responses/OBBRErrorResponse'
        '401':
          $ref: '#/components/responses/OBBRErrorResponse'
        '403':
          $ref: '#/components/responses/OBBRErrorResponse'
        '405':
          $ref: '#/components/responses/OBBRErrorResponse'
        '406':
          $ref: '#/components/responses/OBBRErrorResponse'
        '415':
          $ref: '#/components/responses/OBBRErrorResponse'
        '422':
          $ref: '#/components/responses/OBBRErrorResponse'
        '429':
          $ref: '#/components/responses/OBBRErrorResponse'
        '500':
          $ref: '#/components/responses/OBBRErrorResponse'
      security:
      - defaultcc:
        - consents
      summary: Create Data Access Consent v1
      tags:
      - OBBR
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrazilCustomerDataAccessConsentRequestV1'
        description: Request
