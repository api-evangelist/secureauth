  /open-banking/payments/v4/consents/{consentID}:
    get:
      description: 'Retrieve the information about a previously created payment consent. Pass the required consent identifier

        in the path.


        This endpoint is used by a Payment Initiation Service Provider (PISP).


        For authorization, pass the `Authorization: Bearer` with a token as a bearer value. To obtain the token and include

        the required scopes, apply the

        Client Credentials grant type.


        Find the scope list in the AUTHORIZATIONS block.'
      operationId: GetPaymentConsentV4
      parameters:
      - description: 'The time when the PSU last logged in with the TPP.


          The value is supplied as a HTTP-date as in section 7.1.1.1 of [RFC7231]'
        in: header
        name: x-fapi-auth-date
        schema:
          type: string
      - description: The PSU's IP address if the PSU is currently logged in with the TPP.
        in: header
        name: x-fapi-customer-ip-address
        schema:
          type: string
      - description: 'An RFC4122 UID used as a correlation Id.


          If provided, the ASPSP must "play back" this value

          in the x-fapi-interaction-id response header.'
        in: header
        name: x-fapi-interaction-id
        schema:
          type: string
      - description: 'The header indicates the user-agent that the PSU is using.


          The TPP may populate this field with the user-agent indicated by the PSU.

          If the PSU is using a TPP mobile app, the TPP must ensure that the user-agent string

          is different from browser based user-agent strings.'
        in: header
        name: x-customer-user-agent
        schema:
          type: string
      - description: 'Header containing a detached JWS signature of the body of the payload.


          Refer to resource specific documentation on when this header must be specified.'
        in: header
        name: x-jws-signature
        schema:
          type: string
      - description: Consent id
        in: path
        name: consentID
        required: true
        schema:
          type: string
          format: consentID
