          format: date
          type: string
        antennaInformation:
          description: Indica em qual antena o dispositivo est conectado.
          type: string
        deviceId:
          description: ID nico do dispositivo gerado pela plataforma.
          example: 00000000-54b3-e7c7-0000-000046bffd97
          type: string
        elapsedTimeSinceBoot:
          description: Indica por quanto tempo (em milissegundos) o dispositivo est ligado.
          format: int64
          type: integer
        geolocation:
          $ref: '#/components/schemas/OpenbankingBrasilAutomaticPaymentV1Geolocation'
        integrity:
          $ref: '#/components/schemas/OpenbankingBrasilAutomaticPaymentV1Integrity'
        isCallInProgress:
          description: 'Indica chamada ativa no momento do vnculo.


            [Restrio] Caso o sinal de risco esteja disponvel (cliente permitiu que fosse coletado), o mesmo dever ser enviado'
          type: boolean
        isCharging:
          description: Indica se a bateria do dispositivo est sendo carregada.
          type: boolean
        isDevModeEnabled:
          description: Indica se o dispositivo est em modo de desenvolvedor.
          type: boolean
        isEmulated:
          description: Indica se o dispositivo  emulado ou real.
          type: boolean
        isMockGPS:
          description: Indica se o dispositivo est usando um GPS falso.
          type: boolean
        isMonkeyRunner:
          description: Indica o uso do MonkeyRunner.
          type: boolean
        isRootedDevice:
          description: Indica se o dispositivo atualmente est com permisso de root.
          example: false
          type: boolean
        isUsbConnected:
          description: Indica se o dispositivo est conectado a outro dispositivo via USB.
          type: boolean
        language:
