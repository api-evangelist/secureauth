    OpenbankingBrasilAutomaticPaymentV1Document1:
      description: OpenbankingBrasilAutomaticPaymentV1Document1 Document1
      properties:
        identification:
          description: Nmero do documento de identificao oficial do usurio.
          example: '11111111111'
          maxLength: 11
          pattern: ^\d{11}$
          type: string
        rel:
          description: Tipo do documento de identificao oficial do usurio.
          example: CPF
          maxLength: 3
          pattern: ^[A-Z]{3}$
          type: string
      required:
