components:
  schemas:
    OpenbankingBrasilPaymentV3ConsentRejectionReason:
      description: Motivo da rejeio do consentimento. Informaes complementares sobre o motivo do status
      properties:
        code:
          $ref: '#/components/schemas/OpenbankingBrasilPaymentV3EnumConsentRejectionReasonType'
        detail:
          description: 'Contm informaes adicionais ao consentimento rejeitado.

            VALOR_INVALIDO: O valor enviado no  vlido para o QR Code informado;

            NAO_INFORMADO: No informada pela detentora de conta;

            FALHA_INFRAESTRUTURA: [Descrio de qual falha na infraestrutura inviabilizou o processamento].

            TEMPO_EXPIRADO_AUTORIZACAO: Consentimento expirou antes que o usurio pudesse confirm-lo.

            TEMPO_EXPIRADO_CONSUMO: O usurio no finalizou o fluxo de pagamento e o consentimento expirou;

            REJEITADO_USUARIO: O usurio rejeitou a autorizao do consentimento

            CONTAS_ORIGEM_DESTINO_IGUAIS: A conta selecionada  igual  conta destino e no permite realizar esse pagamento.

            CONTA_NAO_PERMITE_PAGAMENTO: A conta selecionada  do tipo [salario/investimento/liquidao/outros] e no permite realizar esse pagamento.

            SALDO_INSUFICIENTE: A conta selecionada no possui saldo suficiente para realizar o pagamento.

            VALOR_ACIMA_LIMITE: O valor ultrapassa o limite estabelecido [na instituio/no arranjo/outro] para permitir a realizao de transaes pelo cliente.

            QRCODE_INVALIDO: O QRCode utilizado para a iniciao de pagamento no  vlido.'
          example: O usurio rejeitou a autorizao do consentimento
          maxLength: 2048
          pattern: '[\w\W\s]*'
          type: string
      required:
      - code
      - detail
      title: OpenbankingBrasilPaymentV3ConsentRejectionReason ConsentRejectionReason
      type: object
    OpenbankingBrasilPaymentV4EnumAuthorisationStatusType:
      description: 'Retorna o estado do consentimento, o qual no momento de sua criao ser AWAITING_AUTHORISATION. Na situao de mltiplas aladas PARTIALLY_ACCEPTED, indica que consentimento precisa da confirmao de mais autorizadores. Este estado ser alterado depois da(s) autorizao(es) do(s) consentimento(s) na detentora da conta do pagador (Debtor) para AUTHORISED ou REJECTED. O consentimento fica no estado CONSUMED aps ocorrer a iniciao do pagamento referente ao consentimento.


        Em caso de consentimento expirado a detentora dever retornar o status REJECTED.


        Estados possveis:


        AWAITING_AUTHORISATION - Aguardando autorizao


        PARTIALLY_ACCEPTED  Aguardando mltiplas aladas


        AUTHORISED - Autorizado


        REJECTED - Rejeitado


        CONSUMED - Consumido

        Example: AWAITING_AUTHORISATION'
      title: OpenbankingBrasilPaymentV4EnumAuthorisationStatusType EnumAuthorisationStatusType
      type: string
    OpenbankingBrasilAutomaticPaymentV1Integrity:
      description: 'Informa a integridade do dispositivo e app.

        No Android, conforme documentao Play API Integrity - [Android](https://developer.android.com/google/play/integrity/overview?hl=pt-br).

        No iOS, conforme documentao App Attest [iOS](https://developer.apple.com/documentation/devicecheck/establishing_your_app_s_integrity)'
      properties:
        appRecognitionVerdict:
          description: Informa a integridade do app
          type: string
        deviceRecognitionVerdict:
          description: Informa a integridade do dispositivo
          type: string
      title: OpenbankingBrasilAutomaticPaymentV1Integrity Integrity
      type: object
    OpenbankingBrasilPaymentPaymentConsent:
      description: Objeto contendo dados de pagamento para consentimento.
      properties:
        amount:
          description: Valor da transao com 2 casas decimais.
          example: '100000.12'
          maxLength: 19
          minLength: 4
          pattern: ^((\d{1,16}\.\d{2}))$
          type: string
        currency:
          description: 'Cdigo da moeda nacional segundo modelo ISO-4217, ou seja, ''BRL''.

            Todos os valores monetrios informados esto representados com a moeda vigente do Brasil.'
          example: BRL
          maxLength: 3
          pattern: ^([A-Z]{3})$
          type: string
        date:
          description: Mutuamente exclusivo com o objeto schedule. Este campo  obrigatrio no caso de pagamento nico. Neste caso, o objeto schedule no deve ser informado.
          example: '2021-01-01'
          format: date
          type: string
        details:
          $ref: '#/components/schemas/OpenbankingBrasilPaymentDetails'
        ibgeTownCode:
          description: 'Traz o cdigo da cidade segundo o IBGE (Instituto Brasileiro de Geografia e Estatstica).

            Para o preenchimento deste campo, o Iniciador de Pagamentos deve seguir a orientao do arranjo da forma de pagamento.

            O preenchimento do campo tanto em pix/payments quanto /consents deve ser igual. Caso haja divergncia dos valores, a instituio deve retornar HTTP 422 com o cdigo de erro PAGAMENTO_DIVERGENTE_DO_CONSENTIMENTO.

            Este campo faz referncia ao campo CodMun do arranjo Pix.'
          example: '5300108'
          maxLength: 7
          minLength: 7
          pattern: ^\d{7}$
          type: string
        schedule:
          $ref: '#/components/schemas/OpenbankingBrasilPaymentSchedule'
        type:
          description: Este campo define o tipo de pagamento que ser iniciado aps a autorizao do consentimento.
          example: PIX
          type: string
      required:
      - amount
      - currency
      - details
      - type
      title: OpenbankingBrasilPaymentPaymentConsent PaymentConsent
      type: object
    OpenbankingBrasilPaymentV3Document1:
      description: OpenbankingBrasilPaymentV3Document1 Document1
      properties:
        identification:
          description: Nmero do documento de identificao oficial do usurio.
          example: '11111111111'
          maxLength: 11
          pattern: ^\d{11}$
          type: string
        rel:
          description: Tipo do documento de identificao oficial do usurio.
          example: CPF
          maxLength: 3
          pattern: ^[A-Z]{3}$
          type: string
      required:
