    OpenbankingBrasilPaymentV3Payment:
      description: Objeto contendo dados de pagamento para consentimento.
      properties:
        amount:
          description: 'Valor da transao com 2 casas decimais. O valor deve ser o mesmo enviado no consentimento.


            Para QR Code esttico com valor pr-determinado no QR Code ou para QR Code dinmico com indicao de que o valor no pode ser alterado: O campo amount deve ser preenchido com o valor estabelecido no QR Code.

            Caso seja preenchido com valor divergente do QR Code, deve ser retornado um erro HTTP Status 422.'
          example: '100000.12'
          maxLength: 19
          minLength: 4
          pattern: ^((\d{1,16}\.\d{2}))$
          type: string
        currency:
          description: 'Cdigo da moeda nacional segundo modelo ISO-4217, ou seja, ''BRL''.

            Todos os valores monetrios informados esto representados com a moeda vigente do Brasil.'
          example: BRL
          maxLength: 3
          pattern: ^([A-Z]{3})$
          type: string
        date:
          description: '[Restrio] Mutuamente excludente com o objeto schedule.


            Este campo  obrigatrio no caso de pagamento nico.


            Neste caso, o objeto schedule no deve ser informado.'
          example: '2021-01-01'
          format: date
          type: string
        details:
          $ref: '#/components/schemas/OpenbankingBrasilPaymentV3Details'
        ibgeTownCode:
          description: 'O campo ibgetowncode no arranjo PIX, tem o mesmo comportamento que o campo codMun descrito no item 1.6.6 do manual do PIX, conforme segue:


            1. Caso a informao referente ao municpio no seja enviada; o PSP do recebedor assumir que no existem feriados estaduais e municipais no perodo em questo;'
          example: '5300108'
          maxLength: 7
          minLength: 7
          pattern: ^\d{7}$
          type: string
        schedule:
          $ref: '#/components/schemas/OpenbankingBrasilPaymentV3Schedule'
        type:
          description: Este campo define o tipo de pagamento que ser iniciado aps a autorizao do consentimento.
          example: PIX
          type: string
      required:
      - amount
      - currency
      - details
      - type
      title: OpenbankingBrasilPaymentV3Payment Payment
      type: object
    OpenbankingBrasilConsentV2Data4:
      description: OpenbankingBrasilConsentV2Data4 Data4
      properties:
        consentId:
          description: 'O consentId  o identificador nico do consentimento e dever ser um URN - Uniform Resource Name.

            Um URN, conforme definido na [RFC8141](https://tools.ietf.org/html/rfc8141)  um Uniform Resource

            Identifier - URI - que  atribudo sob o URI scheme "urn" e um namespace URN especfico, com a inteno de que o URN

            seja um identificador de recurso persistente e independente da localizao.

            Considerando a string urn:bancoex:C1DD33123 como exemplo para consentId temos:

            o namespace(urn)

            o identificador associado ao namespace da instituio transnmissora (bancoex)

            o identificador especfico dentro do namespace (C1DD33123).

            Informaes mais detalhadas sobre a construo de namespaces devem ser consultadas na [RFC8141](https://tools.ietf.org/html/rfc8141).'
          example: urn:bancoex:C1DD33123
          maxLength: 256
          pattern: ^urn:[a-zA-Z0-9][a-zA-Z0-9-]{0,31}:[a-zA-Z0-9()+,\-.:=@;$_!*'%\/?#]+$
          type: string
        creationDateTime:
          description: Data e hora em que o recurso foi criado. Uma string com data e hora conforme especificao RFC-3339, sempre com a utilizao de timezone UTC(UTC time format).
          example: '2021-05-21T08:30:00Z'
          format: date-time
          type: string
        expirationDateTime:
          description: Data e hora de expirao da permisso. De preenchimento obrigatrio, reflete a data limite de validade do consentimento. Uma string com data e hora conforme especificao RFC-3339, sempre com a utilizao de timezone UTC (UTC time format). Para consentimentos com prazo indeterminado,  esperado preenchimento com `2300-01-01T00:00:00Z`.
          example: '2021-05-21T08:30:00Z'
          format: date-time
          type: string
        permissions:
          description: Especifica os tipos de permisses de acesso s APIs no escopo do Open Finance Brasil - Dados cadastrais e transacionais, de acordo com os blocos de consentimento fornecidos pelo usurio e necessrios ao acesso a cada endpoint das APIs. Esse array no deve ter duplicidade de itens.
          example:
          - ACCOUNTS_READ
          - ACCOUNTS_OVERDRAFT_LIMITS_READ
          - RESOURCES_READ
          items:
            $ref: '#/components/schemas/OpenbankingBrasilConsentV2Permission1'
          minItems: 1
          type: array
        rejection:
          $ref: '#/components/schemas/OpenbankingBrasilConsentV2Rejection'
        status:
          $ref: '#/components/schemas/OpenbankingBrasilConsentV2Status'
        statusUpdateDateTime:
          description: Data e hora em que o recurso foi atualizado. Uma string com data e hora conforme especificao RFC-3339, sempre com a utilizao de timezone UTC(UTC time format).
          example: '2021-05-21T08:30:00Z'
          format: date-time
          type: string
      required:
      - consentId
      - creationDateTime
      - expirationDateTime
      - permissions
      - status
      - statusUpdateDateTime
      type: object
