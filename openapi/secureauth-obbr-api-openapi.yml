          format: date-time
          type: string
        loggedUser:
          $ref: '#/components/schemas/OpenbankingBrasilConsentLoggedUser'
        permissions:
          description: permissions
          example:
          - ACCOUNTS_READ
          - ACCOUNTS_OVERDRAFT_LIMITS_READ
          - RESOURCES_READ
          items:
            $ref: '#/components/schemas/OpenbankingBrasilConsentPermission'
          maxItems: 30
          minItems: 1
          type: array
        transactionFromDateTime:
          description: Data e hora da transao inicial. Se no for preenchido, a transao ter a data aberta e a data ser retornada com a primeira transao disponvel. Uma string com data e hora conforme especificao RFC-3339, sempre com a utilizao de timezone UTC(UTC time format).
          example: '2021-01-01T00:00:00Z'
          format: date-time
          type: string
        transactionToDateTime:
          description: Data e hora final da transao. Se no for preenchido, a transao ter a data aberta e a data ser retornada com a ultima transao disponvel. Uma string com data e hora conforme especificao RFC-3339, sempre com a utilizao de timezone UTC(UTC time format).
          example: '2021-02-01T23:59:59Z'
          format: date-time
          type: string
      required:
      - expirationDateTime
      - loggedUser
      - permissions
      type: object
    OpenbankingBrasilPaymentEnumRevokedBy:
      description: 'Define qual das partes envolvidas na transao est realizando a revogao. Valores possveis:

        USER (Revogado pelo usurio)

        ASPSP (Provedor de servios de pagamento para servios de conta - Detentora de conta)

        TPP (Instituies Provedoras - iniciadora de pagamentos)

        Example: USER'
      title: OpenbankingBrasilPaymentEnumRevokedBy EnumRevokedBy
      type: string
    BrazilCustomerPatchRecurringPaymentConsentRequestV1:
      properties:
        aud:
          type: string
        data:
          description: Objeto contendo as informaes de rejeio e revogao dos consentimentos
          type: object
        iat:
          format: int64
          type: integer
        iss:
          type: string
        jti:
          type: string
      required:
      - data
      type: object
    OpenbankingBrasilPaymentEnumRevocationReason:
      description: 'Define o cdigo da razo pela qual o consentimento foi revogado.

        Valores possveis:

        FRAUD- Indica suspeita de fraude

        ACCOUNT_CLOSURE - Indica que a conta do usurio foi encerrada

        OTHER- Indica que motivo do cancelamento est fora dos motivos pr-estabelecidos.

        Example: OTHER'
      title: OpenbankingBrasilPaymentEnumRevocationReason EnumRevocationReason
      type: string
    OpenbankingBrasilConsentV2EnumReasonCode:
      description: 'Define o cdigo da razo pela qual o consentimento foi rejeitado.


        CONSENT_EXPIRED  consentimento que ultrapassou o tempo limite para autorizao.

        CUSTOMER_MANUALLY_REJECTED  cliente efetuou a rejeio do consentimento manualmente atravs de interao nas instituies participantes.

        CUSTOMER_MANUALLY_REVOKED  cliente efetuou a revogao aps a autorizao do consentimento.

        CONSENT_MAX_DATE_REACHED  consentimento que ultrapassou o tempo limite de compartilhamento.

        CONSENT_TECHNICAL_ISSUE  consentimento que foi rejeitado devido a um problema tcnico que impossibilita seu uso pela instituio receptora, por exemplo: falha associada a troca do AuthCode pelo AccessToken, durante o processo de Hybid Flow.

        INTERNAL_SECURITY_REASON  consentimento que foi rejeitado devido as polticas de segurana aplicada pela instituio transmissora.

        Example: CONSENT_EXPIRED'
      title: OpenbankingBrasilConsentV2EnumReasonCode EnumReasonCode
      type: string
    OpenbankingBrasilPaymentV4Payment:
      description: Objeto contendo dados de pagamento para consentimento.
      properties:
        amount:
          description: 'Valor da transao com 2 casas decimais. O valor deve ser o mesmo enviado no consentimento.


            Para QR Code esttico com valor pr-determinado no QR Code ou para QR Code dinmico com indicao de que o valor no pode ser alterado: O campo amount deve ser preenchido com o valor estabelecido no QR Code.

            Caso seja preenchido com valor divergente do QR Code, deve ser retornado um erro HTTP Status 422.'
          example: '100000.12'
          maxLength: 19
          minLength: 4
          pattern: ^((\d{1,16}\.\d{2}))$
          type: string
        currency:
          description: 'Cdigo da moeda nacional segundo modelo ISO-4217, ou seja, ''BRL''.

            Todos os valores monetrios informados esto representados com a moeda vigente do Brasil.'
          example: BRL
          maxLength: 3
          pattern: ^([A-Z]{3})$
          type: string
        date:
          description: '[Restrio] Mutuamente excludente com o objeto schedule.


            Este campo  obrigatrio no caso de pagamento nico.


            Neste caso, o objeto schedule no deve ser informado.'
          example: '2021-01-01'
          format: date
          type: string
        details:
          $ref: '#/components/schemas/OpenbankingBrasilPaymentV4Details'
        ibgeTownCode:
          description: 'O campo ibgetowncode no arranjo PIX, tem o mesmo comportamento que o campo codMun descrito no item 1.6.6 do manual do PIX, conforme segue:


            1. Caso a informao referente ao municpio no seja enviada; o PSP do recebedor assumir que no existem feriados estaduais e municipais no perodo em questo;'
          example: '5300108'
          maxLength: 7
          minLength: 7
          pattern: ^\d{7}$
          type: string
        schedule:
          description: '[Restrio] Mutuamente excludente com o campo date.

            Este campo  obrigatrio no caso de agendamento.

            Neste caso, o campo date no dever ser informado.

            O prazo mximo para o consentimento dever ser de dois anos, contando a partir da data de criao do consentimento retornada na criao do mesmo (campo /data/creationDateTime).'
          type: object
        type:
          description: Este campo define o tipo de pagamento que ser iniciado aps a autorizao do consentimento.
          example: PIX
          type: string
      required:
      - amount
      - currency
      - details
      - type
      title: OpenbankingBrasilPaymentV4Payment Payment
      type: object
