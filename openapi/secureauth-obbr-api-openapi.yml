        '403':
          $ref: '#/components/responses/OBBRErrorResponse'
        '405':
          $ref: '#/components/responses/OBBRErrorResponse'
        '406':
          $ref: '#/components/responses/OBBRErrorResponse'
        '415':
          $ref: '#/components/responses/OBBRErrorResponse'
        '422':
          $ref: '#/components/responses/OBBRErrorResponse'
        '429':
          $ref: '#/components/responses/OBBRErrorResponse'
        '500':
          $ref: '#/components/responses/OBBRErrorResponse'
      security:
      - defaultcc:
        - consents
      summary: Delete Data Access Consent v1
      tags:
      - OBBR
