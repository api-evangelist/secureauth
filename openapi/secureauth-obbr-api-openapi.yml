    OpenbankingBrasilPaymentCreditorAccount:
      description: Objeto que contm a identificao da conta de destino do beneficirio/recebedor.
      properties:
        accountType:
          $ref: '#/components/schemas/OpenbankingBrasilPaymentEnumAccountPaymentsType'
        ispb:
          description: Deve ser preenchido com o ISPB (Identificador do Sistema de Pagamentos Brasileiros) do participante do SPI (Sistema de pagamentos instantneos) somente com nmeros.
          example: '12345678'
          maxLength: 8
          minLength: 8
          pattern: ^[0-9]{8}$
          type: string
        issuer:
          description: 'Cdigo da Agncia emissora da conta sem dgito.

            (Agncia  a dependncia destinada ao atendimento aos clientes, ao pblico em geral e aos associados de cooperativas de crdito,

            no exerccio de atividades da instituio, no podendo ser mvel ou transitria).

            [Restrio] Preenchimento obrigatrio para os seguintes tipos de conta: CACC (CONTA_DEPOSITO_A_VISTA), SVGS (CONTA_POUPANCA) e SLRY (CONTA_SALARIO).'
          example: '1774'
          maxLength: 4
          pattern: ^\d{4}$
          type: string
        number:
          description: 'Deve ser preenchido com o nmero da conta do usurio recebedor, com dgito verificador (se este existir),

            se houver valor alfanumrico, este deve ser convertido para 0.'
          example: '1234567890'
          maxLength: 20
          minLength: 3
          pattern: ^\d{3,20}$
          type: string
