      tags:
      - Services
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
  /services/{sid}/apis/import/text:
    post:
      description: It removes all apis and policies (created by previous import) before import.
      operationId: importSpecificationFromText
      parameters:
      - description: A server will only return requested resources if the resource matches one of the listed ETag value
        in: header
